<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" font-family="system-ui, sans-serif">
<rect width="640" height="400" rx="10" fill="#23211e"/>
<text x="30" y="32" font-size="13" font-weight="bold" fill="#f08a4b">A progress clock, and what happens when it fills</text>
<text x="30" y="62" font-size="11" font-weight="bold" fill="#e8e2d6">What fills it</text>
<text x="30" y="86" font-size="10" fill="#e8e2d6">A trip’s check</text>
<text x="30" y="100" font-size="9" fill="#a49d90" font-family="ui-monospace, monospace">world.clocks.the-fever: 1</text>
<line x1="200" y1="83" x2="232" y2="129" stroke="#a49d90" stroke-width="1"/>
<text x="30" y="130" font-size="10" fill="#e8e2d6">A click in the World panel</text>
<line x1="200" y1="127" x2="232" y2="143" stroke="#a49d90" stroke-width="1"/>
<text x="30" y="174" font-size="10" fill="#e8e2d6">A faction’s turn table</text>
<text x="30" y="188" font-size="9" fill="#a49d90" font-family="ui-monospace, monospace">world.clocks.the-fever: 1</text>
<line x1="200" y1="171" x2="232" y2="157" stroke="#a49d90" stroke-width="1"/>
<text x="30" y="218" font-size="10" fill="#e8e2d6">Another clock filling</text>
<text x="30" y="232" font-size="9" fill="#a49d90" font-family="ui-monospace, monospace">its Changes</text>
<line x1="200" y1="215" x2="232" y2="171" stroke="#a49d90" stroke-width="1"/>
<path d="M285,150 L286.9,102.0 A48,48 0 0 1 333.0,148.1 Z" fill="#f08a4b" stroke="#e8e2d6" stroke-width="1"/>
<path d="M285,150 L333.0,151.9 A48,48 0 0 1 286.9,198.0 Z" fill="#3a3631" stroke="#e8e2d6" stroke-width="1"/>
<path d="M285,150 L283.1,198.0 A48,48 0 0 1 237.0,151.9 Z" fill="#3a3631" stroke="#e8e2d6" stroke-width="1"/>
<path d="M285,150 L237.0,148.1 A48,48 0 0 1 283.1,102.0 Z" fill="#8a5a3a" stroke="#f08a4b" stroke-width="2.5"/>
<text x="285" y="218" font-size="10" fill="#e8e2d6" text-anchor="middle">The marsh fever</text>
<text x="285" y="232" font-size="9" fill="#a49d90" text-anchor="middle">starts at 1 of 4</text>
<line x1="339" y1="150" x2="362" y2="150" stroke="#f08a4b" stroke-width="1.5"/><polygon points="362,146 370,150 362,154" fill="#f08a4b"/>
<text x="380" y="62" font-size="11" font-weight="bold" fill="#e8e2d6">When the last segment fills</text>
<circle cx="388" cy="84" r="8" fill="none" stroke="#f08a4b"/><text x="388" y="88" font-size="10" fill="#f08a4b" text-anchor="middle">1</text>
<text x="402" y="88" font-size="10" font-weight="bold" fill="#e8e2d6">When full</text>
<text x="402" y="102" font-size="9" fill="#a49d90" font-family="ui-monospace, monospace">“The fever reaches…” → timeline</text>
<circle cx="388" cy="124" r="8" fill="none" stroke="#f08a4b"/><text x="388" y="128" font-size="10" fill="#f08a4b" text-anchor="middle">2</text>
<text x="402" y="128" font-size="10" font-weight="bold" fill="#e8e2d6">Rolls</text>
<text x="402" y="142" font-size="9" fill="#a49d90" font-family="ui-monospace, monospace">core/table.twists → timeline</text>
<circle cx="388" cy="164" r="8" fill="none" stroke="#f08a4b"/><text x="388" y="168" font-size="10" fill="#f08a4b" text-anchor="middle">3</text>
<text x="402" y="168" font-size="10" font-weight="bold" fill="#e8e2d6">Changes</text>
<text x="402" y="182" font-size="9" fill="#a49d90" font-family="ui-monospace, monospace">world.clocks.the-closed-roads: 1</text>
<circle cx="388" cy="204" r="8" fill="none" stroke="#f08a4b"/><text x="388" y="208" font-size="10" fill="#f08a4b" text-anchor="middle">4</text>
<text x="402" y="208" font-size="10" font-weight="bold" fill="#e8e2d6">The trip hears it</text>
<text x="402" y="222" font-size="9" fill="#a49d90" font-family="ui-monospace, monospace">world.clocks.the-fever.full → its action</text>
<line x1="30" y1="285" x2="610" y2="285" stroke="#3a3631" stroke-width="1"/>
<text x="30" y="310" font-size="11" font-weight="bold" fill="#e8e2d6">Then</text>
<text x="68" y="334" font-size="10" fill="#f08a4b" font-family="ui-monospace, monospace">keep</text>
<text x="68" y="350" font-size="10" fill="#e8e2d6">stays full (the default)</text>
<circle cx="44" cy="338" r="14" fill="#f08a4b" stroke="#e8e2d6"/>
<text x="268" y="334" font-size="10" fill="#f08a4b" font-family="ui-monospace, monospace">reset</text>
<text x="268" y="350" font-size="10" fill="#e8e2d6">empty, fills again</text>
<circle cx="244" cy="338" r="14" fill="#3a3631" stroke="#e8e2d6"/>
<text x="468" y="334" font-size="10" fill="#f08a4b" font-family="ui-monospace, monospace">remove</text>
<text x="468" y="350" font-size="10" fill="#e8e2d6">goes away</text>
<circle cx="444" cy="338" r="14" fill="none" stroke="#a49d90" stroke-dasharray="3 3"/>
</svg>
