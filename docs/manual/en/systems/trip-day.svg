<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" font-family="system-ui, sans-serif">
<rect width="640" height="330" rx="10" fill="#23211e"/>
<rect x="40.0" y="120" width="140.0" height="30" fill="#3a3e5c"/>
<text x="110.0" y="139" text-anchor="middle" font-size="11" fill="#e8e2d6">night</text>
<rect x="180.0" y="120" width="140.0" height="30" fill="#e9c46a"/>
<text x="250.0" y="139" text-anchor="middle" font-size="11" fill="#2b2210">morning</text>
<rect x="320.0" y="120" width="116.7" height="30" fill="#f4a261"/>
<text x="378.3" y="139" text-anchor="middle" font-size="11" fill="#2b2210">afternoon</text>
<rect x="436.7" y="120" width="70.0" height="30" fill="#c97b5a"/>
<text x="471.7" y="139" text-anchor="middle" font-size="11" fill="#2b2210">evening</text>
<rect x="506.7" y="120" width="93.3" height="30" fill="#3a3e5c"/>
<text x="553.3" y="139" text-anchor="middle" font-size="11" fill="#e8e2d6">night</text>
<rect x="40" y="120" width="560" height="30" fill="none" stroke="#e8e2d6" stroke-width="1"/>
<line x1="40.0" y1="150" x2="40.0" y2="155" stroke="#e8e2d6"/>
<text x="40.0" y="168" text-anchor="middle" font-size="11" fill="#e8e2d6">00:00</text>
<line x1="180.0" y1="150" x2="180.0" y2="155" stroke="#e8e2d6"/>
<text x="180.0" y="168" text-anchor="middle" font-size="11" fill="#e8e2d6">06:00</text>
<line x1="320.0" y1="150" x2="320.0" y2="155" stroke="#e8e2d6"/>
<text x="320.0" y="168" text-anchor="middle" font-size="11" fill="#e8e2d6">12:00</text>
<line x1="366.7" y1="150" x2="366.7" y2="155" stroke="#e8e2d6"/>
<text x="366.7" y="168" text-anchor="middle" font-size="11" fill="#e8e2d6">14:00</text>
<line x1="436.7" y1="150" x2="436.7" y2="155" stroke="#e8e2d6"/>
<text x="436.7" y="168" text-anchor="middle" font-size="11" fill="#e8e2d6">17:00</text>
<line x1="506.7" y1="150" x2="506.7" y2="155" stroke="#e8e2d6"/>
<text x="506.7" y="168" text-anchor="middle" font-size="11" fill="#e8e2d6">20:00</text>
<line x1="600.0" y1="150" x2="600.0" y2="155" stroke="#e8e2d6"/>
<text x="600.0" y="168" text-anchor="middle" font-size="11" fill="#e8e2d6">24:00</text>
<line x1="180.0" y1="62" x2="366.7" y2="62" stroke="#f08a4b" stroke-width="3"/>
<line x1="180.0" y1="56" x2="180.0" y2="120" stroke="#f08a4b" stroke-width="1.5" stroke-dasharray="3 3"/>
<line x1="366.7" y1="56" x2="366.7" y2="120" stroke="#f08a4b" stroke-width="1.5" stroke-dasharray="3 3"/>
<text x="273.3" y="48" text-anchor="middle" font-size="12" font-weight="bold" fill="#f08a4b">March: 8 hours marched</text>
<polygon points="251.7,78.5 251.7,89.5 242.2,95.0 232.7,89.5 232.7,78.5 242.2,73.0" fill="#3a3631" stroke="#f08a4b" stroke-width="1.5"/>
<line x1="242.2" y1="62" x2="242.2" y2="73" stroke="#f08a4b" stroke-width="1.5"/>
<polygon points="314.0,78.5 314.0,89.5 304.4,95.0 294.9,89.5 294.9,78.5 304.4,73.0" fill="#3a3631" stroke="#f08a4b" stroke-width="1.5"/>
<line x1="304.4" y1="62" x2="304.4" y2="73" stroke="#f08a4b" stroke-width="1.5"/>
<polygon points="376.2,78.5 376.2,89.5 366.7,95.0 357.1,89.5 357.1,78.5 366.7,73.0" fill="#3a3631" stroke="#f08a4b" stroke-width="1.5"/>
<line x1="366.7" y1="62" x2="366.7" y2="73" stroke="#f08a4b" stroke-width="1.5"/>
<polygon points="189.5,78.5 189.5,89.5 180.0,95.0 170.5,89.5 170.5,78.5 180.0,73.0" fill="#3a3631" stroke="#e8e2d6" stroke-width="1.5"/>
<circle cx="180.0" cy="108" r="9" fill="#f08a4b"/>
<text x="180.0" y="112" text-anchor="middle" font-size="11" font-weight="bold" fill="#23211e">1</text>
<circle cx="242.2" cy="108" r="9" fill="#f08a4b"/>
<text x="242.2" y="112" text-anchor="middle" font-size="11" font-weight="bold" fill="#23211e">2</text>
<circle cx="366.7" cy="108" r="9" fill="#f08a4b"/>
<text x="366.7" y="112" text-anchor="middle" font-size="11" font-weight="bold" fill="#23211e">3</text>
<circle cx="401.7" cy="108" r="9" fill="#f08a4b"/>
<text x="401.7" y="112" text-anchor="middle" font-size="11" font-weight="bold" fill="#23211e">4</text>
<circle cx="506.7" cy="108" r="9" fill="#f08a4b"/>
<text x="506.7" y="112" text-anchor="middle" font-size="11" font-weight="bold" fill="#23211e">5</text>
<circle cx="600.0" cy="108" r="9" fill="#f08a4b"/>
<text x="600.0" y="112" text-anchor="middle" font-size="11" font-weight="bold" fill="#23211e">6</text>
<circle cx="48" cy="192" r="8" fill="#f08a4b"/>
<text x="48" y="196" text-anchor="middle" font-size="10" font-weight="bold" fill="#23211e">1</text>
<text x="64" y="196" font-size="11.5" fill="#e8e2d6">06:00 The trip starts, as the morning begins: the actions and checks of that moment.</text>
<circle cx="48" cy="213" r="8" fill="#f08a4b"/>
<text x="48" y="217" text-anchor="middle" font-size="10" font-weight="bold" fill="#23211e">2</text>
<text x="64" y="217" font-size="11.5" fill="#e8e2d6">Each hex entered, its checks: 10 km at 3.75 km/h (30 km a day in 8 hours) is 2 h 40 min.</text>
<circle cx="48" cy="234" r="8" fill="#f08a4b"/>
<text x="48" y="238" text-anchor="middle" font-size="10" font-weight="bold" fill="#23211e">3</text>
<text x="64" y="238" font-size="11.5" fill="#e8e2d6">14:00 Its 8 hours marched, the march’s “Only when” stops holding: it stops here.</text>
<circle cx="48" cy="255" r="8" fill="#f08a4b"/>
<text x="48" y="259" text-anchor="middle" font-size="10" font-weight="bold" fill="#23211e">4</text>
<text x="64" y="259" font-size="11.5" fill="#e8e2d6">The afternoon is yours: the buttons (rest, explore…). Time spent on them isn’t marching.</text>
<circle cx="48" cy="276" r="8" fill="#f08a4b"/>
<text x="48" y="280" text-anchor="middle" font-size="10" font-weight="bold" fill="#23211e">5</text>
<text x="64" y="280" font-size="11.5" fill="#e8e2d6">20:00 The night: a party left waiting takes the halt, camp, which sleeps until 06:00.</text>
<circle cx="48" cy="297" r="8" fill="#f08a4b"/>
<text x="48" y="301" text-anchor="middle" font-size="10" font-weight="bold" fill="#23211e">6</text>
<text x="64" y="301" font-size="11.5" fill="#e8e2d6">24:00 The day ends: eat (food −1); today’s values end, tomorrow’s yesterday.</text>
</svg>
