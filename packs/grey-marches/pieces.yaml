# The Deep Barrows (maps/deep-barrows.otd.json): a sub-map under the Barrow-halls that nobody
# has drawn. The party's steps lay it, piece by piece: a deck says what comes next and a table
# ends it. Bound as `discover.piece` in travel.yaml; the map plays `Through exits, piece by piece`.
kind: pieces
id: deep-barrows
name: The Deep Barrows
description: |-
  What lies under the Barrow-halls: passages, crypts and flooded halls, laid as the party opens each way on, down to the last tomb.

  **Shows:**

  - **Pieces** (`kind: pieces`): shapes drawn in text, laid where the party goes, turned to meet the door it came by
  - `marks`: what each mark lays, black water beside the floor in _The flooded passage_
  - `room: true`, with `tags` and `fields`: a crypt played as one place, its danger read as `place.danger`
  - `contents`: what's rolled in a crypt instead of `discover.contents`
  - `entry: true`: which exits a piece may be entered by
  - An exit with values (`fields: { state: hidden }`): a hidden way found by a check
  - A door laid shut (`fields: { state: barred }`): no way on until the party forces it (_Force the door_), and the noise may wake what sleeps here
  - An exit into a new map (`newMap`): _A stair further down_ makes _The deeper barrows_, a map of their own laid piece by piece as these are, with a sheet of their own (_This place_)
grid: square
marks:
  '.': barrow-floor
  '~': black-water
pieces:
  stair-foot:
    name: The foot of the stair
    room: true
    tags: [deep]
    fields: { danger: 1 }
    cells: |2
        A
       ...
      B...C
       ...
        D
    exits:
      A: { kind: door, entry: true }
      B: { kind: door }
      C: { kind: door }
      D: { kind: door }
  passage:
    name: Passage
    cells: |
      A
      .
      .
      B
    exits:
      A: { kind: door }
      B: { kind: door }
  flooded:
    name: The flooded passage
    tags: [flooded]
    cells: |
      A
      .~
      .~
      B
    exits:
      A: { kind: door }
      B: { kind: door }
  crypt:
    name: Crypt
    room: true
    tags: [crypt]
    fields: { danger: 2 }
    contents: table.crypt-contents
    cells: |2
        A
       ...
      B...C
       ...
    exits:
      A: { kind: door, entry: true }
      B: { kind: door }
      C: { kind: hidden-path, name: A crack behind the bones, fields: { state: hidden } }
  tomb:
    name: The last tomb
    room: true
    tags: [crypt, last]
    fields: { danger: 5 }
    contents: table.last-tomb
    cells: |2
       A
      ...
      ...
    exits:
      A: { kind: door, entry: true }
  # A door shut from the far side: the door kind's `passable` (travel.yaml) reads its state,
  # so the way on waits for Force the door.
  barred-passage:
    name: A barred door
    cells: |
      A
      .
      .
      B
    exits:
      A: { kind: door }
      B: { kind: door, name: A barred door, fields: { state: barred } }
  # A way further down: the exit makes a new map under this one, hanging from the stair's
  # foot, as a way down (`way-in`); going in lays its first piece there.
  stair-down:
    name: A stair further down
    cells: |
      A
      .
      .
      B
    exits:
      A: { kind: door }
      B: { kind: way-in, name: A stair further down, newMap: { name: The deeper barrows } }
  dead-end:
    name: A fall of stone
    cells: |
      A
      .
    exits:
      A: { kind: door }
---
kind: deck
id: deep-barrows
tags: [discovery, rules]
name: The way down
description: |-
  What the next way on opens into. Cards drawn stay drawn until the deck runs out, so the Deep Barrows don't repeat themselves as a table would.

  **Shows:** a **deck** naming pieces (`set: { piece: crypt }`): each card drawn is one piece fewer of its kind; one card is a stair further down, into a new map.
reshuffle: when-empty
cards:
  - { id: passage, result: A passage, set: { piece: passage }, count: 4 }
  - { id: flooded, result: A flooded passage, set: { piece: flooded }, count: 2 }
  - { id: crypt, result: A crypt, set: { piece: crypt }, count: 3 }
  - { id: barred, result: A barred door, set: { piece: barred-passage }, count: 2 }
  - { id: stair, result: A stair further down, set: { piece: stair-down } }
  - { id: fall, result: A fall of stone, set: { piece: dead-end } }
---
kind: table
id: next-barrow
tags: [discovery, rules]
name: What lies beyond
description: |-
  Bound as `discover.piece`: the way down goes on, until enough has been laid for the last tomb.

  **Shows:** what a table sees of the pieces laid: `pieces.total`; a table handing over to a deck; the place kept open while a condition holds (`keepOpen: { pieces.total: { lt: 8 } }` in `travel.yaml`): no fall of stone closes the last way on before the tomb.
entries:
  - {
      id: on,
      weight: 1,
      unless: { pieces.total: { gte: 8 } },
      result: The way goes on,
      table: deck.deep-barrows,
    }
  - {
      id: last,
      weight: 1,
      when: { pieces.total: { gte: 8 } },
      result: The last tomb,
      set: { piece: tomb },
    }
---
kind: table
id: crypt-contents
tags: [discovery, rules]
name: In the crypt
description: |-
  What a crypt of the Deep Barrows holds, rolled on first coming in.

  **Shows:** a piece's own `contents`, in place of `discover.contents`; a result that makes one of those present (`present.barrow-dead`).
entries:
  - { id: bones, weight: 3, result: Bones and nothing else, set: { poi: false } }
  - { id: grave-goods, weight: 2, result: Grave-goods nobody has touched }
  - {
      id: sleeper,
      weight: 1,
      result: A sleeper who does not stay asleep,
      effects: { present.barrow-dead: 1 },
    }
---
kind: table
id: last-tomb
tags: [discovery, rules]
name: The last tomb
description: |-
  What waits at the bottom of the Deep Barrows: a king of the old folk, and under his bier a way down nobody has taken.

  **Shows:** a piece that ends a place, reached by what's been laid, not by where it lies; a result that makes a way into a new map from where the party stands (`place.ways.way-in: 1`), and a box of a progress track (`party.values.legend: 4`).
entries:
  - id: king
    result: 'A king of the old folk, and his crown; under his bier, a way down'
    effects: { party.values.legend: 4, place.ways.way-in: 1 }
---
kind: table
id: door-noise
tags: [rules]
name: The noise of it
description: |-
  Rolled as a barred door of the Deep Barrows gives way (_Force the door_): whether anything heard it. Once the dead of the place are stirring, something always does.

  **Shows:** a table an action rolls (`roll:`), its result making one of those present (`present.barrow-dead`) and stopping the trip (`pause`), and an entry left out by what the map keeps of its own (`unless: { map.conditions: stirring }`).
entries:
  - id: silence
    weight: 3
    result: The echo dies away; nothing stirs
    # The map's own sheet: where the dead are stirring, nothing goes unheard.
    unless: { map.conditions: stirring }
  - id: heard
    weight: 1
    result: Something in the dark heard it, and comes
    pause: true
    effects: { present.barrow-dead: 1 }
