# The lie of the Marches (system.yaml): how the land goes on, as a land model. The
# Map's Generate fills empty hexes with it (the unpainted east of the example map),
# and discovery hands over to it east of the Hollow Hills (The land ahead, discovery.yaml).
kind: land
id: default
name: The lie of the Marches
description: |-
  How the land of the Marches goes on: the hills rise into ranges and bare peaks, heath and woods cling to their feet, and water lies in the hollows between them.

  **Shows:**

  - **A land model** (`kind: land`): for each terrain, how likely a hex next to it is to be each terrain; an empty hex adds up the rows of its known neighbours
  - `weights: { from: 2 }`: the land the party comes from counts twice
  - `start`: the land where nothing around is known
  - Used by **Generate** in Map, and by discovery through a table that hands over to it (`set: { land: land.default }` in _The land ahead_)
next:
  plains: { plains: 5, heath: 2, farmland: 1, forest: 1, hills: 1 }
  farmland: { farmland: 4, plains: 3 }
  heath: { heath: 4, hills: 2, plains: 2, marsh: 1 }
  forest: { forest: 6, dense-forest: 2, hills: 1, plains: 1 }
  dense-forest: { dense-forest: 5, forest: 3 }
  hills: { hills: 5, mountains: 2, heath: 2, forest: 1 }
  mountains: { mountains: 5, hills: 3, peaks: 1 }
  peaks: { peaks: 2, mountains: 4 }
  lake: { lake: 5, marsh: 2, heath: 1 }
  marsh: { marsh: 3, lake: 2, heath: 1 }
# The land you come from counts twice: a trip into the unknown follows its own road.
weights: { from: 2 }
start: { hills: 3, heath: 2, plains: 1 }
---
kind: land
id: galleries
name: The clans' galleries
description: |-
  How the old clan workings run through the rock: long galleries, falls of rubble, black water where they've flooded. For the side workings of a mine, filled in with Generate on a map of squares.

  **Shows:**

  - **A land model on squares**: floor terrains grow as corridors in solid rock, and walls follow them by themselves
  - A system with **two models**, chosen in Generate: one for the land, one for what lies under it
  - `rock`, a terrain no step can enter (`passable: false`), so what's generated stays walled
next:
  rock: { rock: 7, mine-gallery: 2 }
  mine-gallery: { mine-gallery: 5, rock: 3, rubble: 1, black-water: 1 }
  rubble: { mine-gallery: 3, rock: 2 }
  black-water: { black-water: 3, mine-gallery: 2 }
start: { rock: 3, mine-gallery: 1 }
---
kind: land
id: village
name: A village of the Marches
description: |-
  How a village of the Marches goes on: cobbled lanes between yards and houses, gardens at its edge, open land beyond. For the streets of a place like Ashford, filled in with Generate on a map of squares.

  **Shows:**

  - **A land model of ground and structures**: open terrains outside and floors inside on one map, walls drawing themselves round the floors
  - A system's **third model**, beside the land and what lies under it
next:
  plains: { plains: 5, garden: 2, yard: 1 }
  garden: { garden: 4, plains: 2, yard: 1 }
  yard: { yard: 3, cobbles: 2, garden: 1, wood-floor: 2 }
  cobbles: { cobbles: 5, yard: 2, wood-floor: 1, stone-floor: 1 }
  wood-floor: { wood-floor: 6, yard: 1, cobbles: 1 }
  stone-floor: { stone-floor: 6, cobbles: 1 }
start: { plains: 3, cobbles: 1 }
