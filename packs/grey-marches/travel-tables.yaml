# Tables the travel checks roll. Their `set` values are what the trip understands:
# lost, weather, fatigue, rations and fodder (negative to spend).

# Dice with context values: missing ones count as 0. Fog and storms make it harder.
# Roll modes that apply by themselves (`modeWhen`): clear skies give advantage, unless the
# trees hide the sky (`modeUnless`); after a day lost, finding the way again is rolled with
# disadvantage (both at once cancel out).
kind: table
id: getting-lost
tags: [travel, rules]
name: Do we get lost?
description: |-
  Rolled **at dawn**, off roads and rivers, and in each hex entered on a night march, off the road (in the dark, 1–3 gets you lost). The party's Navigation helps; fog doesn't. With **clear skies** or a **guide** with Pathfinding 2 or more it's rolled with advantage (not under the trees of a forest, which hide the sky, unless a companion is Woodwise: then always there); the day after getting lost, with disadvantage. A Pathfinder never goes astray in the dark.

  **Shows:**

  - A travel check: bound to `NAVIGATION_CHECK_REQUIRED`
  - A party stat in the roll: `{{party.stats.navigation}}`
  - `set: { lost: true }`: no more travel today
  - Roll modes that apply by themselves (`modeWhen`): `roll-modes.advantage` with `trip.weather: clear` or a guide with Pathfinding 2 (`roles.guide.values.pathfinding`, a journey role), `roll-modes.disadvantage` with `yesterday.lost: true`
  - A roll mode's `modeUnless`: no advantage in forests, `place.terrain: [forest, dense-forest]`, unless a companion has a knack (`party.highest.values.woodwise`, a value made of the knacks they hold, knacks.yaml), who gives it there
  - A row a knack takes away: the dark's, `unless: { party.highest.values.pathfinder: { gte: 1 } }`
  - Conditions on the weather, on the dark (`time.tags: dark`), and on being outside any region (`exists: false`)
roll: '1d6 + {{party.stats.navigation}}'
modeWhen:
  # Clear skies, or a guide who knows the way (a journey role, read by its holder's value).
  # Under the trees, a companion who is Woodwise (a knack, knacks.yaml) reads the woods.
  roll-modes.advantage:
    any:
      - { trip.weather: clear }
      - { roles.guide.values.pathfinding: { gte: 2 } }
      - { place.terrain: [forest, dense-forest], party.highest.values.woodwise: { gte: 1 } }
  roll-modes.disadvantage: { yesterday.lost: true }
modeUnless:
  # The trees hide the sky, unless someone Woodwise is with you.
  roll-modes.advantage:
    all:
      - { place.terrain: [forest, dense-forest] }
      - { not: { party.highest.values.woodwise: { gte: 1 } } }
entries:
  - {
      id: fog,
      range: 1-3,
      when: { trip.weather: fog },
      result: 'Lost in the fog: no progress today',
      set: { lost: true },
    }
  # In the dark (a night march: `time.tags: dark`), half the rolls go astray.
  # A Pathfinder (a knack) never goes astray in the dark.
  - id: dark
    range: 1-3
    when: { time.tags: dark }
    unless: { party.highest.values.pathfinder: { gte: 1 } }
    result: 'Lost in the dark: you stop until dawn, shaken'
    set: { lost: true }
    # The Company's own sheet: shaken, it can't force a march until it rests.
    effects: { party.conditions.shaken: true }
  # Outside any named region there are no landmarks to go by (`exists: false`).
  - id: wild
    range: 1-2
    when: { place.region: { exists: false } }
    result: 'No landmarks out here: you wander off course'
    set: { lost: true }
  # Being lost also costs morale: a party stat changed by a table (stats: …).
  - {
      id: lost,
      range: 1,
      result: 'You are lost: no progress today',
      set: { lost: true },
      effects: { party.stats.morale: -1 },
    }
  - { id: course, range: 2-20, result: You keep your course }
---
# A party stat in the roll, with Core's advantage and disadvantage on offer. The amount
# found is rolled into a value of the result (set: { days: '{{1d3+1}}' }); the text reads it
# back ({{days}}) and the effect adds that many days of food to the supplies.
kind: table
id: forage
tags: [travel, rules]
name: Foraging
description: |-
  What you find when you **forage for food** (the _Forage for food_ action), only in woods, fields, heath and marsh: **4–6** feeds you a day, **7 or more** 2–4 days. In the morning (until 11, when game is about) it's rolled with advantage.

  **Shows:**

  - A check at one of the system's own actions (`at: actions.forage`)
  - A stat and advantage in the roll: `1d6 + {{party.stats.survival}}`
  - Dice inside a value (`days: '{{1d3+1}}'`), read back by the text and the effect (`{{days}}`)
  - A **part of the calendar's day**: advantage by itself in the morning (`modeWhen: { roll-modes.advantage: { time.part: morning } }`, 06:00 to 11:00)
  - **Effects**: `party.items.ration: 1`, a ration found
roll: '1d6 + {{party.stats.survival}}'
modes: [roll-modes.advantage, roll-modes.disadvantage]
# A part of the calendar's day (calendar.yaml): the morning, 06:00 to 11:00.
modeWhen:
  roll-modes.advantage: { time.part: morning }
entries:
  - { id: nothing, range: 1-3, result: Nothing to eat here }
  - {
      id: some,
      range: 4-6,
      result: Berries and roots for a day,
      effects: { party.items.ration: 1 },
    }
  - {
      id: plenty,
      range: 7-20,
      result: 'Game! Food for {{days}} days',
      set: { days: '{{1d3+1}}' },
      effects: { party.items.ration: '{{days}}' },
    }
---
# What the ground tells, where the place is dangerous; where it isn't, the action's `nothing`.
kind: table
id: tracks
tags: [travel, rules]
name: Tracks
description: |-
  What the party reads on the ground with **Look for tracks**, where the place is dangerous. Where it isn't, no roll: the action says so in its own words, once the hour is spent.

  **Shows:**

  - An action's `nothing`, for what the player can't know before trying (`needs` would tell for free)
  - A check at the end of an action, on a value the place holds: `place.danger: { gte: 1 }`
  - What left fresh tracks by the terrain, as _Who goes there?_ finds its foes (`place.terrain`), and a condition of the Company given for this place only (`party.conditions.forewarned: 1`, its sheet's `lasts: places`): a fight begun here starts with the Company's turns
roll: '1d6 + {{party.stats.survival}}'
# The fresh rows say what walks here, as the encounter table's foes are found: wolves in the
# woods and on the heath, outlaws in the hills and the marsh. Each leaves the Company
# forewarned for this place (`lasts: places` on its sheet).
entries:
  - {
      id: faint,
      range: 1-3,
      result: 'Something passed here, days ago: the rain has taken the rest',
    }
  - id: wolves
    range: 4-20
    when: { place.terrain: [forest, dense-forest, heath] }
    result: 'Wolf-prints in the mud, a pack of them, not a day old: the Company is forewarned'
    effects: { party.conditions.forewarned: 1 }
  - id: outlaws
    range: 4-20
    when: { place.terrain: [hills, marsh, swamp] }
    result: 'Boot-prints and a fire not a day cold: outlaws, and the Company is forewarned'
    effects: { party.conditions.forewarned: 1 }
  - id: unknown
    range: 4-20
    unless: { place.terrain: [forest, dense-forest, heath, hills, marsh, swamp] }
    result: 'Fresh tracks of something nobody knows, not a day old: the Company is forewarned'
    effects: { party.conditions.forewarned: 1 }
---
# A roll-under on the table's own roll: its entries read the d6 as `roll`, in a condition
# against a stat (at or under Survival) and in their texts.
kind: table
id: fishing
tags: [travel, rules]
name: Fishing
description: |-
  What bites when you **fish** (the _Fish_ action), next to a lake, the sea or on the coast: a d6 **at or under Survival** catches fish for two days; otherwise 1–3 for one day.

  **Shows:**

  - A check at one of the system's own actions (`at: actions.fish`), and an action only next to water (`around.water`)
  - A **roll-under** on the table's own roll: `party.stats.survival: { gte: '{{roll}}' }`
  - The roll's total in the texts: `{{roll}}`
roll: 1d6
entries:
  - id: catch
    range: 1-6
    when: { party.stats.survival: { gte: '{{roll}}' } }
    result: 'A {{roll}}, at or under your Survival: a fine catch, food for two days'
    effects: { party.items.ration: 2 }
  - id: some
    range: 1-3
    result: 'A {{roll}}: a few small fish, food for a day'
    effects: { party.items.ration: 1 }
  - { id: nothing, range: 4-6, result: 'A {{roll}}: nothing bites', set: { skunked: true } }
---
# Spending supplies: the toll is paid in food, unless a d6 rolls the party's charisma or
# under (a roll in a condition: both entries read the same d6, so exactly one comes up).
kind: table
id: toll
tags: [travel, rules]
name: The toll
description: |-
  **Keld Bridge**'s toll, arriving by road: roll a d6; at or under the party's **Charisma**, the bridge-warden waves you through, otherwise he takes a day's food.

  **Shows:**

  - A check with `all` / `tags` / `connections`
  - A roll-under against a stat in a condition: `party.stats.charisma: { gte: '{{1d6}}' }`, one d6 for both entries (`when` on one, `unless` on the other)
  - An effect with a negative number: `party.items.ration: -1`, a ration spent
  - An effect on a faction from a trip: paying makes the garrison of Fort Keld think better of you (`factions.fort-keld.values.reputation: 1`, on a map with its factions)
entries:
  - id: pay
    result: 'The bridge-warden takes a day’s food as toll'
    unless: { party.stats.charisma: { gte: '{{1d6}}' } }
    effects: { party.items.ration: -1, factions.fort-keld.values.reputation: 1 }
  - id: wave
    result: The bridge-warden likes your look and waves you through
    when: { party.stats.charisma: { gte: '{{1d6}}' } }
---
# Finding a hidden path: an effect on the connections of a kind leaving the party's place.
kind: table
id: hidden-path
tags: [travel, rules]
name: Looking for the hidden path
description: |-
  Where a **hidden path** starts (the Barrow-road, from the Barrow-halls to Hollow Gate; a crack behind the bones of a crypt, in the Deep Barrows), the party looks for it each time it comes by, until it's found: roll a d6 plus the party's **Survival**; on 5 or more it's found, and routes may take it from then on.

  **Shows:**

  - A check on the connections leaving the place, by kind and state: `place.connections.hidden-path.state: hidden`
  - An effect on them, kept in the trip and never on the map: `place.connections.hidden-path.state: found`
  - A connection that can't be crossed until then: `passable: { when: { connection.state: found } }`
  - A connection between far hexes: the hexes between its ends at its kind's `multiplier`, not the hills'
  - Rows of the same range told apart by a condition (`when: { place.floor: true }`): under the ground the same roll is told in a crypt's words
roll: '1d6 + {{party.stats.survival}}'
entries:
  # Under the ground (a crypt's crack): the same roll, in its own words.
  - id: nothing-below
    range: 1-4
    when: { place.floor: true }
    result: Dust and old bones against the wall; nothing behind them
  - id: found-below
    range: 5-20
    when: { place.floor: true }
    result: 'A cold draught through the bones: a crack in the wall behind them, wide enough to pass'
    effects: { place.connections.hidden-path.state: found }
  - { id: nothing, range: 1-4, result: Heather and stones; no sign of the path }
  - id: found
    range: 5-20
    result: 'Cairns half-buried in the heather: the Barrow-road'
    effects: { place.connections.hidden-path.state: found }
---
# Fatigue down (negative) at a shrine; a once-only blessing comes up a single time.
kind: table
id: shrine
tags: [travel, rules]
name: At the shrine
description: |-
  A wayside **shrine**.

  **Shows:**

  - Fatigue going down: `fatigue: -2`
  - A party stat going up: `morale`
  - `once`: the blessing comes a single time
  - `notable: false`: a quiet hour isn't an important moment, though the shrine's check pauses the trip (it waits in the trip's panel, not up front)
entries:
  - {
      id: blessing,
      weight: 1,
      once: true,
      result: 'A voice answers your prayer: the road will be kind',
      effects: { party.stats.morale: 2, party.stats.fatigue: -2 },
    }
  - {
      id: rest,
      weight: 3,
      result: A quiet hour at the shrine eases your legs,
      effects: { party.stats.fatigue: -1 },
      notable: false,
    }
---
# An oracle: its input `odds` comes from the bindings' context (FORD: odds even), or is
# chosen by hand. Each variant rolls its own dice; answers "then roll" a consequence.
kind: oracle
id: ford
tags: [travel, rules]
name: Crossing the ford
description: |-
  **Does the crossing go well?** The water decides; the party's Survival helps.

  **Shows:**

  - An **oracle** whose input comes from the bindings: `odds: even`
  - Variants with their own dice
  - Day values set by the weather: `{{today.fordModifier}}`, `today.fordImpossible`
  - What the companions carry: +1 with a rope (`{{min(party.stats.roped, 1)}}`, a stat counting the companions with an item tagged `climbing`)
  - `set: { lost: true }`: no crossing today
  - A roll mode of the pack's own: _Carefully_ (three rolls, the middle one kept)
modes: [roll-modes.careful]
inputs:
  odds:
    label: The water
    options: [low, even, high]
    labels: { low: Low and slow, even: Waist-deep, high: In flood }
    default: even
roll: '1d6 + {{party.stats.survival}} + {{today.fordModifier}} + {{min(party.stats.roped, 1)}}'
variants:
  low:
    entries:
      - { id: fine, range: 1-20, result: You wade across without trouble }
  even:
    entries:
      # A day value an earlier table set (a storm): `*Impossible` lasts until tomorrow.
      - id: spate
        range: 1-20
        when: { today.fordImpossible: true }
        result: 'The river is in spate: no crossing today'
        set: { lost: true }
      - {
          id: wet,
          range: 1-3,
          result: 'Halfway, the current takes you — {{result}}',
          table: table.ford-mishap,
        }
      - { id: fine, range: 4-20, result: 'Cold and wet, but across' }
  high:
    roll: '1d8 + {{party.stats.survival}} + {{today.fordModifier}} + {{min(party.stats.roped, 1)}}'
    entries:
      - id: spate
        range: 1-20
        when: { today.fordImpossible: true }
        result: 'The river is in spate: no crossing today'
        set: { lost: true }
      - {
          id: swept,
          range: 1-5,
          result: 'The flood sweeps you downstream — {{result}}',
          table: table.ford-mishap,
          effects: { party.stats.fatigue: 1 },
        }
      - { id: fine, range: 6-20, result: Somehow you make it across }
---
kind: table
id: ford-mishap
tags: [travel, rules]
name: Ford mishap
description: |-
  What the river takes. Rolled from the _Ford_'s answers.

  **Shows:** `set` on supplies (`food`, `fodder`) and on `fatigue`, and effects on the
  character who acts (`acting.…`): whoever leads the crossing sprains an ankle.
entries:
  - { id: food, result: a pack of food is lost, effects: { party.items.ration: -1 } }
  # Whoever leads the crossing (the character acting, chosen in the trip): hurt, and an
  # ankle sprained, which stops the party until it's tended.
  - id: rocks
    result: whoever leads the crossing is dashed against the rocks
    effects: { acting.values.health: -1, acting.conditions.sprained: true }
  - { id: tired, result: you drag yourselves out exhausted, effects: { party.stats.fatigue: 1 } }
  - { id: fodder, result: the fodder is soaked and spoiled, effects: { party.values.fodder: -1 } }
---
# Hunger, when camping with no food left (the check reads party.items.ration.count). The
# party's morale decides what follows: conditions on party values, a cascade into another
# table, and limits (once, maxOccurrences).
kind: table
id: hunger
tags: [travel, rules]
name: Hunger
description: |-
  **Camping with no food.** The lower the morale, the worse it goes.

  **Shows:**

  - A camp check on the party's supplies: `party.items.ration.count` under 1
  - Morale in the roll and in a condition
  - `maxOccurrences` with `onExhausted: next`: after the second desertion, the next entry answers
  - A stat going down: `hirelings`
roll: '1d6 + {{party.stats.morale}}'
onExhausted: next
entries:
  # At morale 0 or less, whatever the roll: someone leaves (at most twice a session).
  - id: desertion
    range: -20-20
    when: { party.stats.morale: { lte: 0 } }
    maxOccurrences: 2
    result: 'In the night, {{result}}'
    table: table.desertion
    effects: { party.stats.morale: -1, party.stats.hirelings: -1 }
  # The last time the hirelings leave, the next hungry night grumbles instead (`next`).
  - {
      id: grumble,
      range: -20-4,
      result: 'Empty bellies, short tempers',
      effects: { party.stats.morale: -1, party.stats.fatigue: 1 },
    }
  - {
      id: endure,
      range: 5-20,
      result: 'You tighten your belts and sing to forget',
      effects: { party.stats.fatigue: 1 },
    }
---
# Who leaves: a hireling's name (a generator's table) and what they take.
kind: table
id: desertion
tags: [travel, rules]
name: Desertion
description: |-
  Who leaves in the night, and what they take.

  **Shows:**

  - A cascade into _Names of the Marches_
  - `once`: the note comes a single time
entries:
  - { id: food, result: '{{result}} slips away with the last of the bread', table: table.npc-names }
  - { id: torch, result: '{{result}} is gone by dawn, and the torches too', table: table.npc-names }
  # Once a session: the deserter leaves a note.
  - {
      id: note,
      once: true,
      result: 'a note is pinned to your pack: “The Greywood is no place for me.”',
    }
---
kind: table
id: scouting
tags: [travel, rules]
name: Scouting ahead
description: |-
  Rolled by _Scout ahead_: a d6 at or under the skill the player chose, of whoever acts.

  **Shows:** a test naming its skill by a parameter (`acting.values[params.skill]`): one table for every skill the action may ask for; a roll-under (`gte: '{{roll}}'`), each result its own branch; a condition of the Company given for two places, this one and the next (`party.conditions.scouted: 2`, its sheet's `lasts: places`), which makes the next place's encounter roll take a roll mode by itself (_Who goes there?_, _Warned_).
roll: 1d6
entries:
  - id: clear
    range: 1-6
    # A key with brackets is written outside braces (or quoted inside them).
    when:
      acting.values[params.skill]: { gte: '{{roll}}' }
    result: 'The way ahead is clear ({{roll}} against {{acting.values[params.skill]}})'
    # Two places: this one and the next, whose encounter is rolled Warned.
    effects: { party.stats.morale: 1, party.conditions.scouted: 2 }
  - id: nothing
    range: 1-6
    unless:
      acting.values[params.skill]: { gte: '{{roll}}' }
    result: 'Nothing to be learnt out there ({{roll}} against {{acting.values[params.skill]}})'
---
# Rolled by _Drive them off_: 2d6 and a Survival against the firmest foe's Morale (the
# foes' own morale roll, bestiary.yaml: a 2d6 over it, it runs). The companion acting adds
# theirs to the roll; a Company with none adds its own in the condition (`{{roll + …}}`).
kind: table
id: drive-off
tags: [encounters, rules]
name: Driving them off
description: |-
  Rolled by _Drive them off_: 2d6 and the Survival of whoever acts (the Company's, with no companions) against the firmest foe's Morale. Over it, they all run; otherwise they stand, and the fight begins (with no companions, who don't fight, the Company loses heart and they stay).

  **Shows:** a roll against the best of those present (`present.highest.values.morale`), as _Scouting ahead_ compares its roll; a skill added to the roll (`2d6 + {{acting.values.survival}}`) or in the condition, by arithmetic (`'{{roll + party.stats.survival}}'`), whether the Company has companions or not (`party.members: { exists: … }`); every foe routed at once (`present.all.conditions.routed`); a fight started by a result (`encounter: start`).
roll: '2d6 + {{acting.values.survival}}'
entries:
  - id: routed
    range: 2-17
    when:
      party.members: { exists: true }
      present.highest.values.morale: { lt: '{{roll}}' }
    result: 'They break and run ({{roll}} against {{present.highest.values.morale}})'
    effects: { present.all.conditions.routed: true }
  - id: stand
    range: 2-17
    when: { party.members: { exists: true } }
    unless: { present.highest.values.morale: { lt: '{{roll}}' } }
    result: 'They hold their ground, and come on ({{roll}} against {{present.highest.values.morale}})'
    effects: { encounter: start }
  # With no companions, the Company's own Survival, added in the condition.
  - id: routed-alone
    range: 2-17
    when:
      party.members: { exists: false }
      present.highest.values.morale: { lt: '{{roll + party.stats.survival}}' }
    result: 'They break and run ({{roll + party.stats.survival}} against {{present.highest.values.morale}})'
    effects: { present.all.conditions.routed: true }
  # Whatever else: what the rows above don't take (written as their opposite, so one row
  # always comes up).
  - id: hold
    range: 2-17
    unless:
      any:
        - { party.members: { exists: true } }
        - { present.highest.values.morale: { lt: '{{roll + party.stats.survival}}' } }
    result: 'They will not be driven off, and the Company loses heart ({{roll + party.stats.survival}} against {{present.highest.values.morale}})'
    effects: { party.stats.morale: -1 }
---
# Looking a chest over (travel.yaml's Look it over), aimed at the one chosen
# (`characters[params.chest]`, the action's parameter): its needle drawn, or sprung.
kind: table
id: look-chest
tags: [rules]
name: Looking it over
description: |-
  Rolled by _Look it over_ at a chest with a needle in its lock: 2d6 and the Survival of whoever acts. 8 or more, the needle is drawn; otherwise it pricks them, for its harm, and it's spent.

  **Shows:** a table rolled on a thing present that doesn't fight, chosen by its action (`characters[params.chest].values.needle`), read in its text and changed by its effects; the one acting harmed by it (`acting.values.health`).
roll: '2d6 + {{acting.values.survival}}'
entries:
  - id: drawn
    range: 8-20
    result: 'A needle in the lock, drawn with care ({{roll}})'
    effects: { 'characters[params.chest].values.needle': '=0' }
  - id: pricked
    range: 2-7
    result: 'The needle pricks {{acting.name}} ({{roll}}): {{characters[params.chest].values.needle}} harm'
    effects:
      acting.values.health: '-{{characters[params.chest].values.needle}}'
      'characters[params.chest].values.needle': '=0'
---
# Picking a door's lock (travel.yaml's Pick the lock): 7 and its Lock or more.
kind: table
id: pick-door
tags: [rules]
name: Picking the door
description: |-
  Rolled by _Pick the lock_ at a locked door at hand (the Wet Ferret's cellar door): 2d6 and the Stealth of whoever acts, against 7 and the door's Lock. Made, that door is open for the rest of the trip; otherwise the lock holds.

  **Shows:** a roll against a value of the one connection chosen (`'place.connections[params.door].lock': { lt: '{{roll - 6}}' }`), a door at hand (`from: place.connections.door.near`), and an effect on that door alone (`'place.connections[params.door].state': open`).
roll: '2d6 + {{acting.values.stealth}}'
entries:
  - id: open
    range: 2-20
    when: { 'place.connections[params.door].lock': { lt: '{{roll - 6}}' } }
    result: 'The lock gives ({{roll}} against {{7 + place.connections[params.door].lock}})'
    effects: { 'place.connections[params.door].state': open }
  - id: holds
    range: 2-20
    unless: { 'place.connections[params.door].lock': { lt: '{{roll - 6}}' } }
    result: 'The lock holds ({{roll}} against {{7 + place.connections[params.door].lock}})'
---
# Picking a chest's lock (travel.yaml's Pick it): 7 and its Lock or more.
kind: table
id: pick-chest
tags: [rules]
name: Picking the lock
description: |-
  Rolled by _Pick it_ at a locked chest: 2d6 and the Stealth of whoever acts, against 7 and the chest's Lock. Made, it's open; a fumble (4 or less) springs its needle, if it has one; otherwise the lock holds.

  **Shows:** a roll against a value of the thing chosen (`'characters[params.chest].values.lock': { lt: '{{roll - 6}}' }`), the rows told apart by conditions on it, written as each other's opposites so one always comes up.
roll: '2d6 + {{acting.values.stealth}}'
entries:
  - id: open
    range: 2-20
    when: { 'characters[params.chest].values.lock': { lt: '{{roll - 6}}' } }
    result: 'The lock gives ({{roll}} against {{7 + characters[params.chest].values.lock}})'
    effects: { 'characters[params.chest].values.lock': '=0' }
  - id: sprung
    range: 2-4
    when: { 'characters[params.chest].conditions': needled }
    unless: { 'characters[params.chest].values.lock': { lt: '{{roll - 6}}' } }
    result: 'A fumble, and the needle springs: {{characters[params.chest].values.needle}} harm to {{acting.name}}'
    effects:
      acting.values.health: '-{{characters[params.chest].values.needle}}'
      'characters[params.chest].values.needle': '=0'
  - id: holds
    range: 2-20
    unless:
      any:
        - { 'characters[params.chest].values.lock': { lt: '{{roll - 6}}' } }
        - all:
            - { 'characters[params.chest].conditions': needled }
            - { roll: { lte: 4 } }
    result: 'The lock holds ({{roll}} against {{7 + characters[params.chest].values.lock}})'
---
# What a chest held (travel.yaml's Take the grave goods), rolled as it leaves those present.
kind: table
id: chest-goods
tags: [treasure]
name: In the chest
description: |-
  What a chest of grave goods held, rolled as it's opened: dust, old silver, or the gold of the old kings.

  **Shows:** a table rolled as a thing present leaves (`on: present.leave`), only for one that was opened (`when: { acting.template: grave-chest, acting.conditions: opened }`), read acting as it; an item given held unknown to whoever of the Company carries things (`party.items.cordial.unknown: 1`: _A stoppered flask_).
roll: 1d6
entries:
  - { id: dust, range: 1, result: Dust and rotten cloth }
  - id: flask
    range: 2
    result: A stoppered flask among the dust
    # Held unknown (items.yaml's cordial): what it is hidden till it's known.
    effects: { party.items.cordial.unknown: 1 }
  - id: silver
    range: 3-5
    set: { coins: '{{2d6}}' }
    result: '{{coins}} pieces of old silver'
    effects: { party.stats.silver: '{{coins}}' }
  - id: gold
    range: 6
    set: { crowns: '{{1d6+2}}' }
    result: '{{crowns}} gold crowns of the old kings'
    effects: { party.stats.silver: '{{crowns * 10}}' }
---
# The cordial drunk (travel.yaml's Drink it, its Use): one flask in six has turned.
kind: table
id: cordial
tags: [rules]
name: The cordial drunk
description: |-
  Rolled by _Drink it_, the hedge-witches' cordial's **Use**: on a 1 it had turned, and the Company is wearier (+1 fatigue); otherwise its fatigue is gone.

  **Shows:** a table rolled by the action an item's **Use** takes (`use: actions.drink`) when the item used is the cordial (`'acting.items[params.item].id': cordial`, the one used read as `params.item`, its key), the flask itself spent by that action's next step (`acting.items[params.item]: -1`).
roll: 1d6
entries:
  - id: turned
    range: 1
    result: 'It had turned: bitter, and the Company is wearier for it'
    effects: { party.stats.fatigue: 1 }
  - id: good
    range: 2-6
    result: 'Green and bitter: the Company’s fatigue is gone'
    effects: { party.stats.fatigue: '=0' }
---
# Tasting a flask held unknown (travel.yaml's Taste a flask): 8 or more and it's known.
kind: table
id: taste
tags: [rules]
name: A careful sip
description: |-
  Rolled by _Taste a flask_: 2d6 and the Survival of whoever tastes it. 8 or more, the flask is known for what it is, the hedge-witches' cordial; otherwise it tastes of herbs, and of nothing they know.

  **Shows:** an item held unknown identified by an effect (`acting.items.cordial.known: 1`), its true name shown and told from then on.
roll: '2d6 + {{acting.values.survival}}'
entries:
  - id: known
    range: 8-20
    result: 'Herbs of the Greywood, and something sharper: the hedge-witches’ cordial ({{roll}})'
    effects: { acting.items.cordial.known: 1 }
  - { id: unknown, range: 2-7, result: 'Herbs, and nothing they know ({{roll}})' }
