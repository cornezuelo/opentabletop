# Tables the travel checks roll. Their `set` values are what the trip understands:
# lost, weather, fatigue and resources (food, fodder…; negative to spend).

# Dice with context values: missing ones count as 0. Fog and storms make it harder.
kind: table
id: getting-lost
name: Do we get lost?
description: "At dawn, off roads and rivers. The party's Navigation helps; fog doesn't. Shows: a travel check (bound to NAVIGATION_CHECK_REQUIRED), a party stat in the roll ({{navigation}}), `set: { lost: true }` (no more travel today), and conditions on the weather and on being outside any region (`exists: false`)."
roll: '1d6 + {{navigation}}'
entries:
  - {
      id: fog,
      range: 1-3,
      when: { weather: fog },
      result: 'Lost in the fog: no progress today',
      set: { lost: true },
    }
  # Outside any named region there are no landmarks to go by (`exists: false`).
  - id: wild
    range: 1-2
    when: { region: { exists: false } }
    result: 'No landmarks out here: you wander off course'
    set: { lost: true }
  # Being lost also costs morale: a party stat changed by a table (stats: …).
  - {
      id: lost,
      range: 1,
      result: 'You are lost: no progress today',
      set: { lost: true, stats: { morale: -1 } },
    }
  - { id: course, range: 2-20, result: You keep your course }
---
# A party stat in the roll, with advantage on offer (the panel's Advantage). The amount
# found is itself rolled inside the value (resources: { food: '{{1d3+1}}' }); the text
# reads that same value back ({{resources.food}}) and the trip adds it to the supplies.
kind: table
id: forage
name: Foraging
description: "What you find when you forage for food (the Forage for food action, in woods, fields, heath and marsh). Shows: a check at one of the system's own actions, a stat and advantage in the roll, dice inside a value (`food: '{{1d3+1}}'`) read back by the text ({{resources.food}}), and `set: { resources }` (the food gained)."
roll: '1d6 + {{survival}}'
advantage: true
entries:
  - { id: nothing, range: 1-3, result: Nothing to eat here }
  - { id: some, range: 4-6, result: Berries and roots for a day, set: { resources: { food: 1 } } }
  - {
      id: plenty,
      range: 7-20,
      result: 'Game! Food for {{resources.food}} days',
      set: { resources: { food: '{{1d3+1}}' } },
    }
---
# Spending supplies: the toll is paid in food.
kind: table
id: toll
name: The toll
description: "Keld Bridge's toll, arriving by road. Shows: a check with all / tags / edges, and `set: { resources }` with a negative number (food spent)."
entries:
  - {
      id: pay,
      weight: 3,
      result: 'The bridge-warden takes a day’s food as toll',
      set: { resources: { food: -1 } },
    }
  - { id: wave, weight: 1, result: The bridge-warden waves you through }
---
# Fatigue down (negative) at a shrine; a once-only blessing comes up a single time.
kind: table
id: shrine
name: At the shrine
description: 'A wayside shrine. Shows: fatigue going down (`fatigue: -2`), a party stat going up (morale), and `once` (the blessing comes a single time).'
entries:
  - {
      id: blessing,
      weight: 1,
      once: true,
      result: 'A voice answers your prayer: the road will be kind',
      set: { fatigue: -2, stats: { morale: 2 } },
    }
  - {
      id: rest,
      weight: 3,
      result: A quiet hour at the shrine eases your legs,
      set: { fatigue: -1 },
    }
---
# An oracle: its input `odds` comes from the bindings' context (FORD: odds even), or is
# chosen by hand. Each variant rolls its own dice; answers "then roll" a consequence.
kind: oracle
id: ford
name: Crossing the ford
description: "Does the crossing go well? The water decides; the party's Survival helps. Shows: an oracle whose input comes from the bindings (`odds: even`), variants with their own dice, day values set by the weather ({{fordModifier}}, fordImpossible), and `set: { lost: true }`."
inputs:
  odds:
    label: The water
    options: [low, even, high]
    labels: { low: Low and slow, even: Waist-deep, high: In flood }
    default: even
roll: '1d6 + {{survival}} + {{fordModifier}}'
variants:
  low:
    entries:
      - { id: fine, range: 1-20, result: You wade across without trouble }
  even:
    entries:
      # A day value an earlier table set (a storm): `*Impossible` lasts until tomorrow.
      - id: spate
        range: 1-20
        when: { fordImpossible: true }
        result: 'The river is in spate: no crossing today'
        set: { lost: true }
      - {
          id: wet,
          range: 1-3,
          result: 'Halfway, the current takes you — {{result}}',
          table: ford-mishap,
        }
      - { id: fine, range: 4-20, result: 'Cold and wet, but across' }
  high:
    roll: '1d8 + {{survival}} + {{fordModifier}}'
    entries:
      - id: spate
        range: 1-20
        when: { fordImpossible: true }
        result: 'The river is in spate: no crossing today'
        set: { lost: true }
      - {
          id: swept,
          range: 1-5,
          result: 'The flood sweeps you downstream — {{result}}',
          table: ford-mishap,
          set: { fatigue: 1 },
        }
      - { id: fine, range: 6-20, result: Somehow you make it across }
---
kind: table
id: ford-mishap
name: Ford mishap
description: "What the river takes. Shows: `set` on supplies (food, fodder) and fatigue, rolled from the Ford's answers."
entries:
  - { id: food, result: a pack of food is lost, set: { resources: { food: -1 } } }
  - { id: tired, result: you drag yourselves out exhausted, set: { fatigue: 1 } }
  - { id: fodder, result: the fodder is soaked and spoiled, set: { resources: { fodder: -1 } } }
---
# Hunger, when camping with no food left (the check reads party.resources.food). The
# party's morale decides what follows: conditions on party values, a cascade into another
# table, and limits (once, maxOccurrences).
kind: table
id: hunger
name: Hunger
description: "Camping with no food. The lower the morale, the worse it goes. Shows: a camp check on the party's supplies (party.resources.food under 1), morale in the roll and in a condition, maxOccurrences with `onExhausted: next` (after the second desertion, the next entry answers), and a stat going down (hirelings)."
roll: '1d6 + {{party.stats.morale}}'
onExhausted: next
entries:
  # At morale 0 or less, whatever the roll: someone leaves (at most twice a session).
  - id: desertion
    range: -20-20
    when: { party.stats.morale: { lte: 0 } }
    maxOccurrences: 2
    result: 'In the night, {{result}}'
    table: desertion
    set: { stats: { morale: -1, hirelings: -1 } }
  # The last time the hirelings leave, the next hungry night grumbles instead (`next`).
  - {
      id: grumble,
      range: -20-4,
      result: 'Empty bellies, short tempers',
      set: { stats: { morale: -1 }, fatigue: 1 },
    }
  - {
      id: endure,
      range: 5-20,
      result: 'You tighten your belts and sing to forget',
      set: { fatigue: 1 },
    }
---
# Who leaves: a hireling's name (a generator's table) and what they take.
kind: table
id: desertion
name: Desertion
description: 'Who leaves in the night, and what they take. Shows: cascades into Names of the Marches, and `once` (the note comes a single time).'
entries:
  - { id: food, result: '{{result}} slips away with the last of the bread', table: npc-names }
  - { id: torch, result: '{{result}} is gone by dawn, and the torches too', table: npc-names }
  # Once a session: the deserter leaves a note.
  - {
      id: note,
      once: true,
      result: 'a note is pinned to your pack: “The Greywood is no place for me.”',
    }
