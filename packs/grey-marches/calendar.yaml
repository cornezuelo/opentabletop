# The Marcher reckoning: the calendar of the Grey Marches' trips. Twelve months of 30
# days in four seasons, a seven-day week, two moons and the feasts the tables know.
# Tables and checks see `month`, `year`, `weekday`, `moons.pale` / `moons.ember` (new,
# waxing, full, waning) and `holidays` (a list: `when: { holidays: midsummer }`).
kind: calendar
id: marcher-reckoning
name: The Marcher reckoning
description: |-
  How the Marches count time: twelve months of thirty days in four seasons, a seven-day
  week, two moons, the feasts the tables know and the parts of a Marcher's day.

  **Shows:** months with their seasons, weekdays, moons with their cycles, holidays, a
  division of the day of its own (`divisions: { part: … }`, read as `time.part`, with a
  `dark` tag on the grey hour and the night) and numbered watches (`watchHours`).
watchHours: 4
# The parts of a Marcher's day, from the grey hour before dawn to the night: the World
# panel waits until one (Until…), and conditions read `time.part` and `time.tags`.
divisions:
  part:
    name: Part of the day
    parts:
      - { id: grey-hour, name: the grey hour, from: '04:00', tags: [dark] }
      - { id: morning, name: morning, from: '06:00' }
      - { id: midday, name: midday, from: '11:00' }
      - { id: afternoon, name: afternoon, from: '14:00' }
      - { id: evening, name: evening, from: '18:00' }
      - { id: night, name: night, from: '20:00', tags: [dark] }
startYear: 412
months:
  - { id: thaw, name: Thaw, days: 30, season: spring }
  - { id: sowing, name: Sowing, days: 30, season: spring }
  - { id: blossom, name: Blossom, days: 30, season: spring }
  - { id: highsun, name: Highsun, days: 30, season: summer }
  - { id: haying, name: Haying, days: 30, season: summer }
  - { id: harvest, name: Harvest, days: 30, season: summer }
  - { id: leaffall, name: Leaffall, days: 30, season: autumn }
  - { id: mists, name: Mists, days: 30, season: autumn }
  - { id: frostfall, name: Frostfall, days: 30, season: autumn }
  - { id: deepwinter, name: Deepwinter, days: 30, season: winter }
  - { id: wolfmoon, name: Wolfmoon, days: 30, season: winter }
  - { id: lastsnow, name: Lastsnow, days: 30, season: winter }
weekdays:
  - { id: moonday, name: Moonday }
  - { id: ironday, name: Ironday }
  - { id: wellday, name: Wellday }
  - { id: thornday, name: Thornday }
  - { id: hearthday, name: Hearthday }
  - { id: marketday, name: Marketday }
  - { id: restday, name: Restday }
moons:
  - { id: pale, name: the Pale Moon, cycle: 28 }
  - { id: ember, name: the Ember Moon, cycle: 45, offset: 20 }
holidays:
  - { id: first-thaw, name: First Thaw, month: thaw, day: 1 }
  - { id: midsummer, name: Midsummer, month: highsun, day: 15 }
  - { id: harvest-home, name: Harvest Home, month: harvest, day: 30 }
  - { id: long-night, name: The Long Night, month: deepwinter, day: 15 }
