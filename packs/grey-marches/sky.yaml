# The weather check of the Marches' trips (travel.yaml binds WEATHER_CHECK_REQUIRED to
# it): today's weather follows yesterday's. Per season, each kind of weather says how
# likely tomorrow is to be each kind, so rain sets in for days and storms blow over.
# The tables in weather.yaml roll weather without memory (for rolls by hand).
kind: weather
id: sky
name: { en: The Marches' sky, es: El cielo de las Marcas }
states:
  clear: { name: { en: Clear skies, es: Cielo despejado } }
  grey: { name: { en: Grey and mild, es: Gris y templado } }
  rain: { name: { en: Steady rain, es: Lluvia constante }, set: { fordModifier: -1 } }
  fog: { name: { en: Thick fog, es: Niebla espesa } }
  storm:
    name: { en: 'Storm: nobody travels', es: 'Tormenta: nadie viaja' }
    set: { fordImpossible: true }
  snow: { name: { en: Falling snow, es: Nieva } }
seasons:
  spring:
    start: grey
    next:
      clear: { clear: 3, grey: 2, rain: 1 }
      grey: { grey: 3, clear: 2, rain: 2, fog: 1 }
      rain: { rain: 3, grey: 2, storm: 1 }
      fog: { fog: 2, grey: 2, clear: 1 }
      storm: { rain: 2, grey: 1 }
  summer:
    start: clear
    next:
      clear: { clear: 5, grey: 1, storm: 1 }
      grey: { clear: 2, grey: 2, rain: 1, storm: 1 }
      rain: { grey: 2, clear: 2, rain: 1 }
      storm: { clear: 2, grey: 1 }
  autumn:
    start: grey
    next:
      clear: { clear: 2, grey: 2, fog: 2 }
      grey: { grey: 3, fog: 2, rain: 2 }
      fog: { fog: 3, grey: 2, rain: 1 }
      rain: { rain: 3, grey: 2, storm: 1 }
      storm: { rain: 2, fog: 1 }
  winter:
    start: snow
    next:
      clear: { clear: 3, snow: 1, grey: 1 }
      grey: { grey: 2, snow: 2, clear: 1 }
      snow: { snow: 3, clear: 1, storm: 1 }
      storm: { snow: 2, storm: 1 }
