# The weather check of the Marches' trips (travel.yaml binds WEATHER_CHECK_REQUIRED to
# it): today's weather follows yesterday's. Per season, each kind of weather says how
# likely tomorrow is to be each kind, so rain sets in for days and storms blow over; winter
# is a hex flower.
# The tables in weather.yaml roll weather without memory (for rolls by hand).
kind: weather
id: sky
name: The Marches' sky
states:
  clear: { name: Clear skies }
  grey: { name: Grey and mild }
  rain: { name: Steady rain, set: { fordModifier: -1 } }
  fog: { name: Thick fog }
  storm:
    name: 'Storm: nobody travels'
    set: { fordImpossible: true }
  # Snow sets a value of the day the travel rules declare: it leaves the horses behind.
  snow: { name: Falling snow, set: { snowbound: true } }
seasons:
  spring:
    start: grey
    next:
      clear: { clear: 3, grey: 2, rain: 1 }
      grey: { grey: 3, clear: 2, rain: 2, fog: 1 }
      rain: { rain: 3, grey: 2, storm: 1 }
      fog: { fog: 2, grey: 2, clear: 1 }
      storm: { rain: 2, grey: 1 }
  summer:
    start: clear
    next:
      clear: { clear: 5, grey: 1, storm: 1 }
      grey: { clear: 2, grey: 2, rain: 1, storm: 1 }
      rain: { grey: 2, clear: 2, rain: 1 }
      storm: { clear: 2, grey: 1 }
  autumn:
    start: grey
    next:
      clear: { clear: 2, grey: 2, fog: 2 }
      grey: { grey: 3, fog: 2, rain: 2 }
      fog: { fog: 3, grey: 2, rain: 1 }
      rain: { rain: 3, grey: 2, storm: 1 }
      storm: { rain: 2, fog: 1 }
  # Winter is a hex flower instead: 19 cells, harsh at the top, fair at the bottom, and
  # each day 2d6 moves the weather one cell (the usual moves: the middle rolls go
  # south-east, towards fair weather; off the edge it comes back in on the far side).
  # Weather drifts: from snow to grey to clear, rarely straight from storm to sun.
  winter:
    flower:
      start: snow
      rows:
        - [storm, storm, snow]
        - [storm, snow, snow, snow]
        - [snow, snow, grey, grey, grey]
        - [grey, grey, clear, clear]
        - [clear, clear, clear]
