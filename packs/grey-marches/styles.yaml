# The Grey Marches' own map style: Core's Parchment as an old engraved atlas, its relief
# drawn by images (Azgaar's illustrated icons, the azgaar-relief pack) and a vellum's
# texture of its own (art/vellum.webp) laid over it. The Hollow Hills are drawn in it.
kind: style
id: engraved
name: Engraved atlas
description: |-
  The Marches as an old atlas: an ink wash on vellum, the hills, mountains and woods engraved as small pictures, a hill or a mountain to a cell and trees in clumps, the vellum's grain over everything. The Hollow Hills are drawn in it.

  **Shows:** art by images of other packs (`art.terrains.<terrain>.images`: Azgaar's illustrated relief icons, a list each cell picks one of, `count` of them a cell, tinted by `color`), beside painters for the rest; a texture over the map (`texture`) that is a raster image of the pack itself (`grey-marches/art/vellum.webp`), with its strength and repeat (`opacity`, `scale`).
paper: '#efe3c4'
grid: { color: '#5a4630', opacity: 0.1, coords: false }
glyphs: 0
ground: { wash: 0.7, blend: 0.25, ragged: 0.3, grain: 0 }
texture: { image: grey-marches/art/vellum.webp, opacity: 0.55, scale: 5 }
art:
  mode: ink
  ink: '#3b2a1a'
  terrains:
    plains: { painter: grass, density: 0.7 }
    farmland: farmland
    heath: { images: azgaar-relief/illustrated/grass-1.svg, count: 2, size: 0.6 }
    forest: { images: azgaar-relief/illustrated/conifer-1.svg, count: 2, size: 1.2 }
    dense-forest:
      images: [azgaar-relief/illustrated/deciduous-1.svg, azgaar-relief/illustrated/deciduous-2.svg]
      count: 3
    swamp: { images: azgaar-relief/illustrated/swamp-1.svg, count: 3, size: 0.8 }
    marsh: { images: azgaar-relief/illustrated/swamp-2.svg, count: 2, size: 0.8 }
    hills:
      images:
        - azgaar-relief/illustrated/hill-1.svg
        - azgaar-relief/illustrated/hill-2.svg
        - azgaar-relief/illustrated/hill-3.svg
        - azgaar-relief/illustrated/hill-4.svg
      size: 1.3
    mountains:
      images:
        - azgaar-relief/illustrated/mount-1.svg
        - azgaar-relief/illustrated/mount-3.svg
        - azgaar-relief/illustrated/mount-4.svg
        - azgaar-relief/illustrated/mount-5.svg
      size: 1.5
    # The peaks: the same mountains with snow, darkened to the Hills' grey stone.
    peaks:
      images:
        - azgaar-relief/illustrated/mountSnow-1.svg
        - azgaar-relief/illustrated/mountSnow-2.svg
        - azgaar-relief/illustrated/mountSnow-4.svg
      size: 1.5
      color: '#d8d2c8'
    coast: dots
    lake: { painter: waves, density: 0.4 }
    sea: { painter: waves, density: 0.6 }
    deep-sea: { painter: waves, density: 0.4 }
shores: { lines: 3, color: '#3b2a1a' }
paths:
  wobble: 0.5
  river: { color: '#3d6f96', width: 0.15 }
  road: { color: '#6b4a2a', width: 0.09 }
  trail: { color: '#6b4a2a', width: 0.07 }
captions:
  hexNames: { font: fell, color: '#3b2a1a', halo: true, haloColor: '#efe3c4' }
  regionNames: { font: fell, italic: true, halo: true, haloColor: '#efe3c4' }
  tokenNames: { font: fell, halo: true, haloColor: '#efe3c4' }
regions: { fill: 0.05, border: 0.06, dashed: true, borderOpacity: 0.7 }
connections:
  bridge: bridge
  ford: ford
