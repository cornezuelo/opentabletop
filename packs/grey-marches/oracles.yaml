# Oracles: an input chooses the variant (odds, stakes…). Answers can "then roll" another
# table, shown through {{result}}.

# Asked at the gates of a place: who you are changes the odds, and so do the guards — a
# value of the place's icon on the map ({{icon.guards}}: 0 in Ashford, 2 at Fort Keld;
# select the hex before rolling). Each answer then rolls what happens next.
kind: oracle
id: gates
name: Will they let us in?
description: At the gates of Ashford or Fort Keld. How you arrive changes the answer.
inputs:
  arrival:
    label: You arrive as
    options: [friends, strangers, armed]
    labels: { friends: Known friends, strangers: Strangers, armed: An armed band }
    default: strangers
roll: '1d6 + {{icon.guards}}'
variants:
  friends:
    entries:
      - { id: yes, range: 1-20, result: 'Yes — and {{result}}', table: gate-news }
  strangers:
    entries:
      - { id: yes, range: 1-3, result: 'Yes, for a coin — and {{result}}', table: gate-news }
      - { id: wait, range: 4-5, result: 'Wait until morning, outside the walls' }
      - { id: no, range: 6-20, result: 'No. Bows appear on the wall' }
  armed:
    # This variant rolls its own dice.
    roll: '1d8 + {{icon.guards}}'
    entries:
      - {
          id: yes,
          range: 1-2,
          result: 'Yes, if you give up your weapons — and {{result}}',
          table: gate-news,
        }
      - { id: no, range: 3-20, result: 'No. The gates stay shut' }
---
kind: table
id: gate-news
name: News at the gate
entries:
  - { id: rumour, result: 'the guard whispers a rumour: {{result}}', table: rumour }
  - { id: work, result: 'there is work: someone pays {{2d6}} silver for an escort' }
  - { id: feast, result: it is a feast day; the inn is full }
  # A holiday of the calendar: only on Midsummer, and then most likely.
  - id: midsummer
    weight: 6
    when: { holidays: midsummer }
    result: the whole town dances for Midsummer and the gates stand open
---
# A token's values: select Brenna on the map and roll this from the Oracle panel; her
# fare is a value of her token ({{token.fare}}). Without her, the jetty is empty.
kind: table
id: ferry
name: The ferry
roll: 1d6
entries:
  - id: calm
    range: 1-4
    when: { token.fare: { exists: true } }
    result: '{{token.name}} rows you across the Saltmere for {{token.fare}} silver each'
  - id: secret
    range: 5-6
    when: { token.fare: { exists: true } }
    result: '{{token.name}} waves away the coins: she wants a secret instead'
  - { id: empty, range: 1-6, result: 'The jetty is empty: select the ferrywoman to talk to her' }
---
# The inn of Ashford, The Wet Ferret. An oracle whose input is what you spend; each
# variant shows something else: rolls on party values ({{party.stats.morale}}), entries
# that only come up with enough food (conditions on party.resources), limits per session
# (once, maxOccurrences), cascades into other tables and generators, and values that
# change the party (food, morale, hirelings) — in the Hexmapper, "Apply to the trip"
# under the result. In the Oracle app there is no party: `exists` picks other entries.
kind: oracle
id: inn
name: At The Wet Ferret
description: 'The inn of Ashford. What you spend changes the night.'
inputs:
  spend:
    label: You spend
    options: [nothing, round, feast]
    labels: { nothing: Nothing, round: A round for the house, feast: A feast }
    default: round
variants:
  nothing:
    entries:
      - { id: cold, weight: 2, result: 'Cold looks and a corner by the door' }
      - { id: overheard, weight: 1, result: 'You overhear something: {{result}}', table: rumours }
  round:
    # A party value in the roll: high morale makes friends.
    roll: '2d6 + {{party.stats.morale}}'
    entries:
      # With no trip going on, there's no party: a plain night.
      - id: quiet
        range: -20-40
        when: { party: { exists: false } }
        result: 'A quiet night; nobody asks who you are'
        set: { resources: { food: -1 } }
      - id: brawl
        range: -20-5
        result: 'A brawl breaks out — {{result}}'
        table: reaction
        set: { reactionModifier: -2, resources: { food: -1 }, stats: { morale: -1 } }
      - id: talk
        range: 6-9
        result: 'The room warms to you: {{result}}'
        generator: rumour
        set: { resources: { food: -1 }, stats: { morale: 1 } }
      # At most twice a session, a sell-sword joins (a stat no one declared: hirelings).
      - id: hireling
        range: 10-40
        maxOccurrences: 2
        result: '{{result}} drinks with you and joins the company'
        table: npc-names
        set: { resources: { food: -1 }, stats: { morale: 1, hirelings: 1 } }
  feast:
    entries:
      # Only with food to spare (2 or more); otherwise the innkeeper shakes her head.
      - id: feast
        when: { party.resources.food: { gte: 2 } }
        result: 'A feast to remember: everyone sleeps well'
        set: { resources: { food: -2 }, stats: { morale: 2 }, fatigue: -1 }
      - id: short
        when: { any: [{ party.resources.food: { lt: 2 } }, { party: { exists: false } }] }
        result: 'Not enough in the larder for a feast tonight'
