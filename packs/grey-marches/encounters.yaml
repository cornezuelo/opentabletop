# Encounters: one table for every check, depending on where you are and when. The first
# entry whose condition holds wins; the last one has none and catches the rest.

# Conditions on the map (terrain, tags, region, the hex's `danger` field) and on the
# bindings' context (timeOfDay). Comparisons (gte, lt), lists, any / all / not.
kind: table
id: encounter
name: Who goes there?
description: |-
  **Who you meet**: depends on the terrain, the region, the hex's danger and the time of day.

  **Shows:**

  - One table for two checks, day and night, told apart by the bindings' context `timeOfDay`
  - Conditions on `terrain`, `region`, `tags`, `danger`, `season` and the moons (`moons.ember: full`)
  - An entry's `unless`: the Vale's patrol, never at night
  - `once`: the Wyrm, only at `danger` 5, in the Greywood's heart; `pause`: the trip stops when it comes up
  - Cascades into _Reaction_ and into a generator
  - `set` of a value for the next table (`reactionModifier`) and of a party stat (`morale`)
roll: '1d6 + {{danger}}'
entries:
  # A once-only encounter, only at the very heart of the Greywood (danger 5): the trip
  # stops (pause) until you press Continue.
  - id: wyrm
    range: 6-20
    once: true
    pause: true
    when: { all: [{ terrain: [forest, dense-forest] }, { danger: { gte: 5 } }] }
    result: 'The Greywood Wyrm uncoils across the path. It will not come again.'
  # The calendar (calendar.yaml): when the Ember Moon is full, the hunt rides at night.
  - id: hunt
    range: 1-20
    when: { all: [{ moons.ember: full }, { timeOfDay: night }] }
    result: 'Horns in the dark: the Ember Hunt rides under the full moon — they are {{result}}'
    table: reaction
    set: { reactionModifier: -3 }
    effects: { party.stats.morale: -1 }
  # Nights in haunted places, whatever the roll.
  - id: lights
    range: 1-20
    when: { all: [{ tags: haunted }, { timeOfDay: night }] }
    result: Pale lights drift between the trees, calling your names
  # In a named region, by day: its own people (`unless`: not at night).
  - id: patrol
    range: 1-4
    when: { region: { eq: Ashford Vale } }
    unless: { timeOfDay: night }
    result: 'A patrol of the Vale — they are {{result}}'
    table: reaction
  # Lists of terrains, a dice expression inside the text, then roll the reaction.
  - id: wolves
    range: 5-20
    # Wolves keep away in summer: `not` with a value.
    when: { all: [{ terrain: [forest, dense-forest, heath] }, { season: { not: summer } }] }
    result: '{{1d4+2}} grey wolves — they are {{result}}'
    table: reaction
    # Values for the next table (reactionModifier) and for the party: morale drops.
    set: { reactionModifier: -2 }
    effects: { party.stats.morale: -1 }
  # Then roll a generator: {{result}} is its text.
  - id: traveller
    range: 1-4
    when: { danger: { lt: 3 } }
    result: 'On the way you meet {{result}}'
    table: npc
  - id: bandits
    range: 5-20
    when: { terrain: { in: [hills, marsh, swamp] } }
    result: 'Bandits of the Hollow Hills — they are {{result}}'
    table: reaction
    set: { reactionModifier: -1 }
    effects: { party.stats.morale: -1 }
  - { id: tracks, range: 1-20, result: 'Only tracks, and the feeling of being watched' }
---
# A party stat plus a modifier the entry before it may set; advantage on offer (Core's roll
# modes, through the dependency).
kind: table
id: reaction
name: Reaction
description: |-
  How someone takes you, from **hostile** to **eager to help**.

  **Shows:**

  - A party stat in the roll: `{{charisma}}`
  - A modifier set by the entry that rolled it: `reactionModifier`
  - Advantage
  - Negative ranges
roll: '2d6 + {{charisma}} + {{reactionModifier}}'
modes: [advantage, disadvantage]
entries:
  - { id: hostile, range: -10-3, result: hostile }
  - { id: wary, range: 4-6, result: wary }
  - { id: neutral, range: 7-9, result: willing to talk }
  - { id: friendly, range: 10-11, result: friendly }
  - { id: helpful, range: 12-30, result: eager to help }
---
# A generator: fields rolled in order (later ones see earlier ones) and a template.
kind: generator
id: npc
name: Someone on the road
description: |-
  A name, a role, what they want and how strong they are.

  **Shows:**

  - A **generator**: fields from tables and from dice (`4d6kh3`: keep the best 3)
  - A template that joins them
fields:
  name: { table: npc-names }
  role: { table: npc-roles }
  want: { table: npc-wants }
  # Keep the best 3 of 4d6: 3 to 18, mostly 10-14.
  might: { roll: 4d6kh3 }
template: '{{name}}, a {{role}} who {{want}} (might {{might}})'
---
# Another generator using the first: {{npc.role}} reads a field of the npc generator.
kind: generator
id: rumour
name: A rumour
description: |-
  Who tells it, and what they say.

  **Shows:** A generator inside another one: `{{npc.name}}` and `{{npc.role}}` read the fields of _Someone on the road_
fields:
  npc: { generator: npc }
  what: { table: rumours }
template: '{{npc.name}} the {{npc.role}} swears that {{what}}.'
---
kind: table
id: npc-names
name: Names of the Marches
description: |-
  Names of the people of the Marches.

  **Shows:** One table used by many others: _Someone on the road_, the inn, _Desertion_
entries:
  - { id: aldo, result: Aldo }
  - { id: brenna, result: Brenna }
  - { id: corin, result: Corin }
  - { id: dagny, result: Dagny }
  - { id: edric, result: Edric }
  - { id: fenna, result: Fenna }
---
kind: table
id: npc-roles
name: Roles
description: |-
  Who someone is.

  **Shows:** Weights: pedlars, pilgrims and hunters are common; deserters and hedge-witches, rare
entries:
  - { id: pedlar, weight: 2, result: pedlar }
  - { id: pilgrim, weight: 2, result: pilgrim }
  - { id: hunter, weight: 2, result: hunter }
  - { id: deserter, weight: 1, result: deserter }
  - { id: witch, weight: 1, result: hedge-witch }
---
kind: table
id: npc-wants
name: Wants
description: |-
  What someone wants. A plain table for the _Someone on the road_ generator.
entries:
  - { id: escort, result: wants an escort to Fort Keld }
  - { id: trade, result: has something to trade }
  - { id: lost, result: is lost and frightened }
  - { id: news, result: wants news from the south }
---
# d66: two dice read as tens and units (11–66), 36 results; ranges like 11-16.
kind: table
id: rumours
name: Rumours (d66)
description: |-
  Rumours heard on the road and at the inn.

  **Shows:** **d66** dice: two dice read as tens and units (11–66), with ranges like `11-16`
roll: d66
entries:
  - { id: wyrm, range: 11-16, result: a wyrm sleeps under the Greywood }
  - { id: salt, range: 21-26, result: the Saltmere was once a city }
  - { id: keld, range: 31-36, result: Fort Keld has not paid its soldiers in a year }
  - { id: stones, range: 41-46, result: the standing stones move at midsummer }
  - { id: ferry, range: 51-56, result: the ferryman takes payment in secrets }
  - { id: hills, range: 61-66, result: 'the hills are hollow, and something lives inside' }
