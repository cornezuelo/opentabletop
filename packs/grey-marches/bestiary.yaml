# Who the Company meets: a sheet for its foes and the bestiary they're made from
# (system.yaml: `bestiary: [bestiary.marches]`). The encounters (encounters.yaml) make copies
# of them, kept in the trip as those present (`present.<template>`).

# A foe's sheet: lighter than a companion's. Two conditions take a copy off by themselves
# (`leaves: true`): one that holds by itself (`down`, at health 0) and one set by effects
# (`routed`, `bought-off`).
kind: sheet
id: foe
name: Foe
description: |-
  What the Company meets on the road and has to deal with: beasts, outlaws, the Hunt.

  **Shows:** a sheet for creatures and NPC types, lighter than a companion's, its main value its health (`main: health`, a bar on a fight's cards), which starts at a maximum each template rolls (`default: '{{self.values.toughness}}'`, a default read from a value before it); conditions that take a copy off those present by themselves (`leaves: true`): one that holds by itself (_Down_, at health 0) and ones set by effects (_Routed_, _Bought off_); one an escape gives, read by a template's `follows` (_Gorging_); one every foe starts with (_Hostile_, its templates' `conditions:`), taken off and given back by effects; items, so a template may carry some.
main: health
values:
  # Rolled for each copy by its template (`toughness: '{{1d4+1}}'`); health starts there.
  toughness:
    name: Max health
    description: The most harm it can take, rolled for each one as it comes.
    min: 0
  health:
    name: Health
    description: The harm it can still take; at 0 it's down, and gone.
    default: '{{self.values.toughness}}'
    min: 0
    max: '{{self.values.toughness}}'
    display: bar
  harm:
    name: Harm
    description: How hard it hits, for your own rulings and the tables that read it.
    min: 0
  morale:
    name: Morale
    description: How long it stands its ground, from 2 to 12, for your morale rolls (a 2d6 over it, it runs).
    min: 2
    max: 12
conditions:
  down:
    name: Down
    description: 'Health 0: it falls, and is gone from those present.'
    when: { self.values.health: { lte: 0 } }
    # How a fight tells it (`told:`).
    told: { gains: '{{name}} falls' }
    leaves: true
  routed:
    name: Routed
    description: It runs; gone from those present.
    leaves: true
    told: { gains: '{{name}} turns and runs' }
  bought-off:
    name: Bought off
    description: Paid to go; gone from those present.
    leaves: true
    told: { gains: '{{name}} takes the food and goes' }
  # Given by Throw them meat (travel.yaml), the cost of getting away from wolves: it stays to
  # eat, and no longer follows the Company (its template's `follows`).
  fed:
    name: Gorging
    description: Busy with the meat thrown to it; it means no harm now and doesn't follow.
    told: { gains: '{{name}} falls on the meat' }
  enraged:
    name: Enraged
    description: Fights to the end, whatever its morale.
  # What every foe starts with (its template's `conditions:`), and what a reaction other than
  # hostile takes off (encounters.yaml): the Company is _Beset_ only by those who have it.
  hostile:
    name: Hostile
    description: Means the Company harm. Taken off when it meets the Company otherwise (a reaction other than hostile), given back when the Company stands and fights.
    told: { gains: '{{name}} turns on you', loses: '{{name}} means you no harm' }
# What a foe carries (nothing to begin with): what its template gives, from the Company's gear.
items: {}
---
# A thing of a place that doesn't fight (the grave-goods chest below, `fights: false`): its lock
# and its needle rolled as it's found; conditions that hold by themselves on those values, and
# one that takes it off those present once it's opened (heard as it leaves: what's inside).
kind: sheet
id: chest
name: Chest
description: |-
  A chest found in the Marches: how stiff its lock is, and whether a poisoned needle waits in it, both rolled as it's found.

  **Shows:** a sheet for a thing present that doesn't fight (its template's `fights: false`): values each copy rolls (`lock: '{{max(1d6 - 2, 0)}}'`), conditions that hold by themselves on them (_Locked_ while its lock is over 0, _Needled_ while its needle is), read by the actions aimed at it (`where: { 'characters[candidate].conditions': locked }`), and one that takes it off those present (_Opened_, `leaves: true`), heard as it leaves (`on: present.leave`) to roll what's inside.
values:
  lock:
    name: Lock
    description: How stiff its lock is, added to what picking it needs (7 or more on 2d6 and Stealth, and this); 0, it's open.
    min: 0
  needle:
    name: Needle
    description: The harm of the poisoned needle in its lock, to whoever opens or fumbles it; 0, none (or drawn).
    min: 0
conditions:
  locked:
    name: Locked
    description: Its lock holds. Pick it, or break it open.
    when: { self.values.lock: { gte: 1 } }
  needled:
    name: Needled
    description: A poisoned needle waits in its lock, for whoever opens it or fumbles the lock. Look it over to draw it.
    when: { self.values.needle: { gte: 1 } }
  opened:
    name: Opened
    description: Opened, and what's inside taken; gone from those present.
    leaves: true
    told: { gains: '{{name}} is opened' }
---
# The bestiary: templates the encounters copy, each copy rolling its own health. A variant
# (`like:`) takes what it doesn't say from another; `names:` names each copy from a table;
# `behind:` says whether copies the Company leaves behind stay there (the Wyrm in its wood)
# or are gone (the rest, so the next visit rolls its encounter afresh).
kind: bestiary
id: marches
name: Who walks the Marches
description: |-
  The beasts, outlaws, riders and worse the Company meets on the road.

  **Shows:**

  - Templates of characters (`kind: bestiary`) on a sheet of the pack's own (`sheet: sheet.foe`), and one on the companions' (an NPC type: the Vale's riders)
  - Values rolled for each copy: `toughness: '{{1d4+1}}'`, its health starting there
  - A variant: the pack leader is a grey wolf (`like: grey-wolf`) with more health and a tag of its own; the bandit chief likewise
  - Copies named from a table (`names: table.npc-names`): a traveller is _Brenna_ or _Corin_, someone to talk to; without `names`, a copy is its template's name and a number (_Bandit 2_, _Rider of the Vale 3_)
  - What harms each the most or the least, as its tags (`fears-fire`, `fireproof`, `unhallowed`, `bone`), read by a blow's kind (_The blow lands_)
  - What a copy carries from the Company's gear (`items:`), and a condition it starts with (`conditions: [enraged]`)
  - How each is drawn on a map and as its face in a fight (`token:` its icon and kind)
  - What a copy does on its turn in a fight (`actions: table.wolf-turn`), taken by its variant through `like` (the pack's leader), and the restless dead's (`actions: table.dead-turn`); the rest do what the system says (`encounter.foes`)
  - Foes that follow the Company when it moves on (`follows`, a condition read with the copy acting): wolves while they mean harm and haven't been thrown meat (_Gorging_, Throw them meat), bandits while they mean harm and the Company isn't on horseback (`trip.mode`); falling back from a fight and marching away, they come along to the next place, and the Company is _Beset_ again
  - What becomes of those left behind: gone (`behind: leave`, the bestiary's), except the Wyrm, which stays in its wood, the restless dead, in their barrow, and a grave-goods chest, in its crypt (`behind: stay`)
  - An ally on the Company's side (`side: party`): an outrider of the Vale who rides with it (_Ask for an outrider_) while it's in the Vale's lands (`follows`, a condition read on reaching each place: `place.region`, `place.faction`), turning back as it leaves them; it fights beside the Company, on its own turns (`actions: table.outrider-turn`), at the foe in its own place (the system's `alliesAim: present.fighters.spread`), and the foes go for it too (`aim: party.fighters.spread`)
  - Who doesn't fight (`fights: false`): travellers and the Vale's riders, met and not fought, and the grave-goods chest, a thing of a crypt on a sheet of its own (_Chest_), aimed at by actions (_Look it over_, _Pick it_, _Break it open_, _Open it_); none of them is a side of a fight, nor counted by `present.fighters`
  - Who is a foe, as a tag (`foe`), and who means harm now, as a condition every foe starts with (`conditions: [hostile]`) and a reaction other than hostile takes off: while one that has it is here (`present.conditions: hostile`) the Company is _Beset_ (its sheet), and can't march on or busy itself with anything else until it deals with them or falls back
sheet: sheet.foe
behind: leave
templates:
  grey-wolf:
    name: Grey wolf
    description: Lean and patient; they hunt in packs, and break when their leader falls.
    # Fire harms it twice over (_The blow lands_ reads its tags).
    tags: [foe, beast, pack, fears-fire]
    values: { toughness: '{{1d4+1}}', harm: 1, morale: 7 }
    conditions: [hostile]
    # Its own turn in a fight (below): it goes for the weakest. Its leader, like it, too.
    actions: table.wolf-turn
    # A chase: while it means harm, it follows the Company to the next place, unless meat
    # was thrown to it (Throw them meat, travel.yaml). Its leader, like it, too.
    follows: { all: [{ acting.conditions: hostile }, { not: { acting.conditions: fed } }] }
    token: { icon: 'game:wolf-head', kind: enemy }
  pack-leader:
    like: grey-wolf
    name: Pack leader
    description: The biggest of the pack; while it stands, the others stand with it.
    tags: [leader]
    values: { toughness: '{{2d4+2}}', harm: 2, morale: 9 }
  ember-rider:
    name: Rider of the Ember Hunt
    description: A pale rider under the full Ember Moon, who never tires and never speaks.
    # Fire does it no harm; hallowed steel harms it twice over.
    tags: [foe, hunt, haunted, fireproof, unhallowed]
    values: { toughness: '{{2d6}}', harm: 2, morale: 12 }
    conditions: [enraged, hostile]
    token: { icon: 'game:ghost', kind: enemy }
  wyrm:
    name: The Greywood Wyrm
    description: Coiled in the heart of the Greywood. It doesn't follow; it waits.
    tags: [foe, beast, wyrm, fireproof]
    values: { toughness: 30, harm: 4, morale: 12 }
    conditions: [hostile]
    token: { icon: 'game:dragon-head', kind: enemy }
    behind: stay
  # What sleeps in the Deep Barrows (pieces.yaml): woken by a crypt's sleeper or a door forced.
  # It stays in its barrow when the party leaves.
  barrow-dead:
    name: The restless dead
    description: Bones in grave-wrappings that don't stay where they were laid.
    # Steel glances off old bones (half its harm); hallowed steel harms them twice over.
    tags: [foe, undead, bone, unhallowed]
    values: { toughness: '{{1d6+2}}', harm: 1, morale: 12 }
    conditions: [hostile]
    token: { icon: 'game:death-skull', kind: enemy }
    actions: table.dead-turn
    behind: stay
  bandit:
    name: Bandit
    description: An outlaw of the Hollow Hills, hungry and badly armed.
    tags: [foe, people, outlaw]
    values: { toughness: '{{1d6+1}}', harm: 1, morale: 7 }
    conditions: [hostile]
    items: { ration: '{{1d2}}' }
    token: { icon: 'game:cowled', kind: enemy }
    # On foot: while it means harm, it follows the Company, unless the Company rides away.
    follows: { all: [{ acting.conditions: hostile }, { not: { trip.mode: horse } }] }
  bandit-chief:
    like: bandit
    name: Bandit chief
    description: Leads the band; better fed, better armed, and quicker to bargain.
    tags: [leader]
    values: { toughness: '{{2d6+2}}', harm: 2, morale: 9 }
    items: { ration: 2 }
  traveller:
    # Whoever a road brings, on the companions' own sheet: gone once the Company moves on,
    # unless it takes them along (Take the escort).
    sheet: sheet.companion
    name: Traveller
    description: Someone met on the road, with business of their own.
    names: table.npc-names
    tags: [people, traveller]
    values: { survival: 1, charisma: '{{1d2}}', health: 3 }
    token: { icon: 'game:hiking', kind: npc }
    behind: leave
    # Met, not fought: never a side of the Company's fights.
    fights: false
  vale-rider:
    # An NPC type on the companions' own sheet: a rider of the Vale's patrol.
    sheet: sheet.companion
    name: Rider of the Vale
    description: One of the Vale's patrol, riding its roads and borders.
    tags: [people, vale]
    values: { survival: 2, charisma: 1, health: 3 }
    token: { icon: 'game:mounted-knight', kind: npc }
    fights: false
  # On the Company's side (`side: party`): a rider of the Vale who rides along with it while
  # it's in the Vale's lands, and turns back as it leaves them (left behind, gone).
  vale-outrider:
    like: vale-rider
    name: Outrider of the Vale
    description: A rider of the Vale's patrol riding with the Company, as far as the Vale's lands go.
    side: party
    fights: true
    values: { survival: 2, charisma: 1, health: 4, armour: 1 }
    actions: table.outrider-turn
    follows: { any: [{ place.region: { eq: Ashford Vale } }, { place.faction: the-vale }] }
  # A thing found in a crypt of the Deep Barrows (pieces.yaml's _In the crypt_), not a foe: no
  # side of a fight (`fights: false`), on a sheet of its own; it stays in its crypt.
  grave-chest:
    sheet: sheet.chest
    name: Grave-goods chest
    description: An iron-bound chest of the old folk's grave goods; some still keep a needle in the lock.
    tags: [thing, chest]
    fights: false
    values: { lock: '{{max(1d6 - 2, 0)}}', needle: '{{max(1d6 - 4, 0)}}' }
    token: { icon: 'game:locked-chest', kind: npc }
    behind: stay
---
# What a foe of the Marches does on its turn in a fight (system.yaml: `encounter.foes`), unless
# its template says otherwise: a swing at the one its turn goes for (the system's `aim`), whose
# armour takes the roll down, its Harm if it lands.
kind: table
id: foe-turn
tags: [encounters]
name: A foe's turn
description: |-
  What a foe does on its turn in a fight, when its kind has no turn of its own: it swings at one of the Company, chosen as its turn begins, and lands half the time, for its Harm; the armour they wear takes its roll down.

  **Shows:** what foes do on their turns (`encounter.foes` in the system), rolled acting as each foe (`acting.values.harm`); whom its turn goes for, chosen before it rolls (the system's `aim: party.fighters.spread`: one each among the companions and an outrider riding with them, the foes left over at the companions), read by its roll (`'1d6 - {{characters[encounter.target].values.armour}}'`) and its effects (`characters[encounter.target].values.health`); a condition given for a while (`characters[encounter.target].conditions.rattled: '{{1d2}}'`: rounds of the fight); a roll mode read off the one it goes for (`modeWhen: { roll-modes.disadvantage: { 'characters[encounter.target].conditions': braced } }`: Shieldwall's braced); a turn that does nothing.
roll: '1d6 - {{characters[encounter.target].values.armour}}'
# Against one braced behind a shield (travel.yaml's Shieldwall), the worse of two rolls.
modeWhen:
  roll-modes.disadvantage: { 'characters[encounter.target].conditions': braced }
entries:
  - { id: miss, range: 1-3, result: '{{acting.name}} swings, and misses' }
  - id: hit
    range: 4-5
    result: '{{acting.name}} lands a blow: {{acting.values.harm}} harm'
    effects: { 'characters[encounter.target].values.health': '-{{acting.values.harm}}' }
  # A heavy one: rattled for 1d2 rounds (sheet.yaml's `lasts: rounds`), counted down by the fight.
  - id: heavy
    range: 6
    result: '{{acting.name}} lands a heavy blow: {{acting.values.harm}} harm'
    effects:
      'characters[encounter.target].values.health': '-{{acting.values.harm}}'
      'characters[encounter.target].conditions.rattled': '{{1d2}}'
---
# The outrider's turn in a fight (its template's `actions:`): a lance at the foe set against it.
kind: table
id: outrider-turn
tags: [encounters]
name: The outrider's turn
description: |-
  What an outrider of the Vale riding with the Company does on its turn in a fight: it lowers its lance at the foe set against it, for 1d4 harm, and rides it down now and then, its nerve shaken.

  **Shows:** an ally's turn (a template with `side: party`), played by itself as a foe's is; whom it goes for, chosen as its turn begins (the system's `alliesAim: present.fighters.spread`: the foe in its own place among them, the next one standing if that one fell), read as `encounter.target` in its effects (`characters[encounter.target].values.morale`); a lance's harm halved on old bones, read off the foe's tags (`'characters[encounter.target].tags': bone`).
roll: 1d6
entries:
  - { id: wheel, range: 1-2, result: '{{acting.name}} wheels round, and finds no opening' }
  - id: lance
    range: 3-5
    unless: { 'characters[encounter.target].tags': bone }
    result: '{{acting.name}} drives the lance home: {{1d4}} harm'
    effects: { 'characters[encounter.target].values.health': '-{{1d4}}' }
  - id: bones
    range: 3-5
    when: { 'characters[encounter.target].tags': bone }
    result: '{{acting.name}}’s lance glances off old bones: {{floor(1d4 / 2)}} harm'
    effects: { 'characters[encounter.target].values.health': '-{{floor(1d4 / 2)}}' }
  - id: ride-down
    range: 6
    result: '{{acting.name}} rides it down: {{1d4}} harm, and its nerve shaken'
    effects:
      'characters[encounter.target].values.health': '-{{1d4}}'
      'characters[encounter.target].values.morale': -1
---
# A wolf's turn in a fight (bestiary.yaml's grey-wolf `actions:`, its leader's too, by `like`):
# it goes for whoever is hurt worst.
kind: table
id: wolf-turn
tags: [encounters]
name: A wolf's turn
description: |-
  What a grey wolf (or the pack's leader) does on its turn in a fight: it goes for whoever of the Company is weakest, and bites, for its Harm, unless it only circles.

  **Shows:** a template's own turn (`actions: table.wolf-turn` in the bestiary, taken by its variant through `like`) over the system's; a target chosen by a value (`set: { target: party.members.lowest.values.health }`); a companion's turn lost (_Dragged down_ for one of their turns, `lasts: turns`, read by the system's `encounter.skip`).
roll: 1d6
entries:
  - { id: circle, range: 1-2, result: '{{acting.name}} circles, snarling' }
  - id: bite
    range: 3-5
    set: { target: party.members.lowest.values.health }
    result: '{{acting.name}} goes for the weakest of you: {{acting.values.harm}} harm'
    effects: { 'characters[target].values.health': '-{{acting.values.harm}}' }
  # Dragged down (sheet.yaml, `lasts: turns`): that one loses their next turn (the system's
  # `encounter.skip`).
  - id: drag
    range: 6
    set: { target: party.members.lowest.values.health }
    result: '{{acting.name}} drags the weakest of you down: {{acting.values.harm}} harm'
    effects:
      'characters[target].values.health': '-{{acting.values.harm}}'
      'characters[target].conditions.dragged-down': 1
---
# The restless dead's turn in a fight (bestiary.yaml's barrow-dead `actions:`): a hand at one
# of you, or the grave's cold on all of you, each rolled for, less for whoever wears armour.
kind: table
id: dead-turn
tags: [encounters]
name: The restless dead's turn
description: |-
  What the restless dead do on their turn in a fight: a cold hand at one of the Company, for their Harm, or the chill of the grave over all of you at once: each takes 1d3 less the armour they wear.

  **Shows:** a result aimed at everyone (`set: { target: party.members.all }`), played once for each of the Company, a line of the journal each: its effect read for each (`characters[target].values.armour`, the armour that one wears) and its dice rolled for each (`'-{{max(1d3 - characters[target].values.armour, 0)}}'`).
roll: 1d6
entries:
  - id: claw
    range: 1-4
    set: { target: party.members.random }
    result: '{{acting.name}} reaches for one of you: {{acting.values.harm}} harm'
    effects: { 'characters[target].values.health': '-{{acting.values.harm}}' }
  # Each of the Company in turn, each with their own 1d3, less their own armour.
  - id: chill
    range: 5-6
    set: { target: party.members.all }
    result: The chill of the grave washes over all of you
    effects:
      { 'characters[target].values.health': '-{{max(1d3 - characters[target].values.armour, 0)}}' }
---
# Falling back (travel.yaml's Fall back) past a foe fiercer than the clumsiest companion.
kind: table
id: parting-blow
tags: [encounters]
name: A parting blow
description: |-
  As the Company falls back, its clumsiest companion is caught by the fiercest foe: as much harm as that foe's Harm is over the companion's Stealth.

  **Shows:** the most and the least of a value in a group, `present.highest.values.harm` (the fiercest foe here) and `party.lowest.values.stealth` (the clumsiest companion), in a step's condition and an effect; a target picked by the same value (`set: { target: party.members.lowest.values.stealth }`).
entries:
  - id: caught
    set: { target: party.members.lowest.values.stealth }
    result: 'The clumsiest of you is caught as you fall back: {{present.highest.values.harm - party.lowest.values.stealth}} harm'
    effects:
      'characters[target].values.health': '-{{present.highest.values.harm - party.lowest.values.stealth}}'
---
# A companion's blow (travel.yaml's Strike one down): 1d6 harm, with disadvantage in the dark
# and advantage on a foe left alone, each a roll mode on this roll alone.
kind: generator
id: blow
tags: [encounters]
name: A blow
description: |-
  The harm a companion's blow does to the foe chosen: 1d6, rolled twice and the lower kept in the dark or while rattled, the higher kept when that foe is the only one left here. What the blow is (steel, fire or hallowed, by what's in their hands) may double it, halve it or do nothing, by what the foe is.

  **Shows:** roll modes on one roll of a generator alone (`modeWhen` on a `roll` field: Core's advantage and disadvantage, cancelling each other in the dark against a lone foe; disadvantage while the striker is rattled, a condition given for some rounds); kinds of damage, a field's table naming the blow's (`kind`, read by the next field as `kind.kind`) and one that reads it against the foe's tags; a field's table that changes the trip (`'characters[params.foe].values.health': '-{{harm * 2}}'`), rolled by an action's step with its parameters.
fields:
  harm:
    roll: 1d6
    modeWhen:
      roll-modes.advantage: { present.fighters.count: 1 }
      roll-modes.disadvantage: { any: [{ time.tags: dark }, { acting.conditions: rattled }] }
  kind: { table: table.blow-kind }
  lands: { table: table.blow-lands }
template: '{{lands}}'
---
kind: table
id: blow-lands
tags: [encounters]
name: The blow lands
description: |-
  The harm of _A blow_ taken from the foe chosen, by what the blow is against what the foe is: fire on a beast that fears it, or hallowed steel on the unhallowed, twice over; steel on old bones, half (rounded down); fire on what it can't burn, nothing.

  **Shows:** kinds of damage as the foe's tags, read with the blow's kind (`kind.kind`, set by _What the blow is_) in each row's `when`: a weakness, a resistance and an immunity, on any sheet (a foe's or a traveller's); rows that hold one at a time, picked whichever holds.
entries:
  - id: twice
    result: '{{harm * 2}} harm, {{kind}}: twice over'
    when:
      any:
        - { kind.kind: fire, 'characters[params.foe].tags': fears-fire }
        - { kind.kind: hallowed, 'characters[params.foe].tags': unhallowed }
    effects: { 'characters[params.foe].values.health': '-{{harm * 2}}' }
  - id: half
    result: '{{floor(harm / 2)}} harm, {{kind}}: glancing off'
    when: { kind.kind: steel, 'characters[params.foe].tags': bone }
    effects: { 'characters[params.foe].values.health': '-{{floor(harm / 2)}}' }
  - id: none
    result: 'No harm, {{kind}}: it doesn’t burn'
    when: { kind.kind: fire, 'characters[params.foe].tags': fireproof }
  - id: lands
    result: '{{harm}} harm, {{kind}}'
    unless:
      any:
        - { kind.kind: fire, 'characters[params.foe].tags': [fears-fire, fireproof] }
        - { kind.kind: hallowed, 'characters[params.foe].tags': unhallowed }
        - { kind.kind: steel, 'characters[params.foe].tags': bone }
    effects: { 'characters[params.foe].values.health': '-{{harm}}' }
---
# What a companion's blow is (_A blow_), by what's in their hands (the sheet's values made
# of them): the Sword of Keld, hallowed; a torch in the dark, fire; else steel. One row holds.
kind: table
id: blow-kind
tags: [encounters]
name: What the blow is
description: |-
  The kind of a companion's blow, by what they hold: hallowed with the Sword of Keld in hand, fire with a torch in hand in the dark, steel otherwise.

  **Shows:** a table with no roll whose rows hold one at a time (`when` / `unless`), naming a kind of damage (`set: { kind: fire }`) that the generator's next field reads; values made of what's in a companion's hands (`acting.values.relic-in-hand`, `torch-in-hand`) and the time of day (`time.tags: dark`).
entries:
  - id: hallowed
    result: hallowed
    when: { acting.values.relic-in-hand: { gte: 1 } }
    set: { kind: hallowed }
  - id: fire
    result: fire
    when:
      { acting.values.relic-in-hand: 0, acting.values.torch-in-hand: { gte: 1 }, time.tags: dark }
    set: { kind: fire }
  - id: steel
    result: steel
    unless:
      any:
        - { acting.values.relic-in-hand: { gte: 1 } }
        - { acting.values.torch-in-hand: { gte: 1 }, time.tags: dark }
    set: { kind: steel }
---
# After a fight (travel.yaml's Mind the mail), once for each piece the companion acting
# wears: its wear die rolled, a step down on 1–2, ruined on 1–2 when it was a d4.
kind: table
id: wear-and-tear
tags: [encounters]
name: Wear and tear
description: |-
  A piece of armour looked over after a fight: its own wear die is rolled; on 1–2 it drops a step (a d8 to a d6), and a d4 that rolls 1–2 is ruined and thrown away.

  **Shows:** a roll made once for each item worn (an action's `roll:` step with `each: params.piece`, the parameter listed by the trip as `acting.places.body.keys`); a die whose size is an item's field that steps (`1d{{acting.items[params.piece].wear}}`, the sheet's `wear: { steps: [4, 6, 8] }`, asked for when rolled in the Oracle); one item named by its key in conditions and effects (`acting.items[params.piece].wear: -1`, and `acting.items[params.piece].count: -1` to throw away that piece alone).
# The piece's own wear die; the Oracle, with no piece, asks for it.
roll: '1d{{acting.items[params.piece].wear}}'
entries:
  - id: ruined
    range: 1-2
    when: { 'acting.items[params.piece].wear': 4 }
    result: "{{acting.name}}'s armour is rent past mending, and thrown away"
    effects: { 'acting.items[params.piece].count': -1 }
  - id: rent
    range: 1-2
    unless: { 'acting.items[params.piece].wear': 4 }
    result: "{{acting.name}}'s armour is rent: its wear die drops a step"
    effects: { 'acting.items[params.piece].wear': -1 }
  - id: holds
    range: 3-12
    result: "{{acting.name}}'s armour holds"
