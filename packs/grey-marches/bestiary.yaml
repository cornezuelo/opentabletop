# Who the Company meets: a sheet for its foes and the bestiary they're made from
# (system.yaml: `bestiary: [bestiary.marches]`). The encounters (encounters.yaml) make copies
# of them, kept in the trip as those present (`present.<template>`).

# A foe's sheet: lighter than a companion's. Two conditions take a copy off by themselves
# (`leaves: true`): one that holds by itself (`down`, at health 0) and one set by effects
# (`routed`, `bought-off`).
kind: sheet
id: foe
name: Foe
description: |-
  What the Company meets on the road and has to deal with: beasts, outlaws, the Hunt.

  **Shows:** a sheet for creatures and NPC types, lighter than a companion's, its main value its health though it has no max (`main: health`, shown as a number on a fight's cards); conditions that take a copy off those present by themselves (`leaves: true`): one that holds by itself (_Down_, at health 0) and ones set by effects (_Routed_, _Bought off_); items, so a template may carry some.
main: health
values:
  health:
    name: Health
    description: The harm it can still take; at 0 it's down, and gone.
    min: 0
    display: number
  harm:
    name: Harm
    description: How hard it hits, for your own rulings and the tables that read it.
    min: 0
  morale:
    name: Morale
    description: How long it stands its ground, from 2 to 12, for your morale rolls (a 2d6 over it, it runs).
    min: 2
    max: 12
conditions:
  down:
    name: Down
    description: 'Health 0: it falls, and is gone from those present.'
    when: { self.values.health: { lte: 0 } }
    leaves: true
  routed:
    name: Routed
    description: It runs; gone from those present.
    leaves: true
  bought-off:
    name: Bought off
    description: Paid to go; gone from those present.
    leaves: true
  enraged:
    name: Enraged
    description: Fights to the end, whatever its morale.
# What a foe carries (nothing to begin with): what its template gives, from the Company's gear.
items: {}
---
# The bestiary: templates the encounters copy, each copy rolling its own health. A variant
# (`like:`) takes what it doesn't say from another; `names:` names each copy from a table;
# `behind:` says whether copies the Company leaves behind stay there (the Wyrm in its wood)
# or are gone (the rest, so the next visit rolls its encounter afresh).
kind: bestiary
id: marches
name: Who walks the Marches
description: |-
  The beasts, outlaws, riders and worse the Company meets on the road.

  **Shows:**

  - Templates of characters (`kind: bestiary`) on a sheet of the pack's own (`sheet: sheet.foe`), and one on the companions' (an NPC type: the Vale's riders)
  - Values rolled for each copy: `health: '{{1d4+1}}'`
  - A variant: the pack leader is a grey wolf (`like: grey-wolf`) with more health and a tag of its own; the bandit chief likewise
  - Copies named from a table (`names: table.npc-names`): _Brenna_, _Corin_… instead of _Bandit 2_
  - What a copy carries from the Company's gear (`items:`), and a condition it starts with (`conditions: [enraged]`)
  - How each is drawn on a map (`token:` its icon and kind)
  - What a copy does on its turn in a fight (`actions: table.wolf-turn`), taken by its variant through `like` (the pack's leader), and the restless dead's (`actions: table.dead-turn`); the rest do what the system says (`encounter.foes`)
  - What becomes of those left behind: gone (`behind: leave`, the bestiary's), except the Wyrm, which stays in its wood, and the restless dead, in their barrow (`behind: stay`)
sheet: sheet.foe
behind: leave
templates:
  grey-wolf:
    name: Grey wolf
    description: Lean and patient; they hunt in packs, and break when their leader falls.
    tags: [beast, pack]
    values: { health: '{{1d4+1}}', harm: 1, morale: 7 }
    # Its own turn in a fight (below): it goes for the weakest. Its leader, like it, too.
    actions: table.wolf-turn
    token: { icon: 'game:wolf-head', kind: enemy }
  pack-leader:
    like: grey-wolf
    name: Pack leader
    description: The biggest of the pack; while it stands, the others stand with it.
    tags: [leader]
    values: { health: '{{2d4+2}}', harm: 2, morale: 9 }
  ember-rider:
    name: Rider of the Ember Hunt
    description: A pale rider under the full Ember Moon, who never tires and never speaks.
    tags: [hunt, haunted]
    values: { health: '{{2d6}}', harm: 2, morale: 12 }
    conditions: [enraged]
    token: { icon: 'game:ghost', kind: enemy }
  wyrm:
    name: The Greywood Wyrm
    description: Coiled in the heart of the Greywood. It doesn't follow; it waits.
    tags: [beast, wyrm]
    values: { health: 30, harm: 4, morale: 12 }
    token: { icon: 'game:dragon-head', kind: enemy }
    behind: stay
  # What sleeps in the Deep Barrows (pieces.yaml): woken by a crypt's sleeper or a door forced.
  # It stays in its barrow when the party leaves.
  barrow-dead:
    name: The restless dead
    description: Bones in grave-wrappings that don't stay where they were laid.
    tags: [undead]
    values: { health: '{{1d6+2}}', harm: 1, morale: 12 }
    token: { icon: 'game:death-skull', kind: enemy }
    actions: table.dead-turn
    behind: stay
  bandit:
    name: Bandit
    description: An outlaw of the Hollow Hills, hungry and badly armed.
    names: table.npc-names
    tags: [people, outlaw]
    values: { health: '{{1d6+1}}', harm: 1, morale: 7 }
    items: { ration: '{{1d2}}' }
    token: { icon: 'game:hooded-figure', kind: enemy }
  bandit-chief:
    like: bandit
    name: Bandit chief
    description: Leads the band; better fed, better armed, and quicker to bargain.
    tags: [leader]
    values: { health: '{{2d6+2}}', harm: 2, morale: 9 }
    items: { ration: 2 }
  traveller:
    # Whoever a road brings, on the companions' own sheet: gone once the Company moves on,
    # unless it takes them along (Take the escort).
    sheet: sheet.companion
    name: Traveller
    description: Someone met on the road, with business of their own.
    names: table.npc-names
    tags: [people, traveller]
    values: { survival: 1, charisma: '{{1d2}}', health: 3 }
    token: { icon: 'game:walking-boot', kind: npc }
    behind: leave
  vale-rider:
    # An NPC type on the companions' own sheet: a rider of the Vale's patrol.
    sheet: sheet.companion
    name: Rider of the Vale
    description: One of the Vale's patrol, riding its roads and borders.
    names: table.npc-names
    tags: [people, vale]
    values: { survival: 2, charisma: 1, health: 3 }
    token: { icon: 'game:mounted-knight', kind: npc }
---
# What a foe of the Marches does on its turn in a fight (system.yaml: `encounter.foes`), unless
# its template says otherwise: a swing at the one its turn goes for (the system's `aim`), whose
# armour takes the roll down, its Harm if it lands.
kind: table
id: foe-turn
tags: [encounters]
name: A foe's turn
description: |-
  What a foe does on its turn in a fight, when its kind has no turn of its own: it swings at one of the Company, chosen as its turn begins, and lands half the time, for its Harm; the armour they wear takes its roll down.

  **Shows:** what foes do on their turns (`encounter.foes` in the system), rolled acting as each foe (`acting.values.harm`); whom its turn goes for, chosen before it rolls (the system's `aim: party.members.random`), read by its roll (`'1d6 - {{characters[encounter.target].values.armour}}'`) and its effects (`characters[encounter.target].values.health`); a condition given for a while (`characters[encounter.target].conditions.rattled: '{{1d2}}'`: rounds of the fight); a turn that does nothing.
roll: '1d6 - {{characters[encounter.target].values.armour}}'
entries:
  - { id: miss, range: 1-3, result: '{{acting.name}} swings, and misses' }
  - id: hit
    range: 4-5
    result: '{{acting.name}} lands a blow'
    effects: { 'characters[encounter.target].values.health': '-{{acting.values.harm}}' }
  # A heavy one: rattled for 1d2 rounds (sheet.yaml's `lasts: rounds`), counted down by the fight.
  - id: heavy
    range: 6
    result: '{{acting.name}} lands a heavy blow'
    effects:
      'characters[encounter.target].values.health': '-{{acting.values.harm}}'
      'characters[encounter.target].conditions.rattled': '{{1d2}}'
---
# A wolf's turn in a fight (bestiary.yaml's grey-wolf `actions:`, its leader's too, by `like`):
# it goes for whoever is hurt worst.
kind: table
id: wolf-turn
tags: [encounters]
name: A wolf's turn
description: |-
  What a grey wolf (or the pack's leader) does on its turn in a fight: it goes for whoever of the Company is weakest, and bites, for its Harm, unless it only circles.

  **Shows:** a template's own turn (`actions: table.wolf-turn` in the bestiary, taken by its variant through `like`) over the system's; a target chosen by a value (`set: { target: party.members.lowest.values.health }`); a companion's turn lost (_Dragged down_ for one of their turns, `lasts: turns`, read by the system's `encounter.skip`).
roll: 1d6
entries:
  - { id: circle, range: 1-2, result: '{{acting.name}} circles, snarling' }
  - id: bite
    range: 3-5
    set: { target: party.members.lowest.values.health }
    result: '{{acting.name}} goes for the weakest of you'
    effects: { 'characters[target].values.health': '-{{acting.values.harm}}' }
  # Dragged down (sheet.yaml, `lasts: turns`): that one loses their next turn (the system's
  # `encounter.skip`).
  - id: drag
    range: 6
    set: { target: party.members.lowest.values.health }
    result: '{{acting.name}} drags the weakest of you down'
    effects:
      'characters[target].values.health': '-{{acting.values.harm}}'
      'characters[target].conditions.dragged-down': 1
---
# The restless dead's turn in a fight (bestiary.yaml's barrow-dead `actions:`): a hand at one
# of you, or the grave's cold on all of you, each rolled for, less for whoever wears armour.
kind: table
id: dead-turn
tags: [encounters]
name: The restless dead's turn
description: |-
  What the restless dead do on their turn in a fight: a cold hand at one of the Company, for their Harm, or the chill of the grave over all of you at once: each takes 1d3 less the armour they wear.

  **Shows:** a result aimed at everyone (`set: { target: party.members.all }`), played once for each of the Company, a line of the journal each: its effect read for each (`characters[target].values.armour`, the armour that one wears) and its dice rolled for each (`'-{{max(1d3 - characters[target].values.armour, 0)}}'`).
roll: 1d6
entries:
  - id: claw
    range: 1-4
    set: { target: party.members.random }
    result: '{{acting.name}} reaches for one of you'
    effects: { 'characters[target].values.health': '-{{acting.values.harm}}' }
  # Each of the Company in turn, each with their own 1d3, less their own armour.
  - id: chill
    range: 5-6
    set: { target: party.members.all }
    result: The chill of the grave washes over all of you
    effects:
      { 'characters[target].values.health': '-{{max(1d3 - characters[target].values.armour, 0)}}' }
---
# Falling back (travel.yaml's Fall back) past a foe fiercer than the clumsiest companion.
kind: table
id: parting-blow
tags: [encounters]
name: A parting blow
description: |-
  As the Company falls back, its clumsiest companion is caught by the fiercest foe: as much harm as that foe's Harm is over the companion's Stealth.

  **Shows:** the most and the least of a value in a group, `present.highest.values.harm` (the fiercest foe here) and `party.lowest.values.stealth` (the clumsiest companion), in a step's condition and an effect; a target picked by the same value (`set: { target: party.members.lowest.values.stealth }`).
roll: 1d1
entries:
  - id: caught
    range: 1
    set: { target: party.members.lowest.values.stealth }
    result: The clumsiest of you is caught as you fall back
    effects:
      'characters[target].values.health': '-{{present.highest.values.harm - party.lowest.values.stealth}}'
---
# A companion's blow (travel.yaml's Strike one down): 1d6 harm, with disadvantage in the dark
# and advantage on a foe left alone, each a roll mode on this roll alone.
kind: generator
id: blow
tags: [encounters]
name: A blow
description: |-
  The harm a companion's blow does to the foe chosen: 1d6, rolled twice and the lower kept in the dark or while rattled, the higher kept when that foe is the only one left here.

  **Shows:** roll modes on one roll of a generator alone (`modeWhen` on a `roll` field: Core's advantage and disadvantage, cancelling each other in the dark against a lone foe; disadvantage while the striker is rattled, a condition given for some rounds); a field's table that changes the trip (`'characters[params.foe].values.health': '-{{harm}}'`), rolled by an action's step with its parameters.
fields:
  harm:
    roll: 1d6
    modeWhen:
      roll-modes.advantage: { present.count: 1 }
      roll-modes.disadvantage: { any: [{ time.tags: dark }, { acting.conditions: rattled }] }
  lands: { table: table.blow-lands }
template: '{{harm}} harm'
---
kind: table
id: blow-lands
tags: [encounters]
name: The blow lands
description: The harm of _A blow_ taken from the foe chosen.
entries:
  - id: lands
    result: '{{harm}} harm'
    effects: { 'characters[params.foe].values.health': '-{{harm}}' }
---
# After a fight (travel.yaml's Mind the mail), once for each piece the companion acting
# wears: its wear die rolled, a step down on 1–2, ruined on 1–2 when it was a d4.
kind: table
id: wear-and-tear
tags: [encounters]
name: Wear and tear
description: |-
  A piece of armour looked over after a fight: its own wear die is rolled; on 1–2 it drops a step (a d8 to a d6), and a d4 that rolls 1–2 is ruined and thrown away.

  **Shows:** a roll made once for each item worn (an action's `roll:` step with `each: params.piece`, the parameter listed by the trip as `acting.places.body.keys`); a die whose size is an item's field that steps (`1d{{max(acting.items[params.piece].wear, 4)}}`, the sheet's `wear: { steps: [4, 6, 8] }`); one item named by its key in conditions and effects (`acting.items[params.piece].wear: -1`, `acting.items[params.piece]: -1`).
# At least a d4, so the Oracle rolls it by hand, with no piece.
roll: '1d{{max(acting.items[params.piece].wear, 4)}}'
entries:
  - id: ruined
    range: 1-2
    when: { 'acting.items[params.piece].wear': 4 }
    result: "{{acting.name}}'s armour is rent past mending, and thrown away"
    effects: { 'acting.items[params.piece]': -1 }
  - id: rent
    range: 1-2
    unless: { 'acting.items[params.piece].wear': 4 }
    result: "{{acting.name}}'s armour is rent: its wear die drops a step"
    effects: { 'acting.items[params.piece].wear': -1 }
  - id: holds
    range: 3-12
    result: "{{acting.name}}'s armour holds"
