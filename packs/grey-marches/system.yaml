# The Grey Marches as a system: everything a map or a trip played in the Marches uses,
# named in one place. Maps and trips choose it by the pack's id (`grey-marches`), since
# its id is `default`.
kind: system
id: default
name: The Grey Marches
description: |-
  A haunted frontier of woods, hollow hills and a salt lake, travelled on foot, on
  horseback or by cart, with hunger, fatigue, morale and getting lost, under two moons.

  **Shows:** a system naming its parts: travel rules and bindings, its calendar, the
  weather model its weather check uses, Core's tables brought along through the
  pack's dependency, its four example maps in one campaign (two of them sub-maps, one crossed by three ways), the sheet its companions are made with and the Company's own, each map's own sheet, its gear, the bestiary its encounters make foes from, fights in turns (each one by what it rolls, rounds of a minute, foes whose nerve breaks on their turn), the places its discovery makes, its factions, its progress clocks, what its world does by itself and how its land goes on.
travel: travel-rules.default
bindings: bindings.default
calendar: calendar.marcher-reckoning
# The Company's characters (sheet.yaml): a trip's party may be made of them.
sheet: sheet.companion
# The Company itself (sheet.yaml): morale, fatigue, hirelings, whoever travels.
partySheet: sheet.company
# What each map keeps of its own (sheet.yaml): how stirred its dead are, remembered there.
mapSheet: sheet.this-place
# The powers of the Marches (factions.yaml): their territory and their world turns.
factions: factions.default
# The Company's gear (items.yaml): what its companions may carry.
items: [items.gear]
# Who walks the Marches (bestiary.yaml): the templates its encounters make copies of.
bestiary: [bestiary.marches]
# Its fights in turns (travel.yaml's Stand and fight, Strike one down, Fall back): each one in
# the order of what it rolls, 1d6 and its Stealth for a companion, 1d6 and its Harm for a foe;
# a round is a minute; over once no foe is left. A foe's turn tests its nerve (Nerve breaks).
encounter:
  order:
    by: participant
    value: { party: '{{1d6 + acting.values.stealth}}', foes: '{{1d6 + acting.values.harm}}' }
  actions: [actions.strike, actions.fall-back]
  minutes: 1
  ends: { present.count: 0 }
# The places of the Marches (places.yaml): what discovery's contents make on a hex.
places: [places.default]
# The threats of the Marches (clocks.yaml): the progress clocks its world clock starts with.
clocks: clocks.default
# How the Marches move (world.yaml): what the world does by itself.
world: world.default
weather: [weather.sky]
# The lie of the Marches (land.yaml): Generate's land, and discovery's east of the Hills.
land: [land.default, land.galleries, land.village]
# What its new maps are drawn in, when they start blank.
style: core/parchment
# What the Deep Barrows are laid with (pieces.yaml).
pieces: [pieces.deep-barrows]
packs: [core]
# Listed in Map's Maps → Example maps: the Marches, the Hollow Hills up close (3 km a hex),
# the Barrow-halls under one of their hexes (a sub-map, 10 m a hex) and the clans' old mine
# under their mountains (a sub-map with three ways, crossed: 500 m a square), and Ashford,
# the market village, up close (a town under its hex, 5 m a square: streets outside, its
# houses' floors under their roofs), maps of one campaign (every file names it: The Grey
# Marches).
maps:
  - maps/grey-marches.otd.json
  - maps/hollow-hills.otd.json
  - maps/barrow-halls.otd.json
  - maps/deep-barrows.otd.json
  - maps/old-mine.otd.json
  - maps/ashford.otd.json
