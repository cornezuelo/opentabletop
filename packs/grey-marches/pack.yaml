# A small frontier to play and to learn from: a haunted wood, hollow hills and a salt
# lake. Its travel system, tables and example map use every feature of OpenTabletop.
# Open the example map in the Hexmapper: Maps → Example maps.
id: grey-marches
name: The Grey Marches
version: 0.1.0
locale: en
license: MIT
# Tables of other packs: Core must be loaded, and `twist` is a short name for one of its tables.
dependencies: { core: '>=0.3.0' }
aliases: { twist: core/twists }
