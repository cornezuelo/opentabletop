  </defs>
  <rect width="100" height="160" fill="url(#glow)"/>
  <rect width="100" height="160" fill="url(#thorns)"/>
  <rect x="7" y="7" width="86" height="146" rx="4" fill="none" stroke="#c8b36a" stroke-opacity=".7"/>
  <rect x="11" y="11" width="78" height="138" rx="3" fill="none" stroke="#c8b36a" stroke-opacity=".35"/>
  <g transform="translate(50 80)" fill="none" stroke="#e2cf86" stroke-width="2" stroke-linejoin="round">
