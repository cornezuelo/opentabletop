# Treasure: percentile dice and limits on how often an entry comes up.

# d100 (also written d%): 1–100.
kind: table
id: treasure
tags: [treasure]
name: What is in the hoard?
description: |-
  What a **hoard** holds.

  **Shows:**

  - Percentile dice: `d100`, also written `d%`
  - Dice rolled once by `set`, read by the text and the `effects`: the silver found is what the Company gets
  - Cascades into _Rumours_ and _A rare prize_
roll: d100
entries:
  # Rolled once by `set`, so the text says what the Company gets.
  - id: coins
    range: 1-50
    result: '{{coins}} silver pieces'
    set: { coins: '{{3d6}}' }
    effects: { party.stats.silver: '{{coins}}' }
  - id: gems
    range: 51-75
    result: '{{gems}} gems worth {{worth}} silver each'
    set: { gems: '{{1d4}}', worth: '{{2d6+4}}' }
    effects: { party.stats.silver: '{{gems * worth}}' }
  - {
      id: map,
      range: 76-90,
      result: 'A map of the Hollow Hills; a note says {{result}}',
      table: table.rumours,
    }
  - {
      id: potion,
      range: 91-98,
      result: A flask of the hedge-witches’ cordial (removes all fatigue),
      # '=value' sets a value instead of adding to it.
      effects: { party.stats.fatigue: '=0' },
    }
  - { id: prize, range: 99-100, table: table.prize }
---
# maxOccurrences: the Sword of Keld turns up twice at most; then only gold remains.
kind: table
id: prize
tags: [treasure]
name: A rare prize
description: |-
  A **rare prize**.

  **Shows:** `maxOccurrences`: the Sword of Keld turns up twice at most; then only gold remains. An item given by a result: whoever finds it (`acting.items.sword-of-keld: 1`) gets the sword from the gear (items.yaml).
entries:
  - {
      id: sword,
      weight: 1,
      maxOccurrences: 2,
      result: 'The Sword of Keld, lost these hundred years',
      effects: { acting.items.sword-of-keld: 1 },
    }
  - id: gold
    weight: 1
    result: '{{crowns}} gold crowns of the old kings'
    set: { crowns: '{{2d6+6}}' }
    effects: { party.stats.silver: '{{crowns * 10}}' }
---
# A generator using every kind of field: a table, dice (keep the lowest of 2d6: mostly
# low), percentile dice, a fixed value with a template, a field only when another says so,
# and a table rolled with its own context (the guardian is met at night, as dangerous as the
# ruin: the danger field before it).
kind: generator
id: ruin-delve
tags: [places, treasure, rules]
name: Delving a ruin
description: |-
  What a **ruin** holds, and what guards it.

  **Shows:**

  - Every kind of generator field: a table, dice (`2d6kl1`: keep the lowest), `d%` and a fixed value with a template
  - A field only when another says so: `when`; and one unless another says so: `unless`
  - A table rolled with its own context: the guardian, met at night, as dangerous as the ruin (fields see the fields before them: `danger`)
  - Fields' fixed texts translated in `locales/` (`fields:`)
  - Rolled by an action's step in a trip (`roll: generator.ruin-delve`, _Delve the ruin_), with no check around it: what its tables set, change and pause reaches the trip (a guardian that stops it, the morale it costs)
fields:
  site: { table: table.ruins }
  danger: { roll: 2d6kl1 }
  untouched: { roll: d% }
  trap: { when: { danger: { lte: 2 } }, value: ' A trap guards the way in.' }
  # Unless less than nine tenths is untouched: nobody has been here.
  fresh: { unless: { untouched: { lt: 90 } }, value: ' No one has set foot here in an age.' }
  rating: { value: 'danger {{danger}} of 6' }
  loot: { table: table.treasure }
  guardian: { table: table.encounter, context: { timeOfDay: night } }
template: 'The ruins of {{site}} ({{rating}}, {{untouched}}% untouched).{{fresh}}{{trap}} Inside: {{loot}}. Guarding it: {{guardian}}.'
