# Treasure: percentile dice and limits on how often an entry comes up.

# d100 (also written d%): 1–100.
kind: table
id: treasure
tags: [treasure]
name: What is in the hoard?
description: |-
  What a **hoard** holds.

  **Shows:**

  - Percentile dice: `d100`, also written `d%`, offered read either way round (_A lucky search_: a roll mode with `swap`)
  - What the dice show (`dice.doubles`): doubles (11, 22… 00) find a hidden cache before anything else
  - Dice rolled once by `set`, read by the text and the `effects`: the silver found is what the Company gets; dice that explode (`3d6!`: a six is rolled again and added)
  - Cascades into _Rumours_ and _A rare prize_
roll: d100
modes: [roll-modes.lucky]
entries:
  # Doubles, whatever the total: the first entry whose condition holds and whose range has it.
  - id: cache
    range: 1-100
    when: { dice.doubles: true }
    result: 'A hidden cache under the floor: {{coins}} silver pieces, and a rare prize'
    set: { coins: '{{3d6!}}' }
    effects: { party.stats.silver: '{{coins}}' }
    table: table.prize
  # Rolled once by `set`, so the text says what the Company gets.
  - id: coins
    range: 1-50
    result: '{{coins}} silver pieces'
    # Exploding dice: each six is rolled again and added.
    set: { coins: '{{3d6!}}' }
    effects: { party.stats.silver: '{{coins}}' }
  - id: gems
    range: 51-75
    result: '{{gems}} gems worth {{worth}} silver each'
    set: { gems: '{{1d4}}', worth: '{{2d6+4}}' }
    effects: { party.stats.silver: '{{gems * worth}}' }
  - {
      id: map,
      range: 76-90,
      result: 'A map of the Hollow Hills; a note says {{result}}',
      table: table.rumours,
    }
  - {
      id: potion,
      range: 91-98,
      result: A flask of the hedge-witches’ cordial (removes all fatigue),
      # '=value' sets a value instead of adding to it.
      effects: { party.stats.fatigue: '=0' },
    }
  - { id: prize, range: 99-100, table: table.prize }
---
# maxOccurrences: the Sword of Keld turns up twice at most; then only gold remains.
kind: table
id: prize
tags: [treasure]
name: A rare prize
description: |-
  A **rare prize**.

  **Shows:** `maxOccurrences`: the Sword of Keld turns up twice at most; then only gold remains. An item given by a result: whoever finds it (`acting.items.sword-of-keld: 1`) gets the sword from the gear (items.yaml).
entries:
  - {
      id: sword,
      weight: 1,
      maxOccurrences: 2,
      result: 'The Sword of Keld, lost these hundred years',
      effects: { acting.items.sword-of-keld: 1 },
    }
  - id: gold
    weight: 1
    result: '{{crowns}} gold crowns of the old kings'
    set: { crowns: '{{2d6+6}}' }
    effects: { party.stats.silver: '{{crowns * 10}}' }
---
# What a foe that fell leaves (travel.yaml's _Strip the fallen_, as it leaves those present),
# read acting as it: by its template and its tags, the first entry that holds.
kind: table
id: fallen
tags: [treasure, encounters]
name: What the fallen leave
description: |-
  What a foe that **fell** leaves behind: an outlaw's purse and the rations it carried, a bandit chief's hoard, now and then the grave goods of the restless dead; a beast leaves nothing worth taking.

  **Shows:**

  - A table rolled as one of those present leaves (`on: present.leave`), only for one that fell (`when: { acting.conditions: down }`), read acting as it was when it left
  - Entries chosen by who it was: its template (`acting.template: bandit-chief`) and its tags (`acting.tags: outlaw`), each over the whole roll, the first that holds
  - What it carried taken by the party (`party.items.ration: '{{max(acting.items.ration.count, 0)}}'`: none when it had none)
  - Cascades into _What is in the hoard?_ and _A rare prize_
roll: 1d6
entries:
  - id: hoard
    range: 1-6
    when: { acting.template: bandit-chief }
    result: 'The chief’s hoard, and {{rations}} rations'
    set: { rations: '{{max(acting.items.ration.count, 0)}}' }
    effects: { party.items.ration: '{{rations}}' }
    table: table.treasure
  - id: purse
    range: 1-6
    when: { acting.tags: outlaw }
    result: 'A purse of {{coins}} silver, and {{rations}} rations'
    set: { coins: '{{1d6}}', rations: '{{max(acting.items.ration.count, 0)}}' }
    effects: { party.stats.silver: '{{coins}}', party.items.ration: '{{rations}}' }
  - id: grave-goods
    range: 6
    when: { acting.tags: undead }
    result: 'Grave goods among the bones'
    table: table.prize
  - { id: nothing, range: 1-6, result: Nothing worth taking }
---
# A generator using every kind of field: a table, dice (keep the lowest of 2d6: mostly
# low), percentile dice, a fixed value with a template, a field only when another says so,
# and a table rolled with its own context (the guardian is met at night, as dangerous as the
# ruin: the danger field before it).
kind: generator
id: ruin-delve
tags: [places, treasure, rules]
name: Delving a ruin
description: |-
  What a **ruin** holds, and what guards it.

  **Shows:**

  - Every kind of generator field: a table, dice (`2d6kl1`: keep the lowest), `d%` and a fixed value with a template
  - A field only when another says so: `when`; and one unless another says so: `unless`
  - A table rolled with its own context: the guardian, met at night, as dangerous as the ruin (fields see the fields before them: `danger`)
  - Fields' fixed texts translated in `locales/` (`fields:`)
  - Rolled by an action's step in a trip (`roll: generator.ruin-delve`, _Delve the ruin_), with no check around it: what its tables set, change and pause reaches the trip (a guardian that stops it, the morale it costs)
fields:
  site: { table: table.ruins }
  danger: { roll: 2d6kl1 }
  untouched: { roll: d% }
  trap: { when: { danger: { lte: 2 } }, value: ' A trap guards the way in.' }
  # Unless less than nine tenths is untouched: nobody has been here.
  fresh: { unless: { untouched: { lt: 90 } }, value: ' No one has set foot here in an age.' }
  rating: { value: 'danger {{danger}} of 6' }
  loot: { table: table.treasure }
  guardian: { table: table.encounter, context: { timeOfDay: night } }
template: 'The ruins of {{site}} ({{rating}}, {{untouched}}% untouched).{{fresh}}{{trap}} Inside: {{loot}}. Guarding it: {{guardian}}.'
