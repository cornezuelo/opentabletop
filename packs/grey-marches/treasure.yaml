# Treasure: percentile dice and limits on how often an entry comes up.

# d100 (also written d%): 1–100.
kind: table
id: treasure
name: What is in the hoard?
description: 'What a hoard holds. Shows: percentile dice (d100, also written d%), dice in the text, and cascades into Rumours and A rare prize.'
roll: d100
entries:
  - { id: coins, range: 1-50, result: '{{3d6}} silver pieces' }
  - { id: gems, range: 51-75, result: '{{1d4}} gems worth {{2d6+4}} silver each' }
  - {
      id: map,
      range: 76-90,
      result: 'A map of the Hollow Hills; a note says {{result}}',
      table: rumours,
    }
  - {
      id: potion,
      range: 91-98,
      result: A flask of the hedge-witches’ cordial (removes all fatigue),
    }
  - { id: prize, range: 99-100, table: prize }
---
# maxOccurrences: the Sword of Keld turns up twice at most; then only gold remains.
kind: table
id: prize
name: A rare prize
description: 'A rare prize. Shows: maxOccurrences (the Sword of Keld turns up twice at most; then only gold remains).'
entries:
  - {
      id: sword,
      weight: 1,
      maxOccurrences: 2,
      result: 'The Sword of Keld, lost these hundred years',
    }
  - { id: gold, weight: 1, result: '{{2d6+6}} gold crowns of the old kings' }
---
# A generator using every kind of field: a table, dice (keep the lowest of 2d6: mostly
# low), percentile dice, a fixed value with a template, a field only when another says so,
# and a table rolled with its own context (the guardian is met at night, deep in danger).
kind: generator
id: ruin-delve
name: Delving a ruin
description: 'What a ruin holds, and what guards it. Shows: every kind of generator field: a table, dice (2d6kl1: keep the lowest), d%, a fixed value with a template, a field only when another says so (`when`), and a table rolled with its own context (the guardian, met at night in danger 3).'
fields:
  site: { table: ruins }
  danger: { roll: 2d6kl1 }
  untouched: { roll: d% }
  trap: { when: { danger: { lte: 2 } }, value: ' A trap guards the way in.' }
  rating: { value: 'danger {{danger}} of 6' }
  loot: { table: treasure }
  guardian: { table: encounter, context: { timeOfDay: night, danger: 3 } }
template: 'The ruins of {{site}} ({{rating}}, {{untouched}}% untouched).{{trap}} Inside: {{loot}}. Guarding it: {{guardian}}.'
