# The Company's characters: what each companion has. The system names this sheet
# (system.yaml: `sheet: companion`), so a trip's party can be made of companions; the
# bindings (travel.yaml) say which party stats come from them and that they carry the food.
kind: sheet
id: companion
name: Companion
description: |-
  One of the Company: their skills, their wounds and the rations they carry. With
  companions in the party, its Survival, Charisma, Navigation and Stealth are theirs, it
  eats a ration per mouth from what they carry, and wounds keep some of them back.

  **Shows:** a sheet of values with bounds (one bounded by another value,
  `max: '{{maxHealth}}'`), a track (dread), named groups, conditions that block an action, a
  way of travelling or travel itself, and kinds of relation (a bond with a number, a home); every part with a description, shown as its help where the sheet is met.
values:
  # Skills: the party takes the best (or the worst) of them (bindings' `from`).
  survival: { name: Survival, default: 1, min: 0, max: 5, group: skills }
  charisma: { name: Charisma, default: 0, min: -2, max: 3, group: skills }
  pathfinding:
    name: Pathfinding
    description: The party's Navigation is the best Pathfinding among the companions.
    default: 0
    min: 0
    max: 3
    group: skills
  stealth:
    name: Stealth
    description: The party is only as stealthy as its clumsiest companion.
    default: 1
    min: 0
    max: 3
    group: skills
  # Health under a maximum that is another value (a variable as the bound).
  maxHealth: { name: Max health, default: 3, min: 1, max: 6, group: body }
  health:
    name: Health
    description: Lost to fords, ambushes and the cold; a fed night in camp gives one back.
    default: 3
    min: 0
    max: '{{maxHealth}}'
    group: body
  # What each one carries of the party's food (bindings: `resources.food: { carried: rations }`).
  rations:
    name: Rations
    description: The food this companion carries; the party's food is everyone's together.
    default: 2
    min: 0
    max: 6
    group: gear
  # A track of boxes, filled by haunted nights and emptied by the Ember Moon's rite.
  dread:
    name: Dread
    description: Filled by the haunted lights of the Greywood; the rite at a shrine empties it.
    default: 0
    min: 0
    max: 6
    track: true
    group: body
# The headings the values are shown under, in this order.
# Each group's description is its help where the sheet is shown, like every part's.
groups:
  skills:
    {
      name: Skills,
      description: What a companion is good at; the party takes the best or the worst of them.,
    }
  body: { name: Body, description: How much a companion can take before they fall. }
  gear: { name: Gear, description: What a companion carries for the whole Company. }
conditions:
  # A wounded companion can't push on (blocks two of the system's actions) nor guide
  # (the party's Survival leaves the wounded out).
  wounded:
    name: Wounded
    description: Hurt and bleeding. Can't force a march or march by night; doesn't count for the party's Survival.
    blocks: [actions.forced-march, actions.night-march]
  # A sprained ankle stops the whole party until it's tended.
  sprained:
    name: Sprained ankle
    description: Can't walk on. The party can't march until someone tends it.
    blocks: [travel.move]
  # Riding is out of the question while saddle-sore (a way of travelling blocked).
  saddle-sore:
    name: Saddle-sore
    description: Can't bear another day on horseback.
    blocks: [modes.horse]
relations:
  bond:
    name: Bond
    description: How close two companions (or a companion and a place) are, 0 to 3.
    value: { min: 0, max: 3 }
  home:
    name: Home
    description: Where a companion comes from.
---
# The Company itself: what belongs to the whole party, whoever travels in it. The system
# names it (system.yaml: `partySheet: company`); its morale, fatigue, hirelings and
# endurance are the party's stats (travel.yaml: `from: { party: … }`).
kind: sheet
id: company
name: The Company
description: |-
  The Company as a whole: its morale, its fatigue, the sell-swords it has hired and how much it can take. It stays the same as companions join and fall: every trip has it.

  **Shows:** a party sheet (`partySheet`) beside the characters' sheet: values the party's stats are made of (`from: { party: morale }`, so effects on `party.stats.fatigue` change it within its bounds), and a condition of the party that blocks an action (shaken, no forced march), set by a table and cleared by resting.
values:
  morale: { name: Morale, default: 3 }
  fatigue: { name: Fatigue, default: 0, min: 0 }
  hirelings: { name: Hirelings, default: 0, min: 0 }
  endurance: { name: Endurance, default: 10 }
conditions:
  shaken:
    name: Shaken
    description: Lost in the dark and frightened; no forced march until the Company rests.
    blocks: [actions.forced-march]
