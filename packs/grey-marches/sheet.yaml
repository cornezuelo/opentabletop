# The Company's characters: what each companion has. The system names this sheet
# (system.yaml: `sheet: sheet.companion`), so a trip's party can be made of companions; the
# bindings (travel.yaml) say which party stats come from them. Their rations are items they
# carry (items.yaml), and the party eats from them as from the Company's stores.
kind: sheet
id: companion
name: Companion
description: |-
  One of the Company: their skills, their wounds and their gear, rations among it. With
  companions in the party, its Survival, Charisma, Navigation and Stealth are theirs, it
  eats a ration per mouth (from the Company's stores, then from whoever carries most),
  wounds keep some of them back, a rope helps at the ford and torches burn on night marches.
  A new companion sets out with two rations.

  **Shows:** a sheet of values with bounds (one bounded by another value,
  `max: '{{self.values.maxHealth}}'`), each value shown its own way (skills as pips, health as
  a bar whose tone falls with it, dread as boxes that turn red,
  nerve as a die that steps from d4 to d12 (`display: levels`), a bond's number as pips), a
  value made of others (wounds, `from: '{{self.values.maxHealth - self.values.health}}'`), named groups, conditions that block an action, a
  way of travelling or travel itself, conditions that hold by themselves (`when:`: _Terrified_
  while dread is full, _Seasick_ while the party travels by boat, reading the world, _Burdened_
  while the load is over the capacity), kinds of relation (a bond with a number, a home), and
  items (`items:`): fields every item has (slots, uses that run out as pips, armour), places
  for a body (hands, body, belt, back) that items fit by tags, the slots filling them, values
  made of the items (the load, `{ sum: items.slots }`, shown against the capacity,
  `of: '{{self.values.capacity}}'`, amber at it and red over it; the armour worn,
  `{ max: items.armour, where: { place.tags: worn } }`), places that take no more than their
  room (`over: refuse`: a full place offers nothing, what's given goes in the backpack or in
  no place), what a new companion carries (`start: { ration: 2 }`) and
  how what the party spends is shared out among them (`share: even`: from whoever carries
  most); every part with a description, shown as its help where the sheet is met.
values:
  # Skills: the party takes the best (or the worst) of them (bindings' `from`).
  survival:
    name: Survival
    description: Added to foraging and fords; the party's Survival is the best among the companions not wounded.
    default: 1
    min: 0
    max: 5
    display: pips
    group: skills
  charisma:
    name: Charisma
    description: Added to reaction rolls and saves the toll at Keld Bridge; whoever does the talking (Rolls with), or the best.
    default: 0
    min: -2
    max: 3
    group: skills
  pathfinding:
    name: Pathfinding
    description: The party's Navigation is the best Pathfinding among the companions.
    default: 0
    min: 0
    max: 3
    display: pips
    group: skills
  stealth:
    name: Stealth
    description: The party is only as stealthy as its clumsiest companion.
    default: 1
    min: 0
    max: 3
    display: pips
    group: skills
  # Health under a maximum that is another value (a variable as the bound).
  maxHealth:
    name: Max health
    description: The most health this companion can have; a fed night in camp heals up to it.
    default: 3
    min: 1
    max: 6
    group: body
  health:
    name: Health
    description: Lost to fords, ambushes and the cold; a fed night in camp gives one back.
    default: 3
    min: 0
    max: '{{self.values.maxHealth}}'
    # A bar up to its max: red under half of it, amber from half, green from three quarters
    # (with a max of 3: red at 0 and 1, amber at 2, green at 3), following the max as it changes.
    display: bar
    tones: { 0: danger, 50%: warning, 75%: good }
    group: body
  # Made of two others, never set: it follows health and its max at once.
  wounds:
    name: Wounds
    description: The health a companion has lost, worked out from health and max health; a fed night in camp heals one.
    from: '{{self.values.maxHealth - self.values.health}}'
    min: 0
    max: '{{self.values.maxHealth}}'
    display: boxes
    tones: { 1: warning, 3: danger }
    group: body
  # Made of the items: every item's slots (× how many), and how much a companion can carry.
  load:
    name: Load
    description: The slots of everything this companion carries, containers and what's in them; over the capacity, they're burdened.
    from: { sum: items.slots }
    # Shown against the capacity, which is no bound (a load may go past it): `9 / 8`, amber
    # at the capacity, red over it.
    of: '{{self.values.capacity}}'
    display: of
    tones: { 0: good, 100%: warning, 101%: danger }
    group: gear
  capacity:
    name: Capacity
    description: How many slots a companion carries before they're burdened, twice their max health plus 2.
    from: '{{self.values.maxHealth * 2 + 2}}'
    group: gear
  # The best armour among the items worn (on the body), never what's in a pack.
  armour:
    name: Armour
    description: The best armour this companion wears; your own tables may read it as `acting.values.armour`.
    from: { max: items.armour, where: { place.tags: worn } }
    group: gear
  # A track of boxes, filled by haunted nights and emptied by the Ember Moon's rite;
  # amber from 4 up and red when full.
  dread:
    name: Dread
    description: Filled by the haunted lights of the Greywood; the rite at a shrine empties it.
    default: 0
    min: 0
    max: 6
    display: boxes
    tones: { 4: warning, 6: danger }
    group: body
  # A die that steps up and down (d4 … d12): the value is the step, its levels name the
  # die. The rite at a shrine steps it up, the Wyrm waking steps it down (travel.yaml).
  nerve:
    name: Nerve
    description: The die a companion's courage is, from d4 to d12, rolled when fear takes hold. The Wyrm waking steps it down a die, the rite at a shrine back up.
    default: 2
    min: 0
    max: 4
    display: levels
    levels: [d4, d6, d8, d10, d12]
    group: body
# The headings the values are shown under, in this order.
# Each group's description is its help where the sheet is shown, like every part's.
groups:
  skills:
    {
      name: Skills,
      description: What a companion is good at; the party takes the best or the worst of them.,
    }
  body: { name: Body, description: How much a companion can take before they fall. }
  gear:
    { name: Gear, description: 'What a companion carries, for themselves and the whole Company.' }
conditions:
  # A wounded companion can't push on (blocks two of the system's actions) nor guide
  # (the party's Survival leaves the wounded out).
  wounded:
    name: Wounded
    description: Hurt and bleeding. Can't force a march or march by night; doesn't count for the party's Survival.
    blocks: [actions.forced-march, actions.night-march]
  # A sprained ankle stops the whole party until it's tended.
  sprained:
    name: Sprained ankle
    description: Can't walk on. The party can't march until someone tends it.
    blocks: [travel.move]
  # Riding is out of the question while saddle-sore (a way of travelling blocked).
  saddle-sore:
    name: Saddle-sore
    description: Can't bear another day on horseback.
    blocks: [modes.horse]
  # Holds by itself while dread is full: nothing sets it, and the rite that empties dread
  # clears it.
  terrified:
    name: Terrified
    description: Dread has filled up. Won't march by night until it's lifted (the rite at a shrine empties dread).
    when: { self.values.dread: { gte: 6 } }
    blocks: [actions.night-march]
  # Holds by itself while the world says so: on a boat, for a companion of little nerve.
  seasick:
    name: Seasick
    description: On a boat with a nerve of d6 or less. Can't forage while it lasts; it passes on landing.
    when: { trip.mode: boat, self.values.nerve: { lte: 1 } }
    blocks: [actions.forage]
  # Holds by itself while the load is over the capacity: the companion's own items say so.
  burdened:
    name: Burdened
    description: Carrying more than they can; no forced march nor night march until something is dropped.
    when: { self.values.load: { gt: '{{self.values.capacity}}' } }
    blocks: [actions.forced-march, actions.night-march]
# What every item has in the Marches, and where on a companion it goes. The catalogue of
# gear (items.yaml) says each item's numbers; an item written by hand gets the defaults.
items:
  fields:
    slots: { name: Slots, description: How much room it takes., default: 1, min: 0 }
    uses:
      name: Uses
      description: What's left of it (a torch's hours); at 0 one is spent, and the next starts full.
      min: 0
      max: 3
      display: pips
      spent: true
    armour: { name: Armour, description: How well it protects when worn., min: 0 }
  places:
    hands: { name: Hands, tags: [hand], room: 2 }
    body: { name: Body, description: What is worn., tags: [worn], room: 2 }
    belt: { name: Belt, tags: [belt], room: 2 }
    back:
      {
        name: Back,
        description: A pack or a bundle slung over the shoulders.,
        tags: [back],
        room: 1,
      }
  # A place's room counts slots: a mail shirt (2 slots) fills more than a torch.
  size: slots
  # Hands, body, belt and back take no more than their room: what's given with no room
  # left goes in a backpack (which takes more, items.yaml) or in no place.
  over: refuse
  # What the party eats or finds (`party.items.ration`) is taken from whoever carries most,
  # and given to whoever carries least (the default, written out).
  share: even
  # A new companion sets out with two rations (from the catalogue).
  start: { ration: 2 }
relations:
  bond:
    name: Bond
    description: How close two companions (or a companion and a place) are, 0 to 3.
    value: { min: 0, max: 3, display: pips }
  home:
    name: Home
    description: Where a companion comes from.
---
# The Company itself: what belongs to the whole party, whoever travels in it. The system
# names it (system.yaml: `partySheet: company`); its morale, fatigue, hirelings and
# endurance are the party's stats (travel.yaml: `from: { party: … }`). Its fodder is a value
# of its own, and its stores of rations are items it keeps (eaten before the companions').
kind: sheet
id: company
name: The Company
description: |-
  The Company as a whole: its morale, its fatigue, the sell-swords it has hired, how much it can take, the horses' fodder and its stores of rations. It stays the same as companions join and fall: every trip has it.

  **Shows:** a party sheet (`partySheet`) beside the characters' sheet: values the party's stats are made of (`from: { party: morale }`, so effects on `party.stats.fatigue` change it within its bounds), a supply as a plain value (fodder, `party.values.fodder`, shown as `6 / 12`), items of the party's own that it starts with (six rations, `items: { start: { ration: 6 } }`), spent before its companions' (`party.items.ration`), and a condition of the party that blocks an action (shaken, no forced march), set by a table and cleared by resting.
values:
  morale:
    name: Morale
    description: How the Company holds up. Wolves, bandits, getting lost and hunger lower it, the shrine and the inn raise it; at 1 or less the night's watch is restless (+1 fatigue), and talking round the hirelings is a d6 at or under it.
    default: 3
  fatigue:
    name: Fatigue
    description: How worn out the Company is. Marching long, forced marches and restless nights add to it; a fed night in camp and resting take it off. At 2 or more there's no forced march, and at your Endurance you can't camp or rest.
    default: 0
    min: 0
  hirelings:
    name: Hirelings
    description: Sell-swords travelling with the Company. They join at the inn, eat with you, refuse to march after a hungry day and may walk off when talked to badly.
    default: 0
    min: 0
  endurance:
    name: Endurance
    description: How much fatigue the Company takes before it can't camp or rest any more (they're only possible while fatigue is under it).
    default: 10
  # A supply as a plain value of the Company: eaten by the horses on each day ridden.
  fodder:
    name: Fodder
    description: Days of fodder for the horses, as many as they can carry; one is eaten at the end of each day on horseback, and it never goes below 0. The market sells more.
    default: 6
    min: 0
    max: 12
    # The count beside its max: 6 / 12.
    display: of
# The Company's own stores: six rations a new trip starts with, eaten before the companions'.
items:
  start: { ration: 6 }
conditions:
  shaken:
    name: Shaken
    description: Lost in the dark and frightened; no forced march until the Company rests.
    blocks: [actions.forced-march]
