# The powers of the Marches, as factions (Factions in the Hexmapper's World panel). Each is
# a character of the `faction` sheet below, holding hexes of the map; on each world turn
# (every 7 days of the world clock, or by hand) it rolls its turn table, whose effects change
# its values, another faction's, its territory and the world clock's progress clocks.
kind: sheet
id: faction
name: Faction
description: |-
  What every power of the Marches has: its strength, how it regards the party, whether it's at war, and whether it's broken.

  **Shows:** a sheet for factions (the same kind as characters'): values with bounds, shown as a dial (strength) and as named levels with tones (reputation, from _Hostile_ at −3 to _Sworn friends_ at 3), a condition set by effects (at war), one that holds by itself (_Broken_ at strength 0, `when:`, read by the turn table), and kinds of relation between factions.
values:
  # A round dial of six segments, red when it's down to one.
  strength:
    { name: Strength, default: 3, min: 0, max: 6, display: dial, tones: { 0: danger, 2: accent } }
  # How the faction regards the party, read by tables as factions.<id>.values.reputation;
  # shown by name, the first level its min (-3), the last its max (3).
  reputation:
    name: Reputation
    default: 0
    min: -3
    max: 3
    display: levels
    levels:
      - { id: hostile, name: Hostile, description: Attacks the party on sight. }
      - { id: unfriendly, name: Unfriendly }
      - { id: wary, name: Wary }
      - { id: neutral, name: Neutral }
      - { id: friendly, name: Friendly }
      - { id: warm, name: Warm }
      - { id: sworn, name: Sworn friends, description: Would fight for the party. }
    tones: { -3: danger, -1: warning, 0: accent, 1: good }
conditions:
  at-war: { name: At war }
  # Holds by itself while its strength is spent: no effect sets or clears it.
  broken:
    name: Broken
    description: Its strength is spent; on its turn it gives up land to gather itself again.
    when: { self.values.strength: { lte: 0 } }
relations:
  rival: { name: Rival }
  ally: { name: Ally }
---
kind: factions
id: default
name: The powers of the Marches
description: |-
  The Iron Clans of the Hollow Hills, the Vale of Ashford and the unpaid garrison of Fort Keld.

  **Shows:** factions declared by a pack: a sheet for their values, starting territory by region (the Hills, the Vale, on any map) and by hex on an example map each (Fort Keld on the Marches' map, the Clans' watch-cairn on the Hollow Hills', `map:`), the Clans holding land on both maps of the example campaign, a default turn table, one of their own (the Clans') and one from Core (the garrison's), and turns every 7 days.
sheet: sheet.faction
turn: table.faction-turn
every: 7
factions:
  iron-clans:
    name: The Iron Clans
    description: Hill clans who answer to no king; they covet the Vale's fields.
    color: '#8b1e1e'
    values: { strength: 4, reputation: -1 }
    # The Hills on any map that has them, and their watch-cairn on the Hollow Hills map
    # (outside the region there).
    territory:
      { regions: [The Hollow Hills], map: maps/hollow-hills.otd.json, hexes: ['3,6', '4,6'] }
    turn: table.clan-turn
  the-vale:
    name: The Vale of Ashford
    description: Farmers and their militia, the last of the old kingdom's order.
    color: '#c9a227'
    values: { strength: 3, reputation: 1 }
    territory: { regions: [Ashford Vale] }
  fort-keld:
    name: The Garrison of Fort Keld
    description: Soldiers unpaid for a year, holding the bridge road.
    color: '#4a6b8a'
    values: { strength: 2 }
    territory: { map: maps/grey-marches.otd.json, hexes: ['15,9'] }
    # A turn table of another pack (Core, a dependency): it only grows or loses ground.
    turn: core/table.faction-turn
---
# The default turn: what a power does depends on its strength (conditions on its own values,
# `faction.values.strength`).
kind: table
id: faction-turn
tags: [factions, rules]
name: A power's turn
description: |-
  What the Vale (and any power without a table of its own) does on a world turn: strong, it reaches out; weak, it gathers its people.

  **Shows:** a faction's turn: conditions on its own values (`faction.values.strength`) and on a condition that holds by itself (`faction.conditions: broken`), effects on them, on its territory (`faction.territory: 1`, `-1`) and on its reputation with the party.
roll: 1d6
entries:
  - id: broken
    range: 1-6
    when: { faction.conditions: broken }
    result: Broken, it gives up its outlying land and gathers what's left
    effects: { faction.territory: -1, faction.values.strength: 1 }
  - id: reach
    range: 1-6
    when: { faction.values.strength: { gte: 4 } }
    result: Strong, it reaches out for more land
    effects: { faction.territory: 1, faction.values.strength: -1 }
  - id: gather
    range: 1-3
    result: Gathers its people and its stores
    effects: { faction.values.strength: 1 }
  - id: feast
    range: 4-5
    result: Holds a feast in the travellers' honour
    effects: { faction.values.reputation: 1 }
  - { id: quiet, range: 6, result: A quiet week }
---
# The Clans' own turn: they raid the Vale (an effect on another faction), push their border
# (territory) and bring their march on Fort Keld closer (a progress clock the system declares,
# clocks.yaml, by its id: world.clocks.the-iron-clans-march).
kind: table
id: clan-turn
tags: [factions, rules]
name: The Clans' turn
description: |-
  What the Iron Clans do on a world turn: raid the Vale, push their border, or call the clans together for the march on Fort Keld.

  **Shows:** effects on another faction (`factions.the-vale.values.strength: -1`), a condition set on itself (`faction.conditions.at-war`), territory taken from a neighbour, and a world clock's progress clock ticked (`world.clocks.the-iron-clans-march: 1`).
roll: 1d6
entries:
  - id: raid
    range: 1-2
    result: Raiders strike the Vale's outlying farms
    effects:
      {
        factions.the-vale.values.strength: -1,
        faction.conditions.at-war: true,
        faction.values.reputation: -1,
      }
  - id: push
    range: 3-4
    result: Clansmen push their border down from the hills
    effects: { faction.territory: 1 }
  - id: gather
    range: 5-6
    result: The chiefs gather; the march on Fort Keld draws closer
    effects: { faction.values.strength: 1, world.clocks.the-iron-clans-march: 1 }
