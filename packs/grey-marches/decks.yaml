# A deck: cards drawn without replacement until it's reshuffled. Cards come in copies,
# can roll a table ({{result}}) and can set values (here, food found).
kind: deck
id: omens
tags: [omens, rules]
name: Omens of the road
description: |-
  One is drawn **at each dawn** on the road, by the _Omens_ check of the Marches' travel rules (or by hand). A drawn card is gone until the deck runs out.

  **Shows:**

  - A **deck**: copies of a card (`count`), reshuffled when empty
  - A deck that **resolves a check** (`OMENS: { resolve: deck.omens }` in the bindings), its draws kept in the campaign's Oracle, shared with draws by hand
  - Cards that roll a generator, their references saying what they name (`generator.npc`), and one that sets values (food)
  - Another pack's table through an alias: `table.twist` → `core/table.twists`
  - `notable: true`: the Wyrm's sign, an important moment shown up front though nothing stops
  - **Faces**: every card drawn as a card, in the Marches' green ink (`face:` on the deck), each with its own icon or sign; the Wyrm's sign in red
  - **Styled texts**: the Wyrm's sign said in bold red (`[**…**]{red}`), a rumour in italics (`_{{result}}_`)
reshuffle: when-empty
face: { ink: '#3b4a2f' }
cards:
  - { id: crows, face: { icon: 'game:seagull' }, result: Crows follow you all day, count: 3 }
  - { id: rainbow, face: { symbol: '☂' }, result: A rainbow over the Saltmere, count: 2 }
  - {
      id: stranger,
      face: { icon: 'game:hooded-figure' },
      result: 'A stranger on the road: {{result}}',
      table: generator.npc,
      count: 2,
    }
  - {
      id: rumour,
      face: { icon: 'game:wooden-sign' },
      result: 'A rumour reaches you: _{{result}}_',
      table: generator.rumour,
    }
  - {
      id: cache,
      face: { icon: 'game:chest' },
      result: 'A hunter’s cache: two days of food',
      effects: { party.items.ration: 2 },
    }
  # An omen that's more than a sign: the Wyrm's clock ticks.
  - id: wyrm-sign
    face: { icon: 'game:dragon-head', ink: red }
    result: '[**Scorched trees and a smell of sulphur**]{red}'
    effects: { world.clocks.the-greywood-wyrm-wakes: 1 }
    # Nothing stops for it, but it's shown up front: an important moment.
    notable: true
  # Another pack's table, through the alias in pack.yaml (table.twist → core/table.twists).
  - {
      id: twist,
      face: { icon: 'game:vortex' },
      result: 'The road turns strange: {{result}}',
      table: table.twist,
    }
---
# Cards a generator deals: the deck is gathered first, so a reading never repeats a card.
kind: deck
id: hedge-cards
tags: [omens]
name: The hedge-witch's cards
description: |-
  The worn cards a hedge-witch of the Marches reads from, dealt by _A hedge-witch's reading_ or drawn by hand.

  **Shows:**

  - Cards with **effects** on the party and on a progress clock, for a generator to deal
  - Cards drawn **either way up**, one in four reversed (`reversible: { chance: 0.25 }`): a reversed card lies upside down and says its **reversed** text (`reversed:`), and the Lantern's table reads which way it came (`when: { reversed: true }`): reversed, it leads the Company astray and costs morale instead
  - A **back** of its own (`back:`, an SVG of the pack), the cards lying face down on the card table before they're turned
  - **Faces** that turn for another reason too: every card is drawn **upside down** while the Wyrm is close to waking (`turned` reads the clock), so a reading looks as bad as it is
reshuffle: when-empty
# Its own back on the card table: worn green board and a lantern.
back: grey-marches/art/cards/hedge-back.svg
# One card in four comes out reversed: upside down, its reversed text.
reversible: { chance: 0.25 }
# Upside down, too, while the Wyrm's clock is at 4 or more.
face: { ink: '#3b4a2f', turned: { world.clocks.the-greywood-wyrm-wakes: { gte: 4 } } }
cards:
  # Its table reads which way up it came: a safe way home, or a light that leads astray.
  - {
      id: lantern,
      face: { icon: 'game:street-light' },
      result: 'The Lantern, {{result}}',
      table: table.hedge-lantern,
    }
  - {
      id: crow,
      face: { icon: 'game:seagull' },
      result: 'The Crow, a warning heeded too late',
      reversed: 'The Crow reversed, a warning heeded in time',
      effects: { party.stats.morale: -1 },
    }
  - {
      id: ford,
      face: { icon: 'game:stone-bridge' },
      result: 'The Ford, a crossing with a price',
      reversed: 'The Ford reversed, a crossing that should not be made',
    }
  - {
      id: hearth,
      face: { icon: 'game:campfire' },
      result: 'The Hearth, a welcome where none was looked for',
      reversed: 'The Hearth reversed, a welcome that hides a knife',
    }
  - id: wyrm
    face: { icon: 'game:dragon-head', ink: red }
    result: The Wyrm, an old thing stirring
    reversed: The Wyrm reversed, an old thing stirring in its sleep
    effects: { world.clocks.the-greywood-wyrm-wakes: 1 }
  - {
      id: salt,
      face: { icon: 'game:crystal-cluster' },
      result: 'The Salt, a promise that binds',
      reversed: 'The Salt reversed, a promise broken',
    }
  - {
      id: thorn,
      face: { icon: 'game:barbed-wire' },
      result: 'The Thorn, a friend who wounds',
      reversed: 'The Thorn reversed, a wound that heals a friendship',
    }
---
# What the Lantern means, by which way up it came out of the hedge-witch's deck.
kind: table
id: hedge-lantern
tags: [omens]
name: The Lantern
description: |-
  What the hedge-witch's Lantern means: upright, a safe way home (+1 morale); reversed, a light that leads astray (−1 morale).

  **Shows:** a table that reads which way up the card that rolled it came out (`when: { reversed: true }`, `unless:`), with no dice: one row holds at a time.
entries:
  - id: astray
    result: a light that leads astray
    when: { reversed: true }
    effects: { party.stats.morale: -1 }
  - id: home
    result: a safe way home
    unless: { reversed: true }
    effects: { party.stats.morale: 1 }
---
kind: generator
id: hedge-reading
tags: [omens]
name: A hedge-witch's reading
description: |-
  Three cards laid out by a hedge-witch: what follows you, what waits and what you should fear. What they say comes true: their effects reach the party and the Wyrm's clock.

  **Shows:**

  - A generator's field that **draws from a deck** (`deck: deck.hedge-cards`), `shuffle: true` on the first one so every reading starts from the whole deck and never repeats a card
  - The cards' `effects` added up by the generator, like a table's
  - A **spread** laid on the table: each field's card in its place (`at: [column, row]`), the one to fear across what waits (`across: true`)
fields:
  behind: { deck: deck.hedge-cards, shuffle: true, at: [0, 0] }
  ahead: { deck: deck.hedge-cards, at: [1, 0] }
  fear: { deck: deck.hedge-cards, at: [1, 0], across: true }
template: |-
  Behind you: {{behind}}
  Ahead of you: {{ahead}}
  What to fear: {{fear}}
