# A deck: cards drawn without replacement until it's reshuffled. Cards come in copies,
# can roll a table ({{result}}) and can set values (here, food found).
kind: deck
id: omens
tags: [omens, rules]
name: Omens of the road
description: |-
  One is drawn **at each dawn** on the road, by the _Omens_ check of the Marches' travel rules (or by hand). A drawn card is gone until the deck runs out.

  **Shows:**

  - A **deck**: copies of a card (`count`), reshuffled when empty
  - A deck that **resolves a check** (`OMENS: { resolve: deck.omens }` in the bindings), its draws kept in the campaign's Oracle, shared with draws by hand
  - Cards that roll a generator, their references saying what they name (`generator.npc`), and one that sets values (food)
  - Another pack's table through an alias: `table.twist` → `core/table.twists`
reshuffle: when-empty
cards:
  - { id: crows, result: Crows follow you all day, count: 3 }
  - { id: rainbow, result: A rainbow over the Saltmere, count: 2 }
  - { id: stranger, result: 'A stranger on the road: {{result}}', table: generator.npc, count: 2 }
  - { id: rumour, result: 'A rumour reaches you: {{result}}', table: generator.rumour }
  - { id: cache, result: 'A hunter’s cache: two days of food', effects: { party.items.ration: 2 } }
  # An omen that's more than a sign: the Wyrm's clock ticks.
  - id: wyrm-sign
    result: Scorched trees and a smell of sulphur
    effects: { world.clocks.the-greywood-wyrm-wakes: 1 }
  # Another pack's table, through the alias in pack.yaml (table.twist → core/table.twists).
  - { id: twist, result: 'The road turns strange: {{result}}', table: table.twist }
---
# Cards a generator deals: the deck is gathered first, so a reading never repeats a card.
kind: deck
id: hedge-cards
tags: [omens]
name: The hedge-witch's cards
description: |-
  The worn cards a hedge-witch of the Marches reads from, dealt by _A hedge-witch's reading_ or drawn by hand.

  **Shows:**

  - Cards with **effects** on the party and on a progress clock, for a generator to deal
reshuffle: when-empty
cards:
  - { id: lantern, result: 'The Lantern, a safe way home', effects: { party.stats.morale: 1 } }
  - { id: crow, result: 'The Crow, a warning heeded too late', effects: { party.stats.morale: -1 } }
  - { id: ford, result: 'The Ford, a crossing with a price' }
  - { id: hearth, result: 'The Hearth, a welcome where none was looked for' }
  - id: wyrm
    result: The Wyrm, an old thing stirring
    effects: { world.clocks.the-greywood-wyrm-wakes: 1 }
  - { id: salt, result: 'The Salt, a promise that binds' }
  - { id: thorn, result: 'The Thorn, a friend who wounds' }
---
kind: generator
id: hedge-reading
tags: [omens]
name: A hedge-witch's reading
description: |-
  Three cards laid out by a hedge-witch: what follows you, what waits and what you should fear. What they say comes true: their effects reach the party and the Wyrm's clock.

  **Shows:**

  - A generator's field that **draws from a deck** (`deck: deck.hedge-cards`), `shuffle: true` on the first one so every reading starts from the whole deck and never repeats a card
  - The cards' `effects` added up by the generator, like a table's
fields:
  behind: { deck: deck.hedge-cards, shuffle: true }
  ahead: { deck: deck.hedge-cards }
  fear: { deck: deck.hedge-cards }
template: |-
  Behind you: {{behind}}
  Ahead of you: {{ahead}}
  What to fear: {{fear}}
