# The threats of the Marches, as progress clocks (Map's World panel). They come
# with the world clock when it starts; trips, tables and faction turns fill them with
# effects (`world.clocks.<id>: 1`), conditions read them, and once full each stays full,
# starts over or goes away. What happens when one fills is the world's (world.yaml).
kind: clocks
id: default
name: Threats of the Marches
description: |-
  Three things coming to the Marches: the Greywood Wyrm waking, the Iron Clans' march on Fort Keld, and the mutiny of its unpaid garrison.

  **Shows:** progress clocks declared by a pack: where each starts and what becomes of it once full (it stays full, starts over or goes away); what happens when one fills is a reaction of the world (_How the Marches move_, `on: world.clocks.<id>.full`); a trip hearing a clock fill, whatever fills it, by hand too (`world.clocks.the-greywood-wyrm-wakes.full`, the moment of the travel rules' _The Wyrm wakes_).
clocks:
  # Filled by the Greywood's haunted lights (encounters.yaml); once full, the Wyrm roams
  # the wood (the encounters read `world.clocks.the-greywood-wyrm-wakes: { gte: 6 }`), so
  # it stays full (`then: keep`, the default).
  the-greywood-wyrm-wakes:
    name: The Greywood Wyrm wakes
    description: The haunted lights of the Greywood stir it in its sleep.
    segments: 6
    filled: 1
  # Filled by the Clans' own turn (factions.yaml). Full, they march (world.yaml); then they
  # gather again.
  the-iron-clans-march:
    name: The Iron Clans march
    description: The chiefs of the Hollow Hills gather for the march on Fort Keld.
    segments: 6
    filled: 1
    then: reset
  # Filled by the Clans' march. Full, the garrison is gone (world.yaml), and the clock with it.
  fort-keld-mutinies:
    name: Fort Keld’s unpaid garrison mutinies
    description: A year without pay, and the Clans at the gates.
    segments: 8
    filled: 3
    then: remove
---
# What the Wyrm does first, once awake: the table the world rolls when its clock fills.
kind: table
id: wyrm-wakes
tags: [clocks, rules]
name: The Wyrm wakes
description: |-
  What the Greywood Wyrm does when it wakes: it falls on the Vale's herds, on the Clans' watch-fires, or lies in wait in the wood.

  **Shows:** a table the world's reaction to a full progress clock rolls (`roll: table.wyrm-wakes`), whose effects change the factions (`factions.the-vale.values.strength: -1`), reading the world as it is (`{{factions.the-vale.values.strength}}`).
roll: 1d6
entries:
  - id: herds
    range: 1-2
    result: 'It falls on the Vale’s herds (the Vale’s strength was {{factions.the-vale.values.strength}})'
    effects: { factions.the-vale.values.strength: -1 }
  - id: fires
    range: 3-4
    result: It scatters the Clans’ watch-fires in the hills
    effects: { factions.iron-clans.values.strength: -1 }
  - { id: waits, range: 5-6, result: It lies in wait under the trees }
