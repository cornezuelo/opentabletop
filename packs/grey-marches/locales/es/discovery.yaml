next-terrain:
  name: La tierra de delante
  description: |-
    Decide un **hex vacío** a partir de la tierra que lo rodea: el agua se junta, la tierra más común sigue, a veces algo parecido, de vez en cuando cualquier cosa.

    **Enseña:**

    - **Descubrimiento**: atada como `discover.terrain` en `travel.yaml`
    - Lo que ven las tablas de la tierra alrededor del hex: `around.lake`, `common`, `commonCount`, `aroundCount`
    - `set: { terrain: '{{common}}' }`: un valor desde una plantilla
    - Cascadas a una tabla por tipo de tierra (4–5 en el dado)
  entries:
    lake: El lago sigue
    sea: El mar sigue
    same: 'La tierra de alrededor sigue ({{commonCount}} de {{aroundCount}} hexes)'
open-land:
  name: Tierra abierta
  description: |-
    La tierra de delante desde **terreno abierto**: llanuras, estepas y parecidos. La tira _La tierra de delante_ con 4–5.

    **Enseña:**

    - Pesos en vez de dados
    - `set: { terrain }`: el hex recibe ese terreno
  entries:
    {
      plains: Llanura,
      steppe: Estepa,
      farmland: Cultivos,
      heath: Brezal,
      forest: Bosque,
      hills: Colinas,
    }
woodland:
  name: Bosques
  description: |-
    La tierra de delante desde **el bosque**: más bosque, a veces denso, de vez en cuando un claro o un pantano. La tira _La tierra de delante_ con 4–5.

    **Enseña:**

    - Una tabla a la que solo se llega desde otra (una cascada)
    - Pesos
  entries: { forest: Bosque, dense: Bosque denso, plains: Llanura, hills: Colinas, swamp: Pantano }
wetland:
  name: Humedales
  description: |-
    La tierra de delante desde **marismas y pantanos**. La tira _La tierra de delante_ con 4–5.

    **Enseña:**

    - Pesos
    - `set: { terrain }`, también a agua (un lago)
  entries: { marsh: Marisma, swamp: Pantano, lake: Lago, forest: Bosque }
highland:
  name: Tierras altas
  description: |-
    La tierra de delante desde **colinas y montañas**: las sierras crecen, con cumbres que nadie cruza. La tira _La tierra de delante_ con 4–5.

    **Enseña:**

    - Pesos
    - `set: { terrain }`
  entries: { hills: Colinas, mountains: Montañas, peaks: Cumbres, canyon: Cañón, forest: Bosque }
dryland:
  name: Tierra seca
  description: |-
    La tierra de delante desde **desiertos, tierras baldías o cañones**. No hay en el mapa de ejemplo: es para tus propios mapas. La tira _La tierra de delante_ con 4–5.

    **Enseña:**

    - Pesos
    - `set: { terrain }`
  entries:
    { desert: Desierto, badlands: Tierras baldías, canyon: Cañón, oasis: Oasis, steppe: Estepa }
cold-land:
  name: Tierra fría
  description: |-
    La tierra de delante desde **tundra, nieve o glaciares**, para tus propios mapas. La tira _La tierra de delante_ con 4–5.

    **Enseña:**

    - Pesos
    - `set: { terrain }`
  entries: { tundra: Tundra, snow: Nieve, glacier: Glaciar, taiga: Taiga }
waters:
  name: Aguas
  description: |-
    La tierra de delante desde **la costa, un lago o el mar**. La tira _La tierra de delante_ con 4–5.

    **Enseña:**

    - Pesos
    - `set: { terrain }` con terrenos de agua
  entries: { coast: Costa, sea: Mar, lake: Lago, plains: Llanura }
any-land:
  name: Cualquier tierra
  description: |-
    **Cualquier cosa**, de vez en cuando: la última entrada de _La tierra de delante_, que no tiene condición y recoge todas las tiradas que no recogen las demás.

    **Enseña:**

    - Una entrada que lo recoge todo
    - Pesos
  entries:
    {
      plains: Llanura,
      forest: Bosque,
      hills: Colinas,
      steppe: Estepa,
      mountains: Montañas,
      swamp: Pantano,
      lake: Lago,
    }
hex-contents:
  name: ¿Qué hay aquí?
  description: |-
    Se tira la **primera vez que entras** en un hex descubierto. Casi siempre nada; a veces ruinas, un santuario o un lugar con nombre.

    **Enseña:**

    - El contenido del **descubrimiento**: `discover.contents`
    - `set: { poi: false }`: nada que merezca un punto de interés
    - `tags` y `name` escritos en el hex
    - Una condición sobre el hex: `water: true`
    - `once`: la guarida del dragón
    - Dados en el texto: `{{1d6+2}}`
  entries:
    water: Aguas abiertas
    lair: La guarida de un dragón, con huesos esparcidos a la entrada
    ruins: 'Ruinas: {{result}}'
    nothing: Nada destacable
    shrine: Un santuario junto al camino a un dios olvidado
    camp: 'Un campamento de {{1d6+2}} viajeros'
landmarks:
  name: Lugares señalados
  description: |-
    Piedras erguidas y, **una sola vez**, las Agujas Gemelas.

    **Enseña:**

    - `once`: después de las Agujas solo quedan piedras
    - `set: { name }` y la etiqueta `landmark`: la comprobación _Lugar señalado_ detiene ahí el viaje
    - Una cascada a _Tallas_
  entries:
    spires: 'Las Agujas Gemelas: dos torres de cristal negro que se ven a leguas'
    stone: 'Una piedra erguida tallada con {{result}}'
ruins:
  name: Ruinas
  description: |-
    Lo que fue una ruina. La tiran _¿Qué hay aquí?_ y _Explorar una ruina_.

    **Enseña:** La tabla más sencilla: sin dados ni pesos, todas las entradas igual de probables
  entries:
    tower: una atalaya derruida
    villa: el esqueleto de una casa solariega
    temple: un templo sin techo
    fort: un castro cubierto de maleza
carvings:
  name: Tallas
  description: |-
    Lo que muestra una piedra erguida.

    **Enseña:** Una tabla sencilla cuyo resultado entra en el texto de otra: `{{result}}` en _Lugares señalados_
  entries:
    serpent: una serpiente enroscada
    eye: un ojo que llora
    ship: un barco a toda vela
    skull: una calavera coronada
