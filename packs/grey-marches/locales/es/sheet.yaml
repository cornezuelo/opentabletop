sheet/companion:
  name: Compañero
  description: |-
    Uno de la Compañía: sus habilidades, sus heridas, las raciones que lleva y su equipo. Con
    compañeros en el grupo, su Supervivencia, Carisma, Orientación y Sigilo son los suyos,
    come una ración por boca de lo que llevan, las heridas retienen a algunos, una cuerda
    ayuda en el vado y las antorchas arden en las marchas nocturnas.

    **Enseña:** una hoja de valores con límites (uno limitado por otro valor,
    `max: '{{self.values.maxHealth}}'`), cada valor mostrado a su manera (las habilidades
    como puntos, la salud como una barra cuyo tono baja con ella, las raciones como `2 / 6`, el
    pavor como casillas que se ponen rojas, el temple como un dado que sube de paso de d4 a d12
    (`display: levels`), el número de un vínculo como puntos), un valor que sale de otros (las
    heridas, `from: '{{self.values.maxHealth - self.values.health}}'`), grupos con nombre, estados que bloquean una
    acción, una forma de viajar o el propio viaje, estados que se cumplen por sí solos (`when:`:
    _Aterrado_ mientras el pavor está lleno, _Mareado_ mientras el grupo viaja en barco, leyendo el
    mundo, _Cargado_ mientras la carga pasa de la capacidad), tipos de relación (un vínculo con un
    número, un hogar) y objetos (`items:`): campos que tiene todo objeto (huecos, usos que se
    gastan como puntos, armadura), lugares de un cuerpo (manos, cuerpo, cinturón, espalda) en los
    que caben los objetos por etiquetas, los huecos que los llenan, valores que salen de los
    objetos (la carga, `{ sum: items.slots }`; la armadura puesta, `{ max: items.armour,
    where: { place.tags: worn } }`); cada parte con su descripción, que se ve como su ayuda donde aparece la hoja.
  values:
    survival:
      name: Supervivencia
      description: Se suma al forrajeo y a los vados; la Supervivencia del grupo es la mejor de los compañeros que no están heridos.
    charisma:
      name: Carisma
      description: Se suma a las tiradas de reacción y ahorra el peaje del Puente de Keld; el de quien habla (Tira), o el mejor.
    pathfinding:
      name: Rastreo
      description: La Orientación del grupo es el mejor Rastreo de los compañeros.
    stealth:
      name: Sigilo
      description: El grupo es tan sigiloso como su compañero más torpe.
    maxHealth:
      name: Salud máxima
      description: La salud más alta que puede tener este compañero; una noche bien comidos en el campamento cura hasta ella.
    health:
      name: Salud
      description: Se pierde en vados, emboscadas y con el frío; una noche bien comidos en el campamento devuelve una.
    wounds:
      name: Heridas
      description: La salud que ha perdido un compañero, calculada a partir de la salud y la salud máxima; una noche bien comidos en el campamento cura una.
    rations:
      name: Raciones
      description: La comida que lleva este compañero; la comida del grupo es la de todos juntos.
    load:
      name: Carga
      description: Los huecos de todo lo que lleva este compañero, contenedores y lo que hay en ellos; por encima de la capacidad, va cargado.
    capacity:
      name: Capacidad
      description: Cuántos huecos lleva un compañero antes de ir cargado, el doble de su salud máxima más 2.
    armour:
      name: Armadura
      description: La mejor armadura que lleva puesta este compañero; tus propias tablas pueden leerla como `acting.values.armour`.
    dread:
      name: Pavor
      description: Lo llenan las luces embrujadas del Bosque Gris; el rito en un santuario lo vacía.
    nerve:
      name: Temple
      description: El dado que es el valor de un compañero, de d4 a d12, que se tira cuando le entra el miedo. El despertar de la Sierpe lo baja un dado, el rito en un santuario lo vuelve a subir.
  groups:
    skills:
      name: Habilidades
      description: En qué es bueno un compañero; el grupo toma lo mejor o lo peor de ellos.
    body:
      name: Cuerpo
      description: Cuánto aguanta un compañero antes de caer.
    gear:
      name: Equipo
      description: Lo que lleva un compañero, para sí y para toda la Compañía.
  conditions:
    wounded:
      name: Herido
      description: Malherido y sangrando. No puede forzar la marcha ni marchar de noche; no cuenta para la Supervivencia del grupo.
    sprained:
      name: Tobillo torcido
      description: No puede seguir andando. El grupo no puede marchar hasta que alguien se lo cure.
    saddle-sore:
      name: Molido de la silla
      description: No aguanta otro día a caballo.
    terrified:
      name: Aterrado
      description: El pavor se ha llenado. No marchará de noche hasta que se le pase (el rito en un santuario vacía el pavor).
    seasick:
      name: Mareado
      description: En un barco con un temple de d6 o menos. No puede forrajear mientras dure; se le pasa al desembarcar.
    burdened:
      name: Cargado
      description: Lleva más de lo que puede; ni marcha forzada ni marcha nocturna hasta que suelte algo.
  items:
    fields:
      slots: { name: Huecos, description: Cuánto sitio ocupa. }
      uses:
        name: Usos
        description: Lo que le queda (las horas de una antorcha); a 0 se gasta uno, y el siguiente empieza lleno.
      armour: { name: Armadura, description: Cuánto protege si se lleva puesto. }
    places:
      hands: Manos
      body: { name: Cuerpo, description: Lo que se lleva puesto. }
      belt: Cinturón
      back: { name: Espalda, description: Una mochila o un fardo a la espalda. }
  relations:
    bond:
      name: Vínculo
      description: Lo unidos que están dos compañeros (o un compañero y un lugar), de 0 a 3.
    home:
      name: Hogar
      description: De dónde viene un compañero.
sheet/company:
  name: La Compañía
  description: |-
    La Compañía en conjunto: su moral, su fatiga, los mercenarios que ha contratado y cuánto aguanta. Sigue igual cuando se unen o caen compañeros: todo viaje la tiene.

    **Enseña:** una hoja de grupo (`partySheet`) junto a la de los personajes: valores de los que salen las características del grupo (`from: { party: morale }`, así que los efectos sobre `party.stats.fatigue` la cambian dentro de sus límites), y un estado del grupo que impide una acción (desanimada, sin marcha forzada), puesto por una tabla y quitado al descansar.
  values:
    morale:
      name: Moral
      description: Cómo aguanta la Compañía. Los lobos, los bandidos, perderse y el hambre la bajan, el santuario y la posada la suben; con 1 o menos la guardia de la noche es inquieta (+1 de fatiga), y convencer a los mercenarios es un d6 igual o menor que ella.
    fatigue:
      name: Fatiga
      description: Lo agotada que está la Compañía. Las marchas largas, las forzadas y las noches inquietas la suben; una noche bien comidos en el campamento y descansar la bajan. Con 2 o más no hay marcha forzada, y al llegar a vuestro Aguante no se puede acampar ni descansar.
    hirelings:
      name: Mercenarios
      description: Espadas a sueldo que viajan con la Compañía. Se unen en la posada, comen con vosotros, se niegan a marchar tras un día de hambre y pueden marcharse si se les habla mal.
    endurance:
      name: Aguante
      description: Cuánta fatiga aguanta la Compañía antes de no poder acampar ni descansar más (solo se puede mientras la fatiga está por debajo).
  conditions:
    shaken:
      name: Desanimada
      description: Perdida en la oscuridad y asustada; no hay marcha forzada hasta que la Compañía descanse.
