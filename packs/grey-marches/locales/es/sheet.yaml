sheet/companion:
  name: Compañero
  description: |-
    Uno de la Compañía: sus habilidades, sus heridas y su equipo, raciones incluidas. Con
    compañeros en el grupo, su Supervivencia, Carisma, Orientación y Sigilo son los suyos,
    come una ración por boca (de las reservas de la Compañía, luego de quien más lleve), las
    heridas retienen a algunos, una cuerda ayuda en el vado y las antorchas arden en las
    marchas nocturnas. Un compañero nuevo sale con dos raciones.

    **Enseña:** su valor principal, la salud (`main: health`), dibujado junto al nombre de
    cada uno en las tarjetas de un combate; una hoja de valores con límites (uno limitado por otro valor,
    `max: '{{self.values.maxHealth}}'`, que se tira para cada compañero nuevo,
    `default: '{{1d3+2}}'`), cada valor mostrado a su manera (las habilidades
    como puntos, la salud como una barra cuyo tono baja con ella, el
    pavor como casillas que se ponen rojas, el temple como un dado que sube de paso de d4 a d12
    (`steps: [4, 6, 8, 10, 12]`, `display: die`), el número de un vínculo como puntos), un valor que sale de otros (las
    heridas, `from: '{{self.values.maxHealth - self.values.health}}'`), grupos con nombre, estados que bloquean una
    acción, una forma de viajar o el propio viaje, un estado que se da por unas rondas de un
    combate (_Aturdido_, `lasts: rounds`), estados que se cumplen por sí solos (`when:`:
    _Aterrado_ mientras el pavor está lleno, _Mareado_ mientras el grupo viaja en barco, leyendo el
    mundo, _Cargado_ mientras la carga pasa de la capacidad), tipos de relación (un vínculo con un
    número, un hogar) y objetos (`items:`): campos que tiene todo objeto (huecos, usos que se
    gastan como puntos, armadura), lugares de un cuerpo (manos, cuerpo, cinturón, espalda) en los
    que caben los objetos por etiquetas, los huecos que los llenan, valores que salen de los
    objetos (la carga, `{ sum: items.slots }`, que se ve frente a la capacidad,
    `of: '{{self.values.capacity}}'`, ámbar al llegar a ella y roja al pasarla; la armadura
    puesta, `{ max: items.armour, where: { place.tags: worn } }`), lugares que no admiten más de
    su sitio (`over: refuse`: un lugar lleno no se ofrece y lo que se da va a la mochila), un
    sitio en total (`room: '{{self.values.capacity * 2}}'`: cargado pasada la capacidad, parado
    al doble), lo que no cabe esperando al jugador (`full: ask`: el viaje espera a que haga
    sitio), lo que lleva un compañero nuevo (`start: { ration: 2 }`)
    y cómo se reparte entre ellos lo que gasta el grupo (`share: even`: de quien más lleve);
    su posición (el renombre, y un rango como puntos, que suben las reglas), un lugar de mañas
    (`takes: { item.tags: knack }`, que no se carga y se muestra como cartas) y valores hechos
    de lo que hay en él (`woodwise`, que leen las reglas como `party.highest.values.woodwise`),
    un estado que se da hasta su próximo turno (_En guardia_, `lasts: turns`);
    cada parte con su descripción, que se ve como su ayuda donde aparece la hoja.
  values:
    survival:
      name: Supervivencia
      description: Se suma al forrajeo y a los vados; la Supervivencia del grupo es la mejor de los compañeros que no están heridos.
    charisma:
      name: Carisma
      description: Se suma a las tiradas de reacción y ahorra el peaje del Puente de Keld; el de quien habla (Tira), o el mejor.
    pathfinding:
      name: Rastreo
      description: La Orientación del grupo es el mejor Rastreo de los compañeros.
    stealth:
      name: Sigilo
      description: El grupo es tan sigiloso como su compañero más torpe.
    maxHealth:
      name: Salud máxima
      description: La salud más alta que puede tener este compañero, tirada cuando se une (1d3+2); una noche bien comidos en el campamento cura hasta ella.
    health:
      name: Salud
      description: Se pierde en vados, emboscadas y con el frío; una noche bien comidos en el campamento devuelve una.
    wounds:
      name: Heridas
      description: La salud que ha perdido un compañero, calculada a partir de la salud y la salud máxima; una noche bien comidos en el campamento cura una.
    load:
      name: Carga
      description: Los huecos de todo lo que lleva este compañero, contenedores y lo que hay en ellos; por encima de la capacidad, va cargado.
    capacity:
      name: Capacidad
      description: Cuántos huecos lleva un compañero antes de ir cargado, el doble de su salud máxima más 2.
    armour:
      name: Armadura
      description: La mejor armadura que lleva puesta este compañero; tus propias tablas pueden leerla como `acting.values.armour`.
    dread:
      name: Pavor
      description: Lo llenan las luces embrujadas del Bosque Gris; el rito en un santuario lo vacía.
    nerve:
      name: Temple
      description: El dado que es el valor de un compañero, de d4 a d12, que se tira cuando le entra el miedo. El despertar de la Sierpe lo baja un dado, el rito en un santuario lo vuelve a subir.
    renown:
      name: Renombre
      description: Lo que cuentan las Marcas de un compañero; lo gana con los combates ganados en pie, el rito de la Luna Ascua y la última tumba. Al llegar al triple de su rango, sube.
    rank:
      name: Rango
      description: Cuánto ha subido un compañero, de 1 a 5; cada rango da más salud, una habilidad o una maña.
    woodwise:
      name: Conocedor del bosque
      description: 1 con la maña Conocedor del bosque.
    pathfinder:
      name: Baqueano
      description: 1 con la maña Baqueano.
    shieldwall:
      name: Muro de escudos
      description: 1 con la maña Muro de escudos.
  groups:
    skills:
      name: Habilidades
      description: En qué es bueno un compañero; el grupo toma lo mejor o lo peor de ellos.
    body:
      name: Cuerpo
      description: Cuánto aguanta un compañero antes de caer.
    gear:
      name: Equipo
      description: Lo que lleva un compañero, para sí y para toda la Compañía.
    standing:
      name: Posición
      description: Su renombre, su rango y las mañas que ha aprendido.
  conditions:
    braced:
      name: En guardia
      description: Tras su escudo hasta su próximo turno; el enemigo que va a por él golpea peor.
      told:
        gains: '{{name}} se cubre tras el escudo'
        loses: '{{name}} baja el escudo'
    wounded:
      name: Herido
      description: Malherido y sangrando. No puede forzar la marcha ni marchar de noche; no cuenta para la Supervivencia del grupo.
      told:
        gains: '{{name}} sangra por una herida'
        loses: '{{name}} deja de sangrar'
    sprained:
      name: Tobillo torcido
      description: No puede seguir andando. El grupo no puede marchar hasta que alguien se lo cure.
    saddle-sore:
      name: Molido de la silla
      description: No aguanta otro día a caballo.
    terrified:
      name: Aterrado
      description: El pavor se ha llenado. No marchará de noche hasta que se le pase (el rito en un santuario vacía el pavor).
    seasick:
      name: Mareado
      description: En un barco con un temple de d6 o menos. No puede forrajear mientras dure; se le pasa al desembarcar.
    rattled:
      name: Aturdido
      description: Sacudido por un golpe fuerte; sus propios golpes aciertan peor durante una o dos rondas del combate.
      told:
        gains: '{{name}} se tambalea'
        loses: '{{name}} se recompone'
    dragged-down:
      name: Derribado
      description: Tirado al suelo por un lobo; el compañero pierde su siguiente turno en el combate.
      told:
        gains: '{{name}} cae al suelo, arrastrado'
        loses: '{{name}} se levanta'
    burdened:
      name: Cargado
      description: Lleva más de lo que puede; ni marcha forzada ni marcha nocturna hasta que suelte algo.
  items:
    fields:
      slots: { name: Huecos, description: Cuánto sitio ocupa. }
      uses:
        name: Usos
        description: Lo que le queda (las horas de una antorcha); a 0 se gasta uno, y el siguiente empieza lleno.
      armour: { name: Armadura, description: Cuánto protege si se lleva puesto. }
      wear:
        name: Desgaste
        description: El desgaste que le queda a una pieza de armadura, un dado; tras un combate se tira, y un 1–2 lo baja un escalón (un d4 que saca 1–2 queda destrozado).
    places:
      hands: Manos
      body: { name: Cuerpo, description: Lo que se lleva puesto. }
      belt: Cinturón
      back: { name: Espalda, description: Una mochila o un fardo a la espalda. }
      knacks:
        name: Mañas
        description: Lo que un compañero ha aprendido en el camino, cada una una carta.
  relations:
    bond:
      name: Vínculo
      description: Lo unidos que están dos compañeros (o un compañero y un lugar), de 0 a 3.
    home:
      name: Hogar
      description: De dónde viene un compañero.
sheet/company:
  name: La Compañía
  description: |-
    La Compañía en conjunto: su moral, su fatiga, los mercenarios que ha contratado, cuánto aguanta, el forraje de los caballos, su leyenda y sus reservas de raciones. Sigue igual cuando se unen o caen compañeros: todo viaje la tiene.

    **Enseña:** una hoja de grupo (`partySheet`) junto a la de los personajes: valores de los que salen las características del grupo (`from: { party: morale }`, así que los efectos sobre `party.stats.fatigue` la cambian dentro de sus límites), una provisión como un simple valor (el forraje, `party.values.fodder`, que se ve como `6 / 12`), una pista de progreso (la leyenda, diez casillas de cuatro marcas, `display: ticks`), objetos propios del grupo con los que empieza (seis raciones, `items: { start: { ration: 6 } }`), que se gastan antes que los de sus compañeros (`party.items.ration`), y un estado del grupo que impide una acción (desanimada, sin marcha forzada), puesto por una tabla y quitado al descansar; su valor principal, la moral (`main: morale`), que se dibuja con el grupo de un vistazo.
  values:
    morale:
      name: Moral
      description: Cómo aguanta la Compañía. Los lobos, los bandidos, perderse y el hambre la bajan, el santuario y la posada la suben; con 1 o menos la guardia de la noche es inquieta (+1 de fatiga), y convencer a los mercenarios es un d6 igual o menor que ella.
    fatigue:
      name: Fatiga
      description: Lo agotada que está la Compañía. Las marchas largas, las forzadas y las noches inquietas la suben; una noche bien comidos en el campamento y descansar la bajan. Con 2 o más no hay marcha forzada, y al llegar a vuestro Aguante no se puede acampar ni descansar.
    silver:
      name: Plata
      description: La bolsa de la Compañía, para el pasaje de Brenna y las habitaciones de la posada.
    escort-offer:
      name: Escolta ofrecida
      description: La plata que ofrece quien está aquí por una escolta a Fuerte Keld.
    escort:
      name: Paga de la escolta
      description: La plata que paga en Fuerte Keld quien va escoltado por la Compañía. Come con vosotros por el camino.
    hirelings:
      name: Mercenarios
      description: Espadas a sueldo que viajan con la Compañía. Se unen en la posada, comen con vosotros, se niegan a marchar tras un día de hambre y pueden marcharse si se les habla mal.
    endurance:
      name: Aguante
      description: Cuánta fatiga aguanta la Compañía antes de no poder acampar ni descansar más (solo se puede mientras la fatiga está por debajo).
    fodder:
      name: Forraje
      description: Días de forraje para los caballos, tantos como pueden cargar; se gasta uno al acabar cada día a caballo, y nunca baja de 0. En el mercado se compra más.
    legend:
      name: Leyenda
      description: Lo que cuentan las Marcas de la Compañía, marca a marca. El rito de la Luna Ascua marca una; la última tumba de los Deep Barrows, una casilla entera.
  conditions:
    shaken:
      name: Desanimada
      description: Perdida en la oscuridad y asustada; no hay marcha forzada hasta que la Compañía descanse.
sheet/this-place:
  name: Este lugar
  description: |-
    Lo que un mapa de las Marcas guarda como suyo: cuán inquietos están sus muertos. Forzar una puerta de los Túmulos Hondos los agita, y una vez agitados el ruido de la siguiente se oye siempre. Cada mapa tiene el suyo, que se guarda cuando la Compañía se va y vuelve a estar cuando regresa.

    **Enseña:** una hoja propia de cada mapa (`mapSheet`): un valor que guarda cada mapa (`map.values.unrest`), tirado para cada mapa la primera vez que se juega (`default: '{{1d2-1}}'`), subido por el efecto de una acción (`map.values.unrest: 1`), un estado del mapa que se cumple por sí solo (`stirring`, `when: { self.values.unrest: { gte: 2 } }`) y una entrada de tabla que lo lee (`unless: { map.conditions: stirring }`).
  values:
    unrest:
      name: Muertos inquietos
      description: Cuán agitados están los muertos de este lugar, de 0 a 3. Cada puerta forzada aquí suma 1; con 2 o más se agitan.
  conditions:
    stirring:
      name: Los muertos se agitan
      description: Los muertos de este lugar están atentos a cada sonido; el ruido de una puerta forzada aquí se oye siempre.
