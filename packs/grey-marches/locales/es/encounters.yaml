encounter:
  name: ¿Quién va?
  description: |-
    **A quién os encontráis**: depende del terreno, la región, el peligro del hex y la hora del día.

    **Enseña:**

    - Una tabla para dos comprobaciones, de día y de noche, que distingue el contexto `timeOfDay` de los bindings
    - Condiciones sobre `terrain`, `region`, `tags`, `danger`, `season` y las lunas (`moons.ember: full`)
    - El `unless` de una entrada: la patrulla del Valle, nunca de noche
    - `once`: la Sierpe, solo con `danger` 5, en el corazón del Bosque Gris; `pause`: el viaje se detiene cuando sale
    - El reloj del mundo: cuando _The Greywood Wyrm wakes_ está lleno (`world.clocks.the-greywood-wyrm-wakes: { gte: 6 }`), la Sierpe recorre el bosque desde peligro 3
    - Cascadas a _Reacción_ y a un generador
    - `set` de un valor para la tabla siguiente (`reactionModifier`) y de una característica del grupo (`morale`)
  entries:
    hunt: 'Cuernos en la oscuridad: la Cacería Ascua cabalga bajo la luna llena; están {{result}}'
    wyrm: La Sierpe del Bosque Gris se despliega sobre el sendero. No volverá.
    lights: Luces pálidas flotan entre los árboles y dicen vuestros nombres
    patrol: 'Una patrulla del Valle: están {{result}}'
    wolves: '{{1d4+2}} lobos grises: están {{result}}'
    traveller: 'Por el camino os cruzáis con {{result}}'
    bandits: 'Bandidos de las Colinas Huecas: están {{result}}'
    tracks: Solo huellas, y la sensación de que os vigilan
reaction:
  name: Reacción
  description: |-
    Cómo os recibe alguien, de **hostil** a **deseoso de ayudar**.

    **Enseña:**

    - Una característica del grupo en la tirada: `{{charisma}}`
    - Un modificador que pone la entrada que la tira: `reactionModifier`
    - Ventaja
    - Rangos negativos
  entries:
    hostile: hostiles
    wary: recelosos
    neutral: dispuestos a hablar
    friendly: amistosos
    helpful: deseosos de ayudar
npc:
  name: Alguien en el camino
  description: |-
    Un nombre, un oficio, qué quiere y su fuerza.

    **Enseña:**

    - Un **generador**: campos de tablas y de dados (`4d6kh3`: las 3 mejores)
    - Campos que encajan: lo que quiere depende de quién es (_Deseos_ lee el `role.id` del campo del oficio)
    - Una plantilla que los une
  template: '{{name}}, {{role}} que {{want}} (fuerza {{might}})'
rumour:
  name: Un rumor
  description: |-
    Quién lo cuenta y qué dice.

    **Enseña:** Un generador dentro de otro: `{{npc.name}}` y `{{npc.role}}` leen los campos de _Alguien en el camino_
  template: '{{npc.name}}, {{npc.role}}, jura que {{what}}.'
npc-names:
  name: Nombres de las Marcas
  description: |-
    Nombres de la gente de las Marcas.

    **Enseña:** Una tabla que usan muchas otras: _Alguien en el camino_, la posada, _Deserción_
npc-roles:
  name: Oficios
  description: |-
    Quién es alguien.

    **Enseña:**

    - Pesos: buhoneros, peregrinos y cazadores son comunes; desertores y brujas, raros
    - `set: { id: … }`: el id del oficio, que _Deseos_ lee en _Alguien en el camino_ (`role.id`) sea cual sea el idioma
  entries:
    pedlar: buhonero
    pilgrim: peregrino
    hunter: cazador
    deserter: desertor
    witch: bruja de los setos
npc-wants:
  name: Deseos
  description: |-
    Qué quiere alguien, de acuerdo con quién es: la tira el generador _Alguien en el camino_ después de su oficio.

    **Enseña:** Condiciones sobre un campo anterior del generador: `role.id` (un desertor nunca pide escolta hasta el fuerte; peregrinos, desertores y brujas tienen deseos propios)
  entries:
    escort: busca escolta hasta Fuerte Keld
    trade: tiene algo que cambiar
    lost: está perdido y asustado
    news: quiere noticias del sur
    shrine: va camino del santuario del Bosque Gris
    hiding: huye de Fuerte Keld y os ruega que no digáis nada
    herbs: recoge hierbas y os prepara un cordial a cambio de una canción
rumours:
  name: Rumores (d66)
  description: |-
    Rumores que se oyen en el camino y en la posada.

    **Enseña:** Dados **d66**: dos dados leídos como decenas y unidades (11–66), con rangos como `11-16`
  entries:
    wyrm: una sierpe duerme bajo el Bosque Gris
    salt: el Lago Salado fue una ciudad
    keld: en Fuerte Keld no pagan a los soldados desde hace un año
    stones: las piedras erguidas se mueven en el solsticio
    ferry: el barquero cobra en secretos
    hills: las colinas están huecas, y algo vive dentro
