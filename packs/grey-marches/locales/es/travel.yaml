travel-rules/default:
  actions:
    forage:
      name: Buscar comida
      description: 'Tres horas buscando comida (una vez al día): el resto de la marcha del día va a la mitad. Solo en bosque, bosque denso, llanura, cultivos, brezal y marisma: se tira 1d6 + Supervivencia (dos veces, la mejor); de 4 a 6 da comida para un día, 7 o más para 2 a 4 días. En otros terrenos no hay nada que encontrar.'
      nothing: 'no hay nada que buscar en {terrain}: solo los bosques, campos, brezales y marismas dan comida'
  checks:
    WEATHER_CHECK_REQUIRED:
      name: Clima
      description: Se tira cada alba, según la estación.
    NAVIGATION_CHECK_REQUIRED:
      name: Perderse
      description: Cada alba fuera de caminos y ríos (no en barca). La Orientación ayuda; la niebla lo complica.
    ENCOUNTER_CHECK_REQUIRED:
      name: Encuentro
      description: Al entrar en un hex con peligro (el Bosque Gris, las Hollow Hills), salvo si llegas por camino.
    TOLL_CHECK_REQUIRED:
      name: Peaje
      description: Keld Bridge, llegando por el camino.
    FORD_CHECK_REQUIRED:
      name: Vado
      description: Cruzar el río a pie o a caballo.
    SHRINE_CHECK_REQUIRED:
      name: Santuario
    LANDMARK_CHECK_REQUIRED:
      name: Lugar señalado
      description: Describe tú el lugar (o tira en un oráculo) y pulsa Continuar.
    CAMP_ENCOUNTER_CHECK_REQUIRED:
      name: Encuentro nocturno
      description: Al acampar donde el peligro es 2 o más.
    HUNGER_CHECK_REQUIRED:
      name: Hambre
      description: Al acampar sin comida. La moral decide cómo va.
    FORAGE_CHECK_REQUIRED:
      name: Buscar comida
      description: Se tira al buscar comida en bosques, campos, brezales o marismas.
bindings/default:
  stats:
    charisma:
      name: Carisma
      description: Se suma a las tiradas de reacción.
    survival:
      name: Supervivencia
      description: Se suma a buscar comida y a los vados.
    morale:
      name: Moral
      description: Baja con lobos, bandidos, perderse y el hambre; sube en el santuario y la posada.
    navigation:
      name: Orientación
      description: Se suma a la tirada de perderse.
