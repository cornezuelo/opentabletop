travel-rules/default:
  values:
    lost:
      name: Perdidos
      description: 'El grupo ha perdido el rumbo (o no puede cruzar): no se viaja más hoy.'
    snowbound:
      name: Nieve profunda
      description: Demasiado profunda hoy para los caballos.
    hungry:
      name: Pasaron hambre
      description: El grupo acabó el día sin comida suficiente.
    torchlit:
      name: A la luz de las antorchas
      description: Seguir marchando pasado el anochecer, hasta medianoche.
    refusing:
      name: Los mercenarios se niegan a marchar
      description: Hasta que alguien los convenza (Hablar con los mercenarios).
    skunked:
      name: No picó nada
      description: Un día de pesca para nada.
  actions:
    march:
      name: Marchar
      description: 'Marchar por la ruta: de día durante 8 horas, o tras una marcha nocturna a la luz de las antorchas hasta medianoche. Hasta el destino, un hex o tres hexes.'
      params:
        until:
          name: Hasta dónde
          choices:
            destination: Hasta el destino
            hex: Un hex
            '3': Tres hexes
    camp:
      name: Acampar
      description: 'Termina el día: las comprobaciones de la noche, y despertáis al alba. Una noche tras un día con comida suficiente quita 1 de fatiga y devuelve 1 de salud a cada compañero; con la moral en 1 o menos, la guardia es inquieta: +1 de fatiga. Solo con comida y fatiga por debajo de vuestro Aguante: si no, la noche pasa a la intemperie, sin descanso.'
    rest:
      name: Descansar
      description: Dos horas sin marchar; quita 1 de fatiga y la Compañía deja de estar desanimada. Solo de día, con comida y fatiga por debajo de vuestro Aguante.
    forage:
      name: Buscar comida
      description: 'Tres horas buscando comida (una vez al día, de día): el resto de la marcha del día va a la mitad. Solo en bosque, bosque denso, llanura, cultivos, brezal y marisma: se tira 1d6 + Supervivencia (dos veces, la mejor); de 4 a 6 da comida para un día, 7 o más para 2 a 4 días. En otros terrenos no hay nada que encontrar. No con tormenta.'
      nothing: 'no hay nada que buscar en {terrain}: solo los bosques, campos, brezales y marismas dan comida'
    eat:
      name: Comer
      description: 'Al final de cada día, acampando o no: 1 de comida por boca (cada compañero, o 1 para un grupo sin ellos), 1 más por cada mercenario, y 1 de forraje a caballo. Sin nada que comer, el grupo pasa hambre.'
    forced-march:
      name: Marcha forzada
      description: 'Apretar el paso: lo que queda de marcha hoy va la mitad más rápido, pero +1 de fatiga, y el grupo sigue marchando hasta su destino. Solo de día con horas de marcha por delante, con fatiga menor de 2 y la Compañía sin desanimar, una vez al día.'
    rite:
      name: Rito de la Luna Ascua
      description: 'En un santuario del camino, solo con la Luna Ascua llena: dos horas de oración. Moral +2, fuera la fatiga, se vacía el pavor de cada compañero y su temple sube un dado.'
    grumble:
      name: Los mercenarios refunfuñan
      description: Tras un día sin comida suficiente, los mercenarios se niegan a marchar.
      do:
        sulk:
          say: Los mercenarios se sientan junto al fuego apagado y no cargan con sus fardos.
    parley:
      name: Hablar con los mercenarios
      description: 'Una hora de charla: tira un d6. Si saca vuestra moral o menos, vuelven a marchar; si no, uno se marcha y el resto os sigue a regañadientes.'
    night-march:
      name: Marcha nocturna
      description: 'Desde el anochecer, encender las antorchas y seguir marchando hasta medianoche, pero +1 de fatiga (y +1 más al acabar el día si se marchó más de sus 8 horas); cada hex en el que se entra a oscuras fuera del camino puede haceros perder o traer un encuentro nocturno. Una vez al día, no con tormenta, con fatiga menor de 4.'
    tale:
      name: Historias del camino
      description: 'Una vez por viaje, tras 50 km de camino, desde el anochecer: historias junto al fuego hasta la guardia de en medio. Moral +1.'
    carter:
      name: Ir con un carretero
      description: 'Por un camino, de día: un carretero que va en vuestra dirección os lleva dos hexes por la ruta en dos horas. Una vez al día.'
    fish:
      name: Pescar
      description: 'Junto a un lago, el mar o en la costa, de día: dos horas con el sedal, una vez al día. Tira un d6: si saca vuestra Supervivencia o menos, pescado para dos días; si no, de 1 a 3, para uno; si no, no pica nada.'
      do:
        skunked:
          say: 'Ni una picada en todo el día: esta noche la Compañía come de sus fardos.'
    market:
      name: Día de mercado
      description: 'En un pueblo con mercado, el día de Mercado (o el día de mercado del reloj del mundo): dos horas de trueque. Comida +3 y forraje +2, una vez al día.'
    tend:
      name: Curar a los heridos
      description: 'Una hora vendando heridas y tobillos, de día, mientras algún compañero esté herido o con un tobillo torcido. Quien actúa necesita Supervivencia 2 o más: entonces se curan las heridas y los tobillos de todos los compañeros.'
    ferry:
      name: Tomar el transbordador
      description: 'En el transbordador de Brenna, de día: pagadle un día de comida y zarpa enseguida, o esperad a su travesía de la tarde (como mucho, hasta el anochecer). Después estáis a flote en el Saltmere, en barca.'
      params:
        fare:
          name: ¿Cómo le pagáis a Brenna?
          description: Por un día de comida zarpa ahora; si no, cruza por la tarde.
          choices:
            food: Un día de comida, ahora
            wait: Esperar a su travesía
      do:
        casts-off:
          say: 'Brenna suelta amarras ({{party.resources.food}} de comida en vuestros fardos).'
        afloat:
          pause: 'A flote en el Saltmere: elegid un hex del lago al que navegar y luego Desembarcar en la otra orilla.'
    ashore:
      name: Desembarcar
      description: 'Media hora para dejar la barca en la orilla: a pie desde ahora, para marchar a tierra.'
    delve:
      name: Explorar la ruina
      description: 'En una ruina, de día: tres horas registrándola y, después, lo que guarda y lo que la protege, tirado en _Explorar una ruina_. Una vez al día.'
    wyrm-wakes:
      name: La Sierpe despierta
      description: 'Cuando la Sierpe del Bosque Gris despierta durante un viaje (se llena su reloj): +1 de pavor a cada compañero y su temple baja un dado, y en el Bosque Gris el viaje se detiene.'
      do:
        stirs:
          say: 'A lo lejos, algo enorme se agita, y los pájaros del Bosque Gris enmudecen.'
        awake:
          pause: 'La Sierpe está despierta, y este es su bosque.'
    stormy-dawn:
      name: Un alba de tormenta
      description: Un alba de tormenta agota a la Compañía antes de ponerse en marcha. Fatiga +1.
      do:
        worn:
          say: 'La tormenta agota a la Compañía antes de ponerse en marcha.'
    out-of-the-wood:
      name: Fuera del Bosque Gris
      description: Al salir del Bosque Gris, los árboles se abren y se levantan los ánimos. Moral +1.
      do:
        thin:
          say: 'Los árboles se abren, y se levantan los ánimos.'
  checks:
    WEATHER_CHECK_REQUIRED:
      name: Clima
      description: Se tira cada alba, según la estación.
    OMENS:
      name: Presagios
      description: Cada alba en el camino, una carta de los Presagios del camino.
    NAVIGATION_CHECK_REQUIRED:
      name: Perderse
      description: Cada alba fuera de caminos y ríos (no en barca), salvo si una tormenta retiene a la Compañía. La Orientación ayuda; la niebla lo complica.
    ENCOUNTER_CHECK_REQUIRED:
      name: Encuentro
      description: Al entrar de día en un hex cuyo peligro supera vuestro Sigilo (el Bosque Gris, las Colinas Huecas), salvo si llegas por camino; o al descansar donde el peligro es 3 o más.
    TOLL_CHECK_REQUIRED:
      name: Peaje
      description: Keld Bridge, llegando por el camino.
    FORD_CHECK_REQUIRED:
      name: Vado
      description: Cruzar el río a pie o a caballo.
    SHRINE_CHECK_REQUIRED:
      name: Santuario
      description: Un santuario junto al camino, la primera vez que el viaje pasa por él. El viaje se detiene tras la tirada; pulsa Continuar para seguir.
    LANDMARK_CHECK_REQUIRED:
      name: Lugar señalado
      description: Describe tú el lugar (o tira en un oráculo) y pulsa Continuar.
    CAMP_ENCOUNTER_CHECK_REQUIRED:
      name: Encuentro nocturno
      description: Al acampar donde el peligro es 2 o más, o al entrar a oscuras en un hex con peligro, fuera del camino. Un vigía sigiloso (Sigilo 2 o más) mantiene oculto el campamento donde el peligro es menor de 3.
    HAUNTED_WATCH:
      name: Luces en la guardia de en medio
      description: Dormidos en el campamento donde el peligro es 3 o más, sin nadie de guardia, las luces encantadas se acercan en la guardia de en medio. El pavor de cada compañero +1.
    NIGHT_NAVIGATION_CHECK_REQUIRED:
      name: Perdidos en la oscuridad
      description: En cada hex en el que se entra pasado el anochecer, fuera del camino. A oscuras es fácil perder el rumbo.
    HUNGER_CHECK_REQUIRED:
      name: Hambre
      description: Un día que acaba sin comida, y una noche a la intemperie. La moral decide cómo va.
    FORAGE_CHECK_REQUIRED:
      name: Buscar comida
      description: Se tira tras tres horas buscando comida en bosques, campos, brezales o marismas.
    HUNGRY_DAY:
      name: Sin comida suficiente
      description: Un día sin comida suficiente cansa al grupo, acampe o no.
    FISHING_CHECK_REQUIRED:
      name: Pesca
      description: Se tira tras dos horas pescando.
    LONG_DAY:
      name: Un día largo
      description: Un día en que se marcha más de sus 8 horas (una marcha nocturna tras un día completo) cuesta 1 de fatiga al acabar.
    HOMECOMING:
      name: En casa
      description: Entrar en el hogar de uno de los compañeros (su región, lugar o hex). Moral +1.
    SADDLE_SORE:
      name: Molidos de la silla
      description: Un día a caballo de más de sus 8 horas deja molidos a todos los compañeros, que no pueden montar hasta pasar una noche fuera de la silla.
    HOMESICK:
      name: Morriña
      description: Los días 10, 20 y 30 de un viaje, el grupo echa de menos su casa. Moral −1.
    IN_CIRCLES:
      name: Dando vueltas
      description: Entrar por tercera vez en un mismo hex durante un viaje. Moral −1.
  modes:
    foot:
      name: A pie
    horse:
      name: A caballo
    boat:
      name: En barca
    cart:
      name: En carro
      description: Lento y seguro, y solo por los caminos.
  resources:
    food:
      name: Comida
    fodder:
      name: Forraje
bindings/default:
  stats:
    charisma:
      name: Carisma
      description: Se suma a las tiradas de reacción; en el puente de Keld, un d6 que saque esto o menos os ahorra el peaje. Con compañeros, el Carisma de quien hable (Tira), o el mejor.
    survival:
      name: Supervivencia
      description: Se suma a buscar comida y a los vados. Con compañeros, la mejor Supervivencia de los que no están heridos.
    morale:
      name: Moral
      description: Baja con lobos, bandidos, perderse y el hambre; sube en el santuario y la posada.
    navigation:
      name: Orientación
      description: Se suma a la tirada de perderse. Con compañeros, su mejor Rastreo.
    endurance:
      name: Aguante
      description: El grupo puede acampar y descansar mientras su fatiga esté por debajo de esto.
    stealth:
      name: Sigilo
      description: Al entrar de día en un hex, solo hay encuentro donde el peligro supera esto. Con compañeros, el del más torpe.
    mouths:
      name: Bocas
      description: Cuántos comen cada día (además de los mercenarios). Con compañeros, cuántos son.
    wounded:
      name: Heridos
      description: Cuántos compañeros están heridos.
    sprained:
      name: Torceduras
      description: Cuántos compañeros tienen un tobillo torcido.
    fatigue:
      name: Fatiga
      description: Sube con cada día sin comida suficiente, los días largos, los vados y el hambre; baja tras una noche bien comidos en el campamento, un descanso o una oración en el santuario.
    hirelings:
      name: Mercenarios
      description: Espadas de alquiler que viajan con el grupo. Se unen en la posada y pueden desertar cuando no hay comida.
  roles:
    guide:
      name: Guía
      description: Abre el camino. Con Rastreo 2 o más, la tirada de perderse va con ventaja.
    lookout:
      name: Vigía
      description: Monta guardia de noche. Con Sigilo 2 o más, el campamento sigue oculto donde el peligro es menor de 3.
  reads:
    danger:
      name: Peligro
      description: 'Lo peligroso que es el hex, un valor del hex o de su región (el Bosque Gris: 2 en el borde, hasta 5 en su corazón).'
    icon.guards:
      name: Guardias
      description: 'Un valor del icono del lugar en el mapa: cuántos guardias vigilan sus puertas (0 en Vado Ceniza, 2 en Fuerte Keld).'
    token.fare:
      name: Pasaje
      description: 'Un valor de un token: lo que cobra Brenna la barquera, en plata.'
    timeOfDay:
      name: Hora del día
      description: 'day o night (día o noche): los bindings se lo dan a la tabla de encuentros (night al acampar).'
    reactionModifier:
      name: Modificador de reacción
      description: Lo suma a la siguiente tirada de reacción la entrada que la tira (lobos −2, la cacería −3).
    fordModifier:
      name: Modificador del vado
      description: Lo suma el clima a la tirada del vado de hoy (lluvia −1, helada +1).
    fordImpossible:
      name: Hoy no se cruza
      description: true cuando una tormenta hace imposible el vado el resto del día.
