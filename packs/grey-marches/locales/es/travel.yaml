travel-rules/default:
  values:
    lost:
      name: Perdidos
      description: 'El grupo ha perdido el rumbo (o no puede cruzar): no se viaja más hoy.'
  actions:
    camp:
      name: Acampar
      description: 'Termina el día: las comprobaciones de la noche, y despertáis al alba. Una noche tras un día con comida suficiente quita 1 de fatiga.'
    rest:
      name: Descansar
      description: Dos horas sin marchar. Quita 1 de fatiga.
    forage:
      name: Buscar comida
      description: 'Tres horas buscando comida (una vez al día): el resto de la marcha del día va a la mitad. Solo en bosque, bosque denso, llanura, cultivos, brezal y marisma: se tira 1d6 + Supervivencia (dos veces, la mejor); de 4 a 6 da comida para un día, 7 o más para 2 a 4 días. En otros terrenos no hay nada que encontrar. No con tormenta.'
      nothing: 'no hay nada que buscar en {terrain}: solo los bosques, campos, brezales y marismas dan comida'
    eat:
      name: Comer
      description: 'Al final de cada día, acampando o no: 1 de comida, y 1 de forraje a caballo. Sin nada que comer, el grupo pasa hambre.'
  checks:
    WEATHER_CHECK_REQUIRED:
      name: Clima
      description: Se tira cada alba, según la estación.
    NAVIGATION_CHECK_REQUIRED:
      name: Perderse
      description: Cada alba fuera de caminos y ríos (no en barca). La Orientación ayuda; la niebla lo complica.
    ENCOUNTER_CHECK_REQUIRED:
      name: Encuentro
      description: Al entrar en un hex con peligro (el Bosque Gris, las Hollow Hills), salvo si llegas por camino.
    TOLL_CHECK_REQUIRED:
      name: Peaje
      description: Keld Bridge, llegando por el camino.
    FORD_CHECK_REQUIRED:
      name: Vado
      description: Cruzar el río a pie o a caballo.
    SHRINE_CHECK_REQUIRED:
      name: Santuario
      description: Un santuario junto al camino. El viaje se detiene tras la tirada; pulsa Continuar para seguir.
    LANDMARK_CHECK_REQUIRED:
      name: Lugar señalado
      description: Describe tú el lugar (o tira en un oráculo) y pulsa Continuar.
    CAMP_ENCOUNTER_CHECK_REQUIRED:
      name: Encuentro nocturno
      description: Al acampar donde el peligro es 2 o más.
    HUNGER_CHECK_REQUIRED:
      name: Hambre
      description: Al acampar sin comida. La moral decide cómo va.
    FORAGE_CHECK_REQUIRED:
      name: Buscar comida
      description: Se tira al buscar comida en bosques, campos, brezales o marismas.
    HUNGRY_DAY:
      name: Sin comida suficiente
      description: Un día sin comida suficiente cansa al grupo, acampe o no.
  modes:
    foot:
      name: A pie
    horse:
      name: A caballo
    boat:
      name: En barca
  resources:
    food:
      name: Comida
    fodder:
      name: Forraje
bindings/default:
  stats:
    charisma:
      name: Carisma
      description: Se suma a las tiradas de reacción.
    survival:
      name: Supervivencia
      description: Se suma a buscar comida y a los vados.
    morale:
      name: Moral
      description: Baja con lobos, bandidos, perderse y el hambre; sube en el santuario y la posada.
    navigation:
      name: Orientación
      description: Se suma a la tirada de perderse.
    fatigue:
      name: Fatiga
      description: Sube con cada día sin comida suficiente, los vados y el hambre; baja tras una noche bien comidos en el campamento, un descanso o una oración en el santuario.
    hirelings:
      name: Mercenarios
      description: Espadas de alquiler que viajan con el grupo. Se unen en la posada y pueden desertar cuando no hay comida.
  reads:
    danger:
      name: Peligro
      description: 'Lo peligroso que es el hex, un valor del hex o de su región (el Bosque Gris: 2 en el borde, hasta 5 en su corazón).'
    icon.guards:
      name: Guardias
      description: 'Un valor del icono del lugar en el mapa: cuántos guardias vigilan sus puertas (0 en Vado Ceniza, 2 en Fuerte Keld).'
    token.fare:
      name: Pasaje
      description: 'Un valor de un token: lo que cobra Brenna la barquera, en plata.'
    timeOfDay:
      name: Hora del día
      description: 'day o night (día o noche): los bindings se lo dan a la tabla de encuentros (night al acampar).'
    reactionModifier:
      name: Modificador de reacción
      description: Lo suma a la siguiente tirada de reacción la entrada que la tira (lobos −2, la cacería −3).
    fordModifier:
      name: Modificador del vado
      description: Lo suma el clima a la tirada del vado de hoy (lluvia −1, helada +1).
    fordImpossible:
      name: Hoy no se cruza
      description: true cuando una tormenta hace imposible el vado el resto del día.
