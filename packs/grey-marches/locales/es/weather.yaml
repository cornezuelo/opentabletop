weather:
  name: El clima de las Marcas
  description: |-
    El clima de hoy según la estación, **sin memoria**, para tiradas a mano. Los viajes usan _El cielo de las Marcas_, donde hoy sigue a ayer.

    **Enseña:**

    - Un id de tabla construido con el contexto: `weather-{{season}}`
    - Una respuesta por defecto cuando no hay estación
  entries: { grey: Cielo gris }
weather-spring:
  name: Primavera en las Marcas
  description: |-
    El clima de primavera.

    **Enseña:**

    - `2d6`: el centro es común, los extremos raros
    - Valores del día para comprobaciones posteriores: la lluvia da `fordModifier: -1`, la tormenta `fordImpossible`
  entries:
    storm: 'Tormenta: nadie viaja'
    rain: Lluvia constante
    grey: Gris y templado
    bright: Luminoso y despejado
weather-summer:
  name: Verano en las Marcas
  description: |-
    El clima de verano.

    **Enseña:** Pesos en vez de dados
  entries:
    clear: Calor y cielo despejado
    grey: Bochorno gris
    storm: 'Tormenta de verano: nadie viaja'
weather-autumn:
  name: Otoño en las Marcas
  description: |-
    El clima de otoño.

    **Enseña:**

    - Dados Fate: `4dF`, de −4 a +4, casi siempre cerca de 0
    - Rangos negativos
  entries:
    storm: 'Vendaval desde el lago: nadie viaja'
    fog: Niebla espesa
    grey: Frío y gris
    clear: Fresco y despejado
weather-winter:
  name: Invierno en las Marcas
  description: |-
    El clima de invierno.

    **Enseña:** Un valor del día que ayuda: la helada da `fordModifier: 1`
  entries:
    blizzard: 'Ventisca: nadie viaja'
    snow: Nieva
    frost: Helada fuerte
