omens:
  name: Presagios del camino
  description: |-
    Se roba uno **cada alba** en el camino, con la comprobación _Presagios_ de las reglas de viaje de las Marcas (o a mano). Una carta robada desaparece hasta que se acaba el mazo.

    **Enseña:**

    - Un **mazo**: copias de una carta (`count`), que se baraja al vaciarse
    - Un mazo que **resuelve una comprobación** (`OMENS: { resolve: deck.omens }` en los bindings), con lo robado guardado en el Oráculo de la campaña, compartido con lo que se roba a mano
    - Cartas que tiran un generador, con referencias que dicen qué nombran (`generator.npc`), y otra que pone valores (comida)
    - Una tabla de otro pack mediante un alias: `table.twist` → `core/table.twists`
    - `notable: true`: la señal de la Sierpe, un momento importante que se muestra delante aunque nada se detenga
    - **Caras**: cada carta robada se dibuja como carta, con la tinta verde de las Marcas (`face:` en el mazo), cada una con su icono o signo; la señal de la Sierpe en rojo
    - **Textos con estilo**: la señal de la Sierpe dicha en rojo y negrita (`[**…**]{red}`), un rumor en cursiva (`_{{result}}_`)
  cards:
    crows: Los cuervos os siguen todo el día
    rainbow: Un arcoíris sobre el Lago Salado
    stranger: 'Un desconocido en el camino: {{result}}'
    rumour: 'Os llega un rumor: _{{result}}_'
    cache: 'El escondrijo de un cazador: comida para dos días'
    wyrm-sign: '[**Árboles chamuscados y olor a azufre**]{red}'
    twist: 'El camino se vuelve extraño: {{result}}'
hedge-cards:
  name: Las cartas de la bruja de los setos
  description: |-
    Las cartas gastadas con las que lee una bruja de los setos de las Marcas, repartidas por _La lectura de la bruja de los setos_ o robadas a mano.

    **Enseña:**

    - Cartas con **efectos** sobre el grupo y sobre un reloj de progreso, para que las reparta un generador
    - Cartas que salen **de cualquier lado**, una de cada cuatro del revés (`reversible: { chance: 0.25 }`): una carta del revés queda boca abajo y dice su texto **del revés** (`reversed:`), y la tabla del Farol lee de qué lado salió (`when: { reversed: true }`): del revés, extravía a la Compañía y le cuesta moral en vez de dársela
    - Un **dorso** propio (`back:`, un SVG del pack), con las cartas boca abajo en la mesa de cartas antes de darles la vuelta
    - **Caras** que se dan la vuelta también por otro motivo: cada carta sale **boca abajo** mientras la Sierpe está a punto de despertar (`turned` lee el reloj), así que una lectura se ve tan mala como es
  cards:
    lantern: 'El Farol, {{result}}'
    crow: El Cuervo, un aviso que llega tarde
    ford: El Vado, una travesía con un precio
    hearth: El Hogar, una acogida inesperada
    wyrm: La Sierpe, algo antiguo que despierta
    salt: La Sal, una promesa que ata
    thorn: La Espina, un amigo que hiere
  reversed:
    crow: El Cuervo del revés, un aviso atendido a tiempo
    ford: El Vado del revés, una travesía que no debe hacerse
    hearth: El Hogar del revés, una acogida que esconde un cuchillo
    wyrm: La Sierpe del revés, algo antiguo que se agita en sueños
    salt: La Sal del revés, una promesa rota
    thorn: La Espina del revés, una herida que cura una amistad
hedge-lantern:
  name: El Farol
  description: |-
    Lo que significa el Farol de la bruja de los setos: al derecho, un camino seguro a casa (+1 de moral); del revés, una luz que extravía (−1 de moral).

    **Enseña:** una tabla que lee de qué lado salió la carta que la tiró (`when: { reversed: true }`, `unless:`), sin dados: cada vez se cumple una sola fila.
  entries:
    astray: una luz que extravía
    home: un camino seguro a casa
hedge-reading:
  name: La lectura de la bruja de los setos
  description: |-
    Tres cartas que echa una bruja de los setos: lo que te sigue, lo que te espera y lo que debes temer. Lo que dicen se cumple: sus efectos llegan al grupo y al reloj de la Sierpe.

    **Enseña:**

    - Un campo de generador que **roba de un mazo** (`deck: deck.hedge-cards`), con `shuffle: true` en el primero para que cada lectura empiece del mazo entero y nunca repita carta
    - Los `effects` de las cartas sumados por el generador, como los de una tabla
    - Una **tirada** puesta en la mesa: la carta de cada campo en su sitio (`at: [columna, fila]`), la que debes temer cruzada sobre lo que te espera (`across: true`)
  template: |-
    Detrás de ti: {{behind}}
    Delante de ti: {{ahead}}
    Lo que debes temer: {{fear}}
