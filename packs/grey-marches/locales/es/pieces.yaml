pieces/deep-barrows:
  name: Los Túmulos Hondos
  description: |-
    Lo que hay bajo las Barrow-halls: pasillos, criptas y salas inundadas, colocados según el grupo abre cada camino, hasta la última tumba.

    **Enseña:**

    - **Piezas** (`kind: pieces`): formas dibujadas en texto, colocadas por donde va el grupo, giradas para encajar con la puerta por la que llegó
    - `marks`: qué coloca cada marca, agua negra junto al suelo en _El pasillo inundado_
    - `room: true`, con `tags` y `fields`: una cripta jugada como un solo lugar, su peligro leído como `place.danger`
    - `contents`: lo que se tira en una cripta en lugar de `discover.contents`
    - `entry: true`: por qué salidas se puede entrar en una pieza
    - Una salida con valores (`fields: { state: hidden }`): un camino oculto que se encuentra con una comprobación
    - Una puerta colocada cerrada (`fields: { state: barred, bar: '{{1d3}}' }`, su tranca tirada al colocarla, cada puerta la suya): no hay camino hasta que el grupo fuerza esa puerta (_Forzar la puerta_, eligiéndola entre las puertas de aquí), y el ruido puede despertar lo que duerme aquí, seguro con la tranca más pesada
    - Una salida a un mapa nuevo (`newMap`): _Una escalera más abajo_ crea _Los túmulos más hondos_, un mapa propio colocado pieza a pieza como estos, con su propia hoja (_Este lugar_)
  pieces:
    stair-foot: { name: El pie de la escalera }
    passage: { name: Pasillo }
    flooded: { name: El pasillo inundado }
    crypt: { name: Cripta, exits: { C: { name: Una grieta tras los huesos } } }
    tomb: { name: La última tumba }
    barred-passage: { name: Una puerta atrancada, exits: { B: { name: Una puerta atrancada } } }
    stair-down:
      name: Una escalera más abajo
      exits: { B: { name: Una escalera más abajo, newMap: { name: Los túmulos más hondos } } }
    dead-end: { name: Un derrumbe }
deep-barrows:
  name: El camino hacia abajo
  description: |-
    A qué da el siguiente camino. Las cartas robadas siguen robadas hasta que se acaba el mazo, así que los Túmulos Hondos no se repiten como lo haría una tabla.

    **Enseña:** un **mazo** que nombra piezas (`set: { piece: crypt }`): cada carta robada es una pieza menos de su tipo; una carta es una escalera más abajo, a un mapa nuevo.
  cards:
    passage: Un pasillo
    flooded: Un pasillo inundado
    crypt: Una cripta
    barred: Una puerta atrancada
    stair: Una escalera más abajo
    fall: Un derrumbe
next-barrow:
  name: Qué hay más allá
  description: |-
    Atada como `discover.piece`: el camino hacia abajo sigue, hasta que se ha colocado bastante para la última tumba.

    **Enseña:** lo que ve una tabla de las piezas colocadas: `pieces.total`; una tabla que pasa la decisión a un mazo; el lugar mantenido abierto mientras se cumple una condición (`keepOpen: { pieces.total: { lt: 8 } }` en `travel.yaml`): ningún derrumbe cierra el último camino antes de la tumba.
  entries:
    on: El camino sigue
    last: La última tumba
crypt-contents:
  name: En la cripta
  description: |-
    Lo que guarda una cripta de los Túmulos Hondos, tirado al entrar por primera vez.

    **Enseña:** los `contents` propios de una pieza, en lugar de `discover.contents`; un resultado que pone una cosa presente que no lucha (`present.grave-chest`: un cofre que examinar, forzar, reventar o abrir); un resultado que pone a uno entre los presentes (`present.barrow-dead`) y deja un estado en la hoja propia del lugar (`place.conditions.restless: true`), que _Los muertos se levantan otra vez_ lee cuando la Compañía vuelve.
  entries:
    bones: Huesos y nada más
    grave-goods: Un cofre de ajuar que nadie ha tocado
    sleeper: Un durmiente que no sigue durmiendo
dead-rise:
  name: Los muertos se levantan otra vez
  description: |-
    Se tira al volver a entrar en una cripta de los Túmulos Hondos cuyo durmiente despertó (sigue **inquieta**): si se levantan más de sus muertos.

    **Enseña:** una tabla que tira una comprobación al entrar en un lugar, por lo que el lugar recuerda (`when: { place.conditions: restless }` en la comprobación, la hoja propia del lugar); un resultado que pone a uno entre los presentes (`present.barrow-dead`), más probable donde los muertos del mapa se agitan (`map.conditions`).
  entries:
    still: Los huesos siguen quietos, por ahora
    rise: Los muertos se levantan otra vez
    woken: Los muertos se levantan otra vez, despertados por el ruido
last-tomb:
  name: La última tumba
  description: |-
    Lo que espera en el fondo de los Túmulos Hondos: un rey del pueblo antiguo y, bajo su túmulo, un camino hacia abajo que nadie ha tomado.

    **Enseña:** una pieza que acaba un sitio, a la que se llega por lo colocado, no por dónde está; un resultado que crea un camino a un mapa nuevo desde donde está el grupo (`place.ways.way-in: 1`), y una casilla de una pista de progreso (`party.values.legend: 4`).
  entries:
    king: Un rey del pueblo antiguo, y su corona; bajo su túmulo, un camino hacia abajo
door-noise:
  name: El ruido
  description: |-
    Se tira cuando cede una puerta atrancada de los Túmulos Hondos (_Forzar la puerta_): si algo lo ha oído. Una vez que los muertos del lugar se agitan, algo lo oye siempre; y siempre se oye ceder la tranca más pesada.

    **Enseña:** una tabla que tira una acción (`roll:`), cuyo resultado pone a uno entre los presentes (`present.barrow-dead`) y detiene el viaje (`pause`), y una entrada que se deja fuera por lo que el mapa guarda como suyo (`map.conditions: stirring`) o por un valor de la puerta forzada, tirado al colocar su pieza (`'place.connections[params.door].bar': 3`).
  entries:
    silence: El eco se apaga; nada se mueve
    heard: Algo en la oscuridad lo ha oído, y viene
