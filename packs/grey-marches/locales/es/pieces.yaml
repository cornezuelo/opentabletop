pieces/deep-barrows:
  name: Los Túmulos Hondos
  description: |-
    Lo que hay bajo las Barrow-halls: pasillos, criptas y salas inundadas, colocados según el grupo abre cada camino, hasta la última tumba.

    **Enseña:**

    - **Piezas** (`kind: pieces`): formas dibujadas en texto, colocadas por donde va el grupo, giradas para encajar con la puerta por la que llegó
    - `marks`: qué coloca cada marca, agua negra junto al suelo en _El pasillo inundado_
    - `room: true`, con `tags` y `fields`: una cripta jugada como un solo lugar, su peligro leído como `place.danger`
    - `contents`: lo que se tira en una cripta en lugar de `discover.contents`
    - `entry: true`: por qué salidas se puede entrar en una pieza
    - Una salida con valores (`fields: { state: hidden }`): un camino oculto que se encuentra con una comprobación
    - Una puerta colocada cerrada (`fields: { state: barred }`): no hay camino hasta que el grupo la fuerza (_Forzar la puerta_), y el ruido puede despertar lo que duerme aquí
    - Una salida a un mapa nuevo (`newMap`): _Una escalera más abajo_ crea _Los túmulos más hondos_, un mapa propio colocado pieza a pieza como estos, con su propia hoja (_Este lugar_)
  pieces:
    stair-foot: { name: El pie de la escalera }
    passage: { name: Pasillo }
    flooded: { name: El pasillo inundado }
    crypt: { name: Cripta, exits: { C: { name: Una grieta tras los huesos } } }
    tomb: { name: La última tumba }
    barred-passage: { name: Una puerta atrancada, exits: { B: { name: Una puerta atrancada } } }
    stair-down:
      name: Una escalera más abajo
      exits: { B: { name: Una escalera más abajo, newMap: { name: Los túmulos más hondos } } }
    dead-end: { name: Un derrumbe }
deep-barrows:
  name: El camino hacia abajo
  description: |-
    A qué da el siguiente camino. Las cartas robadas siguen robadas hasta que se acaba el mazo, así que los Túmulos Hondos no se repiten como lo haría una tabla.

    **Enseña:** un **mazo** que nombra piezas (`set: { piece: crypt }`): cada carta robada es una pieza menos de su tipo; una carta es una escalera más abajo, a un mapa nuevo.
  cards:
    passage: Un pasillo
    flooded: Un pasillo inundado
    crypt: Una cripta
    barred: Una puerta atrancada
    stair: Una escalera más abajo
    fall: Un derrumbe
next-barrow:
  name: Qué hay más allá
  description: |-
    Atada como `discover.piece`: el camino hacia abajo sigue, hasta que se ha colocado bastante para la última tumba.

    **Enseña:** lo que ve una tabla de las piezas colocadas: `pieces.total`; una tabla que pasa la decisión a un mazo; el lugar mantenido abierto mientras se cumple una condición (`keepOpen: { pieces.total: { lt: 8 } }` en `travel.yaml`): ningún derrumbe cierra el último camino antes de la tumba.
  entries:
    on: El camino sigue
    last: La última tumba
crypt-contents:
  name: En la cripta
  description: |-
    Lo que guarda una cripta de los Túmulos Hondos, tirado al entrar por primera vez.

    **Enseña:** los `contents` propios de una pieza, en lugar de `discover.contents`; un resultado que pone a uno entre los presentes (`present.barrow-dead`).
  entries:
    bones: Huesos y nada más
    grave-goods: Un ajuar que nadie ha tocado
    sleeper: Un durmiente que no sigue durmiendo
last-tomb:
  name: La última tumba
  description: |-
    Lo que espera en el fondo de los Túmulos Hondos.

    **Enseña:** una pieza que acaba un sitio, a la que se llega por lo colocado, no por dónde está.
  entries:
    king: Un rey del pueblo antiguo, y su corona
door-noise:
  name: El ruido
  description: |-
    Se tira cuando cede una puerta atrancada de los Túmulos Hondos (_Forzar la puerta_): si algo lo ha oído. Una vez que los muertos del lugar se agitan, algo lo oye siempre.

    **Enseña:** una tabla que tira una acción (`roll:`), cuyo resultado pone a uno entre los presentes (`present.barrow-dead`) y detiene el viaje (`pause`), y una entrada que se deja fuera por lo que el mapa guarda como suyo (`unless: { map.conditions: stirring }`).
  entries:
    silence: El eco se apaga; nada se mueve
    heard: Algo en la oscuridad lo ha oído, y viene
