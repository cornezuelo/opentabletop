world/default:
  name: Cómo se mueven las Marcas
  description: |-
    Las Marcas siguen sin la Compañía: la Sierpe despierta, los Clanes marchan, la guarnición de Fort Keld se amotina y el fuerte cae, las noticias corren tras cada turno del mundo, y el día de mercado en Ashford da ánimo a un Valle debilitado.

    **Enseña:** las reacciones del mundo (`kind: world`): a un reloj que se llena (`on: world.clocks.<id>.full`, lo que hacen las tres amenazas al llenarse), a un turno del mundo (`on: world.turn`, un rumor en la cronología), a una condición que se cumple, una vez hasta que deja de cumplirse (`on: { when: … }`: la fuerza de Fort Keld llegando a 0, el día de un evento, `world.events: market-day`); la condición propia de una reacción (`when:`, solo un Valle debilitado) y la de un paso (`when:` por paso); sus pasos: `say` (con variables), `roll` de una tabla o un generador, `effects` sobre facciones y relojes, `do:` de otra reacción (`world.reactions.rumours`) y de un turno del mundo (`do: world.turn`); el mundo esperando al jugador, una `pause:` (el motín) y una pregunta (`ask:` sobre uno de sus `params`: quién toma el camino del puente, que los pasos siguientes leen como `params.bridge`); cadenas (los efectos del motín hacen caer Fort Keld). Un viaje también trae turnos del mundo (_Llevar las noticias_, en las reglas de viaje) y los oye (_Noticias del camino_).
  reactions:
    wyrm-wakes:
      name: La Sierpe despierta
      do:
        wakes:
          say: La Sierpe despierta, y el Bosque Gris enmudece.
    clans-march:
      name: Los Clanes marchan
      do:
        march:
          say: Los Clanes marchan sobre Fort Keld.
    garrison-mutinies:
      name: La guarnición se amotina
      do:
        scatter:
          say: La guarnición se amotina y se dispersa; el camino del puente queda para quien lo tome.
        gates:
          pause: 'Las puertas de Fort Keld están abiertas, y nadie guarda las murallas.'
    fort-falls:
      name: Cae Fort Keld
      params:
        bridge:
          name: ¿Quién toma el camino del puente?
          description: Caído Fort Keld, el camino del puente es de quien lo tome primero.
          choices:
            iron-clans: Los Clanes de Hierro
            the-vale: El Valle de Ashford
      do:
        falls:
          say: 'Cae Fort Keld (fuerza de los Clanes: {{factions.iron-clans.values.strength}}): todos los poderes de las Marcas se mueven a la vez.'
    rumours:
      name: Noticias en los caminos
    market-day:
      name: Día de mercado en Ashford
      do:
        heart:
          say: 'Día de mercado en Ashford: el comercio da ánimo al Valle.'
