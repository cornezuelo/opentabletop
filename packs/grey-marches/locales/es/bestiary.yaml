sheet/foe:
  name: Enemigo
  description: |-
    Lo que la Compañía encuentra en el camino y con lo que tiene que lidiar: bestias, forajidos, la Cacería.

    **Enseña:** una hoja para criaturas y tipos de PNJ, más ligera que la de un compañero; estados que quitan una copia de los presentes por sí solos (`leaves: true`): uno que se cumple por sí solo (_Abatido_, con salud 0) y otros que ponen los efectos (_En desbandada_, _Sobornado_); objetos, para que una plantilla pueda llevar alguno.
  values:
    health:
      name: Salud
      description: El daño que aún aguanta; a 0 cae, y se va.
    harm:
      name: Daño
      description: Lo fuerte que golpea, para vuestras decisiones y las tablas que lo leen.
    morale:
      name: Moral
      description: Cuánto aguanta antes de huir, de 2 a 12, para vuestras tiradas de moral (un 2d6 por encima, huye).
  conditions:
    down:
      name: Abatido
      description: 'Salud 0: cae, y deja de estar entre los presentes.'
    routed:
      name: En desbandada
      description: Huye; deja de estar entre los presentes.
    bought-off:
      name: Sobornado
      description: Le pagan para que se vaya; deja de estar entre los presentes.
    enraged:
      name: Enfurecido
      description: Lucha hasta el final, tenga la moral que tenga.
bestiary/marches:
  name: Quién recorre las Marcas
  description: |-
    Las bestias, forajidos, jinetes y cosas peores con que la Compañía se cruza en el camino.

    **Enseña:**

    - Plantillas de personajes (`kind: bestiary`) sobre una hoja propia del pack (`sheet: sheet.foe`), y una sobre la de los compañeros (un tipo de PNJ: los jinetes del Valle)
    - Valores que tira cada copia: `health: '{{1d4+1}}'`
    - Una variante: el jefe de la manada es un lobo gris (`like: grey-wolf`) con más salud y una etiqueta propia; el cabecilla de los bandidos, igual
    - Copias con nombre sacado de una tabla (`names: table.npc-names`): _Brenna_, _Corin_… en lugar de _Bandido 2_
    - Lo que lleva una copia, del equipo de la Compañía (`items:`), y un estado con el que empieza (`conditions: [enraged]`)
    - Cómo se dibuja cada una en un mapa (`token:` su icono y su tipo)
    - Lo que hace una copia en su turno en un combate (`actions: table.wolf-turn`), que su variante toma por `like` (el jefe de la manada); las demás hacen lo que dice el sistema (`encounter.foes`)
    - Qué pasa con las que se dejan atrás: desaparecen (`behind: leave`, la del bestiario), salvo la Sierpe, que se queda en su bosque, y los muertos inquietos, en su túmulo (`behind: stay`)
  templates:
    traveller:
      name: Viajero
      description: Alguien que os cruzáis en el camino, con sus propios asuntos.
    grey-wolf:
      name: Lobo gris
      description: Flaco y paciente; caza en manada, y se desbanda cuando cae su jefe.
    pack-leader:
      name: Jefe de la manada
      description: El más grande de la manada; mientras aguanta, los demás aguantan con él.
    ember-rider:
      name: Jinete de la Cacería Ascua
      description: Un jinete pálido bajo la luna Ascua llena, que nunca se cansa y nunca habla.
    wyrm:
      name: La Sierpe del Bosque Gris
      description: Enroscada en el corazón del Bosque Gris. No persigue; espera.
    barrow-dead:
      name: Los muertos inquietos
      description: Huesos en sus mortajas que no se quedan donde los pusieron.
    bandit:
      name: Bandido
      description: Un forajido de las Colinas Huecas, hambriento y mal armado.
    bandit-chief:
      name: Cabecilla de los bandidos
      description: Manda en la banda; mejor comido, mejor armado y más dispuesto a negociar.
    vale-rider:
      name: Jinete del Valle
      description: Uno de la patrulla del Valle, que recorre sus caminos y sus lindes.
foe-turn:
  name: El turno de un enemigo
  description: |-
    Lo que hace un enemigo en su turno en un combate, cuando su especie no tiene un turno propio: lanza un golpe a uno de la Compañía, tirado, y acierta la mitad de las veces, por su Daño.

    **Enseña:** lo que hacen los enemigos en sus turnos (`encounter.foes` en el sistema), tirado actuando como cada enemigo (`acting.values.harm`); un resultado dirigido a alguien (`set: { target: party.members.random }`) y su efecto sobre él (`characters[target].values.health`); un estado dado por un tiempo (`characters[target].conditions.rattled: '{{1d2}}'`: rondas del combate); un turno que no hace nada.
  entries:
    miss: '{{acting.name}} lanza un golpe, y falla'
    hit: '{{acting.name}} acierta un golpe'
    heavy: '{{acting.name}} acierta un golpe fuerte'
wolf-turn:
  name: El turno de un lobo
  description: |-
    Lo que hace un lobo gris (o el jefe de la manada) en su turno en un combate: va a por el más débil de la Compañía y muerde, por su Daño, salvo que solo ronde.

    **Enseña:** el turno propio de una plantilla (`actions: table.wolf-turn` en el bestiario, que su variante toma por `like`) por encima del del sistema; un objetivo elegido por un valor (`set: { target: party.members.lowest.values.health }`).
  entries:
    circle: '{{acting.name}} ronda, gruñendo'
    bite: '{{acting.name}} va a por el más débil de vosotros'
parting-blow:
  name: Un golpe al retirarse
  description: |-
    Al replegarse la Compañía, el enemigo más fiero alcanza al compañero más torpe: tanto daño como lo que el Daño de ese enemigo supera el Sigilo del compañero.

    **Enseña:** lo más y lo menos de un valor en un grupo, `present.highest.values.harm` (el enemigo más fiero aquí) y `party.lowest.values.stealth` (el compañero más torpe), en la condición de un paso y en un efecto; un objetivo elegido por ese mismo valor (`set: { target: party.members.lowest.values.stealth }`).
  entries:
    caught: Al replegaros, alcanzan al más torpe de vosotros
blow:
  name: Un golpe
  description: |-
    El daño que hace el golpe de un compañero al enemigo elegido: 1d6, tirado dos veces y el menor a oscuras o aturdido, el mayor cuando ese enemigo es el único que queda aquí.

    **Enseña:** modos de tirada en una sola tirada de un generador (`modeWhen` en un campo `roll`: la ventaja y la desventaja de Core, que se anulan a oscuras contra un enemigo solo; desventaja mientras quien golpea está aturdido, un estado que se da por unas rondas); la tabla de un campo que cambia el viaje (`'characters[params.foe].values.health': '-{{harm}}'`), tirado por el paso de una acción con sus parámetros.
  template: '{{harm}} de daño'
blow-lands:
  name: El golpe acierta
  description: El daño de _Un golpe_, quitado al enemigo elegido.
  entries:
    lands: '{{harm}} de daño'
wear-and-tear:
  name: Desgaste
  description: |-
    Una pieza de armadura revisada tras un combate: se tira su propio dado de desgaste; con 1–2 baja un escalón (de d8 a d6), y un d4 que saca 1–2 queda destrozado y se tira.

    **Enseña:** una tirada por cada objeto que se lleva puesto (el paso `roll:` de una acción con `each: params.piece`, el parámetro listado por el viaje como `acting.places.body.keys`); un dado cuyo tamaño es un campo con escalones de un objeto (`1d{{max(acting.items[params.piece].wear, 4)}}`, el `wear: { steps: [4, 6, 8] }` de la ficha); un objeto nombrado por su clave en condiciones y efectos (`acting.items[params.piece].wear: -1`, `acting.items[params.piece]: -1`).
  entries:
    ruined: 'La armadura de {{acting.name}} queda destrozada sin arreglo, y se tira'
    rent: 'La armadura de {{acting.name}} se desgarra: su dado de desgaste baja un escalón'
    holds: 'La armadura de {{acting.name}} aguanta'
