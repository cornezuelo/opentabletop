sheet/foe:
  name: Enemigo
  description: |-
    Lo que la Compañía encuentra en el camino y con lo que tiene que lidiar: bestias, forajidos, la Cacería.

    **Enseña:** una hoja para criaturas y tipos de PNJ, más ligera que la de un compañero, con la salud como valor principal (`main: health`, una barra en las tarjetas de un combate), que empieza en un máximo que tira cada plantilla (`default: '{{self.values.toughness}}'`, un valor por defecto que lee un valor anterior); estados que quitan una copia de los presentes por sí solos (`leaves: true`): uno que se cumple por sí solo (_Abatido_, con salud 0) y otros que ponen los efectos (_En desbandada_, _Sobornado_); uno que da una huida y lee el `follows` de una plantilla (_Atiborrándose_); uno con el que empieza todo enemigo (_Hostil_, el `conditions:` de sus plantillas), que los efectos quitan y vuelven a dar; objetos, para que una plantilla pueda llevar alguno.
  values:
    toughness:
      name: Salud máxima
      description: El daño máximo que aguanta, tirado para cada uno al llegar.
    health:
      name: Salud
      description: El daño que aún aguanta; a 0 cae, y se va.
    harm:
      name: Daño
      description: Lo fuerte que golpea, para vuestras decisiones y las tablas que lo leen.
    morale:
      name: Moral
      description: Cuánto aguanta antes de huir, de 2 a 12, para vuestras tiradas de moral (un 2d6 por encima, huye).
  conditions:
    down:
      name: Abatido
      description: 'Salud 0: cae, y deja de estar entre los presentes.'
      told:
        gains: '{{name}} cae'
    routed:
      name: En desbandada
      description: Huye; deja de estar entre los presentes.
      told:
        gains: '{{name}} da media vuelta y huye'
    bought-off:
      name: Sobornado
      description: Le pagan para que se vaya; deja de estar entre los presentes.
      told:
        gains: '{{name}} coge la comida y se va'
    fed:
      name: Atiborrándose
      description: Ocupado con la carne que le han echado; ahora no quiere haceros daño ni os sigue.
      told:
        gains: '{{name}} se lanza sobre la carne'
    enraged:
      name: Enfurecido
      description: Lucha hasta el final, tenga la moral que tenga.
    hostile:
      name: Hostil
      description: Quiere hacer daño a la Compañía. Se le quita cuando la recibe de otro modo (una reacción que no sea hostil), y vuelve a tenerlo cuando la Compañía planta cara.
      told:
        gains: '{{name}} se vuelve contra vosotros'
        loses: '{{name}} no quiere haceros daño'
sheet/chest:
  name: Cofre
  description: |-
    Un cofre hallado en las Marcas: lo dura que es su cerradura y si guarda una aguja envenenada, las dos cosas tiradas al encontrarlo.

    **Enseña:** una hoja para una cosa presente que no lucha (el `fights: false` de su plantilla): valores que tira cada copia (`lock: '{{max(1d6 - 2, 0)}}'`), estados que se cumplen por sí solos sobre ellos (_Cerrado_ mientras su cerradura pasa de 0, _Con aguja_ mientras la tiene), que leen las acciones dirigidas a él (`where: { 'characters[candidate].conditions': locked }`), y uno que lo quita de los presentes (_Abierto_, `leaves: true`), que se oye al irse (`on: present.leave`) para tirar lo que hay dentro.
  values:
    lock:
      name: Cerradura
      description: Lo dura que es su cerradura, sumado a lo que pide forzarla con ganzúa (7 o más con 2d6 y Sigilo, más esto); a 0, está abierto.
    needle:
      name: Aguja
      description: El daño de la aguja envenenada de su cerradura, a quien lo abre o falla con la ganzúa; a 0, ninguna (o ya sacada).
  conditions:
    locked:
      name: Cerrado
      description: Su cerradura aguanta. Forzadla con ganzúa, o reventadlo.
    needled:
      name: Con aguja
      description: Una aguja envenenada espera en su cerradura, para quien lo abra o falle con la ganzúa. Examinadlo para sacarla.
    opened:
      name: Abierto
      description: Abierto, y cogido lo que había dentro; deja de estar entre los presentes.
      told:
        gains: '{{name}} queda abierto'
bestiary/marches:
  name: Quién recorre las Marcas
  description: |-
    Las bestias, forajidos, jinetes y cosas peores con que la Compañía se cruza en el camino.

    **Enseña:**

    - Plantillas de personajes (`kind: bestiary`) sobre una hoja propia del pack (`sheet: sheet.foe`), y una sobre la de los compañeros (un tipo de PNJ: los jinetes del Valle)
    - Valores que tira cada copia: `toughness: '{{1d4+1}}'`, y su salud empieza ahí
    - Una variante: el jefe de la manada es un lobo gris (`like: grey-wolf`) con más salud y una etiqueta propia; el cabecilla de los bandidos, igual
    - Copias con nombre sacado de una tabla (`names: table.npc-names`): un viajero es _Brenna_ o _Corin_, alguien con quien hablar; sin `names`, una copia es el nombre de su plantilla y un número (_Bandido 2_, _Jinete del Valle 3_)
    - Lo que más o lo menos daña a cada una, como sus etiquetas (`fears-fire`, `fireproof`, `unhallowed`, `bone`), que lee el tipo de un golpe (_El golpe acierta_)
    - Lo que lleva una copia, del equipo de la Compañía (`items:`), y un estado con el que empieza (`conditions: [enraged]`)
    - Cómo se dibuja cada una en un mapa y como su cara en un combate (`token:` su icono y su tipo)
    - Lo que hace una copia en su turno en un combate (`actions: table.wolf-turn`), que su variante toma por `like` (el jefe de la manada), y el de los muertos inquietos (`actions: table.dead-turn`); las demás hacen lo que dice el sistema (`encounter.foes`)
    - Enemigos que siguen a la Compañía cuando se marcha (`follows`, una condición leída con la copia actuando): los lobos mientras quieren hacer daño y no les han echado carne (_Atiborrándose_, Echarles carne), los bandidos mientras quieren hacer daño y la Compañía no va a caballo (`trip.mode`); si se repliega de un combate y sigue la marcha, llegan con ella al siguiente sitio, y la Compañía vuelve a estar _Acosada_
    - Qué pasa con las que se dejan atrás: desaparecen (`behind: leave`, la del bestiario), salvo la Sierpe, que se queda en su bosque, los muertos inquietos, en su túmulo, y un cofre de ajuar, en su cripta (`behind: stay`)
    - Un aliado en el bando de la Compañía (`side: party`): un batidor del Valle que cabalga con ella (_Pedir un batidor_) mientras está en tierras del Valle (`follows`, una condición leída al llegar a cada lugar: `place.region`, `place.faction`) y se vuelve al salir de ellas; lucha junto a la Compañía, en sus propios turnos (`actions: table.outrider-turn`), contra el enemigo que ocupa su mismo puesto (el `alliesAim: present.fighters.spread` del sistema), y los enemigos también van a por él (`aim: party.fighters.spread`)
    - Quién no lucha (`fights: false`): los viajeros y los jinetes del Valle, con quienes uno se cruza y no se pelea, y el cofre de ajuar, una cosa de una cripta con una hoja propia (_Cofre_), a la que se dirigen acciones (_Examinarlo_, _Forzar la cerradura_, _Reventarlo_, _Abrirlo_); ninguno es un bando de un combate, ni lo cuenta `present.fighters`
    - Quién es un enemigo, como etiqueta (`foe`), y quién quiere hacer daño ahora, como un estado con el que empieza todo enemigo (`conditions: [hostile]`) y que quita una reacción que no sea hostil: mientras haya aquí uno que lo tenga (`present.conditions: hostile`), la Compañía está _Acosada_ (su hoja), y no puede seguir la marcha ni ocuparse de otra cosa hasta que se las vea con ellos o se repliegue
  templates:
    traveller:
      name: Viajero
      description: Alguien que os cruzáis en el camino, con sus propios asuntos.
    grey-wolf:
      name: Lobo gris
      description: Flaco y paciente; caza en manada, y se desbanda cuando cae su jefe.
    pack-leader:
      name: Jefe de la manada
      description: El más grande de la manada; mientras aguanta, los demás aguantan con él.
    ember-rider:
      name: Jinete de la Cacería Ascua
      description: Un jinete pálido bajo la luna Ascua llena, que nunca se cansa y nunca habla.
    wyrm:
      name: La Sierpe del Bosque Gris
      description: Enroscada en el corazón del Bosque Gris. No persigue; espera.
    barrow-dead:
      name: Los muertos inquietos
      description: Huesos en sus mortajas que no se quedan donde los pusieron.
    bandit:
      name: Bandido
      description: Un forajido de las Colinas Huecas, hambriento y mal armado.
    bandit-chief:
      name: Cabecilla de los bandidos
      description: Manda en la banda; mejor comido, mejor armado y más dispuesto a negociar.
    vale-rider:
      name: Jinete del Valle
      description: Uno de la patrulla del Valle, que recorre sus caminos y sus lindes.
    vale-outrider:
      name: Batidor del Valle
      description: Un jinete de la patrulla del Valle que cabalga con la Compañía, hasta donde llegan las tierras del Valle.
    grave-chest:
      name: Cofre de ajuar
      description: Un cofre reforzado con hierro, con el ajuar de los antiguos; alguno aún guarda una aguja en la cerradura.
foe-turn:
  name: El turno de un enemigo
  description: |-
    Lo que hace un enemigo en su turno en un combate, cuando su especie no tiene un turno propio: lanza un golpe a uno de la Compañía, elegido al empezar su turno, y acierta la mitad de las veces, por su Daño; la armadura que lleva le baja la tirada.

    **Enseña:** lo que hacen los enemigos en sus turnos (`encounter.foes` en el sistema), tirado actuando como cada enemigo (`acting.values.harm`); a quién va su turno, elegido antes de tirar (el `aim: party.fighters.spread` del sistema: uno cada uno entre los compañeros y un batidor que cabalgue con ellos, los enemigos que sobran a los compañeros), leído por su tirada (`'1d6 - {{characters[encounter.target].values.armour}}'`) y sus efectos (`characters[encounter.target].values.health`); un estado dado por un tiempo (`characters[encounter.target].conditions.rattled: '{{1d2}}'`: rondas del combate); un modo de tirada leído de aquel a quien va (`modeWhen: { roll-modes.disadvantage: { 'characters[encounter.target].conditions': braced } }`: el en guardia del Muro de escudos); un turno que no hace nada.
  entries:
    miss: '{{acting.name}} lanza un golpe, y falla'
    hit: '{{acting.name}} acierta un golpe: {{acting.values.harm}} de daño'
    heavy: '{{acting.name}} acierta un golpe fuerte: {{acting.values.harm}} de daño'
outrider-turn:
  name: El turno del batidor
  description: |-
    Lo que hace un batidor del Valle que cabalga con la Compañía en su turno en un combate: baja la lanza contra el enemigo que le ha tocado, por 1d4 de daño, y de vez en cuando lo arrolla y le quiebra el ánimo.

    **Enseña:** el turno de un aliado (una plantilla con `side: party`), jugado solo como el de un enemigo; a quién va, elegido al empezar su turno (el `alliesAim: present.fighters.spread` del sistema: el enemigo que ocupa su mismo puesto entre ellos, o el siguiente en pie si ese cayó), leído como `encounter.target` en sus efectos (`characters[encounter.target].values.morale`); el daño de una lanza, a la mitad contra huesos viejos, leído de las etiquetas del enemigo (`'characters[encounter.target].tags': bone`).
  entries:
    wheel: '{{acting.name}} hace girar el caballo, y no encuentra un hueco'
    lance: '{{acting.name}} clava la lanza: {{1d4}} de daño'
    bones: 'La lanza de {{acting.name}} resbala sobre huesos viejos: {{floor(1d4 / 2)}} de daño'
    ride-down: '{{acting.name}} lo arrolla: {{1d4}} de daño, y el ánimo quebrado'
wolf-turn:
  name: El turno de un lobo
  description: |-
    Lo que hace un lobo gris (o el jefe de la manada) en su turno en un combate: va a por el más débil de la Compañía y muerde, por su Daño, salvo que solo ronde.

    **Enseña:** el turno propio de una plantilla (`actions: table.wolf-turn` en el bestiario, que su variante toma por `like`) por encima del del sistema; un objetivo elegido por un valor (`set: { target: party.members.lowest.values.health }`); el turno perdido de un compañero (_Derribado_ durante uno de sus turnos, `lasts: turns`, que lee el `encounter.skip` del sistema).
  entries:
    circle: '{{acting.name}} ronda, gruñendo'
    bite: '{{acting.name}} va a por el más débil de vosotros: {{acting.values.harm}} de daño'
    drag: '{{acting.name}} derriba al más débil de vosotros: {{acting.values.harm}} de daño'
dead-turn:
  name: El turno de los muertos inquietos
  description: |-
    Lo que hacen los muertos inquietos en su turno en un combate: una mano helada contra uno de la Compañía, por su Daño, o el frío de la tumba sobre todos a la vez: cada uno recibe 1d3 menos la armadura que lleva.

    **Enseña:** un resultado dirigido a todos (`set: { target: party.members.all }`), que se juega una vez por cada uno de la Compañía, con una línea del diario cada uno: su efecto se lee para cada uno (`characters[target].values.armour`, la armadura que lleva ese) y sus dados se tiran para cada uno (`'-{{max(1d3 - characters[target].values.armour, 0)}}'`).
  entries:
    claw: '{{acting.name}} alarga la mano hacia uno de vosotros: {{acting.values.harm}} de daño'
    chill: El frío de la tumba os envuelve a todos
parting-blow:
  name: Un golpe al retirarse
  description: |-
    Al replegarse la Compañía, el enemigo más fiero alcanza al compañero más torpe: tanto daño como lo que el Daño de ese enemigo supera el Sigilo del compañero.

    **Enseña:** lo más y lo menos de un valor en un grupo, `present.highest.values.harm` (el enemigo más fiero aquí) y `party.lowest.values.stealth` (el compañero más torpe), en la condición de un paso y en un efecto; un objetivo elegido por ese mismo valor (`set: { target: party.members.lowest.values.stealth }`).
  entries:
    caught: 'Al replegaros, alcanzan al más torpe de vosotros: {{present.highest.values.harm - party.lowest.values.stealth}} de daño'
blow:
  name: Un golpe
  description: |-
    El daño que hace el golpe de un compañero al enemigo elegido: 1d6, tirado dos veces y el menor a oscuras o aturdido, el mayor cuando ese enemigo es el único que queda aquí. Lo que es el golpe (acero, fuego o sagrado, por lo que lleva en las manos) puede doblarlo, partirlo por la mitad o dejarlo en nada, según lo que sea el enemigo.

    **Enseña:** modos de tirada en una sola tirada de un generador (`modeWhen` en un campo `roll`: la ventaja y la desventaja de Core, que se anulan a oscuras contra un enemigo solo; desventaja mientras quien golpea está aturdido, un estado que se da por unas rondas); tipos de daño, la tabla de un campo que nombra el del golpe (`kind`, que el campo siguiente lee como `kind.kind`) y otra que lo lee frente a las etiquetas del enemigo; la tabla de un campo que cambia el viaje (`'characters[params.foe].values.health': '-{{harm * 2}}'`), tirado por el paso de una acción con sus parámetros.
blow-lands:
  name: El golpe acierta
  description: |-
    El daño de _Un golpe_, quitado al enemigo elegido, según lo que es el golpe frente a lo que es el enemigo: el fuego sobre una bestia que lo teme, o el acero sagrado sobre lo impío, el doble; el acero sobre huesos viejos, la mitad (redondeando hacia abajo); el fuego sobre lo que no arde, nada.

    **Enseña:** tipos de daño como etiquetas del enemigo, leídas con el tipo del golpe (`kind.kind`, que pone _Lo que es el golpe_) en el `when` de cada fila: una debilidad, una resistencia y una inmunidad, en cualquier hoja (la de un enemigo o la de un viajero); filas que se cumplen de una en una, elegida la que se cumple.
  entries:
    twice: '{{harm * 2}} de daño, {{kind}}: el doble'
    half: '{{floor(harm / 2)}} de daño, {{kind}}: resbala'
    none: 'Ningún daño, {{kind}}: no arde'
    lands: '{{harm}} de daño, {{kind}}'
blow-kind:
  name: Lo que es el golpe
  description: |-
    El tipo del golpe de un compañero, por lo que lleva: sagrado con la Espada de Keld en la mano, de fuego con una antorcha en la mano a oscuras, de acero si no.

    **Enseña:** una tabla sin tirada cuyas filas se cumplen de una en una (`when` / `unless`), que nombra un tipo de daño (`set: { kind: fire }`) que lee el campo siguiente del generador; valores hechos de lo que tiene en las manos un compañero (`acting.values.relic-in-hand`, `torch-in-hand`) y la hora del día (`time.tags: dark`).
  entries:
    hallowed: sagrado
    fire: fuego
    steel: acero
wear-and-tear:
  name: Desgaste
  description: |-
    Una pieza de armadura revisada tras un combate: se tira su propio dado de desgaste; con 1–2 baja un escalón (de d8 a d6), y un d4 que saca 1–2 queda destrozado y se tira.

    **Enseña:** una tirada por cada objeto que se lleva puesto (el paso `roll:` de una acción con `each: params.piece`, el parámetro listado por el viaje como `acting.places.body.keys`); un dado cuyo tamaño es un campo con escalones de un objeto (`1d{{acting.items[params.piece].wear}}`, el `wear: { steps: [4, 6, 8] }` de la ficha, que el Oráculo pide al tirarlo); un objeto nombrado por su clave en condiciones y efectos (`acting.items[params.piece].wear: -1`, y `acting.items[params.piece].count: -1` para tirar solo esa pieza).
  entries:
    ruined: 'La armadura de {{acting.name}} queda destrozada sin arreglo, y se tira'
    rent: 'La armadura de {{acting.name}} se desgarra: su dado de desgaste baja un escalón'
    holds: 'La armadura de {{acting.name}} aguanta'
