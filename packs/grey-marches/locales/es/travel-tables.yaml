getting-lost:
  name: ¿Nos perdemos?
  description: |-
    Se tira **al alba**, fuera de caminos y ríos, y en cada hex en el que se entra en una marcha nocturna, fuera del camino (a oscuras, con 1–3 os perdéis). La Orientación del grupo ayuda; la niebla no. Con **cielo despejado** o un **guía** con Rastreo 2 o más se tira con ventaja (no bajo los árboles de un bosque, que tapan el cielo); el día después de perderse, con desventaja.

    **Enseña:**

    - Una comprobación de viaje: atada a `NAVIGATION_CHECK_REQUIRED`
    - Una característica del grupo en la tirada: `{{navigation}}`
    - `set: { lost: true }`: no se viaja más hoy
    - Modos de tirada que se aplican solos (`modeWhen`): `advantage` con `weather: clear` o un guía con Rastreo 2 (`roles.guide.values.pathfinding`, un rol de viaje), `disadvantage` con `yesterday.lost: true`
    - El `modeUnless` de un modo de tirada: sin ventaja en los bosques, `terrain: [forest, dense-forest]`
    - Condiciones sobre el clima, sobre la oscuridad (`daylight: false`) y sobre estar fuera de toda región (`exists: false`)
  entries:
    fog: 'Perdidos en la niebla: hoy no avanzáis'
    dark: 'Perdidos en la oscuridad: os paráis hasta el alba'
    wild: 'Aquí no hay referencias: os desviáis del rumbo'
    lost: 'Os habéis perdido: hoy no avanzáis'
    course: Mantenéis el rumbo
forage:
  name: Buscar comida
  description: |-
    Lo que encontráis al **buscar comida** (la acción _Buscar comida_), solo en bosques, campos, brezales y marismas: de **4 a 6** da comida para un día, **7 o más** para 2 a 4 días. En la guardia del alba (hasta las 8 de la mañana, cuando se mueve la caza) se tira con ventaja.

    **Enseña:**

    - Una comprobación en una acción propia del sistema (`at: forage`)
    - Una característica y ventaja en la tirada: `1d6 + {{survival}}`
    - Dados dentro de un valor (`days: '{{1d3+1}}'`), que vuelven a leer el texto y el efecto (`{{days}}`)
    - Las **guardias** del calendario: ventaja por sí sola en la segunda guardia del día (`modeWhen: { advantage: { watch: 2 } }`, de 4 a 8 con guardias de 4 horas)
    - **Efectos**: `party.resources.food: 1`, la comida ganada
  entries:
    nothing: Aquí no hay nada que comer
    some: Bayas y raíces para un día
    plenty: '¡Caza! Comida para {{days}} días'
fishing:
  name: Pesca
  description: |-
    Lo que pica al **pescar** (la acción _Pescar_), junto a un lago, el mar o en la costa: un d6 **igual o menor que la Supervivencia** saca pescado para dos días; si no, de 1 a 3 para un día.

    **Enseña:**

    - Una comprobación en una acción propia del sistema (`at: fish`), y una acción solo junto al agua (`around.water`)
    - Una tirada **por debajo** sobre la propia tirada de la tabla: `party.stats.survival: { gte: '{{roll}}' }`
    - El total de la tirada en los textos: `{{roll}}`
  entries:
    catch: 'Un {{roll}}, igual o menor que vuestra Supervivencia: buena pesca, comida para dos días'
    some: 'Un {{roll}}: unos pocos peces pequeños, comida para un día'
    nothing: 'Un {{roll}}: no pica nada'
toll:
  name: El peaje
  description: |-
    El peaje del **puente de Keld**, llegando por el camino: tira un d6; si saca el **Carisma** del grupo o menos, el guarda del puente os deja pasar; si no, se cobra un día de comida.

    **Enseña:**

    - Una comprobación con `all` / `tags` / `edges`
    - Una tirada por debajo de una característica en una condición: `party.stats.charisma: { gte: '{{1d6}}' }`, un solo d6 para las dos entradas (`when` en una, `unless` en la otra)
    - Un efecto con un número negativo: `party.resources.food: -1`, comida gastada
  entries:
    pay: El guarda del puente se cobra un día de comida
    wave: Al guarda del puente le caéis bien y os deja pasar
shrine:
  name: En el santuario
  description: |-
    Un **santuario** junto al camino.

    **Enseña:**

    - La fatiga bajando: `fatigue: -2`
    - Una característica del grupo subiendo: `morale`
    - `once`: la bendición llega una sola vez
  entries:
    blessing: 'Una voz responde a tu plegaria: el camino será amable'
    rest: Una hora tranquila en el santuario alivia las piernas
ford:
  name: Cruzar el vado
  description: |-
    **¿Sale bien el cruce?** El agua decide; la Supervivencia del grupo ayuda.

    **Enseña:**

    - Un **oráculo** cuya entrada viene de los bindings: `odds: even`
    - Variantes con sus propios dados
    - Valores del día que pone el clima: `{{fordModifier}}`, `fordImpossible`
    - `set: { lost: true }`: hoy no se cruza
    - Un modo de tirada del propio pack: _Con cuidado_ (tres tiradas, se queda la del medio)
  inputs:
    odds:
      label: El agua
      labels: { low: Baja y mansa, even: Hasta la cintura, high: Crecida }
  entries:
    fine: Cruzáis sin problemas
    spate: 'El río baja crecido: hoy no se cruza'
    wet: 'A mitad de camino os arrastra la corriente: {{result}}'
    swept: 'La crecida os arrastra río abajo: {{result}}'
ford-mishap:
  name: Percance en el vado
  description: |-
    Lo que se lleva el río. Se tira desde las respuestas del _Vado_.

    **Enseña:** `set` sobre provisiones (`food`, `fodder`) y sobre `fatigue`, y efectos
    sobre el personaje que actúa (`acting.…`): quien guía el cruce se tuerce un tobillo.
  entries:
    food: se pierde un fardo de comida
    tired: salís del agua agotados
    fodder: el forraje se empapa y se echa a perder
    rocks: quien guía el cruce se golpea contra las rocas
hunger:
  name: Hambre
  description: |-
    **Acampar sin comida.** Cuanto más baja la moral, peor va.

    **Enseña:**

    - Una comprobación al acampar sobre las provisiones: `party.resources.food` menor que 1
    - La moral en la tirada y en una condición
    - `maxOccurrences` con `onExhausted: next`: tras la segunda deserción responde la entrada siguiente
    - Una característica que baja: `hirelings`
  entries:
    desertion: 'Por la noche, {{result}}'
    grumble: Tripas vacías, mal humor
    endure: Os apretáis el cinturón y cantáis para olvidarlo
desertion:
  name: Deserción
  description: |-
    Quién se va de noche y qué se lleva.

    **Enseña:**

    - Una cascada a _Nombres de las Marcas_
    - `once`: la nota llega una sola vez
  entries:
    food: '{{result}} se escabulle con el último pan'
    torch: '{{result}} se ha ido al alba, y las antorchas también'
    note: 'hay una nota clavada en tu mochila: «El Bosque Gris no es lugar para mí.»'
