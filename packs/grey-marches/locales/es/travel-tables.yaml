getting-lost:
  name: ¿Nos perdemos?
  description: |-
    Al alba, fuera de caminos y ríos. La Orientación del grupo ayuda; la niebla no.

    **Enseña:** una comprobación de viaje (atada a NAVIGATION_CHECK_REQUIRED), una característica del grupo en la tirada ({{navigation}}), `set: { lost: true }` (no se viaja más hoy) y condiciones sobre el clima y sobre estar fuera de toda región (`exists: false`).
  entries:
    fog: 'Perdidos en la niebla: hoy no avanzáis'
    wild: 'Aquí no hay referencias: os desviáis del rumbo'
    lost: 'Os habéis perdido: hoy no avanzáis'
    course: Mantenéis el rumbo
forage:
  name: Buscar comida
  description: |-
    Lo que encontráis al buscar comida (la acción Buscar comida, en bosques, campos, brezales y marismas).

    **Enseña:** una comprobación en una acción propia del sistema, una característica y ventaja en la tirada, dados dentro de un valor (`food: '{{1d3+1}}'`) que el texto vuelve a leer ({{resources.food}}) y `set: { resources }` (la comida ganada).
  entries:
    nothing: Aquí no hay nada que comer
    some: Bayas y raíces para un día
    plenty: '¡Caza! Comida para {{resources.food}} días'
toll:
  name: El peaje
  description: |-
    El peaje del puente de Keld, llegando por el camino.

    **Enseña:** una comprobación con all / tags / edges, y `set: { resources }` con un número negativo (comida gastada).
  entries:
    pay: El guarda del puente se cobra un día de comida
    wave: El guarda del puente os deja pasar
shrine:
  name: En el santuario
  description: |-
    Un santuario junto al camino.

    **Enseña:** la fatiga bajando (`fatigue: -2`), una característica del grupo subiendo (moral) y `once` (la bendición llega una sola vez).
  entries:
    blessing: 'Una voz responde a tu plegaria: el camino será amable'
    rest: Una hora tranquila en el santuario alivia las piernas
ford:
  name: Cruzar el vado
  description: |-
    ¿Sale bien el cruce? El agua decide; la Supervivencia del grupo ayuda.

    **Enseña:** un oráculo cuya entrada viene de los bindings (`odds: even`), variantes con sus propios dados, valores del día que pone el clima ({{fordModifier}}, fordImpossible) y `set: { lost: true }`.
  inputs:
    odds:
      label: El agua
      labels: { low: Baja y mansa, even: Hasta la cintura, high: Crecida }
  entries:
    fine: Cruzáis sin problemas
    spate: 'El río baja crecido: hoy no se cruza'
    wet: 'A mitad de camino os arrastra la corriente: {{result}}'
    swept: 'La crecida os arrastra río abajo: {{result}}'
ford-mishap:
  name: Percance en el vado
  description: |-
    Lo que se lleva el río.

    **Enseña:** `set` sobre provisiones (comida, forraje) y fatiga, tirado desde las respuestas del Vado.
  entries:
    food: se pierde un fardo de comida
    tired: salís del agua agotados
    fodder: el forraje se empapa y se echa a perder
hunger:
  name: Hambre
  description: |-
    Acampar sin comida. Cuanto más baja la moral, peor va.

    **Enseña:** una comprobación al acampar sobre las provisiones del grupo (party.resources.food menor que 1), la moral en la tirada y en una condición, maxOccurrences con `onExhausted: next` (tras la segunda deserción responde la entrada siguiente) y una característica que baja (hirelings).
  entries:
    desertion: 'Por la noche, {{result}}'
    grumble: Tripas vacías, mal humor
    endure: Os apretáis el cinturón y cantáis para olvidarlo
desertion:
  name: Deserción
  description: |-
    Quién se va de noche y qué se lleva.

    **Enseña:** cascadas a Nombres de las Marcas y `once` (la nota llega una sola vez).
  entries:
    food: '{{result}} se escabulle con el último pan'
    torch: '{{result}} se ha ido al alba, y las antorchas también'
    note: 'hay una nota clavada en tu mochila: «El Bosque Gris no es lugar para mí.»'
