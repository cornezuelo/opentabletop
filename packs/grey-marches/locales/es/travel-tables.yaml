getting-lost:
  name: ¿Nos perdemos?
  description: |-
    Se tira **al alba**, fuera de caminos y ríos, y en cada hex en el que se entra en una marcha nocturna, fuera del camino (a oscuras, con 1–3 os perdéis). La Orientación del grupo ayuda; la niebla no. Con **cielo despejado** o un **guía** con Rastreo 2 o más se tira con ventaja (no bajo los árboles de un bosque, que tapan el cielo, salvo que un compañero sea Conocedor del bosque: entonces allí siempre); el día después de perderse, con desventaja. Un Baqueano nunca se extravía en la oscuridad.

    **Enseña:**

    - Una comprobación de viaje: atada a `NAVIGATION_CHECK_REQUIRED`
    - Una característica del grupo en la tirada: `{{party.stats.navigation}}`
    - `set: { lost: true }`: no se viaja más hoy
    - Modos de tirada que se aplican por sí solos (`modeWhen`): `roll-modes.advantage` con `trip.weather: clear` o un guía con Rastreo 2 (`roles.guide.values.pathfinding`, un rol de viaje), `roll-modes.disadvantage` con `yesterday.lost: true`
    - El `modeUnless` de un modo de tirada: sin ventaja en los bosques, `place.terrain: [forest, dense-forest]`, salvo que un compañero tenga una maña (`party.highest.values.woodwise`, un valor hecho de las mañas que tiene, knacks.yaml), que la da allí
    - Una fila que quita una maña: la de la oscuridad, `unless: { party.highest.values.pathfinder: { gte: 1 } }`
    - Condiciones sobre el clima, sobre la oscuridad (`time.tags: dark`) y sobre estar fuera de toda región (`exists: false`)
  entries:
    fog: 'Perdidos en la niebla: hoy no avanzáis'
    dark: 'Perdidos en la oscuridad: os paráis hasta el alba, desanimados'
    wild: 'Aquí no hay referencias: os desviáis del rumbo'
    lost: 'Os habéis perdido: hoy no avanzáis'
    course: Mantenéis el rumbo
forage:
  name: Buscar comida
  description: |-
    Lo que encontráis al **buscar comida** (la acción _Buscar comida_), solo en bosques, campos, brezales y marismas: de **4 a 6** da comida para un día, **7 o más** para 2 a 4 días. Por la mañana (hasta las 11, cuando se mueve la caza) se tira con ventaja.

    **Enseña:**

    - Una comprobación en una acción propia del sistema (`at: actions.forage`)
    - Una característica y ventaja en la tirada: `1d6 + {{party.stats.survival}}`
    - Dados dentro de un valor (`days: '{{1d3+1}}'`), que vuelven a leer el texto y el efecto (`{{days}}`)
    - Una **parte del día del calendario**: ventaja por sí sola por la mañana (`modeWhen: { roll-modes.advantage: { time.part: morning } }`, de 06:00 a 11:00)
    - **Efectos**: `party.items.ration: 1`, una ración encontrada
  entries:
    nothing: Aquí no hay nada que comer
    some: Bayas y raíces para un día
    plenty: '¡Caza! Comida para {{days}} días'
tracks:
  name: Huellas
  description: |-
    Lo que el grupo lee en el suelo con **Buscar huellas**, donde el lugar es peligroso. Donde no lo es, no hay tirada: la acción lo dice con sus palabras, una vez gastada la hora.

    **Enseña:**

    - El `nothing` de una acción, para lo que el jugador no puede saber antes de intentarlo (`needs` lo diría gratis)
    - Una comprobación al acabar una acción, sobre un valor del lugar: `place.danger: { gte: 1 }`
    - Qué dejó huellas frescas según el terreno, como _¿Quién va?_ encuentra a sus enemigos (`place.terrain`), y un estado de la Compañía que se da solo para este lugar (`party.conditions.forewarned: 1`, el `lasts: places` de su hoja): un combate que empiece aquí empieza con los turnos de la Compañía
  entries:
    faint: 'Algo pasó por aquí hace días: la lluvia se ha llevado el resto'
    wolves: 'Huellas de lobo en el barro, de una manada, de menos de un día: la Compañía está avisada'
    outlaws: 'Huellas de botas y un fuego que no lleva un día frío: forajidos, y la Compañía está avisada'
    unknown: 'Huellas frescas de algo que nadie conoce, de menos de un día: la Compañía está avisada'
fishing:
  name: Pesca
  description: |-
    Lo que pica al **pescar** (la acción _Pescar_), junto a un lago, el mar o en la costa: un d6 **igual o menor que la Supervivencia** saca pescado para dos días; si no, de 1 a 3 para un día.

    **Enseña:**

    - Una comprobación en una acción propia del sistema (`at: actions.fish`), y una acción solo junto al agua (`around.water`)
    - Una tirada **por debajo** sobre la propia tirada de la tabla: `party.stats.survival: { gte: '{{roll}}' }`
    - El total de la tirada en los textos: `{{roll}}`
  entries:
    catch: 'Un {{roll}}, igual o menor que vuestra Supervivencia: buena pesca, comida para dos días'
    some: 'Un {{roll}}: unos pocos peces pequeños, comida para un día'
    nothing: 'Un {{roll}}: no pica nada'
hidden-path:
  name: Buscando la senda oculta
  description: |-
    Donde empieza una **senda oculta** (el Barrow-road, de las Barrow-halls a Hollow Gate; una grieta tras los huesos de una cripta, en los Deep Barrows), el grupo la busca cada vez que pasa, hasta encontrarla: tira un d6 más la **Supervivencia** del grupo; con 5 o más la encuentra, y desde entonces las rutas pueden tomarla.

    **Enseña:**

    - Una comprobación sobre las conexiones que salen del lugar, por tipo y estado: `place.connections.hidden-path.state: hidden`
    - Un efecto sobre ellas, guardado en el viaje y nunca en el mapa: `place.connections.hidden-path.state: found`
    - Una conexión que no se puede cruzar hasta entonces: `passable: { when: { connection.state: found } }`
    - Una conexión entre hexes lejanos: los hexes entre sus extremos al `multiplier` de su tipo, no al de las colinas
    - Filas del mismo rango distinguidas por una condición (`when: { place.floor: true }`): bajo tierra la misma tirada se cuenta con las palabras de una cripta
  entries:
    nothing-below: Polvo y huesos viejos contra la pared; nada detrás
    found-below: 'Una corriente fría entre los huesos: una grieta en la pared, tras ellos, lo bastante ancha para pasar'
    nothing: Brezo y piedras; ni rastro de la senda
    found: 'Mojones medio enterrados en el brezo: el Barrow-road'
toll:
  name: El peaje
  description: |-
    El peaje del **puente de Keld**, llegando por el camino: tira un d6; si saca el **Carisma** del grupo o menos, el guarda del puente os deja pasar; si no, se cobra un día de comida.

    **Enseña:**

    - Una comprobación con `all` / `tags` / `connections`
    - Una tirada por debajo de una característica en una condición: `party.stats.charisma: { gte: '{{1d6}}' }`, un solo d6 para las dos entradas (`when` en una, `unless` en la otra)
    - Un efecto con un número negativo: `party.items.ration: -1`, una ración gastada
    - Un efecto sobre una facción desde un viaje: pagar hace que la guarnición de Fort Keld os aprecie más (`factions.fort-keld.values.reputation: 1`, en un mapa con sus facciones)
  entries:
    pay: El guarda del puente se cobra un día de comida
    wave: Al guarda del puente le caéis bien y os deja pasar
shrine:
  name: En el santuario
  description: |-
    Un **santuario** junto al camino.

    **Enseña:**

    - La fatiga bajando: `fatigue: -2`
    - Una característica del grupo subiendo: `morale`
    - `once`: la bendición llega una sola vez
    - `notable: false`: una hora tranquila no es un momento importante, aunque la comprobación del santuario pause el viaje (espera en el panel del viaje, no delante)
  entries:
    blessing: 'Una voz responde a tu plegaria: el camino será amable'
    rest: Una hora tranquila en el santuario alivia las piernas
ford:
  name: Cruzar el vado
  description: |-
    **¿Sale bien el cruce?** El agua decide; la Supervivencia del grupo ayuda.

    **Enseña:**

    - Un **oráculo** cuya entrada viene de los bindings: `odds: even`
    - Variantes con sus propios dados
    - Valores del día que pone el clima: `{{today.fordModifier}}`, `today.fordImpossible`
    - Lo que llevan los compañeros: +1 con una cuerda (`{{min(party.stats.roped, 1)}}`, un dato que cuenta los compañeros con un objeto con la etiqueta `climbing`)
    - `set: { lost: true }`: hoy no se cruza
    - Un modo de tirada del propio pack: _Con cuidado_ (tres tiradas, se queda la del medio)
  inputs:
    odds:
      label: El agua
      labels: { low: Baja y mansa, even: Hasta la cintura, high: Crecida }
  entries:
    fine: Cruzáis sin problemas
    spate: 'El río baja crecido: hoy no se cruza'
    wet: 'A mitad de camino os arrastra la corriente: {{result}}'
    swept: 'La crecida os arrastra río abajo: {{result}}'
ford-mishap:
  name: Percance en el vado
  description: |-
    Lo que se lleva el río. Se tira desde las respuestas del _Vado_.

    **Enseña:** `set` sobre provisiones (`food`, `fodder`) y sobre `fatigue`, y efectos
    sobre el personaje que actúa (`acting.…`): quien guía el cruce se tuerce un tobillo.
  entries:
    food: se pierde un fardo de comida
    tired: salís del agua agotados
    fodder: el forraje se empapa y se echa a perder
    rocks: quien guía el cruce se golpea contra las rocas
hunger:
  name: Hambre
  description: |-
    **Acampar sin comida.** Cuanto más baja la moral, peor va.

    **Enseña:**

    - Una comprobación al acampar sobre las provisiones: `party.items.ration.count` menor que 1
    - La moral en la tirada y en una condición
    - `maxOccurrences` con `onExhausted: next`: tras la segunda deserción responde la entrada siguiente
    - Una característica que baja: `hirelings`
  entries:
    desertion: 'Por la noche, {{result}}'
    grumble: Tripas vacías, mal humor
    endure: Os apretáis el cinturón y cantáis para olvidarlo
desertion:
  name: Deserción
  description: |-
    Quién se va de noche y qué se lleva.

    **Enseña:**

    - Una cascada a _Nombres de las Marcas_
    - `once`: la nota llega una sola vez
  entries:
    food: '{{result}} se escabulle con el último pan'
    torch: '{{result}} se ha ido al alba, y las antorchas también'
    note: 'hay una nota clavada en tu mochila: «El Bosque Gris no es lugar para mí.»'
scouting:
  name: Explorando el camino
  description: |-
    La tira _Explorar el camino_: un d6 igual o menor que la habilidad que eligió el jugador, de quien actúa.

    **Enseña:** una prueba que nombra su habilidad con un parámetro (`acting.values[params.skill]`): una tabla para cada habilidad que la acción pueda preguntar; una tirada por debajo declarada como aquello contra lo que se tira la tabla (`against: { lte: '{{acting.values[params.skill]}}' }`): la mesa de dados dice _Necesitas 3 o menos_ al lanzarlos, y las entradas no necesitan rango, solo cómo fue (`against.success`); un estado de la Compañía que se da por dos lugares, este y el siguiente (`party.conditions.scouted: 2`, el `lasts: places` de su hoja), que hace que la tirada de encuentro del siguiente lugar tome por sí sola un modo de tirada (_¿Quién va?_, _Sobre aviso_).
  entries:
    clear: 'El camino está despejado ({{roll}} contra {{against.target}})'
    nothing: 'No hay nada que sacar de ahí fuera ({{roll}} contra {{against.target}})'
drive-off:
  name: Ahuyentándolos
  description: |-
    La tira _Ahuyentarlos_: 2d6 y la Supervivencia de quien actúa (la de la Compañía, sin compañeros) contra la Moral del enemigo más firme. Por encima, huyen todos; si no, aguantan y empieza el combate (sin compañeros, que no luchan, la Compañía se desanima y ellos se quedan).

    **Enseña:** una tirada contra el mejor de los presentes (`present.highest.values.morale`), como compara la suya _Explorando el camino_; una habilidad sumada a la tirada (`2d6 + {{acting.values.survival}}`) o en la condición, con aritmética (`'{{roll + party.stats.survival}}'`), tenga o no compañeros la Compañía (`party.members: { exists: … }`); todos los enemigos en desbandada a la vez (`present.all.conditions.routed`); un combate que empieza por un resultado (`encounter: start`).
  entries:
    routed: 'Rompen filas y huyen ({{roll}} contra {{present.highest.values.morale}})'
    stand: 'Aguantan, y se os echan encima ({{roll}} contra {{present.highest.values.morale}})'
    routed-alone: 'Rompen filas y huyen ({{roll + party.stats.survival}} contra {{present.highest.values.morale}})'
    hold: 'No hay quien los eche, y la Compañía se desanima ({{roll + party.stats.survival}} contra {{present.highest.values.morale}})'
look-chest:
  name: Examinándolo
  description: |-
    La tira _Examinarlo_ ante un cofre con una aguja en la cerradura: 2d6 y la Supervivencia de quien actúa. Con 8 o más, la aguja sale; si no, le pincha, por su daño, y queda gastada.

    **Enseña:** una tabla tirada sobre una cosa presente que no lucha, elegida por su acción (`characters[params.chest].values.needle`), leída en su texto y cambiada por sus efectos; quien actúa, dañado por ella (`acting.values.health`).
  entries:
    drawn: 'Una aguja en la cerradura, sacada con cuidado ({{roll}})'
    pricked: 'La aguja pincha a {{acting.name}} ({{roll}}): {{characters[params.chest].values.needle}} de daño'
pick-door:
  name: Forzando la puerta
  description: |-
    La tira _Abrir la cerradura_ ante una puerta cerrada con llave al alcance (la de la bodega del Hurón Mojado): 2d6 y el Sigilo de quien actúa, contra 7 más la Cerradura de la puerta. Si lo logra, esa puerta queda abierta el resto del viaje; si no, la cerradura aguanta.

    **Enseña:** una tirada para igualar o superar un valor de la conexión elegida (`against: { gte: '{{7 + place.connections[params.door].lock}}' }`), una puerta al alcance (`from: place.connections.door.near`) y un efecto solo sobre esa puerta (`'place.connections[params.door].state': open`).
  entries:
    open: 'La cerradura cede ({{roll}} contra {{against.target}})'
    holds: 'La cerradura aguanta ({{roll}} contra {{against.target}})'
pick-chest:
  name: Forzando la cerradura
  description: |-
    La tira _Forzar la cerradura_ ante un cofre cerrado: 2d6 y el Sigilo de quien actúa, contra 7 más la Cerradura del cofre. Si lo logra, se abre; una pifia (4 o menos) hace saltar su aguja, si la tiene; si no, la cerradura aguanta.

    **Enseña:** una tirada para igualar o superar un valor de la cosa elegida (`against: { gte: '{{7 + characters[params.chest].values.lock}}' }`), y un rango a su lado: un fallo de 4 o menos es una pifia (`range: 2-4` con `against.success: false`), leída antes que el fallo sin más.
  entries:
    open: 'La cerradura cede ({{roll}} contra {{against.target}})'
    sprung: 'Una pifia, y salta la aguja: {{characters[params.chest].values.needle}} de daño a {{acting.name}}'
    holds: 'La cerradura aguanta ({{roll}} contra {{against.target}})'
chest-goods:
  name: En el cofre
  description: |-
    Lo que guardaba un cofre de ajuar, tirado al abrirlo: polvo, plata vieja o el oro de los antiguos reyes.

    **Enseña:** una tabla tirada cuando una cosa presente se va (`on: present.leave`), solo para una que se abrió (`when: { acting.template: grave-chest, acting.conditions: opened }`), leída actuando como ella; un objeto dado sin identificar a quien lleve cosas en la Compañía (`party.items.cordial.unknown: 1`: _Un frasco tapado_).
  entries:
    dust: Polvo y tela podrida
    flask: Un frasco tapado entre el polvo
    silver: '{{coins}} monedas de plata vieja'
    gold: '{{crowns}} coronas de oro de los antiguos reyes'
cordial:
  name: El cordial bebido
  description: |-
    Lo tira _Bebérselo_, el **Usar** del cordial de las brujas: con un 1 se había echado a perder, y la Compañía está más cansada (+1 de fatiga); si no, se le va la fatiga.

    **Enseña:** una tabla tirada por la acción que hace el **Usar** de un objeto (`use: actions.drink`) cuando el objeto usado es el cordial (`'acting.items[params.item].id': cordial`, el usado leído como `params.item`, su clave), el propio frasco gastado por el siguiente paso de esa acción (`acting.items[params.item]: -1`).
  entries:
    turned: 'Se había echado a perder: amargo, y la Compañía queda más cansada'
    good: 'Verde y amargo: se va la fatiga de la Compañía'
taste:
  name: Un sorbo con cuidado
  description: |-
    Lo tira _Probar un frasco_: 2d6 y la Supervivencia de quien lo prueba. 8 o más, se sabe qué es el frasco, el cordial de las brujas; si no, sabe a hierbas, y a nada que conozcan.

    **Enseña:** un objeto sin identificar que identifica un efecto (`acting.items.cordial.known: 1`), con su nombre verdadero a la vista y en el diario desde entonces.
  entries:
    known: 'Hierbas del Bosque Gris, y algo más áspero: el cordial de las brujas ({{roll}})'
    unknown: 'Hierbas, y nada que conozcan ({{roll}})'
