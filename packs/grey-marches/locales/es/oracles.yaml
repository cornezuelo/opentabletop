gates:
  name: ¿Nos dejarán entrar?
  description: A las puertas de Vado Ceniza o de Fuerte Keld. Cómo llegáis cambia la respuesta.
  inputs:
    arrival:
      label: Llegáis como
      labels: { friends: Amigos conocidos, strangers: Desconocidos, armed: Una banda armada }
  entries:
    yes: 'Sí, y {{result}}'
    wait: Esperad a la mañana, fuera de las murallas
    no: No. Aparecen arcos en la muralla
gate-news:
  name: Noticias en la puerta
  entries:
    midsummer: todo el pueblo baila por Pleno Verano y las puertas están abiertas
    rumour: 'el guardia os susurra un rumor: {{result}}'
    work: 'hay trabajo: alguien paga {{2d6}} monedas de plata por una escolta'
    feast: es día de fiesta; la posada está llena
ferry:
  name: La barca
  entries:
    calm: '{{token.name}} os cruza el Lago Salado por {{token.fare}} monedas de plata cada uno'
    secret: '{{token.name}} rechaza las monedas: quiere un secreto a cambio'
    empty: 'El embarcadero está vacío: selecciona a la barquera para hablar con ella'
inn:
  name: En El Hurón Mojado
  description: La posada de Ashford. Lo que gastas cambia la noche.
  inputs:
    spend:
      label: Gastas
      labels: { nothing: Nada, round: Una ronda para todos, feast: Un banquete }
  entries:
    cold: Miradas frías y un rincón junto a la puerta
    overheard: 'Oyes algo: {{result}}'
    quiet: Una noche tranquila; nadie pregunta quiénes sois
    brawl: 'Se arma una pelea: {{result}}'
    talk: 'La sala os acoge: {{result}}'
    hireling: '{{result}} bebe con vosotros y se une a la compañía'
    feast: 'Un banquete para recordar: todos duermen bien'
    short: No hay bastante en la despensa para un banquete esta noche
