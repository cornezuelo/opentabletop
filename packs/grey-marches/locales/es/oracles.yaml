gates:
  name: ¿Nos dejarán entrar?
  description: |-
    A las puertas de **Vado Ceniza** o de **Fuerte Keld**: cómo llegáis cambia la respuesta.

    **Enseña:**

    - Un **oráculo** con una entrada: cómo llegáis
    - Una variante con sus propios dados
    - Un valor del icono del lugar en el mapa: `{{icon.guards}}` es 0 en Vado Ceniza y 2 en Fuerte Keld (selecciona el hex antes de tirar)
    - Respuestas que tiran otra tabla
  inputs:
    arrival:
      label: Llegáis como
      labels: { friends: Amigos conocidos, strangers: Desconocidos, armed: Una banda armada }
  entries:
    yes: 'Sí, y {{result}}'
    wait: Esperad a la mañana, fuera de las murallas
    no: No. Aparecen arcos en la muralla
gate-news:
  name: Noticias en la puerta
  description: |-
    Lo que oís en la puerta.

    **Enseña:**

    - Una **fiesta** del calendario como condición: `holidays: midsummer` (solo entonces, y entonces casi seguro)
    - Dados en el texto: `{{2d6}}`
    - Una cascada a un generador
  entries:
    midsummer: todo el pueblo baila por Pleno Verano y las puertas están abiertas
    rumour: 'el guardia os susurra un rumor: {{result}}'
    work: 'hay trabajo: alguien paga {{2d6}} monedas de plata por una escolta'
    feast: es día de fiesta; la posada está llena
ferry:
  name: La barca
  description: |-
    La barca de Brenna sobre el **Lago Salado**. Selecciona su token en el mapa y tira esto desde el panel Oracle.

    **Enseña:**

    - Los **valores de un token**: `{{token.name}}`, `{{token.fare}}`
    - Condiciones `exists`
    - Una entrada para cuando no está seleccionada
  entries:
    calm: '{{token.name}} os cruza el Lago Salado por {{token.fare}} monedas de plata cada uno'
    secret: '{{token.name}} rechaza las monedas: quiere un secreto a cambio'
    empty: 'El embarcadero está vacío: selecciona a la barquera para hablar con ella'
inn:
  name: En El Hurón Mojado
  description: |-
    **El Hurón Mojado**, la posada de Vado Ceniza: lo que gastas cambia la noche. En el Hexmapper, **Aplicar al viaje** bajo el resultado cambia el grupo.

    **Enseña:**

    - Valores del grupo en la tirada (`{{party.stats.morale}}`) y en condiciones (`party.resources.food`)
    - Entradas para cuando no hay viaje: `party: { exists: false }`
    - `maxOccurrences`: un mercenario se une dos veces como mucho
    - Cascadas a tablas y generadores
    - **Efectos** en el grupo: comida, moral, fatiga y mercenarios
  inputs:
    spend:
      label: Gastas
      labels: { nothing: Nada, round: Una ronda para todos, feast: Un banquete }
  entries:
    cold: Miradas frías y un rincón junto a la puerta
    overheard: 'Oyes algo: {{result}}'
    quiet: Una noche tranquila; nadie pregunta quiénes sois
    brawl: 'Se arma una pelea: {{result}}'
    talk: 'La sala os acoge: {{result}}'
    hireling: '{{result}} bebe con vosotros y se une a la compañía'
    feast: 'Un banquete para recordar: todos duermen bien'
    short: No hay bastante en la despensa para un banquete esta noche
