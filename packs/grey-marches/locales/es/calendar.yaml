calendar/marcher-reckoning:
  name: El cómputo de las Marcas
  description: |-
    Cómo cuentan el tiempo las Marcas: doce meses de treinta días en cuatro estaciones, una
    semana de siete días, dos lunas, las fiestas que conocen las tablas y las partes del día
    de un marcano.

    **Enseña:** meses con sus estaciones, días de la semana, lunas con sus ciclos, fiestas,
    y dos divisiones del día propias: sus partes (`divisions: { part: … }`, leída como
    `time.part`, con la etiqueta `dark` en la hora gris y la noche) y guardias solo de noche
    (`watch`, con un hueco de día: `until`).
  divisions:
    part:
      name: Parte del día
      parts:
        grey-hour:
          name: la hora gris
        morning:
          name: la mañana
        midday:
          name: el mediodía
        afternoon:
          name: la tarde
        evening:
          name: el atardecer
        night:
          name: la noche
    watch:
      name: Guardias
      parts:
        first:
          name: la primera guardia
        middle:
          name: la guardia de en medio
        last:
          name: la última guardia
  months:
    thaw:
      name: Deshielo
    sowing:
      name: Siembra
    blossom:
      name: Floración
    highsun:
      name: Altosol
    haying:
      name: Siega
    harvest:
      name: Cosecha
    leaffall:
      name: Caída de la hoja
    mists:
      name: Brumas
    frostfall:
      name: Escarcha
    deepwinter:
      name: Invierno hondo
    wolfmoon:
      name: Luna del lobo
    lastsnow:
      name: Última nieve
  weekdays:
    moonday:
      name: Lunadía
    ironday:
      name: Hierrodía
    wellday:
      name: Pozodía
    thornday:
      name: Espinodía
    hearthday:
      name: Hogardía
    marketday:
      name: Mercadía
    restday:
      name: Descansodía
  moons:
    pale:
      name: la Luna Pálida
    ember:
      name: la Luna Ascua
  holidays:
    first-thaw:
      name: Primer Deshielo
    midsummer:
      name: Pleno Verano
    harvest-home:
      name: Fin de Cosecha
    long-night:
      name: La Noche Larga
