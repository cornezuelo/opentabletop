treasure:
  name: ¿Qué hay en el tesoro?
  description: |-
    Lo que guarda un **tesoro**.

    **Enseña:**

    - Dados de porcentaje: `d100`, también `d%`
    - Dados en el texto
    - Cascadas a _Rumores_ y _Un premio raro_
  entries:
    coins: '{{3d6}} monedas de plata'
    gems: '{{1d4}} gemas de {{2d6+4}} monedas de plata cada una'
    map: 'Un mapa de las Colinas Huecas; una nota dice que {{result}}'
    potion: Un frasco del cordial de las brujas (quita toda la fatiga)
prize:
  name: Un premio raro
  description: |-
    Un **premio raro**.

    **Enseña:** `maxOccurrences`: la Espada de Keld aparece dos veces como mucho; después solo queda oro
  entries:
    sword: La Espada de Keld, perdida hace cien años
    gold: '{{2d6+6}} coronas de oro de los antiguos reyes'
ruin-delve:
  name: Explorar una ruina
  description: |-
    Qué guarda una **ruina** y quién la vigila.

    **Enseña:**

    - Todos los tipos de campo de un generador: una tabla, dados (`2d6kl1`: el más bajo), `d%` y un valor fijo con plantilla
    - Un campo solo cuando otro lo dice: `when`; y otro salvo cuando otro lo dice: `unless`
    - Una tabla tirada con su propio contexto: el guardián, de noche y con peligro 3
    - Los textos fijos de los campos, traducidos en `locales/` (`fields:`)
  template: 'Las ruinas de {{site}} ({{rating}}, {{untouched}}% intactas).{{fresh}}{{trap}} Dentro: {{loot}}. La guarda: {{guardian}}.'
  fields:
    trap: ' Una trampa guarda la entrada.'
    fresh: ' Nadie ha puesto un pie aquí en siglos.'
    rating: 'peligro {{danger}} de 6'
