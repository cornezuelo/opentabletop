treasure:
  name: ¿Qué hay en el tesoro?
  description: |-
    Lo que guarda un **tesoro**.

    **Enseña:**

    - Dados de porcentaje: `d100`, también `d%`, que se ofrecen leídos de las dos maneras (_Una búsqueda con suerte_: un modo de tirada con `swap`)
    - Lo que enseñan los dados (`dice.doubles`): unos dobles (11, 22… 00) encuentran un escondrijo antes que nada
    - Dados tirados una vez con `set`, leídos por el texto y los `effects`: la plata hallada es la que recibe la Compañía; dados que explotan (`3d6!`: un seis se vuelve a tirar y se suma)
    - Cascadas a _Rumores_ y _Un premio raro_
  entries:
    cache: 'Un escondrijo bajo el suelo: {{coins}} monedas de plata, y un premio raro'
    coins: '{{coins}} monedas de plata'
    gems: '{{gems}} gemas de {{worth}} monedas de plata cada una'
    map: 'Un mapa de las Colinas Huecas; una nota dice que {{result}}'
    potion: Un frasco del cordial de las brujas (quita toda la fatiga)
prize:
  name: Un premio raro
  description: |-
    Un **premio raro**.

    **Enseña:** `maxOccurrences`: la Espada de Keld aparece dos veces como mucho; después solo queda oro. Un objeto que da un resultado: quien la encuentra (`acting.items.sword-of-keld: 1`) recibe la espada del equipo (items.yaml).
  entries:
    sword: La Espada de Keld, perdida hace cien años
    gold: '{{crowns}} coronas de oro de los antiguos reyes'
ruin-delve:
  name: Explorar una ruina
  description: |-
    Qué guarda una **ruina** y quién la vigila.

    **Enseña:**

    - Todos los tipos de campo de un generador: una tabla, dados (`2d6kl1`: el más bajo), `d%` y un valor fijo con plantilla
    - Un campo solo cuando otro lo dice: `when`; y otro salvo cuando otro lo dice: `unless`
    - Una tabla tirada con su propio contexto: el guardián, de noche y tan peligroso como la ruina (los campos ven los anteriores: `danger`)
    - Los textos fijos de los campos, traducidos en `locales/` (`fields:`)
    - Tirado por un paso de una acción en un viaje (`roll: generator.ruin-delve`, _Explorar la ruina_), sin comprobación alrededor: lo que fijan, cambian y pausan sus tablas llega al viaje (un guardián que lo detiene, la moral que cuesta)
  template: 'Las ruinas de {{site}} ({{rating}}, {{untouched}}% intactas).{{fresh}}{{trap}} Dentro: {{loot}}. La guarda: {{guardian}}.'
  fields:
    trap: ' Una trampa guarda la entrada.'
    fresh: ' Nadie ha puesto un pie aquí en siglos.'
    rating: 'peligro {{danger}} de 6'
