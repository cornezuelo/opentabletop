items/gear:
  name: El equipo de la Compañía
  description: |-
    Equipo para el camino: raciones, cuerda para los vados, antorchas para marchar de noche,
    una mochila, una cota de malla, el cordial de las brujas, una capa de caminante del pantano, y la Espada de Keld si el tesoro llega a darla.

    **Enseña:** un catálogo de objetos (`kind: items`): objetos con etiquetas (`climbing`,
    `light`) que leen las reglas (la tirada del vado cuenta los compañeros con cuerda,
    `party.stats.roped`; la marcha nocturna gasta los usos de las antorchas), números para los
    campos de la hoja (huecos, usos, armadura), dónde cabe un objeto
    (`fits: { place.tags: worn }`), un contenedor (`holds: { room: 6, tags: [pack], over: allow }`,
    que admite más de su sitio aunque los lugares de la hoja no), un
    objeto que da el resultado de una tabla, la comida del grupo como objetos (raciones, que
    come el grupo en conjunto: `party.items.ration`), y un objeto que se lleva sin identificar
    hasta que se sabe qué es (el cordial, hallado como _Un frasco tapado_, `unknown:`), con un
    **Usar** que hace una de las acciones del sistema (`use: actions.drink`); y una capa que
    suma al Sigilo de quien la lleva puesta (su `stealth: 1`, el `plus` de la hoja).
  items:
    ration:
      name: Ración
      description: La comida de un día para uno. El grupo come una por boca al acabar cada día, primero de las reservas de la Compañía.
    rope:
      name: Cuerda
      description: Quince metros de cáñamo. Un compañero con cuerda facilita el vado (+1 al cruce).
    torch:
      name: Antorcha
      description: Brea y trapo, tres horas de luz. Una marcha nocturna gasta una hora de la antorcha de cada compañero.
    backpack:
      name: Mochila
      description: Se lleva a la espalda; guarda seis huecos de equipo, y más si la atiborras.
    mail:
      name: Cota de malla
      description: Pesada, y solo sirve puesta. Su dado de desgaste empieza en d8 y baja según la desgarran los combates.
    cordial:
      name: El cordial de las brujas
      description: Verde y amargo, preparado en el Bosque Gris. Al beberlo se va toda la fatiga de la Compañía; pero uno de cada seis frascos se ha echado a perder, y la cansa en vez de eso.
      unknown:
        name: Un frasco tapado
        description: Vidrio verde, sellado con cera. Huele a hierbas, o a algo pasado. Pruébalo con cuidado, o bébetelo y verás.
    fen-cloak:
      name: Una capa de caminante del pantano
      description: Lana gris verdosa que toma el color de los juncos y la niebla. Puesta, +1 al Sigilo.
    sword-of-keld:
      name: La Espada de Keld
      description: Perdida hace cien años; el tesoro se la da a quien la encuentre.
