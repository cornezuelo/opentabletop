# The Grey Marches as a travel system. Every part of travel rules and bindings is used;
# comments say what each one shows. Conditions use the full names of what they read
# (`place.terrain`, `time.tags`, `trip.mode`, `today.refusing`…): see What tables see.
# Play it on the example map (Map: Maps → Example maps, then Play → With rules),
# without a map in the Travel app, or edit it in Systems.
kind: travel-rules
id: default
# The scale it's played at (travel.hexKm): 10 km a hex, so a day on foot (25 km) crosses
# two or three; maps with this system take it unless they set their own. Its day is named
# by parts of its calendar's (calendar.yaml): trips start as the morning begins (06:00),
# and from the night (20:00) a party that can't march camps (the halt; the night is
# tagged `dark`, as is the grey hour before the morning). Going on by itself (the world
# clock, a travel order), the party marches to its destination whenever it can (onward:
# the action march, with its parameter).
travel:
  hoursPerDay: 8
  hexKm: 10
  start: time.part.morning
  onward: { do: actions.march, with: { until: destination } }
  halt: { at: time.part.night, do: actions.camp }
terrains:
  plains: { multiplier: 1 }
  steppe: { multiplier: 1 }
  farmland: { multiplier: 1 }
  heath: { multiplier: 0.75 }
  coast: { multiplier: 1 }
  forest: { multiplier: 0.5 }
  dense-forest: { multiplier: 0.33 }
  hills: { multiplier: 0.5 }
  mountains: { multiplier: 0.33 }
  # Peaks: the high passes open only in summer, and close again in snow or storm
  # (passable as a condition on the hex entered and the moment: season, weather…).
  peaks:
    multiplier: 0.25
    passable: { when: { time.season: summer }, unless: { trip.weather: [snow, storm] } }
  swamp: { multiplier: 0.33 }
  marsh: { multiplier: 0.5 }
  # Lakes freeze hard in the two coldest months of the calendar (month: …): then they're
  # crossed on foot, slowly; the rest of the year they're water like the sea.
  lake:
    multiplier: 0.5
    passable: { when: { time.month: [deepwinter, wolfmoon] } }
# Lakes and the sea are water on the map (Edit palette → Water): nobody walks on them…
water: { passable: false }
defaultTerrain: { multiplier: 1 }
connections:
  road: { multiplier: 1.5 }
  trail: { multiplier: 1.2 }
  # A ford drawn on the map (Map's Connections: Stonewater Ford in the Hollow Hills): an hour
  # to cross whatever the speed (minutes), and shut on a day a storm makes it impassable
  # (passable reads today's value the weather set): routes go round, or stop before it.
  ford:
    name: Ford
    description: An hour to cross; impassable on a day of storm.
    minutes: 60
    passable: { unless: { today.fordImpossible: true } }
modes:
  foot: { name: On foot, kmPerDay: 25 }
  # Horses go twice as fast and eat fodder (the eat action below, at the end of each day).
  horse: { name: On horseback, kmPerDay: 50 }
  # …but a boat only goes on water and along the coast (through: a condition on each hex it
  # enters), and is only boarded at the water's edge or at a ferry (when: where the party is).
  boat:
    name: By boat
    kmPerDay: 40
    through: { any: [{ place.water: true }, { place.terrain: coast }] }
    when: { any: [{ place.water: true }, { place.terrain: coast }, { place.tags: ferry }] }
  # A cart only rolls along roads (through: the roads of each step, `trip.connections`).
  cart:
    name: By cart
    description: Slow and steady, and only along the roads.
    kmPerDay: 30
    through: { trip.connections: road }
weather:
  rain: { speed: 0.75 }
  fog: { speed: 0.75 }
  snow: { speed: 0.5 }
  storm: { speed: 0 }
# Values of the day this system declares: results set them (`set: { lost: true }`), they
# last until the day ends (tables read them the day after as `yesterday.lost`) and block
# what they name while they hold: lost, there's no more travel today.
values:
  lost:
    name: Lost
    description: 'The party has lost its way (or can’t cross): no more travel today.'
    blocks: [travel.move]
  # Set by the weather (sky.yaml, the weather tables), read by the ford the same day: only the
  # values a system declares last the day.
  fordModifier:
    name: Ford modifier
    description: 'Added to the ford’s roll today: rain swells the river, frost hardens the banks.'
  fordImpossible:
    name: The ford is impassable
    description: 'A storm makes the ford impossible to cross today.'
  # Set by the weather (sky.yaml: falling snow): it blocks a way of travelling, so the
  # horses stay behind (on foot, by boat or by cart the trip goes on).
  snowbound:
    name: Deep snow
    description: Too deep for the horses today.
    blocks: [modes.horse]
  # Set by the eat action when the food ran out; read the next day as `yesterday.hungry`.
  hungry:
    name: Went hungry
    description: The party ended the day without enough to eat.
  # Set by the night march: the party may march on in the dark until the day ends.
  torchlit:
    name: By torchlight
    description: Marching on after nightfall, until midnight.
  # Set by the hirelings' grumbling at dawn, cleared by talking them round.
  refusing:
    name: The hirelings refuse to march
    description: Until someone talks them round (Talk to the hirelings).
    blocks: [travel.move]
  # Set by the fishing table when nothing bites; read by the fish action's step after its roll.
  skunked:
    name: Nothing bit
    description: A day's fishing for nothing.
# The party's actions, each described as steps (do), in order, each one only when its
# condition holds. Camp and rest are actions like the system's own.
actions:
  # Marching is an action like the rest: its step `travel.move` moves the party along the
  # route while its conditions hold, checked as it marches. By day for the day's marching
  # hours, as usual (the `{{…}}` variables are the system's own), or after a night march by
  # torchlight (a value of the day) until the day ends. How far is a parameter (`params`):
  # its button offers the choices (to the destination, one hex, three hexes), and its step
  # reads the one chosen (`{{params.until}}`).
  march:
    name: March
    description: 'March along the route: by day for 8 hours, or after a night march by torchlight until midnight. To the destination, one hex or three hexes.'
    params:
      until:
        name: How far
        choices:
          - { id: destination, name: To the destination }
          - { id: place, name: One hex }
          - { id: 3, name: Three hexes }
    when:
      any:
        - { time.tags: { not: dark }, trip.marched: { lt: '{{system.hoursPerDay}}' } }
        - { today.torchlit: true }
    do:
      - { travel.move: '{{params.until}}' }
  # Camping: sleep until dawn (at midnight the day ends: the eat action below runs), and a
  # fed night eases fatigue: unless the rations ran out during the night (they hit their
  # minimum, `trip.below: party.items.ration`).
  # Night checks (at: camp) come first. Only with food left and not exhausted (`when` on the
  # party: fatigue under the party's own Endurance, a variable): otherwise the night passes
  # without camping (no night checks, no relief), as the halt is camp and can't be taken.
  camp:
    name: Camp
    description: 'End the day: the night’s checks, and you wake at dawn. A night after a day with enough to eat takes off 1 fatigue and gives each companion 1 health back; with morale 1 or less, the watch is restless: +1 fatigue. Only with food left and fatigue under your Endurance: otherwise the night passes in the open, without rest.'
    when:
      {
        party.items.ration.count: { gte: 1 },
        party.stats.fatigue: { lt: '{{party.stats.endurance}}' },
      }
    do:
      - { time: time.part.morning }
      - { unless: { trip.below: party.items.ration }, effects: { party.stats.fatigue: -1 } }
      # …and gives every companion a point of health back (an effect on every member).
      - unless: { trip.below: party.items.ration }
        effects: { party.members.values.health: 1 }
      # A night out of the saddle eases the saddle-sore (a condition cleared on every member).
      - { unless: { trip.mode: horse }, effects: { party.members.conditions.saddle-sore: false } }
      # A night watch kept by a party in low spirits: nobody really sleeps.
      - { when: { party.stats.morale: { lte: 1 } }, effects: { party.stats.fatigue: 1 } }
  # A rest is two hours and takes off one point of fatigue (an effect on the fatigue stat),
  # only by day (not `dark`: the night is for camping), with something to eat and before
  # exhaustion (the party's Endurance): the button is off otherwise.
  rest:
    name: Rest
    description: Two hours without marching; takes off 1 fatigue and the Company is no longer shaken. Only by day, with food left and fatigue under your Endurance.
    when:
      {
        time.tags: { not: dark },
        party.items.ration.count: { gte: 1 },
        party.stats.fatigue: { lt: '{{party.stats.endurance}}' },
      }
    do:
      - { time: 120 }
      # A condition of the party's own sheet, cleared.
      - { effects: { party.stats.fatigue: -1, party.conditions.shaken: false } }
  # The system's own action: foraging takes three hours and halves the rest of the day's
  # march, once a day; its check (below, at: actions.forage.done) is rolled where the party
  # stands, once the three hours are done.
  # `nothing` is what the journal says where that check doesn't apply (hills, mountains…).
  # Only by day, and not in a storm: `when` / `unless` read the moment and today's values
  # (and the map, the party…).
  forage:
    name: Forage for food
    description: 'Three hours looking for food (once a day, by day): the rest of the day’s march is halved. Only in forest, dense forest, plains, farmland, heath and marsh: roll 1d6 + Survival (twice, keep the best); 4–6 finds food for a day, 7 or more 2–4 days. Elsewhere there is nothing to find. Not in a storm.'
    nothing: 'nothing to forage on {terrain}: only woods, fields, heath and marsh give food'
    when: { time.tags: { not: dark } }
    unless: { trip.weather: storm }
    do:
      - { time: 180 }
      - { travel.speed: 0.5 }
    oncePerDay: true
  # Nobody presses this one: the system takes it by itself as each day ends (on: time.day-end),
  # whether the party camped or not. A ration per mouth, one more per hireling (an amount
  # that is a variable: as many as the stat says), taken from the Company's stores first and
  # then from whoever carries most (`party.items`: the party's items and its companions'
  # together, shared out as the companion sheet says), and fodder when riding (a value of
  # the Company's sheet, in a step with a condition on the way of travelling).
  eat:
    name: Eat
    description: 'At the end of each day, in camp or not: 1 ration per mouth (each companion, or 1 for a party without them), 1 more for each hireling, from the Company’s stores first and then from whoever carries most; and 1 fodder on horseback. With none left, the party goes hungry.'
    on: time.day-end
    do:
      - { effects: { party.items.ration: '-{{party.stats.mouths}}' } }
      - when: { party.stats.hirelings: { gte: 1 } }
        effects: { party.items.ration: '-{{party.stats.hirelings}}' }
      - { when: { trip.mode: horse }, effects: { party.values.fodder: -1 } }
      # If the rations ran out (they hit their minimum), the day is remembered as hungry.
      - { when: { trip.below: party.items.ration }, set: { hungry: true } }
  # Pushing on: half as fast again for the rest of the day, at the cost of fatigue, and
  # off at once (it takes the march, with its parameter: an action taking another with
  # `do:` and `with:`); only by day with marching hours left, while the party is fresh
  # enough (a condition on a stat), once a day; a shaken Company (a condition of its sheet
  # that blocks it) can't.
  forced-march:
    name: Forced march
    description: 'Push on: the rest of today’s march goes half as fast again, but +1 fatigue, and the party marches on to its destination. Only by day with marching hours left, with fatigue under 2 and the Company not shaken, once a day.'
    when:
      {
        time.tags: { not: dark },
        trip.marched: { lt: '{{system.hoursPerDay}}' },
        party.stats.fatigue: { lt: 2 },
      }
    oncePerDay: true
    do:
      - { travel.speed: 1.5 }
      - { effects: { party.stats.fatigue: 1 } }
      - { do: actions.march, with: { until: destination } }
  # At a shrine (a tag of the hex) under the full Ember Moon (the calendar): a rite. Its
  # button only shows then (hideWhenUnavailable), day or night.
  rite:
    name: Rite of the Ember Moon
    description: 'At a wayside shrine, only while the Ember Moon is full: two hours of prayer. Morale +2, fatigue gone, every companion’s dread emptied and their nerve a die higher.'
    when: { all: [{ place.tags: shrine }, { time.moons.ember: full }] }
    hideWhenUnavailable: true
    oncePerDay: true
    do:
      - { time: 120 }
      - effects:
          {
            party.stats.morale: 2,
            party.stats.fatigue: '=0',
            party.members.values.dread: '=0',
            party.members.values.nerve: 1,
          }
  # The system's own: at dawn after a hungry day, hirelings (if any) refuse to march
  # (a value that blocks travel) until someone talks them round.
  grumble:
    name: The hirelings grumble
    description: After a day without enough to eat, the hirelings refuse to march.
    on: time.part.morning
    when: { all: [{ yesterday.hungry: true }, { party.stats.hirelings: { gte: 1 } }] }
    do:
      - { set: { refusing: true } }
      # A line of the system's own in the journal (`say`); its `id` names it for translations.
      - { id: sulk, say: 'The hirelings sit by the cold fire and won’t shoulder their packs.' }
  # Talking them round: a d6 at or under morale (a roll in a step's condition, the same
  # all through the talk); otherwise one walks off and the rest follow.
  parley:
    name: Talk to the hirelings
    description: 'An hour of talk: roll a d6. At or under your morale they march again; otherwise one of them walks off, and the rest follow you grudgingly.'
    when: { today.refusing: true }
    hideWhenUnavailable: true
    do:
      - { time: 60 }
      - unless: { party.stats.morale: { gte: '{{1d6}}' } }
        effects: { party.stats.hirelings: -1 }
      - { set: { refusing: false } }
  # Marching on in the dark instead of camping: it lights the torches (a value of the day
  # the march above admits) and marches on (`do: actions.march`) until midnight, at the cost of fatigue (and more if the day's
  # hours were marched already: the Long day check below); each hex entered in the dark
  # rolls to get lost, and night encounters (the checks below, `time.tags: dark`).
  # Only in the evening (from nightfall: `time.hour` against when its calendar's night starts, `{{system.part.night}}`), so
  # its button only shows then.
  night-march:
    name: Night march
    description: 'From nightfall, light the torches (each companion’s burns an hour) and march on until midnight, but +1 fatigue (and +1 more as the day ends if it was marched past its 8 hours); each hex entered in the dark off the road may get you lost or bring a night encounter. Once a day, not in a storm, with fatigue under 4.'
    when: { time.hour: { gte: '{{system.part.night}}' }, party.stats.fatigue: { lt: 4 } }
    unless: { trip.weather: storm }
    hideWhenUnavailable: true
    oncePerDay: true
    do:
      - { set: { torchlit: true } }
      # Each companion's torch (items.yaml) burns an hour: at 0 uses it's spent.
      - { effects: { party.stats.fatigue: 1, party.members.items.torch.uses: -1 } }
      - { do: actions.march }
  # Once a trip: what the trip has done so far (`trip.km`, the hexes entered at the map's
  # scale; `trip.taken.tale`, the times this action was taken, 0 until it is). After 50 km
  # on the road, an evening of tales around the fire; its button only shows then.
  tale:
    name: Tales of the road
    description: 'Once a trip, after 50 km on the road, from nightfall: tales around the fire until the middle watch. Morale +1.'
    when: { trip.km: { gte: 50 }, trip.taken.tale: { lt: 1 }, time.tags: dark }
    hideWhenUnavailable: true
    do:
      # Until a part of the calendar's day: the middle watch (23:00).
      - { time: time.watch.middle }
      - { effects: { party.stats.morale: 1 } }
  # Progress by a move, not by marching (a `travel.advance` step): on the road, by day, a carter
  # takes the party two hexes along its route in two hours. Once a day; hidden off the road.
  carter:
    name: Ride with a carter
    description: 'On a road, by day: a carter going your way takes you two hexes along your route in two hours. Once a day.'
    when: { time.tags: { not: dark }, trip.connections: road }
    hideWhenUnavailable: true
    oncePerDay: true
    do:
      - { time: 120 }
      - { travel.advance: 2 }
  # Next to water (`around.water`: one of the hexes around is water) or on the coast: two
  # hours with a line, by day, once a day; the Fishing check (at: fish) rolls a d6 under
  # Survival. Hidden elsewhere.
  fish:
    name: Fish
    description: 'Next to a lake, the sea or on the coast, by day: two hours with a line, once a day. Roll a d6: at or under your Survival, fish for two days; 1 to 3 otherwise, for one; else nothing bites.'
    when: { time.tags: { not: dark }, any: [{ around.water: true }, { place.terrain: coast }] }
    hideWhenUnavailable: true
    oncePerDay: true
    # Its check is rolled by a step once the two hours are done (`roll:`), and the step after
    # it waits for the result and sees what it set (`today.skunked`).
    do:
      - { time: 120 }
      - { roll: checks.FISHING_CHECK_REQUIRED }
      - when: { today.skunked: true }
        id: skunked
        say: 'Not a bite all day: tonight the Company eats from its packs.'
  # Market day: in a market town (a tag of the hex) on the calendar's Marketday, or when
  # the world clock says it's market day there (an event of the world, `world.events`, by
  # its id: the example map's `market-day`). Two hours of trading for supplies, once a day; hidden otherwise.
  market:
    name: Market day
    description: 'In a market town, on Marketday (or on the world clock’s market day): two hours of trading. Food +3 and fodder +2, once a day.'
    when:
      time.tags: { not: dark }
      place.tags: market
      any: [{ time.weekday: marketday }, { world.events: market-day }]
    hideWhenUnavailable: true
    oncePerDay: true
    do:
      - { time: 120 }
      - { effects: { party.items.ration: 3, party.values.fodder: 2 } }
  # Characters: only while a companion is wounded (a party stat counting them), by day.
  # Whoever acts tends the others: with Survival 2 or more (`acting.values.survival`, a
  # condition on the acting character), every wound and sprain is bound (effects on every
  # member); otherwise the hour is spent for nothing. The acting one is chosen in the trip.
  tend:
    name: Tend the wounded
    description: 'An hour binding wounds and sprains, by day, while a companion is wounded or sprained. Whoever acts needs Survival 2 or more: then every companion’s wounds and sprains are tended.'
    when:
      time.tags: { not: dark }
      any: [{ party.stats.wounded: { gte: 1 } }, { party.stats.sprained: { gte: 1 } }]
    hideWhenUnavailable: true
    do:
      - { time: 60 }
      - when: { acting.values.survival: { gte: 2 } }
        effects:
          { party.members.conditions.wounded: false, party.members.conditions.sprained: false }
  # Brenna's ferry over the Saltmere (a hex tagged `ferry`, by day): the trip stops to ask the
  # player how to pay (`ask`: a parameter of the action, chosen in the trip panel, not on its
  # button), and the steps after it branch on the answer (`when: { params.fare: … }`). Food
  # now, or waiting for her crossing: time passes until a condition holds, here the afternoon
  # (`wait`, with the most it waits: `limit`, until the night). Then a line in the journal
  # reading a value at that moment (`say` with `{{…}}`), the way of travelling changed to the
  # boat (`travel.mode`: the boat's own `when` lets it be boarded at a ferry; the route is
  # planned again for it), and the trip stops, saying where to go now (`pause`), until the
  # player presses Continue.
  ferry:
    name: Take the ferry
    description: 'At Brenna’s ferry, by day: pay her a day of food and she casts off at once, or wait for her afternoon crossing (at the latest, until nightfall). Then you are afloat on the Saltmere, by boat.'
    when: { place.tags: ferry, time.tags: { not: dark } }
    hideWhenUnavailable: true
    oncePerDay: true
    params:
      fare:
        name: How do you pay Brenna?
        description: She takes a day of food to cast off now; otherwise she rows over in the afternoon.
        choices:
          - { id: food, name: 'A day of food, now' }
          - { id: wait, name: Wait for her crossing }
    do:
      - { ask: params.fare }
      - { when: { params.fare: food }, effects: { party.items.ration: -1 } }
      - when: { params.fare: wait }
        wait: { time.part: [afternoon, evening] }
        limit: time.part.night
      - id: casts-off
        say: 'Brenna casts off from the jetty ({{party.items.ration.count}} rations left in your packs).'
      - { travel.mode: modes.boat }
      - id: afloat
        pause: 'Afloat on the Saltmere: choose a hex of the lake to sail to, then Go ashore at the far bank.'
  # Off the boat (`travel.mode` again): on foot from now on, to march onto the shore nearby.
  ashore:
    name: Go ashore
    description: 'Half an hour to leave the boat at the water’s edge: on foot from now on, to march onto the shore.'
    when: { trip.mode: boat }
    hideWhenUnavailable: true
    do:
      - { time: 30 }
      - { travel.mode: modes.foot }
  # A ruin (a hex tagged `ruins`, as discovery tags the ones it finds), by day: three hours
  # delving it, then what it holds rolled on the Oracle by a step (`roll:` naming a
  # generator, not a check: no binding, its result and the generator's name in the journal).
  # Once a day; hidden elsewhere.
  delve:
    name: Delve the ruin
    description: 'In a ruin, by day: three hours searching it, then what it holds and what guards it, rolled on _Delving a ruin_. Once a day.'
    when: { place.tags: ruins, time.tags: { not: dark } }
    hideWhenUnavailable: true
    oncePerDay: true
    do:
      - { time: 180 }
      - { roll: generator.ruin-delve }
  # A moment of the world (`on: world.clocks.<id>.full`): the Greywood Wyrm's clock filling
  # while a trip goes on (the haunted lights fill it, encounters.yaml, or a hand on the World
  # panel), heard by the trip once the step that filled it ends, at once when filled by hand,
  # or on its next step if filled in another app. Every companion's dread grows; inside the
  # Greywood (`place.region`), the trip stops to say so.
  wyrm-wakes:
    name: The Wyrm wakes
    description: 'When the Greywood Wyrm wakes during a trip (its clock fills): every companion’s dread +1 and nerve a die lower, and in the Greywood the trip stops.'
    on: world.clocks.the-greywood-wyrm-wakes.full
    do:
      - { effects: { party.members.values.dread: 1, party.members.values.nerve: -1 } }
      - {
          id: stirs,
          say: 'Far off, something vast stirs, and the birds of the Greywood fall silent.',
        }
      - when: { place.region: The Greywood }
        id: awake
        pause: 'The Wyrm is awake, and this is its wood.'
  # A moment written as a condition (a reaction): it comes once, as morale reaches 0 with
  # hirelings in the Company, whatever lowered it (a table, an action, a hand on the sheet),
  # and again only once morale has risen and fallen to 0 again.
  desertion:
    name: The hirelings desert
    description: 'As morale reaches 0 with hirelings in the Company, they slip away in the night.'
    on: { when: { party.values.morale: { lte: 0 }, party.values.hirelings: { gte: 1 } } }
    do:
      - { effects: { party.values.hirelings: '=0' } }
      - {
          id: gone,
          say: 'With their hope gone, the hirelings slip away, and their packs with them.',
        }
  # The same, for each companion (`for: party.members`): played with the one who fell acting.
  collapse:
    name: A companion falls
    description: 'As a companion’s health reaches 0: they’re wounded, and their dread grows.'
    on: { when: { acting.values.health: { lte: 0 } }, for: party.members }
    do:
      - { effects: { acting.conditions.wounded: true, acting.values.dread: 1 } }
      - { id: carried, say: '{{acting.name}} falls, and has to be carried.' }
  # Right after a check is resolved (`on: checks.<event>`): the dawn's weather just rolled,
  # read as `trip.weather` (today's, not yesterday's), before the dawn's next checks.
  stormy-dawn:
    name: A stormy dawn
    description: A dawn of storm wears the Company down before they set off. Fatigue +1.
    on: checks.WEATHER_CHECK_REQUIRED
    when: { trip.weather: storm }
    do:
      - { effects: { party.stats.fatigue: 1 } }
      - { id: worn, say: 'The storm wears the Company down before they set off.' }
  # Entering a hex, an action sees what the moment's checks see: the hex just left
  # (`from.region`) against the one entered.
  out-of-the-wood:
    name: Out of the Greywood
    description: Leaving the Greywood, the trees thin out and spirits rise. Morale +1.
    on: trip.place-enter
    when: { from.region: The Greywood }
    unless: { place.region: The Greywood }
    do:
      - { effects: { party.stats.morale: 1 } }
      - { id: thin, say: 'The trees thin out, and spirits rise.' }
  # The trip brings a world turn (a step `do: world.turn`): the travel engine doesn't know the
  # world, so it tells the host, which plays the turn on the campaign's world as one due with
  # time (each faction's turn, then the world's reactions to it, world.yaml's _News on the
  # roads_); the journal says what the factions did. In a market town, by day, once a trip.
  carry-news:
    name: Carry the news
    description: 'In a market town, by day, once a trip: an hour telling the townsfolk what you saw on the roads. The news spreads, and the powers of the Marches move (a world turn).'
    when: { place.tags: market, time.tags: { not: dark }, trip.taken.carry-news: { lt: 1 } }
    hideWhenUnavailable: true
    do:
      - { time: 60 }
      - { id: told, say: 'The news spreads from the market square faster than the Company could.' }
      - { do: world.turn }
  # A moment of the world (`on: world.turn`): after every world turn of the campaign, whatever
  # brought it (time moving on, a hand on the World panel, Carry the news), heard on the trip's
  # next step. What the powers did reaches the Company: with the Clans at war (a faction's
  # condition, `factions.iron-clans.conditions`), the news is bad and morale drops.
  word-on-the-road:
    name: Word on the road
    description: 'After every world turn, news of the powers reaches the Company; with the Iron Clans at war, morale -1.'
    on: world.turn
    do:
      - { id: word, say: 'Travellers bring word of what the powers of the Marches are doing.' }
      - when: { factions.iron-clans.conditions: at-war }
        effects: { party.stats.morale: -1 }
  # Those present (bestiary.yaml): the copies of templates the encounters made, at the
  # Company's hex. Open while someone hostile is here (`present.count`, `present.tags`); every
  # one of them changed at once (`present.all.…`, one roll for all); whoever's health reaches
  # 0 is down, and gone by itself (the foe's sheet: `leaves: true`).
  drive-off:
    name: Drive them off
    description: 'With foes here: ten minutes of steel and fire. Each of them takes 1d3 harm, and the fallen are gone; whoever acts takes 1 harm unless their Survival is 2 or more.'
    when: { present.count: { gte: 1 } }
    unless: { present.tags: vale }
    hideWhenUnavailable: true
    do:
      - { time: 10 }
      - { effects: { present.all.values.health: '-{{1d3}}' } }
      - unless: { acting.values.survival: { gte: 2 } }
        effects: { acting.values.health: -1 }
      - { id: fought, say: 'Steel and fire on the road.' }
  # Outlaws among those present (a tag of their template): a ration for each of them
  # (`'-{{present.count}}'`), and a condition that takes them off (`bought-off`).
  buy-off:
    name: Buy them off
    description: 'With outlaws here: a ration for each one of them, and they go.'
    when: { present.tags: outlaw, party.items.ration.count: { gte: '{{present.count}}' } }
    hideWhenUnavailable: true
    do:
      - effects:
          { party.items.ration: '-{{present.count}}', present.all.conditions.bought-off: true }
      - { id: paid, say: 'The outlaws take the food and melt back into the hills.' }
  # A reaction on those present (a moment written as a condition): once the pack leader is
  # gone (down, by hand…) with grey wolves still here, the rest of the pack runs.
  pack-breaks:
    name: The pack breaks
    description: 'Once the pack leader is gone with grey wolves still here, they run.'
    on: { when: { present.pack-leader.count: 0, present.grey-wolf.count: { gte: 1 } } }
    do:
      - { effects: { present.grey-wolf.conditions.routed: true } }
      - { id: run, say: 'Without their leader, the wolves break and run.' }
checks:
  # Each check has a name and a description for players (the event id is for the bindings).
  - event: WEATHER_CHECK_REQUIRED
    name: Weather
    description: Rolled every dawn, by season.
    at: time.part.morning
  # A card of a deck each dawn on the road (not once arrived): drawn cards stay out until the
  # deck runs out, in the campaign's Oracle, shared with draws by hand.
  - event: OMENS
    name: Omens
    description: Every dawn on the road, a card of the Omens of the road, and one more as the Wyrm stirs (its clock at 4).
    # Also a moment written as a condition: once, as the Wyrm's clock reaches 4.
    at: [time.part.morning, { when: { world.clocks.the-greywood-wyrm-wakes: { gte: 4 } } }]
    unless: { trip.arrived: true }
  # Off roads and rivers, and not by boat: any / connections / mode. The checks of one moment are
  # decided one by one, in this order: at the same dawn, this one already sees the weather
  # just rolled (`trip.weather`): nobody travels in a storm, so nobody gets lost.
  - event: NAVIGATION_CHECK_REQUIRED
    name: Getting lost
    description: Every dawn off roads and rivers (not by boat), unless a storm keeps the Company in. Navigation helps; fog makes it harder.
    at: time.part.morning
    unless:
      { any: [{ trip.connections: [road, river] }, { trip.mode: boat }, { trip.weather: storm }] }
  # Encounters where the map says there is danger (a hex field) over the party's Stealth (a
  # variable: a stealthy party slips through the safer hexes unseen), never on the road;
  # also when resting somewhere dangerous enough. Two moments (at: a list), told apart by
  # `trip.moment` in the condition.
  # By day only (not `dark`): marching in the dark brings the night encounter below.
  - event: ENCOUNTER_CHECK_REQUIRED
    name: Encounter
    description: Entering by day a hex whose danger is over your Stealth (the Greywood, the Hollow Hills), unless you came by road; or resting where danger is 3 or more.
    at: [trip.place-enter, actions.rest]
    when:
      any:
        - {
            trip.moment: trip.place-enter,
            time.tags: { not: dark },
            place.danger: { gt: '{{party.stats.stealth}}' },
          }
        - { trip.moment: actions.rest, place.danger: { gte: 3 } }
    unless: { trip.connections: road }
  # A toll on tagged hexes reached by road: all / tags / connections.
  - event: TOLL_CHECK_REQUIRED
    name: Toll
    description: Keld Bridge, arriving by road.
    at: trip.place-enter
    when: { all: [{ place.tags: toll }, { trip.connections: road }] }
  # Fords are rolled on an oracle, except by boat: not. Entering a hex tagged `ford`, or
  # crossing a ford drawn on the map (the kind of the step's connection, `connection.kind`).
  - event: FORD_CHECK_REQUIRED
    name: Ford
    description: Crossing the river on foot or horseback, at a ford.
    at: trip.place-enter
    when:
      all:
        [{ any: [{ place.tags: ford }, { connection.kind: ford }] }, { not: { trip.mode: boat } }]
  # Rolled on a table, then the trip pauses (pause) so you can describe the shrine. Only the
  # first time the trip comes by (`trip.visits`: 1 the first time in a hex).
  - event: SHRINE_CHECK_REQUIRED
    name: Shrine
    description: A wayside shrine, the first time the trip comes by. The trip stops after the roll; press Continue to go on.
    at: trip.place-enter
    when: { place.tags: shrine, trip.visits: 1 }
    pause: true
  # No table for this one: it only stops the trip because it says so (pause), and waits
  # for you to describe the place and press Continue.
  - event: LANDMARK_CHECK_REQUIRED
    name: Landmark
    description: Describe the place yourself (or roll on an oracle), then press Continue.
    at: trip.place-enter
    when: { place.tags: landmark }
    pause: true
  # The night's encounters: in camp, or marching in the dark (a night march) off the road.
  - event: CAMP_ENCOUNTER_CHECK_REQUIRED
    name: Night encounter
    description: Camping where danger is 2 or more, or entering a hex with danger in the dark, off the road. A stealthy lookout (Stealth 2 or more) keeps the camp hidden where danger is under 3.
    at: [actions.camp, trip.place-enter]
    when:
      any:
        - { trip.moment: actions.camp, place.danger: { gte: 2 } }
        - all:
            - { trip.moment: trip.place-enter, time.tags: dark, place.danger: { gte: 1 } }
            - { not: { trip.connections: road } }
    # A journey role: whoever keeps watch (`roles.lookout`, chosen in the trip), read by their
    # own values. With nobody on watch, this never holds.
    unless:
      {
        trip.moment: actions.camp,
        place.danger: { lt: 3 },
        roles.lookout.values.stealth: { gte: 2 },
      }
  # A moment of the calendar's day (`at: time.watch.middle`, the middle watch beginning, 23:00),
  # while the party sleeps in camp (`trip.doing`) in the dark (`time.tags`, the night's
  # tag) where danger is 3 or more, with nobody keeping watch (the lookout's values only
  # hold with someone in the role): the haunted lights come close. No table: its effects.
  - event: HAUNTED_WATCH
    name: Lights in the middle watch
    description: Asleep in camp where danger is 3 or more, with nobody keeping watch, the haunted lights come close in the middle watch. Every companion's dread +1.
    at: time.watch.middle
    when: { trip.doing: camp, time.tags: dark, place.danger: { gte: 3 } }
    unless: { roles.lookout.values.stealth: { gte: 0 } }
    effects: { party.members.values.dread: 1 }
  # Marching in the dark (a night march), off the road: each hex entered may get you lost,
  # rolled on the same table as in the morning (it sees `time.tags: dark`).
  - event: NIGHT_NAVIGATION_CHECK_REQUIRED
    name: Lost in the dark
    description: Each hex entered after nightfall, off the road. The dark makes it easy to lose your way.
    at: trip.place-enter
    when: { time.tags: dark }
    unless: { trip.connections: road }
  # Conditions on the party: a day ending with no rations left (party.items.ration.count:
  # the Company's and its companions' together, 0 when nobody has one), when the party can't
  # camp either (camp needs food): the night out in the open, hungry.
  - event: HUNGER_CHECK_REQUIRED
    name: Hunger
    description: A day ending with no food left, and a night in the open. Morale decides how it goes.
    at: time.day-end
    when: { party.items.ration.count: { lt: 1 } }
  # The end of each day (at: time.day-end), after the eat action: checks see what hit its
  # minimum today (below) and the action under way as it ended (`trip.doing: camp`). With effects and no
  # table, they just apply: fatigue is this system's own rule, not the app's. (A fed night
  # is camp's own step.)
  - event: HUNGRY_DAY
    name: Not enough to eat
    description: A day without enough food tires the party, in camp or not.
    at: time.day-end
    when: { trip.below: party.items.ration }
    effects: { party.stats.fatigue: 1 }
  # Foraging (the forage action above) in the woods and fields (a list of terrains), rolled
  # once its three hours are done (`actions.forage.done`), not as it begins.
  - event: FORAGE_CHECK_REQUIRED
    name: Foraging
    description: Rolled after three hours foraging in woods, fields, heath or marsh.
    at: actions.forage.done
    when: { place.terrain: [forest, dense-forest, plains, farmland, heath, marsh] }
  # Fishing (the fish action above): a table rolled on a d6 under Survival. No `at`: only the
  # fish action's step rolls it, after its two hours.
  - event: FISHING_CHECK_REQUIRED
    name: Fishing
    description: Rolled after two hours fishing.
  # Hours marched today over the system's own (`trip.marched` against `system.hoursPerDay`,
  # a variable): a night march, or a long day of it, tires the party as the day ends.
  - event: LONG_DAY
    name: A long day
    description: A day marched past its 8 hours (a night march after a full day) costs 1 fatigue as it ends.
    at: time.day-end
    when: { trip.marched: { gt: '{{system.hoursPerDay}}' } }
    effects: { party.stats.fatigue: 1 }
  # The same long day on horseback leaves every companion saddle-sore (a condition set on
  # every member), which blocks riding until a night out of the saddle.
  - event: SADDLE_SORE
    name: Saddle-sore
    description: A day ridden past its 8 hours leaves every companion saddle-sore, unable to ride until a night spent off horseback.
    at: time.day-end
    when: { trip.mode: horse, trip.marched: { gt: '{{system.hoursPerDay}}' } }
    effects: { party.members.conditions.saddle-sore: true }
  # Relations: entering a companion's home (a region, a place or a hex they're tied to as
  # `home`: `place.relations.home`, who) from outside it (`from.relations.home`: the hex left).
  - event: HOMECOMING
    name: Home ground
    description: Coming into the home of one of the companions (their region, place or hex). Morale +1.
    at: trip.place-enter
    when: { place.relations.home: { exists: true } }
    unless: { from.relations.home: { exists: true } }
    effects: { party.stats.morale: 1 }
  # The trip's own days (`trip.day`, a list of them): on the tenth, twentieth and thirtieth
  # day on the road, the party misses home.
  - event: HOMESICK
    name: Homesick
    description: On the 10th, 20th and 30th day of a trip, the party misses home. Morale −1.
    at: time.part.morning
    when: { trip.day: [10, 20, 30] }
    effects: { party.stats.morale: -1 }
  # Coming back to the same hex a third time in a trip (`trip.visits`): lost heart.
  - event: IN_CIRCLES
    name: Going in circles
    description: Entering a hex for the third time in a trip. Morale −1.
    at: trip.place-enter
    when: { trip.visits: 3 }
    effects: { party.stats.morale: -1 }
---
kind: bindings
id: default
# Stats with `from` are the companions' while the party has any (sheet.yaml): the best, the
# worst or how many of them, among those a condition lets in. Without companions, the party
# keeps them as a whole like any other stat. Morale, fatigue, hirelings and endurance are
# values of the Company's own sheet (`from: { party: … }`, sheet.yaml), whoever travels:
# effects on them change the sheet, within its bounds.
stats:
  # Whoever does the talking: the companion the player chooses in the trip (Rolls with), or
  # the best Charisma among them (`pick`).
  charisma:
    name: Charisma
    description: Added to reaction rolls; at Keld Bridge, a d6 at or under it saves the toll. With companions, the Charisma of whoever does the talking (Rolls with), or the best.
    default: 0
    from: { pick: charisma }
  # The best Survival among the companions who aren't wounded (none standing: 0).
  survival:
    name: Survival
    description: Added to foraging and fords. With companions, the best Survival among those not wounded.
    default: 1
    from: { max: survival, unless: { conditions: wounded }, none: 0 }
  # Changed by tables (encounters, getting lost, the shrine, hunger, the inn) and read by
  # them as party.stats.morale.
  morale:
    name: Morale
    description: Falls with wolves, bandits, getting lost and hunger; rises at the shrine and the inn.
    from: { party: morale }
  navigation:
    name: Navigation
    description: Added to the getting-lost roll. With companions, their best Pathfinding.
    default: 0
    from: { max: pathfinding }
  # Sell-swords who join at the inn and desert when hungry: 0 until a table adds some.
  hirelings:
    name: Hirelings
    description: Sell-swords travelling with the party. They join at the inn and may desert when there is no food.
    from: { party: hirelings }
  # How much fatigue the party takes before it can't camp or rest: the camp and rest
  # actions compare fatigue with it (a variable, `{{party.stats.endurance}}`).
  endurance:
    name: Endurance
    description: The party can camp and rest while its fatigue is under this.
    from: { party: endurance }
  # Hexes with danger at or under it are crossed unseen (the encounter check reads it).
  stealth:
    name: Stealth
    description: Entering a hex by day, an encounter comes only where danger is over this. With companions, the clumsiest one's.
    default: 0
    from: { min: stealth }
  # How many eat: one without companions, one per companion with them (`count`).
  mouths:
    name: Mouths
    description: How many eat each day (besides the hirelings). With companions, how many they are.
    default: 1
    from: { count: true }
  # How many companions carry something for climbing (a rope, items.yaml): the ford reads it.
  roped:
    name: Roped
    description: How many companions carry a rope; with one or more, the ford's roll gets +1.
    default: 0
    from: { count: true, when: { items.tags: climbing } }
  # How many companions are wounded: the Tend the wounded action shows only then.
  wounded:
    name: Wounded
    description: How many companions are wounded.
    default: 0
    from: { count: true, when: { conditions: wounded } }
  sprained:
    name: Sprained
    description: How many companions have a sprained ankle.
    default: 0
    from: { count: true, when: { conditions: sprained } }
  # Fatigue is a value of the Company's sheet (min: effects never take it below 0), changed
  # by its day-end checks, rests, the shrine, fords and hunger.
  fatigue:
    name: Fatigue
    description: 'Rises with each day without enough food, long days, fords and hunger; eases after a fed night in camp, a rest or a prayer at the shrine.'
    from: { party: fatigue }
# Journey roles: the player gives each to a companion; checks and tables read the holder as
# `roles.<id>.…` (the getting-lost table, the night encounter).
roles:
  guide:
    name: Guide
    description: Leads the way. With Pathfinding 2 or more, getting lost is rolled with advantage.
  lookout:
    name: Lookout
    description: Keeps watch at night. With Stealth 2 or more, the camp stays hidden where danger is under 3.
# Values the pack's tables read that nobody else names: the roll panel and the map show
# these names (the key stays in the tooltip). Map values first, then today's values tables set.
reads:
  danger:
    {
      name: Danger,
      description: 'How dangerous the hex is, a value of the hex or its region (the Greywood: 2 at the edge, up to 5 at its heart).',
    }
  icon.guards:
    {
      name: Guards,
      description: 'A value of the place’s icon on the map: how many guards watch its gates (0 in Ashford, 2 at Fort Keld).',
    }
  token.fare:
    {
      name: Fare,
      description: 'A value of a token: what Brenna the ferrywoman charges, in silver.',
    }
  timeOfDay:
    {
      name: Time of day,
      description: 'day or night: the bindings give it to the encounter table (night when camping).',
    }
  reactionModifier:
    {
      name: Reaction modifier,
      description: 'Added to the next reaction roll by the entry that rolls it (wolves −2, the hunt −3).',
    }
  fordModifier:
    {
      name: Ford modifier,
      description: 'Added to today’s ford roll by the weather (rain −1, frost +1).',
    }
  fordImpossible:
    {
      name: No crossing today,
      description: 'true when a storm makes the ford impossible for the rest of the day.',
    }
discover:
  terrain: { resolve: table.next-terrain }
  contents: { resolve: table.hex-contents }
  reveal: neighbors
on:
  # Weather with inertia: a model (sky.yaml) instead of a table.
  WEATHER_CHECK_REQUIRED: { weather: weather.sky }
  # A deck resolves it: each dawn draws a card.
  OMENS: { resolve: deck.omens }
  NAVIGATION_CHECK_REQUIRED: { resolve: table.getting-lost }
  NIGHT_NAVIGATION_CHECK_REQUIRED: { resolve: table.getting-lost }
  # One encounter table for day and night: the context says which.
  ENCOUNTER_CHECK_REQUIRED: { resolve: table.encounter, context: { timeOfDay: day } }
  CAMP_ENCOUNTER_CHECK_REQUIRED: { resolve: table.encounter, context: { timeOfDay: night } }
  TOLL_CHECK_REQUIRED: { resolve: table.toll }
  # An oracle resolves the ford; the context gives its input (how likely it goes well).
  FORD_CHECK_REQUIRED: { resolve: oracle.ford, context: { odds: even } }
  SHRINE_CHECK_REQUIRED: { resolve: table.shrine }
  FORAGE_CHECK_REQUIRED: { resolve: table.forage }
  FISHING_CHECK_REQUIRED: { resolve: table.fishing }
  HUNGER_CHECK_REQUIRED: { resolve: table.hunger }
