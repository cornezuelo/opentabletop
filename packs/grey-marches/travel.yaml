# The Grey Marches as a travel system. Every part of travel rules and bindings is used;
# comments say what each one shows. Play it in the Hexmapper (Play → With rules → The
# Grey Marches) on the example map, or without a map in the Travel app.
kind: travel-rules
id: default
day: { start: '06:00', nightfall: '20:00' }
travel: { hoursPerDay: 8 }
terrains:
  plains: { multiplier: 1 }
  steppe: { multiplier: 1 }
  farmland: { multiplier: 1 }
  heath: { multiplier: 0.75 }
  coast: { multiplier: 1 }
  forest: { multiplier: 0.5 }
  dense-forest: { multiplier: 0.33 }
  hills: { multiplier: 0.5 }
  mountains: { multiplier: 0.33 }
  # Peaks: no way through on foot or horseback.
  peaks: { passable: false }
  swamp: { multiplier: 0.33 }
  marsh: { multiplier: 0.5 }
# Lakes and the sea are water on the map (Edit palette → Water): nobody walks on them…
water: { passable: false }
defaultTerrain: { multiplier: 1 }
edges:
  road: { multiplier: 1.5 }
  trail: { multiplier: 1.2 }
modes:
  foot: { name: On foot, kmPerDay: 25 }
  # Horses go twice as fast and eat fodder.
  horse: { name: On horseback, kmPerDay: 50, consumes: { fodder: 1 } }
  # …but a boat only goes on water (and along the coast).
  boat: { name: By boat, kmPerDay: 40, allowedTerrains: [water, coast] }
resources:
  food: { name: Food, perDay: 1 }
  fodder: { name: Fodder }
weather:
  rain: { speed: 0.75 }
  fog: { speed: 0.75 }
  snow: { speed: 0.5 }
  storm: { speed: 0 }
actions:
  # A rest is two hours and takes off one point of fatigue.
  rest: { minutes: 120, fatigue: 1 }
  # The system's own action: foraging takes three hours and halves the rest of the day's
  # march, once a day; its check (below, at: forage) is rolled where the party stands.
  # `nothing` is what the journal says where that check doesn't apply (hills, mountains…).
  forage:
    name: Forage for food
    description: 'Three hours looking for food (once a day): the rest of the day’s march is halved. Only in forest, dense forest, plains, farmland, heath and marsh: roll 1d6 + Survival (twice, keep the best); 4–6 finds food for a day, 7 or more 2–4 days. Elsewhere there is nothing to find.'
    nothing: 'nothing to forage on {terrain}: only woods, fields, heath and marsh give food'
    minutes: 180
    speed: 0.5
    oncePerDay: true
checks:
  # Each check has a name and a description for players (the event id is for the bindings).
  - event: WEATHER_CHECK_REQUIRED
    name: Weather
    description: Rolled every dawn, by season.
    at: day-start
  # Off roads and rivers, and not by boat: any / edges / mode.
  - event: NAVIGATION_CHECK_REQUIRED
    name: Getting lost
    description: Every dawn off roads and rivers (not by boat). Navigation helps; fog makes it harder.
    at: day-start
    unless: { any: [{ edges: [road, river] }, { mode: boat }] }
  # Encounters where the map says there is danger (a hex field), never on the road.
  - event: ENCOUNTER_CHECK_REQUIRED
    name: Encounter
    description: Entering a hex with danger (the Greywood, the Hollow Hills), unless you came by road.
    at: hex-enter
    when: { danger: { gte: 1 } }
    unless: { edges: road }
  # A toll on tagged hexes reached by road: all / tags / edges.
  - event: TOLL_CHECK_REQUIRED
    name: Toll
    description: Keld Bridge, arriving by road.
    at: hex-enter
    when: { all: [{ tags: toll }, { edges: road }] }
  # Fords are rolled on an oracle, except by boat: not.
  - event: FORD_CHECK_REQUIRED
    name: Ford
    description: Crossing the river on foot or horseback.
    at: hex-enter
    when: { all: [{ tags: ford }, { not: { mode: boat } }] }
  - event: SHRINE_CHECK_REQUIRED
    name: Shrine
    at: hex-enter
    when: { tags: shrine }
  # No table for this one: the trip stops at landmarks and waits for you to Continue.
  - event: LANDMARK_CHECK_REQUIRED
    name: Landmark
    description: Describe the place yourself (or roll on an oracle), then press Continue.
    at: hex-enter
    when: { tags: landmark }
  - event: CAMP_ENCOUNTER_CHECK_REQUIRED
    name: Night encounter
    description: Camping where danger is 2 or more.
    at: camp
    when: { danger: { gte: 2 } }
  # Conditions on the party: camping with no food left (party.resources.food).
  - event: HUNGER_CHECK_REQUIRED
    name: Hunger
    description: Camping with no food left. Morale decides how it goes.
    at: camp
    when: { party.resources.food: { lt: 1 } }
  # Foraging (the forage action above) in the woods and fields (a list of terrains).
  - event: FORAGE_CHECK_REQUIRED
    name: Foraging
    description: Rolled when you forage for food in woods, fields, heath or marsh.
    at: forage
    when: { terrain: [forest, dense-forest, plains, farmland, heath, marsh] }
---
kind: bindings
id: default
stats:
  charisma:
    name: Charisma
    description: Added to reaction rolls.
    default: 0
  survival:
    name: Survival
    description: Added to foraging and fords.
    default: 1
  # Changed by tables (encounters, getting lost, the shrine, hunger, the inn) and read by
  # them as party.stats.morale. "hirelings" isn't declared: it appears once a table sets it.
  morale:
    name: Morale
    description: Falls with wolves, bandits, getting lost and hunger; rises at the shrine and the inn.
    default: 3
  navigation:
    name: Navigation
    description: Added to the getting-lost roll.
    default: 0
discover:
  terrain: { resolve: next-terrain }
  contents: { resolve: hex-contents }
  reveal: neighbors
on:
  # Weather with inertia: a model (sky.yaml) instead of a table.
  WEATHER_CHECK_REQUIRED: { weather: sky }
  NAVIGATION_CHECK_REQUIRED: { resolve: getting-lost }
  # One encounter table for day and night: the context says which.
  ENCOUNTER_CHECK_REQUIRED: { resolve: encounter, context: { timeOfDay: day } }
  CAMP_ENCOUNTER_CHECK_REQUIRED: { resolve: encounter, context: { timeOfDay: night } }
  TOLL_CHECK_REQUIRED: { resolve: toll }
  # An oracle resolves the ford; the context gives its input (how likely it goes well).
  FORD_CHECK_REQUIRED: { resolve: ford, context: { odds: even } }
  SHRINE_CHECK_REQUIRED: { resolve: shrine }
  FORAGE_CHECK_REQUIRED: { resolve: forage }
  HUNGER_CHECK_REQUIRED: { resolve: hunger }
