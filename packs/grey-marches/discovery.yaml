---
# What a hex holds the first time you enter it. The text becomes a point of interest;
# `poi: false` means nothing worth noting. `tags` and `name` are written on the hex too:
# a `landmark` tag makes the landmark check stop the trip there on later visits.
kind: table
id: hex-contents
name: What is here?
description: Rolled the first time you enter a discovered hex. Mostly nothing; sometimes ruins, a shrine or a place with a name.
roll: 2d6
entries:
  - { id: water, range: 2-12, when: { water: true }, result: Open water, set: { poi: false } }
  - {
      id: lair,
      range: 2,
      once: true,
      result: 'A dragon’s lair, bones scattered at its mouth',
      set: { tags: [lair, danger] },
    }
  - { id: ruins, range: 3-4, result: 'Ruins: {{result}}', table: ruins, set: { tags: ruins } }
  - { id: nothing, range: 5-9, result: Nothing of note, set: { poi: false } }
  - { id: shrine, range: 10, result: A wayside shrine to a forgotten god, set: { tags: shrine } }
  - { id: camp, range: 11, result: 'A camp of {{1d6+2}} travellers', set: { tags: camp } }
  - { id: landmark, range: 12, table: landmarks }
---
# A once-only entry: after the Twin Spires are found, only standing stones remain.
kind: table
id: landmarks
name: Landmarks
entries:
  - {
      id: spires,
      weight: 1,
      once: true,
      result: 'The Twin Spires: two towers of black glass, seen for miles',
      set: { tags: landmark, name: The Twin Spires },
    }
  - {
      id: stone,
      weight: 3,
      result: 'A standing stone carved with {{result}}',
      table: carvings,
      set: { tags: landmark },
    }
