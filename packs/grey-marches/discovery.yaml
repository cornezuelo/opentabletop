# Discovering the map as you travel (Hexmapper: Play → With rules → The Grey Marches,
# "Discover the map as you travel"). The bindings name these two tables under `discover`;
# see travel.yaml. The example map leaves its east unpainted for this.

# The terrain of an empty hex, seen from where you stand. The context has `terrain` (the
# land you're on) and the land around the hex being decided: `around` counts its known
# neighbours' terrains (around.lake: 2) and `common` is the most frequent one. So lakes,
# forests and ranges grow together instead of a patchwork.
kind: table
id: next-terrain
name: The land ahead
description: "Decides an empty hex from the land around it: water gathers, the common land goes on, sometimes its kin, now and then anything. Shows: discovery (`discover.terrain` in travel.yaml), what tables see of the land around the hex (around.lake, common, commonCount), `set: { terrain: '{{common}}' }` from a template, and cascades into a table per kind of land."
roll: 1d6
entries:
  # Water gathers: a hex between two lakes (or two seas) is mostly water too.
  - {
      id: lake,
      range: 1-4,
      when: { around.lake: { gte: 2 } },
      result: The lake goes on,
      set: { terrain: lake },
    }
  - {
      id: sea,
      range: 1-4,
      when: { around.sea: { gte: 2 } },
      result: The sea goes on,
      set: { terrain: sea },
    }
  # The commonest land around goes on ({{common}}; a tie goes to the land you're on).
  - {
      id: same,
      range: 1-3,
      when: { common: { exists: true } },
      result: 'The land around goes on ({{commonCount}} of {{aroundCount}} hexes)',
      set: { terrain: '{{common}}' },
    }
  - {
      id: open,
      range: 4-5,
      when: { terrain: [steppe, plains, farmland, heath, savanna] },
      table: open-land,
    }
  - {
      id: woods,
      range: 4-5,
      when: { terrain: [forest, dense-forest, jungle, taiga] },
      table: woodland,
    }
  - { id: wet, range: 4-5, when: { terrain: [swamp, marsh] }, table: wetland }
  - {
      id: high,
      range: 4-5,
      when: { terrain: [hills, mountains, peaks, volcanic] },
      table: highland,
    }
  - { id: dry, range: 4-5, when: { terrain: [desert, badlands, canyon, oasis] }, table: dryland }
  - { id: cold, range: 4-5, when: { terrain: [tundra, snow, glacier] }, table: cold-land }
  - { id: waters, range: 4-5, when: { terrain: [coast, lake, sea, deep-sea] }, table: waters }
  - { id: anything, range: 1-6, table: any-land }
---
kind: table
id: open-land
name: Open land
description: 'The land ahead from open ground: plains, steppe and their kin. Rolled by The land ahead on 4–5. Shows: weights instead of dice, and `set: { terrain }` (the hex gets that terrain).'
entries:
  - { id: plains, weight: 3, result: Plains, set: { terrain: plains } }
  - { id: steppe, weight: 2, result: Steppe, set: { terrain: steppe } }
  - { id: farmland, weight: 1, result: Farmland, set: { terrain: farmland } }
  - { id: heath, weight: 1, result: Heath, set: { terrain: heath } }
  - { id: forest, weight: 1, result: Forest, set: { terrain: forest } }
  - { id: hills, weight: 1, result: Hills, set: { terrain: hills } }
---
kind: table
id: woodland
name: Woodland
description: 'The land ahead from the woods: more forest, sometimes dense, now and then a clearing or a swamp. Rolled by The land ahead on 4–5. Shows: a table only reached through another (a cascade), with weights.'
entries:
  - { id: forest, weight: 3, result: Forest, set: { terrain: forest } }
  - { id: dense, weight: 2, result: Dense forest, set: { terrain: dense-forest } }
  - { id: plains, weight: 1, result: Plains, set: { terrain: plains } }
  - { id: hills, weight: 1, result: Hills, set: { terrain: hills } }
  - { id: swamp, weight: 1, result: Swamp, set: { terrain: swamp } }
---
kind: table
id: wetland
name: Wetland
description: 'The land ahead from marsh and swamp. Rolled by The land ahead on 4–5. Shows: weights and `set: { terrain }`, including water (a lake).'
entries:
  - { id: marsh, weight: 2, result: Marsh, set: { terrain: marsh } }
  - { id: swamp, weight: 2, result: Swamp, set: { terrain: swamp } }
  - { id: lake, weight: 1, result: Lake, set: { terrain: lake } }
  - { id: forest, weight: 1, result: Forest, set: { terrain: forest } }
---
kind: table
id: highland
name: Highland
description: 'The land ahead from hills and mountains: ranges grow, with peaks nobody crosses. Rolled by The land ahead on 4–5. Shows: weights and `set: { terrain }`.'
entries:
  - { id: hills, weight: 3, result: Hills, set: { terrain: hills } }
  - { id: mountains, weight: 3, result: Mountains, set: { terrain: mountains } }
  - { id: peaks, weight: 1, result: Peaks, set: { terrain: peaks } }
  - { id: canyon, weight: 1, result: Canyon, set: { terrain: canyon } }
  - { id: forest, weight: 1, result: Forest, set: { terrain: forest } }
---
kind: table
id: dryland
name: Dry land
description: 'The land ahead from desert, badlands or canyons (not on the example map: for maps of your own). Rolled by The land ahead on 4–5. Shows: weights and `set: { terrain }`.'
entries:
  - { id: desert, weight: 3, result: Desert, set: { terrain: desert } }
  - { id: badlands, weight: 2, result: Badlands, set: { terrain: badlands } }
  - { id: canyon, weight: 1, result: Canyon, set: { terrain: canyon } }
  - { id: oasis, weight: 1, result: Oasis, set: { terrain: oasis } }
  - { id: steppe, weight: 1, result: Steppe, set: { terrain: steppe } }
---
kind: table
id: cold-land
name: Cold land
description: 'The land ahead from tundra, snow or glaciers (for maps of your own). Rolled by The land ahead on 4–5. Shows: weights and `set: { terrain }`.'
entries:
  - { id: tundra, weight: 3, result: Tundra, set: { terrain: tundra } }
  - { id: snow, weight: 2, result: Snow, set: { terrain: snow } }
  - { id: glacier, weight: 1, result: Glacier, set: { terrain: glacier } }
  - { id: taiga, weight: 1, result: Taiga, set: { terrain: taiga } }
---
kind: table
id: waters
name: Waters
description: 'The land ahead from the coast, a lake or the sea. Rolled by The land ahead on 4–5. Shows: weights and `set: { terrain }` with water terrains.'
entries:
  - { id: coast, weight: 2, result: Coast, set: { terrain: coast } }
  - { id: sea, weight: 2, result: Sea, set: { terrain: sea } }
  - { id: lake, weight: 1, result: Lake, set: { terrain: lake } }
  - { id: plains, weight: 1, result: Plains, set: { terrain: plains } }
---
kind: table
id: any-land
name: Any land
description: "Anything, now and then: the last entry of The land ahead, which has no condition and catches every roll the others don't. Shows: a catch-all entry, and weights."
entries:
  - { id: plains, weight: 3, result: Plains, set: { terrain: plains } }
  - { id: forest, weight: 3, result: Forest, set: { terrain: forest } }
  - { id: hills, weight: 2, result: Hills, set: { terrain: hills } }
  - { id: steppe, weight: 2, result: Steppe, set: { terrain: steppe } }
  - { id: mountains, weight: 1, result: Mountains, set: { terrain: mountains } }
  - { id: swamp, weight: 1, result: Swamp, set: { terrain: swamp } }
  - { id: lake, weight: 1, result: Lake, set: { terrain: lake } }
---
# What a hex holds the first time you enter it. The text becomes a point of interest;
# `poi: false` means nothing worth noting. `tags` and `name` are written on the hex too:
# a `landmark` tag makes the landmark check stop the trip there on later visits.
kind: table
id: hex-contents
name: What is here?
description: "Rolled the first time you enter a discovered hex. Mostly nothing; sometimes ruins, a shrine or a place with a name. Shows: discovery's contents (`discover.contents`), `set: { poi: false }` (nothing worth a point of interest), `tags` and `name` written on the hex, a condition on the hex (`water: true`), `once` (the dragon's lair), dice in the text ({{1d6+2}})."
roll: 2d6
entries:
  - { id: water, range: 2-12, when: { water: true }, result: Open water, set: { poi: false } }
  - {
      id: lair,
      range: 2,
      once: true,
      result: 'A dragon’s lair, bones scattered at its mouth',
      set: { tags: [lair, danger] },
    }
  - { id: ruins, range: 3-4, result: 'Ruins: {{result}}', table: ruins, set: { tags: ruins } }
  - { id: nothing, range: 5-9, result: Nothing of note, set: { poi: false } }
  - { id: shrine, range: 10, result: A wayside shrine to a forgotten god, set: { tags: shrine } }
  - { id: camp, range: 11, result: 'A camp of {{1d6+2}} travellers', set: { tags: camp } }
  - { id: landmark, range: 12, table: landmarks }
---
# A once-only entry: after the Twin Spires are found, only standing stones remain.
kind: table
id: landmarks
name: Landmarks
description: 'Standing stones and, once, the Twin Spires. Shows: `once` (after the Spires only stones remain), `set: { name }` and the `landmark` tag (the Landmark check then stops the trip there), and a cascade into Carvings.'
entries:
  - {
      id: spires,
      weight: 1,
      once: true,
      result: 'The Twin Spires: two towers of black glass, seen for miles',
      set: { tags: landmark, name: The Twin Spires },
    }
  - {
      id: stone,
      weight: 3,
      result: 'A standing stone carved with {{result}}',
      table: carvings,
      set: { tags: landmark },
    }
---
kind: table
id: ruins
name: Ruins
description: 'What a ruin once was. Shows: the simplest table, with no dice and no weights (every entry equally likely). Rolled by What is here? and Delving a ruin.'
entries:
  - { id: tower, result: a broken watchtower }
  - { id: villa, result: the shell of a manor house }
  - { id: temple, result: a roofless temple }
  - { id: fort, result: an overgrown hillfort }
---
kind: table
id: carvings
name: Carvings
description: "What a standing stone shows. Shows: a plain table whose result goes into another one's text ({{result}} in Landmarks)."
entries:
  - { id: serpent, result: a coiled serpent }
  - { id: eye, result: a weeping eye }
  - { id: ship, result: a ship under sail }
  - { id: skull, result: a crowned skull }
