# Discovering the map as you travel (Hexmapper: Play → With rules → The Grey Marches,
# "Discover the map as you travel"). The bindings name these two tables under `discover`;
# see travel.yaml. The example map leaves its east unpainted for this.

# The terrain of an empty hex, seen from where you stand: `terrain` in the context is the
# terrain you're on. `set: { terrain: '{{terrain}}' }` copies it: the same land goes on.
kind: table
id: next-terrain
name: The land ahead
description: Decides an empty hex from the land you stand on. Mostly more of the same, sometimes its kin, now and then anything.
roll: 1d6
entries:
  - {
      id: same,
      range: 1-3,
      when: { terrain: { exists: true } },
      result: The same land,
      set: { terrain: '{{terrain}}' },
    }
  - {
      id: open,
      range: 4-5,
      when: { terrain: [steppe, plains, farmland, heath, savanna] },
      table: open-land,
    }
  - {
      id: woods,
      range: 4-5,
      when: { terrain: [forest, dense-forest, jungle, taiga] },
      table: woodland,
    }
  - { id: wet, range: 4-5, when: { terrain: [swamp, marsh] }, table: wetland }
  - {
      id: high,
      range: 4-5,
      when: { terrain: [hills, mountains, peaks, volcanic] },
      table: highland,
    }
  - { id: dry, range: 4-5, when: { terrain: [desert, badlands, canyon, oasis] }, table: dryland }
  - { id: cold, range: 4-5, when: { terrain: [tundra, snow, glacier] }, table: cold-land }
  - { id: waters, range: 4-5, when: { terrain: [coast, lake, sea, deep-sea] }, table: waters }
  - { id: anything, range: 1-6, table: any-land }
