# A progress clock for any game: a threat that grows and starts over once full (the
# Map's World panel); what it does when full is world.yaml's. A system brings both:
# `clocks: core/clocks.threat`, `world: core/world.threat`.
kind: clocks
id: threat
name: A growing threat
description: |-
  One progress clock for any game: **the threat grows** a segment at a time (by hand, or by your tables' effects: `world.clocks.the-threat-grows: 1`), and when it fills it strikes with one of Core's _Twists_ (_The threat strikes_, `core/world.threat`) and starts over. A system brings both: `clocks: core/clocks.threat` and `world: core/world.threat`.
clocks:
  the-threat-grows:
    name: The threat grows
    segments: 6
    then: reset
