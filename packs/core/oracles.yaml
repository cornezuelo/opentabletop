# Generic oracles for solo play. Original content, MIT like the rest of the repo.
kind: oracle
id: yes-no
name: Yes or no?
description: |-
  Ask a question that can be answered **yes or no**, choose how likely it is, and roll.

  - **Yes, and…** / **No, and…**: more than you asked for, for better or worse.
  - **Yes, but…** / **No, but…**: the answer comes with a cost, or with a way out.

  When in doubt about the odds, choose _Even_.
inputs:
  odds:
    label: Odds
    options: [very-unlikely, unlikely, even, likely, very-likely]
    labels:
      very-unlikely: Very unlikely
      unlikely: Unlikely
      even: Even
      likely: Likely
      very-likely: Very likely
    default: even
roll: 1d6
variants:
  very-unlikely:
    entries:
      - { id: yes-and, range: 1, result: 'Yes, and something more' }
      - { id: no, range: 2-5, result: 'No' }
      - { id: no-and, range: 6, result: 'No, and it gets worse' }
  unlikely:
    entries:
      - { id: yes, range: 1-2, result: 'Yes' }
      - { id: no-but, range: 3, result: 'No, but there is a way' }
      - { id: no, range: 4-6, result: 'No' }
  even:
    entries:
      - { id: yes-and, range: 1, result: 'Yes, and something more' }
      - { id: yes, range: 2, result: 'Yes' }
      - { id: yes-but, range: 3, result: 'Yes, but at a cost' }
      - { id: no-but, range: 4, result: 'No, but there is a way' }
      - { id: no, range: 5, result: 'No' }
      - { id: no-and, range: 6, result: 'No, and it gets worse' }
  likely:
    entries:
      - { id: yes, range: 1-4, result: 'Yes' }
      - { id: yes-but, range: 5, result: 'Yes, but at a cost' }
      - { id: no, range: 6, result: 'No' }
  very-likely:
    entries:
      - { id: yes-and, range: 1, result: 'Yes, and something more' }
      - { id: yes, range: 2-5, result: 'Yes' }
      - { id: no-but, range: 6, result: 'No, but there is a way' }
---
# An input with labels, a variant with its own dice, and answers that roll a motive
# ("then roll") shown through {{result}}.
kind: oracle
id: npc-attitude
name: How do they take it?
description: |-
  Ask how someone answers a **request**. The bigger the ask, the harder the yes: a **big ask** may come with a price.

  Every answer comes with a _Motive_, so you know why they say it.
inputs:
  stakes:
    label: Stakes
    options: [small, fair, big]
    labels: { small: A small favour, fair: A fair deal, big: A big ask }
    default: fair
roll: 1d6
variants:
  small:
    entries:
      - { id: agree, range: 1-4, result: 'They agree ({{result}})', table: npc-motive }
      - { id: refuse, range: 5-6, result: 'They refuse ({{result}})', table: npc-motive }
  fair:
    entries:
      - { id: agree, range: 1-3, result: 'They agree ({{result}})', table: npc-motive }
      - { id: refuse, range: 4-6, result: 'They refuse ({{result}})', table: npc-motive }
  big:
    roll: 1d8
    entries:
      - { id: agree, range: 1-2, result: 'They agree ({{result}})', table: npc-motive }
      - { id: price, range: 3-4, result: 'Only for {{2d6}} silver ({{result}})', table: npc-motive }
      - { id: refuse, range: 5-8, result: 'They refuse ({{result}})', table: npc-motive }
---
kind: table
id: npc-motive
name: Motive
description: |-
  **Why** someone does what they do. Greed and fear are the most common.
entries:
  - { id: greed, weight: 2, result: greed }
  - { id: fear, weight: 2, result: fear }
  - { id: loyalty, weight: 1, result: loyalty }
  - { id: curiosity, weight: 1, result: curiosity }
  - { id: duty, weight: 1, result: duty }
