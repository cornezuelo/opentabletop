# The Generic rules' sheets (system.yaml): its characters (`sheet: character`) and the
# party's own (`partySheet: party`). The smallest that work.
kind: sheet
id: character
name: Character
description: |-
  A character of the Generic rules: their health, the harm they've taken, whether they're wounded and whether they're down.

  **Shows:** the smallest character sheet: a value with bounds, drawn as a bar, one made of it (`from:`), a condition set by effects, one given for a while in a fight (_Staggered_, `lasts: rounds`), one that holds by itself (`when:`), a room in all for what they carry (`items.room`, ten things, no more), and an item field that is a die stepping down (`wear: { steps: [4, 6] }`).
values:
  health:
    name: Health
    description: How much harm the character can still take; at 0 they're down. Your tables say what costs or restores it.
    default: 3
    min: 0
    max: 3
    display: bar
  harm:
    name: Harm
    description: The health lost, worked out from it; never set by hand.
    from: '{{3 - self.values.health}}'
conditions:
  wounded:
    name: Wounded
    description: Hurt badly enough to matter until it's cleared; your tables and rules say what it stops.
  # Given for some rounds of a fight (`characters[params.foe].conditions.staggered: 1`), gone
  # by itself as they pass.
  staggered:
    name: Staggered
    description: Reeling from a hard blow; loses its turns in a fight while it lasts, a round at a time.
    lasts: rounds
  down:
    name: Down
    description: Out of the fight while their health is 0; it lifts by itself when health comes back. A foe made from the bestiary is gone once down.
    when: { self.values.health: { lte: 0 } }
    # Copies of a template (bestiary.yaml) that are down leave those present; a party's
    # characters never leave this way.
    leaves: true
# What they carry is one list (no places): ten things in all, each counted as one; what's
# given past it is left behind, said in the journal. Only a shield has a field: its wear,
# a die that steps down (d6, then d4).
items:
  room: 10
  over: refuse
  fields:
    wear:
      name: Wear
      description: How much a piece of gear can still take, a die that steps down as blows land on it.
      steps: [4, 6]
      display: die
---
kind: sheet
id: party
name: Party
description: |-
  The party of the Generic rules, as a whole: its morale and its food.

  **Shows:** the smallest party sheet: a value with bounds, drawn as boxes, and a supply as a plain value of the party (it starts rolled, `default: '{{2d3+2}}'`, and never goes below 0; the rules eat it).
values:
  morale:
    name: Morale
    description: How the party holds up, from 0 (broken) to 5. Your tables lower or raise it and may read it.
    default: 3
    min: 0
    max: 5
    display: boxes
  food:
    name: Food
    description: Days of food the party carries between them, rolled when it sets out (2d3+2); a day is eaten as each day ends, and it never goes below 0.
    # Rolled for each new party (dice as a default): 4 to 8.
    default: '{{2d3+2}}'
    min: 0
---
# Each map's own (the system's `mapSheet`): kept for each map, read as `map.values.*`.
kind: sheet
id: map
name: This map
description: |-
  What each map keeps of its own in the Generic rules: how many times the party has explored it, and the die exploring rolls for a landmark.

  **Shows:** the smallest sheet of each map (`mapSheet`): a value each map keeps (`map.values.explored`), which an action raises (`map.values.explored: 1`) and the trip finds again when it comes back to the map; and the smallest die that steps (`steps: [4, 6]`, `display: die`), a d6 that drops to a d4 (`map.values.finds: -1`).
values:
  explored:
    name: Explored
    description: How many times the party has explored this map (Explore). Your tables may read it.
    default: 0
    min: 0
  # A die that steps down: a d6 until a landmark is found here, then a d4, which can't roll
  # the 6 another one needs (places.yaml).
  finds:
    name: Finds die
    description: The die Explore rolls for a landmark on this map, a 6 finding one. Once one is found it drops to a d4.
    default: 6
    steps: [4, 6]
    display: die
