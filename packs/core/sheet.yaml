# The Generic rules' sheets (system.yaml): its characters (`sheet: character`) and the
# party's own (`partySheet: party`). The smallest that work.
kind: sheet
id: character
name: Character
description: |-
  A character of the Generic rules: their health and whether they're wounded.

  **Shows:** the smallest character sheet: a value with bounds and a condition.
values:
  health:
    name: Health
    description: How much harm the character can still take; at 0 they're down. Your tables say what costs or restores it.
    default: 3
    min: 0
    max: 3
conditions:
  wounded:
    name: Wounded
    description: Hurt badly enough to matter until it's cleared; your tables and rules say what it stops.
---
kind: sheet
id: party
name: Party
description: |-
  The party of the Generic rules, as a whole: its morale.

  **Shows:** the smallest party sheet: one value with bounds, drawn as a track.
values:
  morale:
    name: Morale
    description: How the party holds up, from 0 (broken) to 5. Your tables lower or raise it and may read it.
    default: 3
    min: 0
    max: 5
    track: true
