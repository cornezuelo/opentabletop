# An example travel system that uses every part of travel rules and bindings. Pick "Core"
# in the Hexmapper, Play → With rules. The manual explains each part: Connecting tables
# to maps and trips.
kind: travel-rules
id: default
day: { start: '07:00', nightfall: '19:00' }
travel: { hoursPerDay: 8 }
terrains:
  plains: { multiplier: 1 }
  steppe: { multiplier: 1 }
  farmland: { multiplier: 1 }
  desert: { multiplier: 0.75 }
  forest: { multiplier: 0.5 }
  taiga: { multiplier: 0.5 }
  hills: { multiplier: 0.5 }
  tundra: { multiplier: 0.5 }
  snow: { multiplier: 0.5 }
  badlands: { multiplier: 0.5 }
  swamp: { multiplier: 0.33 }
  jungle: { multiplier: 0.33 }
  mountains: { multiplier: 0.33 }
  volcanic: { multiplier: 0.33 }
  heath: { multiplier: 0.75 }
  savanna: { multiplier: 1 }
  dense-forest: { multiplier: 0.33 }
  marsh: { multiplier: 0.33 }
  peaks: { multiplier: 0.25 }
  canyon: { multiplier: 0.5 }
  oasis: { multiplier: 1 }
  glacier: { multiplier: 0.25 }
  coast: { multiplier: 1 }
  lake: { passable: false }
  sea: { passable: false }
  deep-sea: { passable: false }
defaultTerrain: { multiplier: 1 }
edges:
  road: { multiplier: 1.5 }
  trail: { multiplier: 1.2 }
modes:
  foot: { kmPerDay: 25 }
  horse: { kmPerDay: 50, consumes: { fodder: 1 } }
resources:
  food: { perDay: 1 }
  fodder: {}
weather:
  rain: { speed: 0.75 }
  hot: { speed: 0.75 }
  fog: { speed: 0.75 }
  snow: { speed: 0.5 }
  storm: { speed: 0 }
  blizzard: { speed: 0 }
actions:
  rest: { minutes: 120, fatigue: 1 }
checks:
  - { event: WEATHER_CHECK_REQUIRED, at: day-start }
  - { event: NAVIGATION_CHECK_REQUIRED, at: day-start, unless: { edges: [road, river] } }
  - { event: ENCOUNTER_CHECK_REQUIRED, at: hex-enter, unless: { edges: road } }
  # No binding below: the trip stops at hexes tagged "landmark" and waits for you.
  - { event: LANDMARK_CHECK_REQUIRED, at: hex-enter, when: { tags: landmark } }
  - { event: CAMP_ENCOUNTER_CHECK_REQUIRED, at: camp }
---
kind: bindings
id: default
stats:
  charisma:
    name: { en: Charisma, es: Carisma }
    description: { en: 'Added to reaction rolls.', es: 'Se suma a las tiradas de reacción.' }
    default: 0
  navigation:
    name: { en: Navigation, es: Orientación }
    description:
      {
        en: 'Added to the getting-lost roll (a guide, a good map).',
        es: 'Se suma a la tirada de perderse (un guía, un buen mapa).',
      }
    default: 0
on:
  WEATHER_CHECK_REQUIRED: { resolve: weather }
  NAVIGATION_CHECK_REQUIRED: { resolve: getting-lost }
  # The same table by day and by night: the context tells it which.
  ENCOUNTER_CHECK_REQUIRED: { resolve: wilderness-encounter, context: { timeOfDay: day } }
  CAMP_ENCOUNTER_CHECK_REQUIRED: { resolve: wilderness-encounter, context: { timeOfDay: night } }
