# The Generic rules' bestiary (system.yaml: `bestiary: [bestiary.foes]`): one template, on the
# characters' own sheet, and a table that makes copies of it. The smallest that works.
kind: bestiary
id: foes
name: Foes
description: |-
  Whoever stands in the way: a template to make foes from.

  **Shows:** the smallest bestiary: one template on the characters' sheet (`sheet: sheet.character`), its health rolled for each copy; a copy whose health reaches 0 is down, and gone (the sheet's _Down_ `leaves`).
sheet: sheet.character
templates:
  foe:
    name: Foe
    description: Someone or something hostile; your tables say who.
    values: { health: '{{1d3}}' }
---
# Rolled by hand during a trip, its result makes copies of the template (`present.foe`):
# as many as its `set` rolls, said in its text.
kind: table
id: trouble
tags: [encounters]
name: Trouble on the road
description: |-
  **Foes** block the way: how many, and they're there.

  **Shows:** a result that makes copies of a template (`present.foe: '{{foes}}'`), as many as its `set` rolls and its text says; a die that explodes once (`1d3!1`: on a 3, another 1d3 more).
roll: 1d1
entries:
  - id: foes
    range: 1
    # Dice that explode once: on a 3, another 1d3 come.
    set: { foes: '{{1d3!1}}' }
    result: '{{foes}} foes block the way'
    effects: { present.foe: '{{foes}}' }
---
# What a foe does on its turn in a fight (system.yaml: `encounter.foes`): it strikes one of
# the party's members, rolled, as a Strike does a foe.
kind: table
id: foe-turn
tags: [encounters]
name: A foe's turn
description: |-
  What a foe does on its turn in a fight: a blow at one of you, or now and then a sweep at all of you.

  **Shows:** what foes do on their turns (`encounter.foes` in the system), rolled acting as each foe; a result aimed at someone (`set: { target: party.members.random }`), its effect on them (`characters[target].values.health`, and their shield's wear die a step down, `characters[target].items.shield.wear: -1`, nothing for whoever carries none); a result aimed at everyone (`set: { target: party.members.all }`), its effect played for each, its die rolled for each. A staggered foe never rolls it: its turn is lost (the system's `encounter.skip`).
roll: 1d6
entries:
  - id: blow
    range: 1-5
    set: { target: party.members.random }
    result: The foe strikes
    # The shield of whoever it hits, if they carry one, drops a step (d6 to d4).
    effects:
      { 'characters[target].values.health': '-{{1d3}}', 'characters[target].items.shield.wear': -1 }
  # Each of you, each with their own die.
  - id: sweep
    range: 6
    set: { target: party.members.all }
    result: The foe sweeps at all of you
    effects: { 'characters[target].values.health': '-{{1d2}}' }
---
# A member's blow (travel.yaml's Strike): 1d3 harm; a glancing 1 staggers the foe for a round.
kind: table
id: strike
tags: [encounters]
name: A strike
description: |-
  A blow at the foe chosen: 1d3 harm; a glancing 1 throws it off balance, staggered for a round, and it loses its turn.

  **Shows:** a condition given for a while (`characters[params.foe].conditions.staggered: 1`: one round, the sheet's `lasts: rounds`), counted down by the fight.
roll: 1d3
entries:
  - id: glancing
    range: 1
    result: 1 harm, and it staggers
    effects:
      {
        'characters[params.foe].values.health': -1,
        'characters[params.foe].conditions.staggered': 1,
      }
  - {
      id: blow,
      range: 2-3,
      result: '{{roll}} harm',
      effects: { 'characters[params.foe].values.health': '-{{roll}}' },
    }
---
# What a fallen foe carried (travel.yaml's _Search the fallen_, as it leaves those present).
kind: table
id: fallen
tags: [encounters]
name: What the fallen carry
description: |-
  What a foe that fell had on it: nothing much, or a day's food.

  **Shows:** a table rolled as one of those present leaves (`on: present.leave`), only for one that fell (`when: { acting.conditions: down }`), read acting as it.
roll: 1d6
entries:
  - { id: nothing, range: 1-4, result: Nothing worth taking }
  - { id: food, range: 5-6, result: A day's food, effects: { party.values.food: 1 } }
