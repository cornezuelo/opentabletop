# What the world does when Core's growing threat fills (clocks.yaml): it strikes with one of
# Core's twists. A system brings both: `clocks: core/clocks.threat`, `world: core/world.threat`.
kind: world
id: threat
name: The threat strikes
description: |-
  The world's reaction to Core's growing threat (`core/clocks.threat`): when it fills, a line on the timeline and one of Core's _Twists_; the clock starts over by itself. A system brings both: `clocks: core/clocks.threat` and `world: core/world.threat`.
reactions:
  strikes:
    name: The threat strikes
    on: world.clocks.the-threat-grows.full
    do:
      - { id: strikes, say: The threat strikes. }
      - roll: table.twists
