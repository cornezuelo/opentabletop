# Map styles (docs/map-styles.md): how a map is drawn, never what it holds. Map settings →
# Style offers every loaded pack's; choosing one copies its names', regions', coordinates'
# and glyphs' settings into the map, which changes them freely after. A key left out is
# this style's.
kind: style
id: schematic
name: Schematic
description: |-
  Flat colours and a small glyph per terrain, every cell with its coordinates: plain and clear, for planning and printing.

  **Shows:** a map style (`kind: style`): the grid's line (`grid`), the terrains' glyphs, how each kind of name is drawn (`captions`) and the regions (`regions`).
grid: { color: '#000000', opacity: 0.35, coords: true }
glyphs: 0.45
captions:
  hexNames: { font: fell, size: 1, italic: false, halo: true, haloColor: '#f4eedd' }
  regionNames: { font: fell, size: 1, italic: true, halo: true, haloColor: '#f4eedd' }
  tokenNames: { font: fell, size: 1, italic: false, halo: true, haloColor: '#f4eedd' }
regions: { fill: 0.14, border: 0.09, dashed: false, borderOpacity: 0.85 }
---
# Ink on paper: each terrain a light wash of its colour, its art drawn in ink by the
# painters (by terrain id: the natural palette's), borders that wander and blend, rippled
# shores, roads and rivers drawn by hand. No coordinates or glyphs.
kind: style
id: parchment
name: Parchment
description: |-
  A hexcrawl drawn in ink on old paper: a light wash of each terrain's colour, mountains, trees, hills and waves drawn by hand, rippled shores, wandering borders, roads and rivers that wobble. No coordinates (the cell's panel and the line under the map say them).

  **Shows:** a style's paper and ground (`paper`, `ground`: wash, blend, ragged borders, grain), art by terrain in ink (`art.mode: ink`, a painter per terrain id), shores (`shores.lines`) and paths drawn by hand (`paths.wobble`, each kind's colour and width); connections drawn as what they are (`connections`: a bridge, a ford's stepping stones).
paper: '#efe3c4'
grid: { color: '#5a4630', opacity: 0.12, coords: false }
glyphs: 0
ground: { wash: 0.62, blend: 0.2, ragged: 0.3, grain: 0.35 }
art:
  mode: ink
  ink: '#3b2a1a'
  terrains:
    steppe: { painter: grass, density: 0.8 }
    plains: grass
    farmland: farmland
    heath: { painter: grass, density: 0.6 }
    savanna: { painter: broadleaf, density: 0.35 }
    forest: conifers
    dense-forest: { painter: forest, density: 1.2 }
    jungle: { painter: broadleaf, density: 1.4 }
    taiga: { painter: conifers, density: 0.8 }
    swamp: { painter: reeds, density: 1.2 }
    marsh: reeds
    hills: { painter: hills, size: 1.15 }
    mountains: { painter: mountains, size: 1.3 }
    peaks: { painter: peaks, size: 1.3 }
    volcanic: volcano
    desert: dunes
    badlands: rocks
    canyon: { painter: rocks, density: 1.5 }
    oasis: { painter: broadleaf, density: 0.4 }
    tundra: { painter: grass, density: 0.4 }
    glacier: { painter: rocks, density: 0.4 }
    coast: dots
    lake: { painter: waves, density: 0.4 }
    sea: { painter: waves, density: 0.6 }
    deep-sea: { painter: waves, density: 0.4 }
shores: { lines: 3, color: '#3b2a1a' }
paths:
  wobble: 0.5
  river: { color: '#3d6f96', width: 0.15 }
  road: { color: '#6b4a2a', width: 0.09 }
  trail: { color: '#6b4a2a', width: 0.07 }
captions:
  hexNames: { font: fell, color: '#3b2a1a', halo: true, haloColor: '#efe3c4' }
  regionNames: { font: fell, italic: true, halo: true, haloColor: '#efe3c4' }
  tokenNames: { font: fell, halo: true, haloColor: '#efe3c4' }
regions: { fill: 0.05, border: 0.06, dashed: true, borderOpacity: 0.7 }
# Connections of these kinds (as a system names them) drawn as what they are; the rest a
# dashed line with a diamond, the ways into sub-maps a badge.
connections:
  bridge: bridge
  ford: ford
---
# Painted: the terrains' own colours blended into each other, art lit on one side and shaded
# on the other, shallows along the shores, no grid lines to speak of.
kind: style
id: painted
name: Painted
description: |-
  A painted map: rich colours that melt into each other, mountains and trees lit on one side and shaded on the other, pale shallows along the shores, a paper grain over all. No coordinates.

  **Shows:** art painted by terrain (`art.mode: painted`), the ground's colours blended (`ground.blend`) with a little wash, shores as a shallow band (`shores.band`), a ford drawn as stepping stones (`connections`).
paper: '#d9cba6'
grid: { color: '#000000', opacity: 0.06, coords: false }
glyphs: 0
ground: { wash: 0.08, blend: 0.55, ragged: 0.4, grain: 0.22 }
art:
  mode: painted
  terrains:
    steppe: { painter: grass, density: 0.8 }
    plains: grass
    farmland: farmland
    heath: { painter: grass, density: 0.6 }
    savanna: { painter: broadleaf, density: 0.35 }
    forest: { painter: conifers, size: 1.25 }
    dense-forest: { painter: forest, density: 1.3, size: 1.2 }
    jungle: { painter: broadleaf, density: 1.4 }
    taiga: { painter: conifers, density: 0.8, size: 1.25 }
    swamp: { painter: reeds, density: 1.2 }
    marsh: reeds
    hills: { painter: hills, size: 1.15 }
    mountains: { painter: mountains, size: 1.3 }
    peaks: { painter: peaks, size: 1.3 }
    volcanic: volcano
    desert: dunes
    badlands: rocks
    canyon: { painter: rocks, density: 1.5 }
    oasis: { painter: broadleaf, density: 0.4 }
    tundra: { painter: grass, density: 0.4 }
    glacier: { painter: rocks, density: 0.4 }
    coast: dots
    lake: { painter: waves, density: 0.4 }
    sea: { painter: waves, density: 0.6 }
    deep-sea: { painter: waves, density: 0.4 }
shores: { band: 0.8 }
paths:
  wobble: 0.35
  river: { color: '#4f8fc0', width: 0.17 }
  road: { color: '#8a6a44', width: 0.09 }
  trail: { color: '#8a6a44', width: 0.07 }
captions:
  hexNames: { font: fell, halo: true, haloColor: '#f4eedd' }
  regionNames: { font: cinzel, italic: false, halo: true, haloColor: '#f4eedd' }
  tokenNames: { font: fell, halo: true, haloColor: '#f4eedd' }
regions: { fill: 0.06, border: 0.05, dashed: false, borderOpacity: 0.6 }
connections:
  bridge: bridge
  ford: ford
---
# Painted's ground with pictures for the land's relief: mountains, hills, trees and dunes
# drawn by images (Azgaar's colored relief icons, the azgaar-relief pack), each cell one of
# its list; water and grass keep their painters. The trees' pictures fill little of their
# frame, so their sizes are large.
kind: style
id: relief
name: Relief
description: |-
  A painted map whose mountains, hills, forests, dunes, swamps and volcanoes are pictures: a mountain or a hill to a cell, trees in groups. Rich colours that melt into each other, a paper grain over all. No coordinates.

  **Shows:** art by images of a pack (`art.terrains.<terrain>.images`, a list each cell picks one of, `count` of them a cell), beside painters for the rest; images from another pack (Azgaar's relief icons), named `<pack>/<path>`.
paper: '#d9cba6'
grid: { color: '#000000', opacity: 0.06, coords: false }
glyphs: 0
ground: { wash: 0.08, blend: 0.55, ragged: 0.4, grain: 0.22 }
art:
  mode: painted
  terrains:
    steppe: { painter: grass, density: 0.8 }
    plains: grass
    farmland: farmland
    heath: { painter: grass, density: 0.6 }
    savanna: { images: azgaar-relief/colored/acacia-1.svg, count: 2, size: 2 }
    forest: { images: azgaar-relief/colored/conifer-1.svg, count: 3, size: 2.3 }
    dense-forest:
      images: [azgaar-relief/colored/deciduous-1.svg, azgaar-relief/colored/deciduous-2.svg]
      count: 4
      size: 2.6
    jungle: { images: azgaar-relief/colored/palm-1.svg, count: 4, size: 2.6 }
    taiga: { images: azgaar-relief/colored/coniferSnow-1.svg, count: 3, size: 2.3 }
    swamp:
      images: [azgaar-relief/colored/swamp-1.svg, azgaar-relief/colored/swamp-2.svg]
      count: 3
      size: 2
    marsh: reeds
    hills:
      images:
        - azgaar-relief/colored/hill-1.svg
        - azgaar-relief/colored/hill-2.svg
        - azgaar-relief/colored/hill-3.svg
        - azgaar-relief/colored/hill-4.svg
    mountains:
      images:
        - azgaar-relief/colored/mount-1.svg
        - azgaar-relief/colored/mount-2.svg
        - azgaar-relief/colored/mount-3.svg
        - azgaar-relief/colored/mount-4.svg
        - azgaar-relief/colored/mount-5.svg
        - azgaar-relief/colored/mount-6.svg
      size: 1.15
    peaks:
      images:
        - azgaar-relief/colored/mountSnow-1.svg
        - azgaar-relief/colored/mountSnow-2.svg
        - azgaar-relief/colored/mountSnow-3.svg
        - azgaar-relief/colored/mountSnow-4.svg
        - azgaar-relief/colored/mountSnow-5.svg
        - azgaar-relief/colored/mountSnow-6.svg
      size: 1.15
    volcanic:
      images: [azgaar-relief/colored/vulcan-1.svg, azgaar-relief/colored/vulcan-2.svg]
      size: 1.15
    desert: { images: azgaar-relief/colored/dune-1.svg, count: 2 }
    badlands: rocks
    canyon: { painter: rocks, density: 1.5 }
    oasis: { images: azgaar-relief/colored/palm-1.svg, count: 2, size: 2 }
    tundra: { painter: grass, density: 0.4 }
    glacier: { painter: rocks, density: 0.4 }
    coast: dots
    lake: { painter: waves, density: 0.4 }
    sea: { painter: waves, density: 0.6 }
    deep-sea: { painter: waves, density: 0.4 }
shores: { band: 0.8 }
paths:
  wobble: 0.35
  river: { color: '#4f8fc0', width: 0.17 }
  road: { color: '#8a6a44', width: 0.09 }
  trail: { color: '#8a6a44', width: 0.07 }
captions:
  hexNames: { font: fell, halo: true, haloColor: '#f4eedd' }
  regionNames: { font: cinzel, italic: false, halo: true, haloColor: '#f4eedd' }
  tokenNames: { font: fell, halo: true, haloColor: '#f4eedd' }
regions: { fill: 0.06, border: 0.05, dashed: false, borderOpacity: 0.6 }
connections:
  bridge: bridge
  ford: ford
---
# A dungeon as old modules and Dungeon Scrawl draw it: white floor with a faint grid, thick
# black walls, the rock beyond them hatched by hand. For maps with floor (rooms, corridors).
kind: style
id: classic-dungeon
name: Classic dungeon
description: |-
  A dungeon as old adventure modules draw it: white floor with a faint grid, thick black walls, the rock around them hatched by hand, water and rubble still shown. No coordinates.

  **Shows:** a style's floors (`floors`: their colour, `wash` giving the terrains' colours way to it, a grid on floor alone) and walls (`walls`: colour, width, `outside: hatch` and how deep the band is); doors, arches and gates in their walls, stairs and ladders on the cells a way down or up arrives at (`connections`, by kind).
paper: '#f7f5ef'
grid: { color: '#3a3a3a', opacity: 0, coords: false }
glyphs: 0
floors: { color: '#ffffff', wash: 1, grid: 0.28 }
walls: { color: '#1b1b1b', width: 0.14, outside: hatch, band: 0.42 }
art:
  mode: ink
  ink: '#2a2a2a'
  terrains:
    rubble: { painter: rocks, density: 0.9, size: 0.8 }
    pool: { painter: waves, density: 0.5 }
captions:
  hexNames: { font: sans, color: '#1b1b1b', halo: true, haloColor: '#ffffff' }
  regionNames: { font: fell, italic: true, halo: true, haloColor: '#ffffff' }
  tokenNames: { font: sans, halo: true, haloColor: '#ffffff' }
regions: { fill: 0.04, border: 0.05, dashed: true, borderOpacity: 0.6 }
# Doors in their walls; the ways between maps as stairs (a shaft's as a ladder).
connections:
  door: door
  gate: door
  arch: arch
  way-in: stair
  stair: stair
  shaft: ladder
  ladder: ladder
---
# A cave: rough rock edges that wander off the grid, sandy floor, the rock beyond the walls
# stippled thick by them and thinning out.
kind: style
id: cave
name: Cave
description: |-
  A cave or a mine: walls of rough rock that wander off the grid, a pale sandy floor, the rock beyond them stippled thick by the walls and thinning out. No coordinates.

  **Shows:** walls that follow the ground's ragged borders (`ground.ragged`), the rock outside stippled (`walls.outside: stipple`), floor kept partly in its terrains' colours (`floors.wash` below 1), the ways out drawn as a cave's mouth and a shaft as a ladder (`connections`).
paper: '#cbbfa6'
grid: { color: '#4a3f30', opacity: 0, coords: false }
glyphs: 0
ground: { ragged: 0.45, grain: 0.3 }
floors: { color: '#f3ead6', wash: 0.75, grid: 0.12 }
walls: { color: '#3a3026', width: 0.1, outside: stipple, band: 0.5 }
art:
  mode: ink
  ink: '#3a3026'
  terrains:
    rubble: { painter: rocks, density: 1.1 }
    pool: { painter: waves, density: 0.5 }
captions:
  hexNames: { font: fell, color: '#3a3026', halo: true, haloColor: '#f3ead6' }
  regionNames: { font: fell, italic: true, halo: true, haloColor: '#f3ead6' }
  tokenNames: { font: fell, halo: true, haloColor: '#f3ead6' }
regions: { fill: 0.04, border: 0.05, dashed: true, borderOpacity: 0.6 }
connections:
  door: door
  arch: arch
  way-in: mouth
  shaft: ladder
  ladder: ladder
---
# A town or a village seen from above: streets of cobbles, yards and gardens in ink over a
# light wash, and the buildings under their roofs; a building opens (its floor and walls)
# while the party is in it, or the Roofs layer is hidden.
kind: style
id: village
name: Village
description: |-
  A town or a village seen from above: cobbled streets, yards and gardens drawn in ink over a light wash, trees and water, and every building under its tiled roof, casting its shadow. A building opens while the party is in it (or a cell of it is selected), showing its wooden floor, its walls and its doors. No coordinates.

  **Shows:** roofs over buildings (`roofs`: tiles, their colour, the shadow cast), floor and walls inside them (`floors`, `walls` with a soft shadow outside), the street's cobbles drawn by their own painter (`art.terrains.cobbles: cobbles`), doors in their walls (`connections`).
paper: '#ece2c8'
grid: { color: '#5a4630', opacity: 0.08, coords: false }
glyphs: 0
ground: { wash: 0.35, blend: 0.12, grain: 0.25 }
art:
  mode: ink
  ink: '#3b2a1a'
  terrains:
    plains: { painter: grass, density: 0.7 }
    cobbles: cobbles
    yard: { painter: dots, density: 0.5 }
    garden: farmland
    forest: { painter: broadleaf, size: 1.3 }
    lake: { painter: waves, density: 0.5 }
shores: { lines: 2, color: '#3b2a1a' }
paths:
  wobble: 0.25
  river: { color: '#3d6f96', width: 0.3 }
  road: { color: '#8a7860', width: 0.35 }
  trail: { color: '#8a7860', width: 0.15 }
floors: { color: '#d8bd90', wash: 0.85, grid: 0.22 }
walls: { color: '#3a2b1e', width: 0.12, outside: shadow, band: 0.15 }
roofs: { kind: tiles, color: '#a5563a', shadow: 0.3 }
captions:
  hexNames: { font: fell, color: '#3b2a1a', halo: true, haloColor: '#ece2c8' }
  regionNames: { font: fell, size: 0.75, italic: true, halo: true, haloColor: '#ece2c8' }
  tokenNames: { font: fell, halo: true, haloColor: '#ece2c8' }
regions: { fill: 0, border: 0, dashed: false, borderOpacity: 0 }
connections:
  door: door
  gate: door
  arch: arch
  way-in: badge
