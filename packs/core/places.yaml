# The Generic rules' places (system.yaml: `places: [places.default]`): one template, and a
# table that makes it on the party's hex (`place.pois.landmark: 1`), rolled by Explore
# (travel.yaml). The smallest that works.
kind: places
id: default
name: Places
description: |-
  Places a result can make on the party's hex.

  **Shows:** the smallest catalogue of places: one template with a name, a text, an icon of the map's, a tag it gives the hex and a value the rules read there (`place.poi.shelter`); on a map it's written as a point of interest, in a trip without one the journal notes it.
places:
  landmark:
    name: Landmark
    description: Something worth finding again.
    icon: game:obelisk
    tags: [landmark]
    # A value of the place, read by the rules on its cell (`place.poi.shelter`, Camp).
    fields: { shelter: 1 }
---
# Rolled by Explore's last step: on a 6, a landmark is made on the party's hex.
kind: table
id: place-found
tags: [places]
name: A place found?
description: |-
  Whether exploring finds a place worth marking: on a 6, a **Landmark**; on a 5, a locked chest. It rolls the map's Finds die, a d6 that drops to a d4 once a landmark is found, so a map has one.

  **Shows:** a result that makes a place from a template (`effects: { place.pois.landmark: 1 }`); one that makes a thing present that doesn't fight (`present.chest: 1`); a die whose size is a value that steps (`roll: '1d{{map.values.finds}}'`, `map.values.finds: -1`), asked for when rolled in the Oracle with no map.
# The map's Finds die; the Oracle, with no map, asks for it.
roll: '1d{{map.values.finds}}'
entries:
  - { id: nothing, range: 1-4, result: Nothing worth marking }
  # A thing present that doesn't fight (bestiary.yaml's Locked chest).
  - { id: chest, range: 5, result: A locked chest, effects: { present.chest: 1 } }
  - {
      id: landmark,
      range: 6,
      result: A landmark worth marking,
      effects: { place.pois.landmark: 1, map.values.finds: -1 },
    }
