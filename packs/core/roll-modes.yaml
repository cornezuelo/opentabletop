# Ways of rolling a table's whole roll several times and keeping one total. Tables list the
# ones they offer (`modes`) and when they apply by themselves (`modeWhen`). Other packs use
# them through their dependency on Core (`modes: [advantage, disadvantage]`).
kind: roll-modes
id: default
modes:
  advantage:
    name: Advantage
    description: Roll twice and keep the higher total.
    repeat: 2
    keep: highest
    # Advantage and disadvantage together give a normal roll.
    cancels: disadvantage
  disadvantage:
    name: Disadvantage
    description: Roll twice and keep the lower total.
    repeat: 2
    keep: lowest
