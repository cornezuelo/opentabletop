# Ways of rolling a table's whole roll several times and keeping one total. Tables list the
# ones they offer (`modes`) and when they apply by themselves (`modeWhen`). Other packs use
# them through their dependency on Core (`modes: [roll-modes.advantage, roll-modes.disadvantage]`).
kind: roll-modes
id: default
modes:
  advantage:
    name: Advantage
    description: Roll twice and keep the higher total.
    repeat: 2
    keep: highest
    # Advantage and disadvantage together give a normal roll.
    cancels: roll-modes.disadvantage
  # A percentile die read either way round, its tens and units swapped (`swap`), the lower
  # kept: for rolling under a chance (_Against the odds_, oracles.yaml).
  either-way:
    name: Either way
    description: Read the percentile die either way round, its tens and units swapped, and keep the lower.
    swap: true
    keep: lowest
  disadvantage:
    name: Disadvantage
    description: Roll twice and keep the lower total.
    repeat: 2
    keep: lowest
