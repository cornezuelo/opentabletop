travel-rules/default:
  modes:
    foot:
      name: A pie
    horse:
      name: A caballo
  checks:
    WEATHER_CHECK_REQUIRED:
      name: Clima
      description: Se tira cada mañana, según la estación; el de hoy sigue al de ayer.
  actions:
    march:
      name: Marchar
      description: 'Marchar por la ruta mientras no es de noche, 8 horas al día: hasta el destino o un hex.'
      params:
        until:
          name: Hasta dónde
          choices:
            destination: Hasta el destino
            hex: Un hex
    camp:
      name: Acampar
      description: Dormir hasta la mañana.
    rest:
      name: Descansar
      description: Una hora sin marchar, solo de día.
    eat:
      name: Comer
      description: Un día de comida, que se come al acabar cada día.
      do:
        empty:
          say: No queda nada que comer.
    despair:
      name: Desesperación
      description: Cuando la moral del grupo llega a 0, el viaje se detiene para que decidas qué hace.
      do:
        broken:
          pause: El grupo ha perdido el ánimo.
    explore:
      name: Explorar
      description: 'Una hora mirando alrededor, de día: una idea de lo que encontráis (una acción y un tema, la Inspiración de Core).'
