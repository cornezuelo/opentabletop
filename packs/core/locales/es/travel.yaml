travel-rules/default:
  connections:
    gate:
      name: Verja
      description: Diez minutos más para pasarla; no se puede pasar mientras está cerrada.
    door:
      name: Puerta
      description: Un paso a través de un muro.
    way-in:
      name: Entrada
      description: Cinco minutos para entrar, o para volver a salir.
    river:
      crossing:
        name: Vadear el río
        description: Una hora más para cruzar un río donde no lo cruza un camino ni un puente.
  modes:
    foot:
      name: A pie
    horse:
      name: A caballo
  checks:
    WEATHER_CHECK_REQUIRED:
      name: Clima
      description: Se tira cada mañana, según la estación; el de hoy sigue al de ayer.
  actions:
    march:
      name: Marchar
      description: 'Marchar por la ruta mientras no es de noche, 8 horas al día: hasta el destino o un hex.'
      params:
        until:
          name: Hasta dónde
          choices:
            destination: Hasta el destino
            place: Una casilla
    camp:
      name: Acampar
      description: Dormir hasta la mañana.
      do:
        sheltered:
          say: El hito os ha dado cobijo.
    rest:
      name: Descansar
      description: Una hora sin marchar, solo de día.
    eat:
      name: Comer
      description: Un día de comida, que se come al acabar cada día.
      do:
        empty:
          say: No queda nada que comer.
    despair:
      name: Desesperación
      description: Cuando la moral del grupo llega a 0, el viaje se detiene para que decidas qué hace.
      do:
        broken:
          pause: El grupo ha perdido el ánimo.
    open-gate:
      name: Abrir la verja
      description: Diez minutos para abrir una verja cerrada del camino.
    fight:
      name: Luchar
      description: 'Con enemigos aquí: empieza un combate por turnos, el grupo primero.'
    strike:
      name: Golpear
      description: 'En el turno de un miembro, en un combate: un golpe a un enemigo de los que están aquí, el que elijáis, por 1d3 de daño.'
      params:
        foe: { name: ¿A quién? }
    explore:
      name: Explorar
      description: 'Una hora mirando alrededor, de día: una idea de lo que encontráis (una acción y un tema, la Inspiración de Core) y, con un 6, un hito que merece la pena marcar. Se cuenta en el mapa (Explorado).'
      do:
        idea:
          say: 'Miráis alrededor. Lo que encontráis, como una idea que leer libremente:'
