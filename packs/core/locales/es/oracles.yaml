yes-no:
  name: ¿Sí o no?
  description: Haz una pregunta que se responda con sí o no, elige lo probable que es y tira.
  inputs:
    odds:
      label: Probabilidad
      labels:
        very-unlikely: Muy improbable
        unlikely: Improbable
        even: Igualada
        likely: Probable
        very-likely: Muy probable
  entries:
    yes-and: Sí, y algo más
    yes: Sí
    yes-but: Sí, pero a un precio
    no-but: No, pero hay una forma
    no: 'No'
    no-and: No, y empeora
npc-attitude:
  name: ¿Cómo se lo toman?
  description: Pregunta cómo responde alguien a una petición. Cuanto más pides, más difícil es el sí; cada respuesta trae un motivo.
  entries:
    agree: 'Aceptan ({{result}})'
    refuse: 'Se niegan ({{result}})'
    price: 'Solo por {{2d6}} monedas de plata ({{result}})'
  inputs:
    stakes:
      label: Lo que pides
      labels: { small: Un pequeño favor, fair: Un trato justo, big: Mucho pedir }
npc-motive:
  name: Motivo
  entries:
    greed: codicia
    fear: miedo
    loyalty: lealtad
    curiosity: curiosidad
    duty: deber
