yes-no:
  name: ¿Sí o no?
  description: |-
    Haz una pregunta que se responda con **sí o no**, elige lo probable que es y tira.

    - **Sí, y…** / **No, y…**: más de lo que preguntabas, para bien o para mal.
    - **Sí, pero…** / **No, pero…**: la respuesta llega con un precio, o con una salida.

    Si dudas de la probabilidad, elige _Igualada_.
  inputs:
    odds:
      label: Probabilidad
      labels:
        very-unlikely: Muy improbable
        unlikely: Improbable
        even: Igualada
        likely: Probable
        very-likely: Muy probable
  entries:
    yes-and: Sí, y algo más
    yes: Sí
    yes-but: Sí, pero a un precio
    no-but: No, pero hay una forma
    no: 'No'
    no-and: No, y empeora
npc-attitude:
  name: ¿Cómo se lo toman?
  description: |-
    Pregunta cómo responde alguien a una **petición**. Cuanto mayor es lo que pides, más difícil el sí: una **gran petición** puede tener precio.

    Cada respuesta llega con un _Motivo_, para que sepas por qué lo dicen.
  entries:
    agree: 'Aceptan ({{result}})'
    refuse: 'Se niegan ({{result}})'
    price: 'Solo por {{2d6}} monedas de plata ({{result}})'
  inputs:
    stakes:
      label: Lo que pides
      labels: { small: Un pequeño favor, fair: Un trato justo, big: Mucho pedir }
npc-motive:
  name: Motivo
  description: |-
    **Por qué** alguien hace lo que hace. La codicia y el miedo son lo más común.
  entries:
    greed: codicia
    fear: miedo
    loyalty: lealtad
    curiosity: curiosidad
    duty: deber
against-the-odds:
  name: Contra pronóstico
  description: |-
    Tira **por debajo de una probabilidad** sobre cien: si sale igual o menos, pasa. Unos dobles (11, 22… 00) lo hacen más que eso, para bien o para mal.

    **Enseña:** dados de porcentaje tirados por debajo de un valor (`when: { chance: { gte: '{{roll}}' } }`), los dobles (`dice.doubles`) y _Del derecho o del revés_, un modo de tirada que cambia las decenas y las unidades del dado (`swap`).
  entries:
    and: '{{roll}} contra {{chance}}: pasa, y algo más'
    yes: '{{roll}} contra {{chance}}: pasa'
    worse: '{{roll}} contra {{chance}}: falla, y va a peor'
    no: '{{roll}} contra {{chance}}: no pasa'
