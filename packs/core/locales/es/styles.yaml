style/schematic:
  name: Esquemático
  description: |-
    Colores planos y un pequeño símbolo por terreno, cada casilla con sus coordenadas: sencillo y claro, para preparar y para imprimir.

    **Enseña:** un estilo de mapa (`kind: style`): la línea de la rejilla (`grid`), los símbolos de los terrenos, cómo se dibuja cada clase de nombre (`captions`) y las regiones (`regions`).
style/parchment:
  name: Pergamino
  description: |-
    Un hexcrawl dibujado a tinta sobre papel viejo: una aguada suave del color de cada terreno, montañas, árboles, colinas y olas dibujadas a mano, costas con ondas, bordes que serpentean, caminos y ríos que tiemblan. Sin coordenadas (las dicen el panel de la casilla y la línea bajo el mapa).

    **Enseña:** el papel y el terreno de un estilo (`paper`, `ground`: aguada, fundido, bordes irregulares, grano), arte por terreno a tinta (`art.mode: ink`, un pintor por id de terreno), costas (`shores.lines`) y caminos dibujados a mano (`paths.wobble`, el color y el grosor de cada clase); conexiones dibujadas como lo que son (`connections`: un puente, las piedras de un vado).
style/painted:
  name: Pintado
  description: |-
    Un mapa pintado: colores intensos que se funden entre sí, montañas y árboles iluminados por un lado y en sombra por el otro, aguas someras claras junto a las costas, un grano de papel sobre todo. Sin coordenadas.

    **Enseña:** arte pintado por terreno (`art.mode: painted`), los colores del terreno fundidos (`ground.blend`) con poca aguada, costas como una franja somera (`shores.band`), un vado dibujado como piedras para cruzar (`connections`).
style/classic-dungeon:
  name: Mazmorra clásica
  description: |-
    Una mazmorra como la dibujan los módulos de aventura de siempre: suelo blanco con una rejilla tenue, muros gruesos y negros, la roca que los rodea rayada a mano, y el agua y los escombros a la vista. Sin coordenadas.

    **Enseña:** los suelos de un estilo (`floors`: su color, `wash`, que lleva los colores de los terrenos hacia él, y una rejilla solo en el suelo) y los muros (`walls`: color, grosor, `outside: hatch` y la profundidad de la franja); puertas, arcos y rejas en sus muros, escaleras y escalas en las casillas a las que llega un camino de bajada o subida (`connections`, por clase).
style/cave:
  name: Cueva
  description: |-
    Una cueva o una mina: muros de roca tosca que se salen de la rejilla, un suelo arenoso claro y la roca de fuera punteada, densa junto a los muros y cada vez más rala. Sin coordenadas.

    **Enseña:** muros que siguen los bordes irregulares del terreno (`ground.ragged`), la roca de fuera punteada (`walls.outside: stipple`) y el suelo que conserva en parte los colores de sus terrenos (`floors.wash` por debajo de 1), los caminos de salida dibujados como la boca de una cueva y un pozo como una escala (`connections`).
style/village:
  name: Aldea
  description: |-
    Un pueblo o una aldea visto desde arriba: calles empedradas, patios y huertos dibujados a tinta sobre una aguada suave, árboles y agua, y cada edificio bajo su tejado de tejas, con su sombra. Un edificio se abre mientras la party está dentro (o hay una casilla suya seleccionada), y se ven su suelo de madera, sus muros y sus puertas. Sin coordenadas.

    **Enseña:** tejados sobre los edificios (`roofs`: tejas, su color, la sombra que proyectan), suelo y muros dentro (`floors`, `walls` con una sombra suave por fuera), los adoquines de la calle dibujados por su propio pintor (`art.terrains.cobbles: cobbles`), puertas en sus muros (`connections`).
