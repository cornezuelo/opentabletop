bestiary/foes:
  name: Enemigos
  description: |-
    Quien se interpone en el camino: una plantilla de la que sacar enemigos.

    **Enseña:** el bestiario más pequeño: una plantilla sobre la hoja de los personajes (`sheet: sheet.character`), con su salud tirada para cada copia; una copia cuya salud llega a 0 cae, y se va (el _Caído_ de la hoja tiene `leaves`).
  templates:
    foe:
      name: Enemigo
      description: Alguien o algo hostil; vuestras tablas dicen quién.
trouble:
  name: Problemas en el camino
  description: |-
    **Enemigos** cortan el paso: cuántos, y ahí están.

    **Enseña:** un resultado que hace copias de una plantilla (`present.foe: '{{foes}}'`), tantas como tira su `set` y dice su texto; un dado que explota una vez (`1d3!1`: con un 3, otro 1d3 más).
  entries:
    foes: '{{foes}} enemigos cortan el paso'
foe-turn:
  name: El turno de un enemigo
  description: |-
    Lo que hace un enemigo en su turno en un combate: un golpe a uno de vosotros, o de vez en cuando un barrido contra todos.

    **Enseña:** lo que hacen los enemigos en sus turnos (`encounter.foes` en el sistema), tirado actuando como cada enemigo; a quién va su turno, elegido antes de tirar (el `aim: party.members.random` del sistema), y el efecto del golpe sobre él (`characters[encounter.target].values.health`, y el dado de desgaste de su escudo un escalón abajo, `characters[encounter.target].items.shield.wear: -1`, nada para quien no lleva); un resultado dirigido a todos (`set: { target: party.members.all }`), con su efecto jugado para cada uno y su dado tirado para cada uno. Un enemigo que se tambalea nunca la tira: pierde su turno (el `encounter.skip` del sistema).
  entries:
    blow: El enemigo golpea
    sweep: El enemigo os lanza un barrido a todos
strike:
  name: Un golpe
  description: |-
    Un golpe al enemigo elegido: 1d3 de daño; un 1, de refilón, lo desequilibra: tambaleándose una ronda, y pierde su turno.

    **Enseña:** un estado dado por un tiempo (`characters[params.foe].conditions.staggered: 1`: una ronda, el `lasts: rounds` de la hoja), que el combate descuenta.
  entries:
    glancing: 1 de daño, y se tambalea
    blow: '{{roll}} de daño'
fallen:
  name: Lo que llevan los caídos
  description: |-
    Lo que llevaba encima un enemigo que cayó: poca cosa, o un día de comida.

    **Enseña:** una tabla tirada cuando se va uno de los presentes (`on: present.leave`), solo por uno que cayó (`when: { acting.conditions: down }`), leída actuando como él.
  entries:
    nothing: Nada que merezca la pena
    food: Un día de comida
