sheet/character:
  name: Personaje
  description: |-
    Un personaje de las reglas genéricas: su salud, el daño recibido, si está herido y si ha caído.

    **Enseña:** la hoja de personaje más pequeña: un valor con límites, dibujado como barra, otro que sale de él (`from:`), un estado que ponen los efectos, otro que se da por un tiempo en un combate (_Tambaleándose_, `lasts: rounds`), otro que se cumple por sí solo (`when:`), un sitio en total para lo que lleva (`items.room`, diez cosas, no más) y un campo de los objetos que es un dado que baja por escalones (`wear: { steps: [4, 6] }`).
  values:
    health:
      name: Salud
      description: Cuánto daño puede aguantar aún el personaje; con 0 cae. Tus tablas dicen qué la quita o la devuelve.
    harm:
      name: Daño
      description: La salud perdida, calculada a partir de ella; no se cambia a mano.
  conditions:
    wounded:
      name: Herido
      description: Herido de verdad hasta que se le quite; tus tablas y reglas dicen qué le impide.
    staggered:
      name: Tambaleándose
      description: Aturdido por un golpe fuerte; pierde sus turnos en un combate mientras dure, ronda a ronda.
    down:
      name: Caído
      description: Fuera de combate mientras su salud sea 0; se le pasa por sí solo cuando recupera salud. Un enemigo sacado del bestiario se va en cuanto cae.
  items:
    fields:
      wear:
        name: Desgaste
        description: Cuánto aguanta aún una pieza de equipo, un dado que baja por escalones según le caen golpes.
sheet/party:
  name: Grupo
  description: |-
    El grupo de las reglas genéricas, como un todo: su moral y su comida.

    **Enseña:** la hoja de grupo más pequeña: un valor con límites, dibujado como casillas, y una provisión como un simple valor del grupo (empieza tirada, `default: '{{2d3+2}}'`, y nunca baja de 0; las reglas se la comen).
  values:
    morale:
      name: Moral
      description: Cómo aguanta el grupo, de 0 (roto) a 5. Tus tablas la bajan o la suben y pueden leerla.
    food:
      name: Comida
      description: Días de comida que lleva el grupo entre todos, tirados al ponerse en marcha (2d3+2); se come un día al acabar cada día, y nunca baja de 0.
sheet/map:
  name: Este mapa
  description: |-
    Lo que guarda cada mapa como suyo en las reglas genéricas: cuántas veces lo ha explorado el grupo, y el dado que tira explorar para un hito.

    **Enseña:** la hoja de cada mapa más pequeña (`mapSheet`): un valor que guarda cada mapa (`map.values.explored`), que sube una acción (`map.values.explored: 1`) y que el viaje vuelve a encontrar cuando regresa al mapa; y el dado escalonado más pequeño (`steps: [4, 6]`, `display: die`), un d6 que baja a d4 (`map.values.finds: -1`).
  values:
    explored:
      name: Explorado
      description: Cuántas veces ha explorado el grupo este mapa (Explorar). Tus tablas pueden leerlo.
    finds:
      name: Dado de hallazgos
      description: El dado que tira Explorar para un hito en este mapa; un 6 encuentra uno. Cuando se encuentra uno, baja a d4.
