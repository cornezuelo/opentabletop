sheet/character:
  name: Personaje
  description: |-
    Un personaje de las reglas genéricas: su salud y si está herido.

    **Enseña:** la hoja de personaje más pequeña: un valor con límites y un estado.
  values:
    health:
      name: Salud
      description: Cuánto daño puede aguantar aún el personaje; con 0 cae. Tus tablas dicen qué la quita o la devuelve.
  conditions:
    wounded:
      name: Herido
      description: Herido de verdad hasta que se le quite; tus tablas y reglas dicen qué le impide.
sheet/party:
  name: Grupo
  description: |-
    El grupo de las reglas genéricas, como un todo: su moral.

    **Enseña:** la hoja de grupo más pequeña: un valor con límites, dibujado como contador.
  values:
    morale:
      name: Moral
      description: Cómo aguanta el grupo, de 0 (roto) a 5. Tus tablas la bajan o la suben y pueden leerla.
