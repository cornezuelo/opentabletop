sheet/character:
  name: Personaje
  description: |-
    Un personaje de las reglas genéricas: su salud, el daño recibido, si está herido y si ha caído.

    **Enseña:** la hoja de personaje más pequeña: un valor con límites, dibujado como barra, otro que sale de él (`from:`), un estado que ponen los efectos y otro que se cumple por sí solo (`when:`), y un sitio en total para lo que lleva (`items.room`, diez cosas, no más).
  values:
    health:
      name: Salud
      description: Cuánto daño puede aguantar aún el personaje; con 0 cae. Tus tablas dicen qué la quita o la devuelve.
    harm:
      name: Daño
      description: La salud perdida, calculada a partir de ella; no se cambia a mano.
  conditions:
    wounded:
      name: Herido
      description: Herido de verdad hasta que se le quite; tus tablas y reglas dicen qué le impide.
    down:
      name: Caído
      description: Fuera de combate mientras su salud sea 0; se le pasa por sí solo cuando recupera salud.
sheet/party:
  name: Grupo
  description: |-
    El grupo de las reglas genéricas, como un todo: su moral y su comida.

    **Enseña:** la hoja de grupo más pequeña: un valor con límites, dibujado como casillas, y una provisión como un simple valor del grupo (empieza en su valor por defecto y nunca baja de 0; las reglas se la comen).
  values:
    morale:
      name: Moral
      description: Cómo aguanta el grupo, de 0 (roto) a 5. Tus tablas la bajan o la suben y pueden leerla.
    food:
      name: Comida
      description: Días de comida que lleva el grupo entre todos; se come un día al acabar cada día, y nunca baja de 0.
