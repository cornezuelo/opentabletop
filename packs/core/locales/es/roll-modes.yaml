roll-modes/default:
  modes:
    advantage:
      name: Ventaja
      description: Tira dos veces y quédate con el total más alto.
    either-way:
      name: Del derecho o del revés
      description: Lee el dado de porcentaje de las dos maneras, con decenas y unidades cambiadas, y quédate con el más bajo.
    disadvantage:
      name: Desventaja
      description: Tira dos veces y quédate con el total más bajo.
