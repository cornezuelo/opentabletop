lenormand:
  name: Lenormand
  description: |-
    El **Lenormand** de 36 cartas con dibujos: cosas sencillas que se leen una tras otra, como las palabras de una frase.
  cards:
    rider: 'El Jinete: noticias, una visita'
    clover: 'El Trébol: un pequeño golpe de suerte'
    ship: 'El Barco: un viaje, comercio, distancia'
    house: 'La Casa: el hogar, la familia, lo seguro'
    tree: 'El Árbol: salud, raíces, crecimiento lento'
    clouds: 'Las Nubes: confusión, problemas a la vista'
    snake: 'La Serpiente: engaño, un camino tortuoso, una rival'
    coffin: 'El Ataúd: un final, enfermedad, una caja cerrada'
    bouquet: 'El Ramo: un regalo, una sorpresa agradable'
    scythe: 'La Guadaña: un corte repentino, peligro, cosecha'
    whip: 'El Látigo: disputas, castigo, repetición'
    birds: 'Los Pájaros: habladurías, nervios, cháchara'
    child: 'El Niño: algo nuevo, inocencia, pequeñez'
    fox: 'El Zorro: astucia, un truco, interés propio'
    bear: 'El Oso: poder, un protector, mano dura'
    stars: 'Las Estrellas: guía, esperanza, ver con claridad'
    stork: 'La Cigüeña: cambio, una mudanza, un regreso'
    dog: 'El Perro: un amigo leal'
    tower: 'La Torre: autoridad, aislamiento, una institución'
    garden: 'El Jardín: un lugar público, una reunión'
    mountain: 'La Montaña: un obstáculo, una larga demora'
    crossroads: 'La Encrucijada: una elección de caminos'
    mice: 'Los Ratones: pérdida, robo, un lento deterioro'
    heart: 'El Corazón: amor, lo que más importa'
    ring: 'El Anillo: un pacto, una promesa, un ciclo'
    book: 'El Libro: un secreto, saber, lo desconocido'
    letter: 'La Carta: un mensaje, un documento'
    man: 'El Hombre: un hombre, quien pregunta'
