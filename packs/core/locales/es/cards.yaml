runes:
  name: Runas
  description: |-
    Las 24 **runas** del futhark antiguo, como una bolsa de piedras: sacas una y se queda fuera hasta que la bolsa se vacía, o hasta que pulsas **Barajar**.
  cards:
    fehu: 'ᚠ Fehu: riqueza, ganado, lo que posees'
    uruz: 'ᚢ Uruz: fuerza bruta, el uro salvaje'
    thurisaz: 'ᚦ Thurisaz: una espina, un gigante, peligro'
    ansuz: 'ᚨ Ansuz: habla un dios, un mensaje'
    raidho: 'ᚱ Raidho: el camino, cabalgar, un viaje'
    kenaz: 'ᚲ Kenaz: una antorcha, oficio, saber'
    gebo: 'ᚷ Gebo: un regalo, una deuda entre iguales'
    wunjo: 'ᚹ Wunjo: alegría, compañerismo'
    hagalaz: 'ᚺ Hagalaz: granizo, ruina repentina'
    nauthiz: 'ᚾ Nauthiz: necesidad, penurias'
    isa: 'ᛁ Isa: hielo, todo se detiene'
    jera: 'ᛃ Jera: la cosecha, el premio de un año'
    eihwaz: 'ᛇ Eihwaz: el tejo, aguante, muerte y vida'
    perthro: 'ᛈ Perthro: el cubilete, el azar, un misterio'
    algiz: 'ᛉ Algiz: el alce, protección'
    sowilo: 'ᛋ Sowilo: el sol, victoria'
    tiwaz: 'ᛏ Tiwaz: el dios de la guerra, justicia, sacrificio'
    berkano: 'ᛒ Berkano: el abedul, nacimiento, crecimiento'
    ehwaz: 'ᛖ Ehwaz: el caballo, confianza, compañía'
    mannaz: 'ᛗ Mannaz: la humanidad, los tuyos, uno mismo'
    laguz: 'ᛚ Laguz: el agua, la corriente invisible'
    ingwaz: 'ᛜ Ingwaz: la semilla, un tiempo de espera'
    dagaz: 'ᛞ Dagaz: el amanecer, un cambio súbito'
    othala: 'ᛟ Othala: la tierra natal, la herencia'
dominoes:
  name: Dominó
  description: |-
    El juego de **doble seis** de 28 fichas, boca abajo: una ficha robada queda fuera hasta que se acaban, o hasta que pulsas **Barajar**.

    Cada ficha pone sus dos extremos (`high`, `low`) y sus `pips`, lo que suman.
suit-meaning:
  name: De qué habla el palo
  description: |-
    De qué trata una carta de la _Baraja de póker_, según su palo: la tira _Una carta para la escena_, que le da la carta robada (`card.suit`).
  entries:
    hearts: 'Gente y sentimientos: un amigo, un amor, un rencor.'
    diamonds: 'Riqueza y comercio: un precio, un premio, una deuda.'
    clubs: 'Trabajo y conflicto: una tarea, una pelea, un rival.'
    spades: 'Peligro y secretos: una amenaza, una pérdida, una verdad oculta.'
    joker: 'Cualquier cosa: entra en escena lo inesperado.'
card-for-the-scene:
  name: Una carta para la escena
  description: |-
    Una carta de un mazo entero y **de qué habla su palo**: una idea rápida de qué trata una escena.
  template: '{{card}}. {{meaning}}'
poker-hand:
  name: Mano de póker
  description: |-
    **Cinco cartas** repartidas de un mazo entero, comodines incluidos: una mano nunca repite carta. Para una partida en la posada, o una apuesta.
  template: '{{first}} · {{second}} · {{third}} · {{fourth}} · {{fifth}}'
three-card-reading:
  name: Tirada de tres cartas
  description: |-
    La **tirada de tarot** más sencilla, de un mazo entero: de dónde viene, dónde está, adónde va.
  template: |-
    Pasado: {{past}}
    Presente: {{present}}
    Futuro: {{future}}
celtic-cross:
  name: Cruz celta
  description: |-
    La clásica **tirada de tarot de diez cartas**, de un mazo entero: para la pregunta que mueve toda una aventura.
  template: |-
    La situación: {{situation}}
    Lo que la cruza: {{challenge}}
    Su raíz: {{root}}
    Lo que pasa: {{past}}
    Lo que puede coronarla: {{crown}}
    Lo que viene: {{future}}
    Tú: {{self}}
    Quienes te rodean: {{surroundings}}
    Esperanzas y miedos: {{hopes}}
    El desenlace: {{outcome}}
tarot-character:
  name: Un personaje del tarot
  description: |-
    **Tres cartas** que esbozan a alguien, de un mazo entero: quién es, qué quiere y qué se lo impide.
  template: |-
    Quién es: {{who}}
    Qué quiere: {{wants}}
    Qué se lo impide: {{obstacle}}
lenormand-line:
  name: Línea de Lenormand
  description: |-
    **Tres cartas** en línea, de un mazo entero, que se leen como una frase: quién, qué pasa, cómo acaba.
  template: |-
    Quién: {{subject}}
    Qué pasa: {{action}}
    Cómo acaba: {{end}}
rune-cast:
  name: Tirada de runas
  description: |-
    **Tres piedras** de una bolsa llena: el problema, el camino, el resultado.
  template: |-
    El problema: {{problem}}
    El camino: {{way}}
    El resultado: {{result}}
