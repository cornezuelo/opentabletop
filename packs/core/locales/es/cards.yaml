tarot-way:
  name: De qué lado sale
  description: |-
    Cómo sale una carta del _Tarot_. **Al derecho**, significa lo que dice; **del revés**, lo mismo pero bloqueado, tardío, vuelto hacia dentro o llevado demasiado lejos.
  entries:
    upright: al derecho
    reversed: del revés
tarot:
  name: Tarot
  description: |-
    El **tarot** de 78 cartas: las 22 de los arcanos mayores y los cuatro palos de los menores, que salen al derecho o del revés (_De qué lado sale_). Lee lo que dice con libertad, para una escena, una persona o un lugar.

    Cada carta pone su `arcana` (`major` o `minor`) y su `rank` (los arcanos mayores del 0 al 21; los menores as 1, sota 11, caballero 12, reina 13, rey 14), y una carta menor su `suit` (`wands`, `cups`, `swords` o `pentacles`).
  cards:
    fool: 'El Loco, {{result}}: un salto a lo desconocido'
    magician: 'El Mago, {{result}}: habilidad y voluntad en marcha'
    high-priestess: 'La Sacerdotisa, {{result}}: un secreto guardado, una verdad intuida'
    empress: 'La Emperatriz, {{result}}: abundancia y cuidados'
    emperor: 'El Emperador, {{result}}: orden, mando y autoridad'
    hierophant: 'El Sumo Sacerdote, {{result}}: la tradición y sus maestros'
    lovers: 'Los Enamorados, {{result}}: un vínculo y una elección'
    chariot: 'El Carro, {{result}}: victoria a fuerza de empuje y control'
    strength: 'La Fuerza, {{result}}: valor y paciencia, no fuerza bruta'
    hermit: 'El Ermitaño, {{result}}: buscar a solas, una luz en la oscuridad'
    wheel: 'La Rueda de la Fortuna, {{result}}: la suerte cambia'
    justice: 'La Justicia, {{result}}: un juicio justo, una deuda saldada'
    hanged-man: 'El Colgado, {{result}}: un sacrificio, verlo todo de otra manera'
    death: 'La Muerte, {{result}}: un final que deja sitio'
    temperance: 'La Templanza, {{result}}: equilibrio y mezcla de contrarios'
    devil: 'El Diablo, {{result}}: cadenas, tentación, un mal trato'
    tower: 'La Torre, {{result}}: un derrumbe repentino, una verdad dura'
