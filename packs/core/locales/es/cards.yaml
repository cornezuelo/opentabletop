playing-cards:
  name: Baraja de póker
  description: |-
    La **baraja de póker**: cuatro palos de trece y dos comodines. Una carta robada queda fuera hasta que se acaba el mazo, o hasta que pulsas **Barajar**.

    Cada carta pone su `suit` (`spades`, `hearts`, `diamonds`, `clubs` o `joker`) y su `rank` (as 1, jota 11, reina 12, rey 13, comodín 0).
