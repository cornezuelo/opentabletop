tarot:
  name: Tarot
  description: |-
    El **tarot** de 78 cartas: las 22 de los arcanos mayores y los cuatro palos de los menores, que salen al derecho o del revés al robarlas, con un sentido para cada lado. Lee lo que dice con libertad, para una escena, una persona o un lugar.

    Cada carta pone su `arcana` (`major` o `minor`) y su `rank` (los arcanos mayores del 0 al 21; los menores as 1, sota 11, caballero 12, reina 13, rey 14), y una carta menor su `suit` (`wands`, `cups`, `swords` o `pentacles`).
