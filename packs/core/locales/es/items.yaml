items/gear:
  name: Equipo
  description: |-
    Unas pocas cosas que lleva cualquier grupo, para elegirlas en la tarjeta de un personaje.

    **Enseña:** el catálogo de objetos más pequeño: objetos con nombre, descripción y
    etiquetas (`light`, `food`), en una hoja sin lugares (una lista con cantidades) y con un
    campo, un dado que baja por escalones (el `wear: 6` del escudo).
  items:
    rope: { name: Cuerda, description: Un buen trozo de cuerda. }
    torch: { name: Antorcha, description: Luz para unas horas. }
    ration: { name: Ración, description: La comida de un día para uno. }
    shield: { name: Escudo, description: Se lleva las abolladuras de los golpes que te alcanzan. }
