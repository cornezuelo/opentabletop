scene-twist:
  name: Giro de escena
  description: |-
    Tira cuando **empieza una escena**: con un 1 no sale como esperabas, y _Giros_ dice cómo.

    - Tira con **desventaja** cuando la tensión es alta: más giros.
    - Tira con **ventaja** cuando las cosas están tranquilas.
  entries:
    twist: 'Giro: algo cambia'
    expected: Como se esperaba
twists:
  name: Giros
  description: |-
    Cómo una escena va **distinta** de lo que esperabas. La tira _Giro de escena_ con un 1, o se tira sola.
  entries:
    r1: Alguien inesperado ya está allí.
    r2: El lugar no es lo que parecía.
    r3: Un aliado necesita ayuda ahora mismo.
    r4: Una amenaza llega antes de tiempo.
    r5: Falta algo importante.
    r6: Un viejo enemigo hace una oferta.
    r7: La naturaleza se interpone.
    r8: Una pista apunta a otro sitio.
complications:
  name: Complicaciones
  description: |-
    Roba cuando las cosas van **demasiado fáciles**. Cada carta sale una vez hasta que **barajas** (a mano: el mazo no se baraja solo).
  cards:
    ambush: Una emboscada.
    broken: Se rompe el equipo.
    lost: Se pierde el camino.
    hurt: Alguien sale herido.
    delay: Un gran retraso.
    witness: Alguien lo ha visto todo.
    storm: Una tormenta repentina.
    lie: Alguien ha mentido.
