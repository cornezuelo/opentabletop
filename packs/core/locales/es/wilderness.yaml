weather:
  name: El clima de hoy
  description: Tira la tabla de clima de la estación. Fuera de un viaje, sin estación, hace un tiempo suave.
  entries:
    mild: Tiempo suave
weather-spring:
  name: Clima de primavera
  entries:
    clear: Despejado y luminoso
    rain: Lluvia constante
    storm: 'Tormenta: hoy no se viaja'
weather-summer:
  name: Clima de verano
  description: Se elige por peso, no con dados.
  entries:
    hot: Calor seco
    clear: Cielo despejado
    storm: 'Tormenta de verano: hoy no se viaja'
weather-autumn:
  name: Clima de otoño
  entries:
    clear: Fresco y despejado
    fog: Niebla espesa
    rain: Lluvia fría
weather-winter:
  name: Clima de invierno
  entries:
    blizzard: 'Ventisca: hoy no se viaja'
    snow: Nieva
    grey: Gris y helador
    clear: Escarcha bajo el sol
getting-lost:
  name: ¿Nos perdemos?
  description: Se tira al alba fuera de caminos y ríos. El clima fija navModifier; la orientación del grupo ayuda.
  entries:
    lost: 'Os habéis perdido: hoy no avanzáis'
    on-course: Mantenéis el rumbo
reaction:
  name: Reacción
  entries:
    hostile: hostiles
    wary: recelosos
    neutral: indiferentes
    friendly: amistosos
    helpful: deseosos de ayudar
wilderness-encounter:
  name: Encuentro en la naturaleza
  description: Depende de dónde estés y de la hora del día. Los hexes pueden subir las probabilidades con un campo danger.
  entries:
    dragon: Un dragón vuela en círculos sobre vosotros. No volverá.
    lights: Luces pálidas se mueven entre las piedras
    patrol: 'Una patrulla de {{region}}: están {{result}}'
    wolves: '{{1d4+1}} lobos: están {{result}}'
    bandits: 'Bandidos en el camino: están {{result}}'
    travellers: 'Viajeros en dirección contraria: están {{result}}'
    nothing: Nada más que el viento
camp-site:
  name: Lugar de acampada
  entries:
    hollow: Una hondonada resguardada
    ruin: Los muros de una granja en ruinas
    open: Campo abierto bajo las estrellas
camp-scene:
  name: Escena de acampada
  description: Dónde acampáis, las guardias y qué llega por la noche.
  template: '{{place}}. {{watch}} turnos de guardia.{{cold}} Durante la noche: {{visitor}}.'
road-events:
  name: Eventos del camino
  description: Roba una por cada día de camino. Una carta desaparece hasta que se acaba el mazo.
  cards:
    caravan: 'Una caravana de mercaderes de {{2d4}} carros'
    shrine: Un santuario junto al camino
    trouble: 'Problemas más adelante: {{result}}'
    twist: 'Algo cambia: {{result}}'
    inn: 'Una posada: una comida caliente y comida para dos días'
