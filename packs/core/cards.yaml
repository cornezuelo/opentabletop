kind: table
id: suit-meaning
tags: [cards]
name: What the suit speaks of
description: |-
  What a card of the _Playing cards_ is about, by its suit: rolled by _A card for the scene_, which gives it the card drawn (`card.suit`).
entries:
  - {
      id: hearts,
      when: { card.suit: hearts },
      result: 'People and feelings: a friend, a love, a grudge.',
    }
  - {
      id: diamonds,
      when: { card.suit: diamonds },
      result: 'Wealth and trade: a price, a prize, a debt.',
    }
  - {
      id: clubs,
      when: { card.suit: clubs },
      result: 'Work and conflict: a task, a fight, a rival.',
    }
  - {
      id: spades,
      when: { card.suit: spades },
      result: 'Danger and secrets: a threat, a loss, a hidden truth.',
    }
  # Jokers, and when it's rolled by hand with no card.
  - id: joker
    unless: { card.suit: [hearts, diamonds, clubs, spades] }
    result: 'Anything at all: the unexpected walks in.'
