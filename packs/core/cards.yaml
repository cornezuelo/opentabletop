kind: table
id: tarot-way
tags: [cards]
name: Which way up
description: |-
  How a _Tarot_ card comes out. **Upright**, it means what it says; **reversed**, the same thing blocked, late, turned inward or gone too far.
roll: 1d2
entries:
  - { id: upright, range: 1, result: upright }
  - { id: reversed, range: 2, result: reversed }
