kind: deck
id: tarot
tags: [cards]
name: Tarot
description: |-
  The **tarot** of 78 cards: the 22 of the major arcana and the four suits of the minor ones, each comes out upright or reversed (_Which way up_). Read what it says freely, for a scene, a person or a place.

  Each card sets its `arcana` (`major` or `minor`) and its `rank` (the major arcana 0 to 21; the minor ones ace 1, page 11, knight 12, queen 13, king 14), and a minor card its `suit` (`wands`, `cups`, `swords` or `pentacles`).
reshuffle: when-empty
