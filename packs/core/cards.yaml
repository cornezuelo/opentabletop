# Cards to draw, for any game: what each deck is, and hands and readings made with them.
# Every card says what it is (`set`), so a table rolled with it can read its suit or rank.
kind: deck
id: playing-cards
tags: [cards]
name: Playing cards
description: |-
  The **poker deck**: four suits of thirteen and two jokers. A drawn card stays out until the deck runs out, or until you **Shuffle**.

  Each card sets its `suit` (`spades`, `hearts`, `diamonds`, `clubs` or `joker`) and its `rank` (ace 1, jack 11, queen 12, king 13, joker 0).
reshuffle: when-empty
