# Names for people: an oracle to choose the folk, a generator for each folk (a given
# name and a family name), the tables they roll, and names made of syllables.
# Every definition is tagged with what it names (`people`) and its setting (`fantasy`,
# `modern`), so the Oracle's Filter finds them.
kind: oracle
id: person
tags: [names, people, fantasy, modern]
name: Someone's name
description: |-
  A **name for someone**: choose their folk, or _Any_ for a folk at random.

  Each folk is also a generator of its own (_A northern name_…), and their tables can be rolled alone.
inputs:
  folk:
    label: Folk
    options: [any, north, south, fair, invented, modern]
    labels:
      any: Any
      north: Northern
      south: Southern
      fair: Fair folk
      invented: Invented
      modern: Modern
    default: any
variants:
  any:
    entries:
      - { id: north, generator: generator.person-north }
      - { id: south, generator: generator.person-south }
      - { id: fair, generator: generator.person-fair }
      - { id: invented, generator: generator.invented }
  north:
    entries: [{ id: north, generator: generator.person-north }]
  south:
    entries: [{ id: south, generator: generator.person-south }]
  fair:
    entries: [{ id: fair, generator: generator.person-fair }]
  invented:
    entries: [{ id: invented, generator: generator.invented }]
  modern:
    entries: [{ id: modern, generator: generator.person-modern }]
---
# A child takes their father's name: -sson for a son, -sdottir for a daughter, by what
# the given name sets (`given.gender`). One in six comes with a byname: fields rolled
# only when an earlier one allows it.
kind: generator
id: person-north
tags: [names, people, fantasy]
name: A northern name
description: |-
  A given name and their father's, hard and short, from cold coasts and long winters; now and then a byname (_Sigrun Haldorsdottir the Grey_).
fields:
  given: { table: table.given-north }
  father: { table: table.father-north }
  son: { value: sson, when: { given.gender: m } }
  daughter: { value: sdottir, when: { given.gender: f } }
  odds: { roll: 1d6 }
  byname: { table: table.byname, when: { odds: 6 } }
template: '{{given}} {{father}}{{son}}{{daughter}}{{byname}}'
---
