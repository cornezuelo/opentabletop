  - { id: astrid, result: Astrid, set: { gender: f } }
  - { id: bjorn, result: Bjorn, set: { gender: m } }
  - { id: eirik, result: Eirik, set: { gender: m } }
  - { id: freya, result: Freya, set: { gender: f } }
