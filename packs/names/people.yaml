---
# Names built from syllables: a start, sometimes a middle, an end. The parts aren't
# words, so they have nothing to translate.
kind: generator
id: invented
tags: [names, people, fantasy]
name: An invented name
description: |-
  A name made of **syllables**, unlike any other: a start, now and then a middle, and an end (_Thargar_, _Veymira_, _Oranthel_). For people, but also for a beast, a god or a lost city.
fields:
  start: { table: table.syllable-start }
  odds: { roll: 1d6 }
  middle: { table: table.syllable-middle, when: { odds: { gte: 4 } } }
  end: { table: table.syllable-end }
template: '{{start}}{{middle}}{{end}}'
