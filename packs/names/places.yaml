id: world
tags: [names, worlds, sci-fi]
name: A world
description: |-
  A planet's name and its place around its star (_Kessaron IV_, _Vel Ishta II_).
fields:
  root: { table: table.world-root }
  end: { table: table.world-end }
  place: { table: table.world-numeral }
template: '{{root}}{{end}} {{place}}'
