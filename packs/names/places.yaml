# An inn's name is words, so it's translated. Its sign is written whole with its article,
# and what follows begins with its own space: a translation can make them agree.
kind: generator
id: inn
tags: [names, inns, fantasy]
name: An inn or tavern
description: |-
  The name over the door: a sign and, half the time, a second one (_The Drowned Rat_, _The Golden Goose and Lantern_).
fields:
  sign: { table: table.inn-sign }
  odds: { roll: 1d6 }
  and: { table: table.inn-and, when: { odds: { gte: 4 } } }
template: '{{sign}}{{and}}'
