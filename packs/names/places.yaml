  - { id: bram, result: Bram }
  - { id: elder, result: Elder }
  - { id: frost, result: Frost }
  - { id: kings, result: Kings }
  - { id: mill, result: Mill }
  - { id: ox, result: Ox }
  - { id: raven, result: Raven }
  - { id: salt, result: Salt }
  - { id: stone, result: Stone }
  - { id: thorn, result: Thorn }
  - { id: wolf, result: Wolf }
  - { id: wyn, result: Wyn }
---
