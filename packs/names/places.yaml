# Names for places: an oracle to choose what is named, and a generator for each.
# Tagged with what they name (`settlements`, `inns`, `landmarks`, `ships`, `worlds`) and
# their setting (`fantasy`, `sci-fi`).
kind: oracle
id: place
tags: [names, settlements, inns, landmarks, ships, worlds, fantasy, sci-fi]
name: What's it called?
description: |-
  A **name for a place**: choose what it is.

  Rolled from Map on a hex, a landmark's name fits its terrain when the system calls it `forest`, `hills`, `mountains`, `swamp`, `marsh`, `lake`, `coast` or `sea`.
inputs:
  what:
    label: What is it
    options: [settlement, inn, landmark, ship, world]
    labels:
      settlement: A village or town
      inn: An inn or tavern
      landmark: A landmark
      ship: A starship
      world: A world
    default: settlement
variants:
  settlement:
    entries: [{ id: settlement, generator: generator.settlement }]
  inn:
    entries: [{ id: inn, generator: generator.inn }]
  landmark:
    entries: [{ id: landmark, generator: generator.landmark }]
  ship:
    entries: [{ id: ship, generator: generator.ship }]
  world:
    entries: [{ id: world, generator: generator.world }]
---
# A village's name is a made-up word, joined from two parts: like a person's name, it
# stays as it is in every language.
kind: generator
id: settlement
tags: [names, settlements, fantasy]
name: A village or town
description: |-
  A name for a village, a town or a hamlet, joined from two old words (_Ashford_, _Wolfstead_, _Kingsmere_).
fields:
  start: { table: table.settlement-start }
  end: { table: table.settlement-end }
template: '{{start}}{{end}}'
---
kind: table
